schema_version: 1
owner: .context-circuit/wrapper/contracts/schemas/context-impact.yaml
describes: .runtime/executions/<plan-id>/<execution-id>/context-impact.yaml
concern: context_impact

purpose: >
  Optional references produced after post-implementation knowledge reconcile.
  The runtime only preserves these references; it never interprets or writes
  Product Knowledge (INV-KNOWLEDGE-02, INV-RUNTIME-01). In-place edits of live
  context/ files are a coordinator act after gathering or after mark-done
  (INV-COMPLETE-02). Delivery does not start reconcile and does not emit a
  knowledge-loop marker. A later plan is not blocked waiting for Product
  Knowledge.

fields:
  schema_version: { type: integer, required: true, values: [1] }
  execution_id: { type: string, required: true }
  plan: { type: string, required: true }
  status:
    type: enum
    required: true
    values: [no-update-needed, updated, deferred, conflict]
  units:
    type: list
    required: false
    description: live context unit ids the coordinator edited or considered

reconciliation_inputs:
  - final plan and tasks plus revisions
  - plan grounding references and summary
  - changed paths and commits for every affected repository
  - worker handoffs and verifier evidence
  - current revisions of relevant context units

rules:
  - INV-KNOWLEDGE-02
  - INV-COMPLETE-02
  - INV-CANDIDATE-01
