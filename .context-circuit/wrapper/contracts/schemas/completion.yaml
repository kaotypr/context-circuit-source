schema_version: 1
owner: .context-circuit/wrapper/contracts/schemas/completion.yaml
describes: .runtime/executions/<plan-id>/<execution-id>/completion.yaml
concern: completion_record

purpose: >
  Optional durable implementation completion record written when mark-done can
  populate it from existing execution files. Under Context Circuit v1.0 a
  Standard or Critical plan becomes done only on an explicit human mark-done
  request (`human_completion: accepted`, INV-COMPLETE-01). Asking flips plan
  status with no readiness or evidence precondition; this record is not a gate
  on that flip. Explore is planless until promotion and therefore has no plan
  completion record. Verification, candidate acceptance, and delivery never
  write this record. It never changes Product Knowledge.

preconditions:
  - plan status is draft at the moment of completion
  - an explicit human mark-done request (Standard and Critical)

fields:
  schema_version: { type: integer, required: true, values: [1] }
  execution_id: { type: string, required: false }
  plan: { type: string, required: true }
  candidate_id: { type: string, required: false }
  plan_revision: { type: string, required: false }
  accepted_by: { type: string, required: false }
  verifier_outcome:
    type: enum
    required: false
    values: [passed, not-run]
  change_set: { type: string, required: false }
  change_set_verifier_candidate: { type: string, required: false }
  human_completion:
    type: enum
    required: true
    values: [accepted]
    description: >
      accepted = an explicit human mark-done (Standard and Critical).
  completed_at: { type: string, required: true }
  commits:
    type: map
    required: false
    key: repository id
    value: accepted commit revision

effects:
  - plan status changes draft -> done
  - implementation completion record is written when execution evidence files
    exist; missing files do not block the status change
  - when the plan affected Product Knowledge, the coordinator starts in-place
    reconcile of live context/ files (INV-COMPLETE-02); the runtime does not

non_effects:
  - does not write or accept any Product Knowledge update
  - does not merge, push, open a pull request, deploy, or clean up
  - a verification pass, candidate acceptance, or delivery alone never performs
    this transition
  - does not block a later plan waiting for Product Knowledge

rules:
  - INV-COMPLETE-01
  - INV-COMPLETE-02
  - INV-KNOWLEDGE-02
