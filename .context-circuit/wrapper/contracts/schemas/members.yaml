schema_version: 1
owner: .context-circuit/wrapper/contracts/schemas/members.yaml
describes: members.yaml
concern: member_roster

purpose: >
  Committed, portable workspace roster mapping each member to non-overlapping
  intent and plan number bands. Inclusive integer bounds. Default size for a
  new member is 99 intents and 999 plans when bounds are chosen rather than
  copied; explicit start/end are required in the file and default size is not
  inferred at validate time. Overlapping intent bands or overlapping plan bands
  across members are rejected. This file is portable and shipped with the
  workspace; host-local identity lives in member.local.yaml.
  intent-allocate-id and plan-allocate-id consume these bands (INV-INTENT-01,
  INV-PLAN-03, INV-MEMBER-01). Exhaustion is a new non-overlapping band here,
  never a wrap or a block number in chat.

fields:
  schema_version: { type: integer, required: true, values: [1] }
  members:
    type: map
    required: true
    key: member id (cc_safe_id)
    value:
      display_name:
        type: string
        required: true
        description: Human-facing name; may differ from the id.
      intent_band_start:
        type: integer
        required: true
        description: Inclusive intent sequence start (1–999).
      intent_band_end:
        type: integer
        required: true
        description: Inclusive intent sequence end (1–999, >= start).
      plan_band_start:
        type: integer
        required: true
        description: Inclusive plan sequence start (1–9999).
      plan_band_end:
        type: integer
        required: true
        description: Inclusive plan sequence end (1–9999, >= start).

defaults:
  new_member_intent_span: 99
  new_member_plan_span: 999

resolution_rejects:
  - missing members.yaml (MEMBER_ROSTER_MISSING)
  - malformed schema, unsafe member id, or missing required fields (MEMBER_ROSTER_INVALID)
  - inverted, non-numeric, or out-of-range bounds (MEMBER_BAND_INVALID)
  - overlapping intent bands or overlapping plan bands across members (MEMBER_BAND_OVERLAP)

rules:
  - INV-INTENT-01
  - INV-PLAN-03
  - INV-MEMBER-01
  - INV-SEC-01
