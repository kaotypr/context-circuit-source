schema_version: 1
owner: .context-circuit/wrapper/contracts/schemas/trace-manifest.yaml
describes: intent/<intent-id>/trace/<repository>.yaml
concern: trace_manifest

purpose: >
  Legacy schema for existing `intent/<id>/trace/<repository>.yaml` files.
  New approvals do not require this file: the planner writes `finding.yaml` and,
  when feasible, the plan files. The field definitions below remain so recorded
  traces stay readable.

produced_by: cc-trace (legacy recorded look) — no lease, no worktree
consumed_by:
  - cc-plan authors the plan(s) from the file map, task partition, and done checks
  - the coordinator's feasibility check reads feasible + out_of_scope_reach + open_questions
  - the verifier re-runs the done_checks carried into the plan

fields:
  schema_version: { type: integer, required: true, values: [1] }
  plan_ready_version:
    type: integer
    required: true for newly recorded manifests
    values: [1]
    description: >
      Additive migration marker. Absence identifies a legacy schema-1 manifest and
      requires fallback refresh before its evidence may authorize materialization.
  intent: { type: string, required: true, description: the parent intent id }
  repository: { type: string, required: true, description: which repository this manifest covers }
  repository_identity:
    type: object
    required: true for newly recorded manifests
    fields:
      workspace: { type: string, required: true }
      repository: { type: string, required: true }
      canonical_binding: { type: string, required: true }
      canonical_location: { type: string, required: true }
    description: stable logical and canonical identity used to reject cross-workspace cache reuse
  revision:
    type: object
    required: true for newly recorded manifests
    fields:
      observed: { type: string, required: true, description: revision the evidence was read from }
      current: { type: string, required: true, description: revision checked immediately before ratification }
      merge_base: { type: string, required: false, description: common base used to bound a delta refresh }
  repository_map:
    type: object
    required: true for newly recorded manifests
    fields:
      schema_version: { type: integer, required: true, values: [1] }
      discovery_rules_digest: { type: string, required: true }
      cache_key: { type: string, required: true }
    description: >
      Reference to a structural map cached below
      .runtime/trace-cache/maps/<workspace>/<repository>/<cache-key>.yaml. The key
      binds workspace and repository identity, canonical binding/location, observed
      revision, map schema, and discovery rules. Maps contain structural inventory
      and command metadata only: never secrets, ignored files, provider payloads, or
      source copies. They are written by temp-file rename, are safe to delete, and
      an incomplete map is never published.
  grounding:
    type: object
    required: true for newly recorded manifests
    fields:
      mode: { type: enum, required: true, values: [cold, exact, delta, fallback] }
      reread_paths: { type: list, required: true }
      fallback_reason: { type: string, required: false }
    description: >
      Exact reuse still rereads current intent sites. Delta reuse is allowed only
      for bounded, understood drift and rereads changed sites plus known dependents.
      Incompatible schemas, changed discovery rules, broad drift, missing ancestry,
      identity uncertainty, or legacy manifests use fallback and perform a cold trace.
  file_map:
    type: list
    required: true
    description: >
      exact paths, the specific call sites that change, relevant signatures and
      integration points — the grounded map the coordinator plans from.
  evidence_anchors:
    type: list
    required: true for newly recorded manifests
    description: >
      Revision-bound typed evidence for planning. Anchors are investigation and
      implementation guides, not a worker write allowlist.
    item:
      type: { type: enum, required: true, values: [file, symbol, call-site, dependency, test] }
      path: { type: string, required: true }
      site: { type: string, required: false }
      revision: { type: string, required: true }
      supports: { type: list, required: false, description: intent criterion ids supported by this anchor }
  investigation_leads:
    type: list
    required: false
    description: bounded follow-up reads which may confirm or reject a proposed fragment
  task_partition:
    type: list
    required: false
    description: >
      proposed split of the work (by feature area or layer) for the coordinator to
      ratify or adjust. The report should expose whether one bounded execution and
      verification boundary supports one plan with embedded tasks, or whether
      independent execution/verification boundaries, meaningful dependencies, or
      distinct failure surfaces justify stacked plans. Task depends_on and inter-plan
      plan_dependencies remain separate; the rationale is recorded on the derived
      plan rather than by adding a new manifest field.
  plan_fragments:
    type: list
    required: true for newly recorded manifests
    description: >
      Normalized plan-ready fragments from a recorded look. Each has a stable
      request-local key, exactly one repository, typed tasks and dependencies,
      criterion coverage, checks, risks, and a boundary reason. These fragments
      do not allocate plan ids, ratify boundaries, approve, or publish.
  criterion_coverage:
    type: list
    required: true for newly recorded manifests
    item:
      criterion: { type: string, required: true }
      anchors: { type: list, required: true }
      checks: { type: list, required: true }
    description: every approved outcome criterion must be covered before ratification
  risks:
    type: list
    required: false
    description: >
      concrete risks named against the real code (data, security, irreversibility,
      coupling), including risks only a code read reveals.
  done_checks:
    type: list
    required: false
    description: >
      the runnable commands/tests that PROVE the intent's outcome criteria hold (for
      example a grep proving zero direct call-sites remain); carried into the plan and
      re-run by the verifier. This is where an outcome criterion becomes executable.
    item:
      criterion: { type: string, required: false, description: the outcome criterion id this proves }
      command: { type: string, required: true, description: the runnable check }
      expect: { type: string, required: false, description: the passing condition }
  tier_signal:
    type: string
    required: false
    description: evidence that may RAISE the intent's provisional tier (auth, secrets, data, irreversibility); surfaces at plan review
  feasible:
    type: boolean
    required: true
    description: >
      whether the approved intent is buildable given the real code. false stops the
      coordinator, which explains the blocker (carried in open_questions) and hands the
      decision to the human before any plan is written (intent-feasibility).
  feasibility_outcome:
    type: enum
    required: true for newly recorded manifests
    values: [feasible, question, not-feasible]
    description: typed finding consumed by the coordinator; never an engine judgment
  out_of_scope_reach:
    type: list
    required: false
    description: >
      repositories or areas the change must MODIFY that fall outside a bound scope
      (empty when none, or when no scope is bound). The coordinator surfaces these in
      the feasibility check as a question — merely reading or calling an out-of-scope
      area does not trigger it.
  open_questions:
    type: list
    required: false
    description: >
      anything the human must settle, for the coordinator to relay. Each entry
      carries a provisional disposition: intent-revision when
      it changes the approved decision and blocks planning, plan-resolution when it
      is an implementation detail to carry into the plan, or already-answered when
      the plain request or approved intent already resolves it.
  completeness_proof:
    type: object
    required: false
    description: >
      present only for a "change every X" obligation — the command and count showing
      the found set is the WHOLE set, so completeness is a check that passes or fails
      rather than a file count the coordinator hand-maintains.
    fields:
      command: { type: string, required: false }
      count: { type: integer, required: false }
  recorded_at: { type: string, required: false }
  freshness_checked_at: { type: string, required: false, description: last bounded freshness check against current code }

invariants:
  - the look reads the real code AFTER Gate 1 and reports to the coordinator only,
    never to the human (roles-and-spawning, tracing-and-grounding)
  - the runnable check that proves an outcome criterion is a tracing output here,
    never authored on the intent contract (INV-INTENT-01)
  - the manifest is durable grounding evidence, reused with a bounded freshness check
    rather than re-traced from zero (INV-GROUND-*)
  - reuse is bound to repository identity, revision, map schema, and discovery rules;
    uncertainty, incompatible or legacy evidence, and broad drift fall back to a cold trace
  - plan-ready fragments and anchors are evidence only: the coordinator ratifies and
    materializes plans, and anchors do not exhaustively constrain worker writes
  - it is not part of contract_digest — earned post-approval, it never re-enters Gate 1
    (whether post-approval done-checks should bind into the frozen contract is an open
    question in risks-and-open-questions; current behavior keeps them out)

rules:
  - INV-INTENT-01
  - INV-INTENT-02
  - INV-GROUND-01
