schema_version: 1
owner: .context-circuit/wrapper/contracts/schemas/grounding-manifest.yaml
describes: .runtime/executions/<plan-id>/<execution-id>/grounding/<repository-id>.yaml
concern: grounding_manifest

purpose: >
  Private runtime evidence for one repository's grounding discovery: the target
  repository's own agent guidance found live in the execution worktree, plus the
  prepared-environment status. It is data, not prompt text (INV-RUNTIME-01): a
  deterministic filesystem scan the worker brief consumes and a later reviewer
  reads to see exactly what the worker was pointed at (INV-GROUND-01). Recorded
  per execution so a run is reproducible.

layout:
  grounding_dir: .runtime/executions/<plan-id>/<execution-id>/grounding/
  file: <repository-id>.yaml   # one manifest per affected repository

fields:
  schema_version: { type: integer, required: true, values: [1] }
  repository: { type: string, required: true, description: logical repository id }
  worktree: { type: string, required: true, description: the scanned worktree path }
  files:
    type: list
    required: true
    description: >
      Agent-guidance files present in the worktree (a subset of the host-neutral
      scan set: AGENTS.md, CLAUDE.md, .cursor/rules/, .github/copilot-instructions.md).
      An empty list is valid — a doc-less repository.
  skills:
    type: list
    required: true
    description: >
      Each .agents/skills/*/SKILL.md discovered, as {name, description} read from
      its frontmatter, so the worker can judge relevance without opening each one.
    item:
      name: { type: string, required: true }
      description: { type: string, required: true }
  environment:
    type: enum
    required: true
    values: [ready, no-toolchain]
    description: >
      Set only after worktree hardening completes the gitignored overlay and,
      when a toolchain exists, provisions the worktree to match its own lockfile:
      ready means that preparation succeeded; no-toolchain means no toolchain was
      detected after the overlay (for example, a greenfield repository). A detected
      lockfile alone is not ready. An overlay or provisioning failure blocks setup
      instead of being recorded as an environment value.

rules:
  - INV-GROUND-01
  - INV-RUNTIME-01
  - INV-RUNTIME-02
