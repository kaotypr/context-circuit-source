schema_version: 1
owner: .context-circuit/wrapper/contracts/schemas/candidate.yaml
describes: .runtime/executions/<plan-id>/<execution-id>/human-acceptance.yaml
concern: human_acceptance

purpose: >
  A first-class record that a human accepted a specific candidate (Context Circuit
  v1.0, Mechanism 2). It is co-owned with the candidate schema
  (.context-circuit/wrapper/contracts/schemas/candidate.yaml) and bound to a candidate_id, so a new
  candidate (any commit or criteria change) leaves the acceptance no longer
  matching — void by construction (INV-CANDIDATE-01). For teams it is the durable,
  candidate-bound artifact that says what was accepted and by whom, preserving the
  team-visibility the old explicit "mark done" flip provided, without the solo-user
  bookkeeping. Candidate acceptance is a distinct act from plan-done: Standard
  and Critical become done only on an explicit mark-done (INV-COMPLETE-01).
  Explore is planless until promotion.

fields:
  schema_version: { type: integer, required: true, values: [1] }
  candidate_id:
    type: string
    required: true
    description: the accepted candidate; a new candidate voids this acceptance
  accepted_by:
    type: string
    required: true
    description: the human (name/handle) who accepted, for team visibility
  accepted_at: { type: string, required: true }
  checklist:
    type: list
    required: false
    description: which criteria the human confirmed, including any manual ones

rules:
  - the acceptance names the candidate it observed; it never floats free of it
  - a candidate change voids a prior acceptance (INV-CANDIDATE-01)
  - acceptance is not verification and is not delivery; it is a human confirming a candidate
  - INV-CANDIDATE-01
  - INV-KNOWLEDGE-02
