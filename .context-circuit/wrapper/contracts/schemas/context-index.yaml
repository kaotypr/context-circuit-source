schema_version: 1
owner: .context-circuit/wrapper/contracts/schemas/context-index.yaml
describes: context/INDEX.md and per-unit retrieval metadata
concern: context_retrieval

purpose: >
  Defines the agent retrieval catalog for Product Knowledge. The index maps
  concepts, aliases, repositories, domains, decisions, and constraints to
  knowledge units so an agent locates the right knowledge without scanning the
  whole context directory. It is human-navigable but exists first for retrieval.
  It catalogs live context files (INV-KNOWLEDGE-01); it does not index a
  proposal staging path.

per_unit_metadata:
  context_id: { type: string, required: true, description: stable topic or id }
  summary: { type: string, required: true }
  topics: { type: list, required: true }
  keywords_aliases: { type: list, required: false }
  domains: { type: list, required: false }
  repositories: { type: list, required: false }
  decisions: { type: list, required: false }
  constraints: { type: list, required: false }
  status: { type: enum, values: [accepted, needs-review, stale] }
  owner: { type: string, required: false }
  freshness: { type: string, required: false }
  provenance: { type: list, required: false }

index_entries:
  - page path
  - stable context id
  - topic and concise summary
  - keywords and aliases
  - related domains and repositories
  - decisions and constraints covered
  - status, owner, freshness
  - primary related repositories and provenance

update_triggers:
  - a unit is added, renamed, archived, or materially changed
  - gathering or mark-done reconcile edits a live context file

rules:
  - INV-KNOWLEDGE-01
  - INV-KNOWLEDGE-02
