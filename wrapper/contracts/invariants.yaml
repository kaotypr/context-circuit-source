schema_version: 1
owner: wrapper/contracts/invariants.yaml
purpose: >
  Single authoritative index of Context Circuit product rules (v0.5 core plus the
  v0.6 run-stack delta) and the one file that owns each rule. One rule has one
  owner. Other artifacts reference an effect defined here; they never define a
  parallel copy of it.

invariants:
  - id: INV-KNOWLEDGE-01
    rule: >
      Product Knowledge is optimized first for agent retrieval (stable IDs,
      summaries, domains, repositories, decisions, constraints, freshness,
      provenance) while remaining human-readable. The context index is a
      retrieval catalog, not a full copy of page content.
  - id: INV-KNOWLEDGE-02
    rule: >
      Completion, verification, worker claims, and code changes never silently
      accept a Product Knowledge update. A context update is accepted only by an
      explicit separate human decision; a plan may be done while a proposal is
      pending.
  - id: INV-PLAN-01
    rule: >
      plan.yaml owns human plan status (draft, approved, done). Task status is a
      synchronized projection and never a second lifecycle authority.
  - id: INV-PLAN-02
    rule: >
      Every task names the repository or repositories it may change and bounded
      paths or an explicit repository-wide scope. Dependencies are explicit.
  - id: INV-PLAN-03
    rule: >
      New plans use stable IDs of the form NNNN-<kebab-slug>. The four-digit
      sequence is the next after the highest ever allocated and is never reused,
      including after archive or restore.
  - id: INV-PLAN-04
    rule: >
      Plans are grounded against available Product Knowledge, source evidence,
      and repository evidence. Missing or contradictory information becomes an
      explicit open question, assumption, or risk; the agent never silently
      invents a decision.
  - id: INV-PLAN-05
    rule: >
      A plan may declare optional inter-plan plan_dependencies (a list of
      {id, reason}), distinct from a task's intra-plan depends_on. A plan that
      declares plan_dependencies must set schema_version 2; a plan without the
      field stays schema_version 1. Every dependency entry references an
      existing, non-self plan id in the same workspace, and the inter-plan
      dependency graph is acyclic. schema_version outside [1, 2] is unsupported.
  - id: INV-APPROVE-01
    rule: >
      Approval is an explicit conversational human gate that only changes plan
      status draft to approved after deterministic readiness checks. There is no
      confirmation card and no hidden confirmation token.
  - id: INV-EXEC-01
    rule: >
      Only an approved plan may execute. Execution is a separate authorization
      from approval unless one request explicitly asks for both.
  - id: INV-EXEC-02
    rule: >
      One worker executes every task of one approved plan in one bounded
      execution, in dependency order, across all mapped repositories.
  - id: INV-EXEC-03
    rule: >
      Execution creates exactly one deterministic branch (cc/<plan-id>/<repo-id>)
      and one isolated worktree per affected repository, from the captured
      anchor-branch tip. The anchor checkout is never written during execution.
  - id: INV-EXEC-04
    rule: >
      The worker commits each changed repository before verification. Every
      repair creates a new commit; a prior commit is never amended to conceal a
      repair attempt.
  - id: INV-COMMIT-01
    rule: >
      Every commit an agent authors anywhere in the product, and every
      pull-request title, follows Conventional Commits: a lowercase type from
      the fixed set (feat, fix, docs, refactor, perf, test, build, ci, chore,
      revert), an optional scope naming the affected repository id or component,
      an optional "!" before the colon for a breaking change, and a short
      imperative subject with no trailing period. An optional body explains what
      changed and why; an optional "Refs:" footer names the plan and task IDs
      the commit implements. A repair commit uses the same convention and is a
      new commit, never an amendment (see INV-EXEC-04). Commit and pull-request
      text never contain credentials, provider payloads, or host-specific paths.
      No commit message, pull request, merge request, review, or comment an
      agent authors ever carries an AI attribution, credit, co-author, or
      "generated by" footer or trailer for any tool, model, provider, or the
      agent itself; the human author is the sole recorded author. Any such text
      the host would inject automatically is disabled rather than re-added.
  - id: INV-VERIFY-01
    rule: >
      One independent verifier checks the latest commit of every affected
      repository, strictly read-only with respect to product files. It never
      repairs, modifies product files, changes plan status, or self-verifies.
  - id: INV-VERIFY-02
    rule: >
      If the host cannot create an independent verifier with read-only
      capability, the execution is blocked. The worker or coordinator must not
      self-verify as a substitute.
  - id: INV-REPAIR-01
    rule: >
      The worker-failure counter increments on each verifier rejection including
      the initial implementation. The maximum is three, after which execution
      stops. A block from missing host capability or external evidence is a
      blocked execution, not an invented worker failure.
  - id: INV-PRESERVE-01
    rule: >
      Failure, interruption, or blocking preserves branches, worktrees, commits,
      worker handoffs, verifier evidence, repair attempts, and runtime records.
      Failed work is never silently cleaned up.
  - id: INV-COMPLETE-01
    rule: >
      Only an explicit human request changes plan status to done, and only when
      the latest execution passed independent verification. Verification alone
      never marks a plan complete.
  - id: INV-COMPLETE-02
    rule: >
      Marking a plan done records an implementation completion record (plan
      revision, execution, per-repository commits, verifier result, human
      request) and starts Product Knowledge reconciliation.
  - id: INV-ARCHIVE-01
    rule: >
      Archiving moves plans/<id>/ to plans/archive/<id>/, removes the row from
      plans/INDEX.md, and preserves plan files, status, and runtime evidence. It
      performs no plan-status or execution validation and implies no completion,
      delivery, cleanup, or deletion.
  - id: INV-ARCHIVE-02
    rule: >
      The normal agent must not read or traverse plans/archive/. An explicit
      restore is the only operation that returns a named archived plan to the
      active plan area before normal reading resumes.
  - id: INV-REPO-01
    rule: >
      Portable workspace identity holds only a logical repository key, an
      optional credential-free canonical URL, and an optional default_branch.
      It never contains a machine-specific path or credentials.
  - id: INV-REPO-02
    rule: >
      anchor_branch is the required user-local execution base and the default
      pull-request target. default_branch is only portable clone/setup guidance
      and is never inferred as the anchor branch or execution base.
  - id: INV-REPO-03
    rule: >
      repositories/ is the gitignored default destination for cloned or
      initialized project repositories. The workspace root, when it is a Git
      repository, binds as the reserved logical id workspace at path "." with its
      own anchor branch, and is never placed under repositories/.
  - id: INV-REPO-04
    rule: >
      Binding resolution is explicit and bounded. Missing, ambiguous, non-Git,
      traversal, unsafe-symlink, or identity-mismatched bindings fail closed
      without scanning the filesystem or substituting a similarly named path.
  - id: INV-DELIVER-01
    rule: >
      Pull-request creation, merge, push, deployment, archive, and
      cleanup are separate human-requested actions. A pull request uses each
      execution branch as source and the repository's recorded anchor_branch as
      the default target; it never substitutes default_branch or silently follows
      a moving remote. Drift guard (v0.6): when a plan is delivered and its
      recorded base has diverged from the current anchor_branch tip (because a
      sibling plan already merged), the plan is rebased onto the current tip and
      re-verified before its pull request opens. A plan is never merged from a
      base that no longer reflects the branch it will land on.
  - id: INV-DELIVER-02
    rule: >
      Delivery blocks and reports when the source branch, configured provider or
      remote, or target branch is unavailable, rather than inferring a remote or
      pushing silently.
  - id: INV-SEC-01
    rule: >
      Workspace-relative paths reject traversal and unsafe symlinks. Credentials
      remain in host Git configuration or the host agent and never enter
      workspace files or runtime records.
  - id: INV-SEC-02
    rule: >
      sources/ is passive raw evidence. Only exact request-scoped source files
      are read; the workspace never scans all sources or sibling workspaces to
      fill a context gap.
  - id: INV-RUNTIME-01
    rule: >
      The Context Circuit runtime is a small host-neutral deterministic library.
      It contains no provider launch code, model prompts, Product Knowledge
      interpretation, plan-writing intelligence, conversational routing policy,
      confirmation cards, product test-runner logic, or automatic
      pull-request/merge/push/deploy/cleanup/completion.
  - id: INV-RUNTIME-02
    rule: >
      Runtime records are written atomically. A partial or contradictory record
      cannot grant ownership, resume a writer, prove verification, or authorize
      completion.
  - id: INV-OWN-01
    rule: >
      At most one active writer owns a plan execution, enforced by an atomic
      exclusive-create lock. A competing writer receives a read-only or blocked
      result; a live lock is never silently stolen.
  - id: INV-CONCURRENCY-01
    rule: >
      A path lease generalizes the one-writer lock (INV-OWN-01) from plan scope
      to (repository, path-region) scope, recorded atomically under
      .runtime/locks/paths/. While an execution holds a lease on a path region in
      a repository, no other execution that is not a descendant of the holder in
      the plan-dependency graph may acquire an overlapping region in that
      repository (regions overlap when equal, when one is a path-prefix ancestor
      of the other, or when either is the repository-wide "."). A competing plan
      receives a read-only or blocked result, the same outcome INV-OWN-01 gives a
      competing writer; a live lease is never silently stolen. A declared
      descendant is exempt because it builds on the holder rather than competing
      with it. A lease is held from execution start until the plan is delivered,
      not merely verified. It composes with INV-OWN-01 and does not redefine it.
  - id: INV-CONCURRENCY-02
    rule: >
      When a plan becomes runnable the runtime selects its base in each
      repository it touches, before the worker starts: the anchor tip when there
      are no same-repo predecessors, the single predecessor branch when there is
      exactly one, or a runtime-authored integration merge of the predecessor
      branches when there are two or more, recorded as base_commit. The
      integration merge is authored by the runtime, never counted as a worker
      attempt; a base that cannot be built cleanly is a blocked execution, not a
      worker failure. Cross-repo predecessors never affect the base; they are
      ordering gates only. A kept base reference lives in the reserved namespace
      refs/cc-base/<plan>/<repo> and is never nested beneath a branch ref. If a
      predecessor is repaired after a dependent's base was built, the dependent's
      base is stale and is rebuilt from the predecessor's new tip before the
      dependent re-runs; a stale base never silently persists.
  - id: INV-GROUND-01
    rule: >
      Before implementing, the writer reads and honors the target repository's own
      agent guidance (AGENTS.md, CLAUDE.md, .cursor/rules, .github/copilot-
      instructions.md, and .agents/skills/*/SKILL.md), discovered live from the
      execution worktree by a deterministic runtime scan. The runtime emits data
      (a grounding manifest recorded as execution evidence), never prompt text
      (INV-RUNTIME-01). The repository's guidance is referenced, never captured
      into Product Knowledge; there is no per-repo profile and no plan.yaml field.
  - id: INV-GROUND-02
    rule: >
      Precedence: the writer brief's scope and safety rules are authoritative on
      what and where a writer may change; the repository's own guidance is
      authoritative on how to write code correctly there (conventions, patterns,
      build, test) within that scope. Where they conflict on scope or safety the
      writer stops and reports; the repository's guidance never overrides a
      Context Circuit safety or scope rule.
  - id: INV-GROUND-03
    rule: >
      The writer brief's fact-bearing sections are a fixed template
      (wrapper/adapters/writer-brief.md) filled by deterministic slot
      substitution from the grounding manifest and the plan; the coordinator
      delivers the brief and authors only a one-line task focus, never the fact
      sections. The repository-grounding section is required; a preflight refuses
      to deliver a brief that omits or leaves it unfilled. Execution-environment
      workarounds are eliminated by worktree hardening, never documented by hand.
  - id: INV-HOST-01
    rule: >
      Host identity, version, capability, permission mode, and provider status
      are bounded provider-neutral evidence only. They never authorize a route,
      role, lease, gate, verification, or completion.
  - id: INV-SKILL-01
    rule: >
      Product skills ship only at `.agents/skills/<name>/SKILL.md` and are
      read-as-procedure packets the coordinator resolves by path. A host may
      additionally surface a skill as a directly invocable slash command, but
      that host bridge is an optional convenience owned by the host adapter and
      is never a separate route, role, or authority. The shipped workspace never
      contains a host-specific skill directory or symlink.
  - id: INV-EXTERNAL-01
    rule: >
      The external surface is a set of opt-in, manually-triggered publications
      that push workspace data to external systems and are orthogonal to the core
      workflow. No core-workflow phase (plan, approve, execute, verify, deliver),
      runtime action, coordinator route, or role references, triggers, schedules,
      waits on, or is affected by any publication, and none runs except on an
      explicit human invocation of the cc-publish skill. A publication is a
      command, not a standing relationship: it observes the workspace as it finds
      it at invocation time. There is no automatic, scheduled, event, or
      workflow-driven trigger.
  - id: INV-EXTERNAL-02
    rule: >
      A publication reads only the workspace artifact types its config.yaml names
      and writes only its own records under publication/<name>/published/. Nothing
      is written under plans/, so no planning, execution, verification, or delivery
      step encounters a publication record and none updates external state or
      status. It never mutates core Context Circuit state or human plan status
      (INV-PLAN-01), and it is export-only — data flows from the workspace outward.
      External side effects are performed through the host or MCP layer, never the
      runtime (INV-RUNTIME-01); configuration and records are credential-free and
      hold no provider payload (INV-SEC-01). A record's lifecycle is independent of
      a plan's archive state, keyed to the stable plan id. Any future inbound flow
      must pass through the normal plan-authoring and approval gates
      (INV-APPROVE-01), never around them.
  - id: INV-EXTERNAL-03
    rule: >
      Every external artifact a publication creates or updates (a task, document,
      or message) is self-contained: its title, description, and any checklist or
      field describe the plan, task, or document in plain language understandable
      to a reader with no access to the workspace. It never contains a workspace
      file name (for example plan.yaml, config.yaml), a workspace-internal path
      (for example plans/, context/, publication/), a workspace-internal
      identifier (for example an acceptance or verification id), or internal
      Context Circuit mechanism or vocabulary. A stable plan or task identifier may
      appear — normally in the title, as [<plan-number>] — solely so a human can
      map what went where.

owners:
  authority_order: WORKFLOW.md
  source_boundary: AGENTS.md
  product_knowledge: context/INDEX.md
  context_retrieval: wrapper/contracts/schemas/context-index.yaml
  context_proposals: wrapper/contracts/schemas/context-proposal.yaml
  plan_lifecycle: wrapper/contracts/schemas/plan.yaml
  task_projection: wrapper/contracts/schemas/task.yaml
  repository_identity: wrapper/contracts/schemas/workspace.yaml
  local_binding: wrapper/contracts/schemas/repositories-local.yaml
  commit_convention: wrapper/contracts/invariants.yaml
  runtime: wrapper/runtime/engine.sh
  path_leases: wrapper/runtime/engine.sh
  path_lease_records: wrapper/contracts/schemas/lease.yaml
  base_selection: wrapper/runtime/engine.sh
  run_stack_action: wrapper/adapters/WORKFLOW.md
  repository_grounding: wrapper/runtime/engine.sh
  grounding_manifest: wrapper/contracts/schemas/grounding-manifest.yaml
  writer_brief: wrapper/adapters/writer-brief.md
  execution_records: wrapper/contracts/schemas/execution.yaml
  worker_handoff: wrapper/contracts/schemas/worker-handoff.yaml
  verifier_result: wrapper/contracts/schemas/verifier-result.yaml
  completion_record: wrapper/contracts/schemas/completion.yaml
  context_impact: wrapper/contracts/schemas/context-impact.yaml
  release_boundary: wrapper/manifest.yaml
  skill_packets: .agents/skills/
  coordinator_role: agents/coordinator.md
  worker_role: agents/writer.md
  verifier_role: agents/verifier.md
  host_adapter: wrapper/adapters/AGENTS.md
  delivery_boundary: wrapper/adapters/WORKFLOW.md
  external_surface: wrapper/contracts/invariants.yaml
  publication_config: wrapper/contracts/schemas/publication-config.yaml
  publication_record: wrapper/contracts/schemas/publication-record.yaml
