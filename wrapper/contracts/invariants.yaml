schema_version: 1
owner: wrapper/contracts/invariants.yaml
purpose: >
  Single authoritative index of Context Circuit v0.5 product rules and the one
  file that owns each rule. One rule has one owner. Other artifacts reference an
  effect defined here; they never define a parallel copy of it.

invariants:
  - id: INV-KNOWLEDGE-01
    rule: >
      Product Knowledge is optimized first for agent retrieval (stable IDs,
      summaries, domains, repositories, decisions, constraints, freshness,
      provenance) while remaining human-readable. The context index is a
      retrieval catalog, not a full copy of page content.
  - id: INV-KNOWLEDGE-02
    rule: >
      Completion, verification, worker claims, and code changes never silently
      accept a Product Knowledge update. A context update is accepted only by an
      explicit separate human decision; a plan may be done while a proposal is
      pending.
  - id: INV-PLAN-01
    rule: >
      plan.yaml owns human plan status (draft, approved, done). Task status is a
      synchronized projection and never a second lifecycle authority.
  - id: INV-PLAN-02
    rule: >
      Every task names the repository or repositories it may change and bounded
      paths or an explicit repository-wide scope. Dependencies are explicit.
  - id: INV-PLAN-03
    rule: >
      New plans use stable IDs of the form NNNN-<kebab-slug>. The four-digit
      sequence is the next after the highest ever allocated and is never reused,
      including after archive or restore.
  - id: INV-PLAN-04
    rule: >
      Plans are grounded against available Product Knowledge, source evidence,
      and repository evidence. Missing or contradictory information becomes an
      explicit open question, assumption, or risk; the agent never silently
      invents a decision.
  - id: INV-APPROVE-01
    rule: >
      Approval is an explicit conversational human gate that only changes plan
      status draft to approved after deterministic readiness checks. There is no
      confirmation card and no hidden confirmation token.
  - id: INV-EXEC-01
    rule: >
      Only an approved plan may execute. Execution is a separate authorization
      from approval unless one request explicitly asks for both.
  - id: INV-EXEC-02
    rule: >
      One worker executes every task of one approved plan in one bounded
      execution, in dependency order, across all mapped repositories.
  - id: INV-EXEC-03
    rule: >
      Execution creates exactly one deterministic branch (cc/<plan-id>/<repo-id>)
      and one isolated worktree per affected repository, from the captured
      anchor-branch tip. The anchor checkout is never written during execution.
  - id: INV-EXEC-04
    rule: >
      The worker commits each changed repository before verification. Every
      repair creates a new commit; a prior commit is never amended to conceal a
      repair attempt.
  - id: INV-VERIFY-01
    rule: >
      One independent verifier checks the latest commit of every affected
      repository, strictly read-only with respect to product files. It never
      repairs, modifies product files, changes plan status, or self-verifies.
  - id: INV-VERIFY-02
    rule: >
      If the host cannot create an independent verifier with read-only
      capability, the execution is blocked. The worker or coordinator must not
      self-verify as a substitute.
  - id: INV-REPAIR-01
    rule: >
      The worker-failure counter increments on each verifier rejection including
      the initial implementation. The maximum is three, after which execution
      stops. A block from missing host capability or external evidence is a
      blocked execution, not an invented worker failure.
  - id: INV-PRESERVE-01
    rule: >
      Failure, interruption, or blocking preserves branches, worktrees, commits,
      worker handoffs, verifier evidence, repair attempts, and runtime records.
      Failed work is never silently cleaned up.
  - id: INV-COMPLETE-01
    rule: >
      Only an explicit human request changes plan status to done, and only when
      the latest execution passed independent verification. Verification alone
      never marks a plan complete.
  - id: INV-COMPLETE-02
    rule: >
      Marking a plan done records an implementation completion record (plan
      revision, execution, per-repository commits, verifier result, human
      request) and starts Product Knowledge reconciliation.
  - id: INV-ARCHIVE-01
    rule: >
      Archiving moves plans/<id>/ to plans/.archived/<id>/, removes the row from
      plans/INDEX.md, and preserves plan files, status, and runtime evidence. It
      performs no plan-status or execution validation and implies no completion,
      delivery, cleanup, or deletion.
  - id: INV-ARCHIVE-02
    rule: >
      The normal agent must not read or traverse plans/.archived/. An explicit
      restore is the only operation that returns a named archived plan to the
      active plan area before normal reading resumes.
  - id: INV-REPO-01
    rule: >
      Portable workspace identity holds only a logical repository key, an
      optional credential-free canonical URL, and an optional default_branch.
      It never contains a machine-specific path or credentials.
  - id: INV-REPO-02
    rule: >
      anchor_branch is the required user-local execution base and the default
      pull-request target. default_branch is only portable clone/setup guidance
      and is never inferred as the anchor branch or execution base.
  - id: INV-REPO-03
    rule: >
      repositories/ is the gitignored default destination for cloned or
      initialized project repositories. The workspace root, when it is a Git
      repository, binds as the reserved logical id workspace at path "." with its
      own anchor branch, and is never placed under repositories/.
  - id: INV-REPO-04
    rule: >
      Binding resolution is explicit and bounded. Missing, ambiguous, non-Git,
      traversal, unsafe-symlink, or identity-mismatched bindings fail closed
      without scanning the filesystem or substituting a similarly named path.
  - id: INV-DELIVER-01
    rule: >
      Pull-request creation, merge, push, publication, deployment, archive, and
      cleanup are separate human-requested actions. A pull request uses each
      execution branch as source and the repository's recorded anchor_branch as
      the default target; it never substitutes default_branch or silently follows
      a moving remote.
  - id: INV-DELIVER-02
    rule: >
      Delivery blocks and reports when the source branch, configured provider or
      remote, or target branch is unavailable, rather than inferring a remote or
      pushing silently.
  - id: INV-SEC-01
    rule: >
      Workspace-relative paths reject traversal and unsafe symlinks. Credentials
      remain in host Git configuration or the host agent and never enter
      workspace files or runtime records.
  - id: INV-SEC-02
    rule: >
      sources/ is passive raw evidence. Only exact request-scoped source files
      are read; the workspace never scans all sources or sibling workspaces to
      fill a context gap.
  - id: INV-RUNTIME-01
    rule: >
      The Context Circuit runtime is a small host-neutral deterministic library.
      It contains no provider launch code, model prompts, Product Knowledge
      interpretation, plan-writing intelligence, conversational routing policy,
      confirmation cards, product test-runner logic, or automatic
      pull-request/merge/push/publish/deploy/cleanup/completion.
  - id: INV-RUNTIME-02
    rule: >
      Runtime records are written atomically. A partial or contradictory record
      cannot grant ownership, resume a writer, prove verification, or authorize
      completion.
  - id: INV-OWN-01
    rule: >
      At most one active writer owns a plan execution, enforced by an atomic
      exclusive-create lock. A competing writer receives a read-only or blocked
      result; a live lock is never silently stolen.
  - id: INV-HOST-01
    rule: >
      Host identity, version, capability, permission mode, and provider status
      are bounded provider-neutral evidence only. They never authorize a route,
      role, lease, gate, verification, or completion.
  - id: INV-SKILL-01
    rule: >
      Product skills ship only at `.agents/skills/<name>/SKILL.md` and are
      read-as-procedure packets the coordinator resolves by path. A host may
      additionally surface a skill as a directly invocable slash command, but
      that host bridge is an optional convenience owned by the host adapter and
      is never a separate route, role, or authority. The shipped workspace never
      contains a host-specific skill directory or symlink.

owners:
  authority_order: WORKFLOW.md
  source_boundary: AGENTS.md
  product_knowledge: context/INDEX.md
  context_retrieval: wrapper/contracts/schemas/context-index.yaml
  context_proposals: wrapper/contracts/schemas/context-proposal.yaml
  plan_lifecycle: wrapper/contracts/schemas/plan.yaml
  task_projection: wrapper/contracts/schemas/task.yaml
  repository_identity: wrapper/contracts/schemas/workspace.yaml
  local_binding: wrapper/contracts/schemas/repositories-local.yaml
  runtime: wrapper/runtime/engine.sh
  execution_records: wrapper/contracts/schemas/execution.yaml
  worker_handoff: wrapper/contracts/schemas/worker-handoff.yaml
  verifier_result: wrapper/contracts/schemas/verifier-result.yaml
  completion_record: wrapper/contracts/schemas/completion.yaml
  context_impact: wrapper/contracts/schemas/context-impact.yaml
  release_boundary: wrapper/manifest.yaml
  skill_packets: .agents/skills/
  coordinator_role: agents/coordinator.md
  worker_role: agents/writer.md
  verifier_role: agents/verifier.md
  host_adapter: wrapper/adapters/AGENTS.md
  delivery_boundary: wrapper/adapters/WORKFLOW.md
