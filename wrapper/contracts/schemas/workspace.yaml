schema_version: 1
owner: wrapper/contracts/schemas/workspace.yaml
describes: workspace.yaml
concern: repository_identity

purpose: >
  Canonical portable workspace identity: project name, purpose, and logical
  repository identities. It records logical identity only; machine-specific
  paths and anchor branches live in the ignored repositories.local.yaml.

fields:
  schema_version: { type: integer, required: true }
  workspace: { type: string, required: true, description: portable workspace key }
  title: { type: string, required: false }
  purpose: { type: string, required: false }
  repositories:
    type: list
    required: true
    item:
      id: { type: string, required: true, description: logical repository key }
      purpose: { type: string, required: false }
      canonical_url:
        type: string
        required: false
        description: optional credential-free clone URL
      default_branch:
        type: string
        required: false
        description: >
          Portable clone/setup hint only. It is never the user's active branch
          and never, by itself, the execution base or pull-request target.

reserved_ids:
  workspace: >
    When the workspace root is itself a Git repository it is bound as the
    reserved logical id "workspace" at local path ".", with its own independent
    anchor_branch. The workspace repository is never placed under repositories/.

forbidden:
  - machine-specific local paths
  - credentials, tokens, private keys, provider payloads
  - deriving Product Knowledge from this file

rules:
  - INV-REPO-01
  - INV-REPO-02
  - INV-REPO-03
