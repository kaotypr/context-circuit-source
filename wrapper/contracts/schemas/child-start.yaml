schema_version: 1
owner: .runtime/sessions/<child-id>/child-start.yaml
required: [schema_version, wrapper_version, child_start_id, session_id, parent_session_id, root_session_id, role, repository, worktree, delegation_locator, delegation_revision, delegation_bytes, delegation_digest, context_receipt_locator, context_receipt_revision, context_receipt_bytes, context_receipt_digest, host_evidence_digest, ownership_graph_digest, launch_locator, handoff_locator, created_at, updated_at, transaction_id, transaction_state, commit_marker]
record_contract:
  constructor_inputs:
    caller_intent: [delegation_locator, context_receipt_locator, launch_locator, handoff_locator]
    validated_evidence: [session_id, parent_session_id, root_session_id, role, repository, worktree]
  engine_generated: [schema_version, wrapper_version, child_start_id, delegation_revision, delegation_bytes, delegation_digest, context_receipt_revision, context_receipt_bytes, context_receipt_digest, host_evidence_digest, ownership_graph_digest, created_at, updated_at, transaction_id, transaction_state, commit_marker]
  transaction_states: [staged, valid, committed, interrupted, legacy-readable]
  compatibility: legacy-readable is read-only and cannot authorize child start, expand delegation scope, grant ownership, or satisfy verification
evidence:
  locators: [delegation_locator, context_receipt_locator, launch_locator, handoff_locator]
  graph_fields: [session_id, parent_session_id, root_session_id, role, repository, worktree, delegation_digest, context_receipt_digest, host_evidence_digest, ownership_graph_digest]
  generated_metadata: [created_at, updated_at, delegation_revision, delegation_bytes, context_receipt_revision, context_receipt_bytes]
  forbidden: [prompt, credentials, tokens, provider-payloads, transcripts, auth-state, permission-grants]
ownership:
  child_scope: delegation.yaml
  evidence_only: child-start.yaml records validated launch evidence and never authorizes execution
  launch_projection: [role, assigned_root, delegation_locator, handoff_locator]
transaction:
  states: [staged, valid, committed, interrupted, legacy-readable]
  commit_marker: engine-generated marker is required for authoritative graph publication
  interrupted: discard staged records and marker; no partial evidence grants ownership or resume
  legacy-readable: preserve readable legacy evidence without rewriting or upgrading authority
