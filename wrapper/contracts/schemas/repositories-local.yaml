schema_version: 1
owner: wrapper/contracts/schemas/repositories-local.yaml
describes: repositories.local.yaml
concern: local_binding

purpose: >
  Host-local, git-ignored mapping from a logical repository id to a concrete
  local checkout path and the user-selected anchor branch. Never portable and
  never shipped.

fields:
  schema_version: { type: integer, required: true }
  bindings:
    type: map
    required: true
    key: logical repository id
    value:
      path:
        type: string
        required: true
        description: >
          Local checkout path. May be "." for the workspace repository, a path
          under repositories/<id>/, or an explicitly provided external path.
      anchor_branch:
        type: string
        required: true
        description: >
          The user's actual active local branch. It is the execution worktree
          base and the default pull-request target. Different users may set
          different anchor branches for the same logical repository.

resolution_rejects:
  - missing paths
  - non-Git paths
  - traversal outside permitted roots
  - unsafe symlinks
  - remote identity conflicts
  - duplicate or ambiguous bindings
  - dirty anchor checkouts when execution requires a clean anchor

rules:
  - INV-REPO-02
  - INV-REPO-04
  - INV-SEC-01
