schema_version: 1
owner: .runtime/stacks/<stack-id>/graph.yaml and progress.yaml
graph_required: [schema_version, wrapper_version, stack_id, repository, members, edges, leaves]
progress_required: [schema_version, wrapper_version, stack_id, status, owner_session_id, members]
member_states: [pending, ready, running, joining, implemented, failed, blocked]
rules:
  - graph is frozen once created
  - one parent uses frozen parent SHA
  - multiple parents join sorted frozen SHAs in-run
  - implemented parents unblock dependents; no auto-finish
