schema_version: 2
owner: plans/<repository>-plans/<plan>/tasks/<task>.md frontmatter projection
required: [schema_version, id, plan, status, paths, depends_on, acceptance, verification, expected_evidence, stop_conditions]
enums:
  status: [draft, ready, done]
projection:
  draft: draft
  approved: ready
  done: done
rules:
  - task status is projected from plan status and is not an approval gate
format:
  frontmatter:
    opening: The first line of every task Markdown file is exactly `---`.
    closing: A second `---` closes the YAML frontmatter before the Markdown body.
  plan_yaml: plan.yaml is pure YAML and is not wrapped in Markdown frontmatter.
