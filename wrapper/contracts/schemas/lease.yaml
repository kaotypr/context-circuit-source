schema_version: 1
owner: wrapper/contracts/schemas/lease.yaml
describes: .runtime/locks/paths/<repository-id>/<holder-plan-id>.yaml
concern: path_lease_records

purpose: >
  Private runtime evidence for one path lease: the (repository, path-region)
  reservation an execution holds. A path lease generalizes the one-worker lock
  (INV-OWN-01) from plan scope to path-region scope and composes with it
  (INV-CONCURRENCY-01). Records are written atomically; a partial or
  contradictory record grants nothing (INV-RUNTIME-02).

layout:
  lease_dir: .runtime/locks/paths/<repository-id>/
  file: <holder-plan-id>.yaml   # one record per (repository, holder plan)

fields:
  schema_version: { type: integer, required: true, values: [1] }
  plan: { type: string, required: true, description: holder plan id }
  repository: { type: string, required: true, description: logical repository id }
  regions:
    type: list
    required: true
    description: >
      The path regions the holder reserves in this repository — the union of the
      bounded task paths the execution records for the repository. A region is a
      workspace-relative path, or "." for a repository-wide reservation.
  acquired_at: { type: string, required: true }
  released_at:
    type: string
    required: false
    description: >
      Set when the lease is released (on delivery, not merely verification). The
      record is preserved, never deleted, so released history stays inspectable.

overlap:
  rule: >
    Two regions overlap when they are equal, when one is a path-prefix ancestor
    of the other, or when either is the repository-wide ".". An overlapping
    region held by a non-descendant blocks acquisition (LEASE_CONFLICT); a
    descendant of the holder is exempt because it builds on the holder.

rules:
  - INV-CONCURRENCY-01
  - INV-OWN-01
  - INV-RUNTIME-02
