schema_version: 1
owner: wrapper/contracts/schemas/candidate.yaml
describes: .runtime/executions/<plan-id>/<execution-id>/candidate.yaml
concern: candidate_identity

purpose: >
  A candidate is the identity of the exact proposed result (Context Circuit v1.0,
  Mechanism 2). It is a deterministic digest computed over records the engine
  already keeps — the per-repository commit map and the selected base commits —
  plus the intent's frozen contract_digest (the definition of correct). It is not
  a new state machine; it is a binding that makes "it passed earlier" impossible by
  construction. Independent-check results (verifier-result.yaml) and human
  acceptance (human-acceptance.yaml) bind to a candidate; any new commit OR a
  criteria change yields a new candidate_id and voids all prior evidence and
  acceptance for the old one (INV-CANDIDATE-01). No role decides whether old
  evidence is "close enough".

candidate_id:
  form: cand-<hash>
  inputs:
    - repository -> latest_commit   # the per-repo commit map (recorded per execution)
    - repository -> base_commit     # the selected base commits (recorded per execution)
    - contract_digest               # the intent's frozen criteria
  rules:
    - deterministic: identical inputs produce an identical candidate_id
    - any change to a commit, a base, or the contract digest changes the id
    - the digest is computed over a canonical, sorted representation of the inputs

fields:
  schema_version: { type: integer, required: true, values: [1] }
  candidate_id: { type: string, required: true, description: cand-<hash> over the inputs }
  plan: { type: string, required: true }
  execution_id: { type: string, required: true }
  contract_digest:
    type: string
    required: true
    description: the intent's frozen criteria digest
  repositories:
    type: map
    required: true
    description: repository id -> latest_commit (from the per-repository records)
  bases:
    type: map
    required: true
    description: repository id -> base_commit (from the per-repository records)
  computed_at: { type: string, required: true }

interaction:
  drift_guard: >
    A delivery rebase changes the commit map, which changes the candidate, which
    voids the prior verification and acceptance (INV-CANDIDATE-01) — so the
    re-verification the drift guard (INV-DELIVER-01) already demands is the general
    candidate rule doing its job, not a special case.
  change_set: >
    Several stacked plans that converge to one pull request form one change set; the
    candidate is computed over the combined integration tip, so one candidate is
    verified once and accepted once (concurrency-and-candidate.md).

rules:
  - INV-CANDIDATE-01
  - INV-RUNTIME-02
