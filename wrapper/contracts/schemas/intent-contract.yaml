schema_version: 2
owner: wrapper/contracts/schemas/intent-contract.yaml
describes: intent/<intent-id>/contract.yaml
concern: intent_contract

purpose: >
  Machine-readable half of an intent — the first-class decision for one change
  (Context Circuit v1.0, Mechanism 1). It owns the human-level definition of
  correct: goal, non-goals, constraints, OUTCOME-level acceptance criteria, a
  coarse and optional scope, and the consequence tier — drafted by the coordinator
  without reading the codebase (it grounds only in existing context/ Product
  Knowledge). INTENT.md is the readable half describing the same intent.
  contract.yaml is canonical for identifiers, status, scope, tier, and the frozen
  contract_digest. Approval is the single upstream human gate (Gate 1); it freezes
  contract_digest — the identity of the criteria the candidate (candidate.yaml) is
  later proven against — and also confirms the coordinator understood the plain ask,
  which is what lets the tracer read the real code next (tracing-and-grounding).
  The runnable check that proves each outcome criterion is a TRACING output carried
  in the plan (trace-manifest.yaml), never authored here.

intent_status:
  authority: this file
  values: [draft, approved]
  transitions:
    - draft -> approved   # explicit human approval (Gate 1)
  notes: >
    Approval freezes contract_digest. Changing any criteria-bearing field after
    approval is a new decision: the digest no longer matches, so the plan's
    derives-from-an-approved-intent authorization (cc_intent_authorized) fails
    until the intent is re-approved, and prior candidate evidence voids
    (INV-CANDIDATE-01). There is no draft<-approved transition; a change re-enters
    the gate.

intent_id:
  form: i<NNN>-<kebab-slug>
  rules:
    - a leading `i`, then exactly three zero-padded decimal digits, then `-` and a slug
    - distinct from a plan id (NNNN-slug) so an id reads as an intent on sight
    - three digits are the next after the highest intent id ever allocated
    - i999 is the exact representational ceiling; allocation fails clearly beyond it
    - lowercase kebab-case slug, no dates, underscores, punctuation, or hashes
    - unique across active and archived intents for the workspace lifetime
    - stable after creation even if title or status changes; never reused

fields:
  schema_version: { type: integer, required: true, values: [2] }
  intent: { type: string, required: true, description: canonical intent id, matches the directory name }
  title: { type: string, required: true }
  goal: { type: string, required: true, description: one paragraph }
  non_goals: { type: list, required: false, description: explicit exclusions }
  constraints: { type: list, required: false, description: e.g. no new deps, latency budget }
  acceptance_criteria:
    type: list
    required: true
    description: >
      Each criterion defines one part of correct at the OUTCOME level — what must be
      true, in terms a human can approve (for example "no direct localStorage access
      remains"). Criteria are not executable and not frozen as runnable here: the
      tracer earns the runnable check that proves each one against the real code
      after approval, carried into the plan (trace-manifest.yaml). At least one is
      required.
    item:
      id: { type: string, required: true }
      statement: { type: string, required: true, description: the outcome, human-approvable }
  scope:
    type: object
    required: false
    description: >
      COARSE and OPTIONAL — a rough boundary the human may draw, not an enforced
      gate. A lay human usually states a goal, not paths, so this is often empty. It
      is NOT compared against a plan by any automated gate: the tracer reports where
      the change lands, the coordinator's feasibility check surfaces a required change
      that must MODIFY a repository or area beyond a bound scope (intent-feasibility),
      and scope-safety itself is settled at delivery (Gate 2, INV-DELIVER-01). Its one
      deterministic use is as a transparent input to tier signal classification
      (INV-ASSURE-01).
    fields:
      repositories:
        type: list
        item:
          id: { type: string, required: true }
          paths: { type: list, required: false, description: rough path regions or repository-wide "." }
  tier:
    type: enum
    required: true
    values: [explore, standard, critical]
    description: >
      The consequence tier (Mechanism 3). Explore is human-supervised with no
      independent verifier and is never labeled verified; Standard and Critical
      require an independent read-only verifier bound to the current candidate.
      Proposed at intent time from transparent risk signals and raisable by the
      human, and re-checked with the tracer's findings before plans are written
      (a tier signal may raise it). The runtime enforces the verifier floor but
      never selects a tier (INV-ASSURE-01). A reader may treat an absent tier as
      standard.
  status: { type: enum, required: true, values: [draft, approved] }
  intent_dependencies:
    type: list
    required: false
    description: >
      Optional inter-intent ordering, mirroring plan_dependencies (INV-PLAN-05).
      Each entry names another intent this one depends on, with a reason.
    item:
      id: { type: string, required: true, description: an existing, non-self intent id }
      reason: { type: string, required: true }
  contract_digest:
    type: string
    required: false
    description: >
      Set on approval; the frozen identity of the criteria-bearing content (all
      fields except status and contract_digest itself). It is folded into the
      candidate digest (candidate.yaml), so a criteria change yields a new
      candidate and voids prior evidence (INV-CANDIDATE-01). Empty while draft.

trace_manifest:
  file: intent/<intent-id>/trace/<repository>.yaml
  produced_by: cc-trace (the tracer), spawned on approval — one per repository in scope
  owner: wrapper/contracts/schemas/trace-manifest.yaml
  note: >
    The tracer reads the real code AFTER approval and reports a durable manifest —
    file/call-site map, concrete risks, the runnable "done" checks that prove each
    outcome criterion, a tier signal, feasibility, and any out-of-scope reach. The
    contract above holds the stable human-level target; the manifest holds the
    machine-precise measure. The manifest is NOT part of contract_digest (it is
    earned post-approval, so it never re-enters Gate 1).

invariants:
  - every writing request is anchored to an intent whose contract.yaml holds goal,
    outcome-level acceptance criteria, and an optional coarse scope (INV-INTENT-01)
  - acceptance criteria are OUTCOME level; the runnable check is a tracing output
    carried in the plan, never authored here (INV-INTENT-01, tracing-and-grounding)
  - approval is the single upstream human gate, freezes contract_digest, and confirms
    the coordinator understood the ask so the tracer can read the code (INV-INTENT-01, INV-APPROVE-01)
  - scope is coarse and optional; it is not an enforced gate — scope-safety is settled
    at delivery (Gate 2), and the feasibility check surfaces an out-of-scope reach (INV-INTENT-02)
  - tier is declared here and enforced as a floor by the runtime, never selected by it (INV-ASSURE-01)

rules:
  - INV-INTENT-01
  - INV-INTENT-02
  - INV-APPROVE-01
  - INV-ASSURE-01
  - INV-CANDIDATE-01
