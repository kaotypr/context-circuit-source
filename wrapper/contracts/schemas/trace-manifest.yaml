schema_version: 1
owner: wrapper/contracts/schemas/trace-manifest.yaml
describes: intent/<intent-id>/trace/<repository>.yaml
concern: trace_manifest

purpose: >
  The tracer's report, captured as durable grounding evidence (Context Circuit v1.0,
  Mechanism 1, tracing-and-grounding). On intent approval the coordinator spawns one
  read-only tracer child per repository in the intent's scope, in parallel; each reads
  its repository first-hand for this change and reports back a manifest rich enough for
  the coordinator to plan from without having read the code itself. It is recorded (not
  lost in a context window) so a later session loads it and runs a bounded freshness
  check instead of re-tracing from zero (INV-GROUND-*). The tracer never writes plans,
  never edits the frozen contract, and never talks to the human: it finds, records, and
  reports to the coordinator, which authors the plan and runs the feasibility check.

produced_by: cc-trace (the tracer) — read-only over the code; no lease, no worktree
consumed_by:
  - cc-plan authors the plan(s) from the file map, task partition, and done checks
  - the coordinator's feasibility check reads feasible + out_of_scope_reach + open_questions
  - the verifier re-runs the done_checks carried into the plan

fields:
  schema_version: { type: integer, required: true, values: [1] }
  intent: { type: string, required: true, description: the parent intent id }
  repository: { type: string, required: true, description: which repository this manifest covers }
  file_map:
    type: list
    required: true
    description: >
      exact paths, the specific call sites that change, relevant signatures and
      integration points — the grounded map the coordinator plans from.
  task_partition:
    type: list
    required: false
    description: proposed split of the work (by feature area or layer) for the coordinator to ratify or adjust
  risks:
    type: list
    required: false
    description: >
      concrete risks named against the real code (data, security, irreversibility,
      coupling), including risks only a code read reveals.
  done_checks:
    type: list
    required: false
    description: >
      the runnable commands/tests that PROVE the intent's outcome criteria hold (for
      example a grep proving zero direct call-sites remain); carried into the plan and
      re-run by the verifier. This is where an outcome criterion becomes executable.
    item:
      criterion: { type: string, required: false, description: the outcome criterion id this proves }
      command: { type: string, required: true, description: the runnable check }
      expect: { type: string, required: false, description: the passing condition }
  tier_signal:
    type: string
    required: false
    description: evidence that may RAISE the intent's provisional tier (auth, secrets, data, irreversibility); surfaces at plan review
  feasible:
    type: boolean
    required: true
    description: >
      whether the approved intent is buildable given the real code. false stops the
      coordinator, which explains the blocker (carried in open_questions) and hands the
      decision to the human before any plan is written (intent-feasibility).
  out_of_scope_reach:
    type: list
    required: false
    description: >
      repositories or areas the change must MODIFY that fall outside a bound scope
      (empty when none, or when no scope is bound). The coordinator surfaces these in
      the feasibility check as a question — merely reading or calling an out-of-scope
      area does not trigger it.
  open_questions:
    type: list
    required: false
    description: anything the human must settle, for the coordinator to relay (never the tracer directly)
  completeness_proof:
    type: object
    required: false
    description: >
      present only for a "change every X" obligation — the command and count showing
      the found set is the WHOLE set, so completeness is a check that passes or fails
      rather than a file count the coordinator hand-maintains.
    fields:
      command: { type: string, required: false }
      count: { type: integer, required: false }
  recorded_at: { type: string, required: false }
  freshness_checked_at: { type: string, required: false, description: last bounded freshness check against current code }

invariants:
  - the tracer reads the real code AFTER Gate 1 and reports to the coordinator only,
    never to the human (roles-and-spawning, tracing-and-grounding)
  - the runnable check that proves an outcome criterion is a tracing output here,
    never authored on the intent contract (INV-INTENT-01)
  - the manifest is durable grounding evidence, reused with a bounded freshness check
    rather than re-traced from zero (INV-GROUND-*)
  - it is not part of contract_digest — earned post-approval, it never re-enters Gate 1
    (whether post-approval done-checks should bind into the frozen contract is an open
    question in risks-and-open-questions; current behavior keeps them out)

rules:
  - INV-INTENT-01
  - INV-INTENT-02
  - INV-GROUND-01
