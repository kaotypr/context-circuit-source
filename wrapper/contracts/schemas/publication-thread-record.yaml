schema_version: 1
owner: wrapper/contracts/schemas/publication-thread-record.yaml
describes: publication/<name>/published/<plan-id>.yaml
concern: publication_thread_record

purpose: >
  The authoritative record for a "thread" kind publication — a plan's open questions
  posted as a chat discussion. It is keyed by the thread and its questions, not by
  tasks, so it is a different shape from the plan kind's record
  (publication-record.yaml); record shapes are per-kind. It lives under the
  publication's published/ folder, keyed by the stable plan id, with a lifecycle
  independent of the plan's archive state. It holds no credential and no message
  text — only ids and timestamps — so it is unaffected by the config's language or
  instructions.

layout:
  published_dir: publication/<name>/published/
  file: <plan-id>.yaml   # one record per published plan (e.g. 0100-csv-export-reports.yaml)

fields:
  schema_version: { type: integer, required: true, values: [1] }
  plan: { type: string, required: true, description: the plan id this record publishes }
  provider: { type: string, required: true, description: for example slack }
  thread:
    type: object
    required: true
    description: the parent message that opens the discussion
    fields:
      channel: { type: string, required: true, description: logical channel id (credential-free) }
      parent_ts: { type: string, required: true, description: provider id of the parent message }
      url: { type: string, required: false }
  questions:
    type: list
    required: true
    description: one entry per open question, mirroring it as a threaded reply
    item:
      ref:
        type: string
        required: true
        description: >
          A stable per-question key derived from the question (not a workspace id),
          so a re-run can find and edit the right message.
      reply_ts: { type: string, required: true, description: provider id of the question's reply }
      url: { type: string, required: false }

authority:
  direction: >
    Written after the host/MCP call returns the message ids; the deterministic write
    reuses the runtime's atomic-write path. The runtime gains no provider or network
    action for this (INV-RUNTIME-01).
  discussion_safe: >
    A discussion is never clobbered. On re-run cc-publish may edit its own question
    messages in place and append a reply for a newly-added question; it never edits
    or deletes a human's reply, and it deletes no messages (INV-EXTERNAL-02).
  not_an_execution_input: >
    This record lives under publication/, never under plans/, so no planning,
    execution, verification, or delivery step encounters it, and no such step
    updates external state. It is read and written only by cc-publish on explicit
    manual invocation (INV-EXTERNAL-01).

forbidden:
  - credentials, tokens, or provider payloads
  - message text (the record holds ids and timestamps only)
  - any field on plan.yaml holding an external id

rules:
  - INV-EXTERNAL-02
  - INV-PLAN-01
  - INV-RUNTIME-02
