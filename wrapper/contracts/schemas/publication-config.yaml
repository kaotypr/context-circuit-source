schema_version: 1
owner: wrapper/contracts/schemas/publication-config.yaml
describes: publication/<name>/config.yaml
concern: publication_config

purpose: >
  User-owned declaration of one publication: an opt-in, manually-triggered pipeline
  the external surface uses to push workspace data to an external system (a task
  tracker, chat, or docs system). It is credential-free and holds only a logical
  destination; provider tokens stay at the host or MCP layer (INV-SEC-01). The
  publication/ folder is created on first use, never shipped in the template seed. A
  publication is orthogonal to the core workflow (INV-EXTERNAL-01) and export-only
  (INV-EXTERNAL-02).

layout:
  name_dir: publication/<name>/
  naming: >
    <name> is a user-chosen label, conventionally <subject>-<provider> — for
    example plans-clickup, plans-github, docs-clickup, thread-slack.
  files:
    config.yaml: this declaration (committed with the workspace or not, a workspace choice)
    .local.yaml: optional, gitignored — non-secret instance ids only, never credentials
    published/<plan-id>.yaml: authoritative per-plan records (publication-record.yaml)
  note: >
    Everything about a publication lives under publication/<name>/ — this
    configuration and the published/ records. Nothing is written under plans/.

fields:
  schema_version: { type: integer, required: true, values: [1] }
  publication: { type: string, required: true, description: stable local id; matches the folder name }
  kind:
    type: string
    required: true
    description: >
      What this publication publishes; the cc-publish skill publishes according to
      it. Implemented kinds are "plan" (a plan and its tasks) and "thread" (a plan's
      open questions as a chat discussion; see publication-thread-record.yaml). A
      future kind (e.g. docs) is new behavior in cc-publish, not new authority.
  provider:
    type: string
    required: true
    description: >
      The external system this publication reaches (for example clickup, jira,
      github, notion, slack). Open-ended: any system that fits the kind qualifies.
      The provider selects the host/MCP adapter; it never selects a runtime action.
  direction:
    type: enum
    required: true
    values: [export]
    description: >
      Export-only in this contract (INV-EXTERNAL-02). The field exists so a
      non-export value is refused rather than silently doing something inbound.
  trigger:
    type: enum
    required: true
    values: [manual]
    description: >
      Manual invocation is the only allowed trigger (INV-EXTERNAL-01). The field
      exists so an automatic or scheduled value is refused, never honored.
  instructions:
    type: string
    required: false
    description: >
      Optional free-text guidance cc-publish follows when authoring external text:
      the language to author in (for example "write in Bahasa Indonesia"; default is
      the source plan's language), tone, phrasing, and term handling (for example
      "everyday conversational tone; keep technical terms in English"), and which
      optional provider fields to enrich by deriving them from the plan (for example
      a time estimate per task or a target date range), written one-way as
      best-effort estimates. It guides wording and optional field values only; it
      never overrides INV-EXTERNAL-03, expands reads, writes back to the workspace,
      changes the core mapping, or relaxes a boundary. It changes no workspace text
      (INV-PLAN-01); ids and target_ref are never translated. Applies to every kind.
  reads:
    type: list
    required: true
    description: >
      Bounded, declared allow-list of the workspace artifact types this publication
      may read (for example plans, tasks; a thread publication reads a plan's open
      questions). It reads only what it names and never scans to fill a gap
      (INV-SEC-02 ethos, INV-EXTERNAL-02).
  target_ref:
    type: object
    required: true
    description: >
      Credential-free logical destination only (for example a list name, a project
      key, a repository id, a channel). Never a secret, token, or provider payload.
  mapping:
    type: object
    required: false
    description: >
      Kind-specific field map. For the plan kind: the plan-to-work-item and
      task-to-child-item realization; acceptance_as (checklist, or
      description-checklist when the adapter has no native checklist-create call);
      and a status map from plan status (draft, approved, done) onto the target's
      own discovered status set, since status vocabularies are provider-defined.

forbidden:
  - credentials, tokens, private keys, or provider payloads
  - a direction other than export
  - a trigger other than manual
  - any field that would couple a publication to a core-workflow phase

rules:
  - INV-EXTERNAL-01
  - INV-EXTERNAL-02
  - INV-SKILL-01
  - INV-SEC-01
