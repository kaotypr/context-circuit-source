schema_version: 1
owner: wrapper/contracts/schemas/completion.yaml
describes: .runtime/executions/<plan-id>/<execution-id>/completion.yaml
concern: completion_record

purpose: >
  Durable implementation completion record proving which execution and repository
  commits were accepted as done. Under Context Circuit v1.0 the way it is reached
  depends on the intent's consequence tier (INV-COMPLETE-01): Standard is INFERRED
  from a current candidate-bound human acceptance plus a recorded delivery
  (`human_completion: inferred`); Critical is written only by an EXPLICIT human
  completion request after independent verification (`human_completion: accepted`).
  Explore is planless until promotion and therefore has no plan completion record.
  It never changes Product Knowledge.

preconditions:
  - completion-ready passes for the plan's tier (Explore: candidate-bound
    acceptance; Standard/Critical: candidate-bound independent pass)
  - plan status is draft at the moment of completion
  - completion is candidate-bound to the current intent contract and execution
  - inferred completion (Standard) additionally requires a recorded delivery still
    binding to the current candidate; Critical requires an explicit human request

fields:
  schema_version: { type: integer, required: true }
  execution_id: { type: string, required: true }
  plan: { type: string, required: true }
  candidate_id: { type: string, required: true }
  plan_revision: { type: string, required: true }
  accepted_by: { type: string, required: true }
  verifier_outcome:
    type: enum
    required: true
    values: [passed, not-run]
  change_set: { type: string, required: false }
  change_set_verifier_candidate: { type: string, required: false }
  human_completion:
    type: enum
    required: true
    values: [accepted, inferred]
    description: >
      accepted = an explicit human completion (Critical); inferred = a
      projection of candidate acceptance + delivery (Explore/Standard).
  completed_at: { type: string, required: true }
  commits:
    type: map
    required: true
    key: repository id
    value: accepted commit revision

effects:
  - plan status changes draft -> done
  - implementation completion record is written
  - knowledge reconciliation starts and produces proposals or a no-update-needed result

non_effects:
  - does not accept any Product Knowledge update
  - does not merge, push, open a pull request, deploy, or clean up
  - a verification pass alone never performs this transition

rules:
  - INV-COMPLETE-01
  - INV-COMPLETE-02
  - INV-KNOWLEDGE-02
