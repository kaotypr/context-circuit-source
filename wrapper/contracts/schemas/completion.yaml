schema_version: 1
owner: wrapper/contracts/schemas/completion.yaml
describes: .runtime/executions/<plan-id>/<execution-id>/completion.yaml
concern: completion_record

purpose: >
  Durable implementation completion record proving which verified execution and
  repository commits a human accepted as done. It is written only by an explicit
  human completion request, and only when the latest execution passed
  independent verification. It never changes Product Knowledge.

preconditions:
  - the latest execution status is verified
  - plan status is approved at the moment of completion
  - completion is an explicit human request

fields:
  schema_version: { type: integer, required: true }
  execution_id: { type: string, required: true }
  plan: { type: string, required: true }
  human_completion: { const: accepted, required: true }
  completed_at: { type: string, required: true }
  commits:
    type: map
    required: true
    key: repository id
    value: accepted commit revision

effects:
  - plan status changes approved -> done
  - implementation completion record is written
  - knowledge reconciliation starts and produces proposals or a no-update-needed result

non_effects:
  - does not accept any Product Knowledge update
  - does not merge, push, open a pull request, deploy, or clean up
  - a verification pass alone never performs this transition

rules:
  - INV-COMPLETE-01
  - INV-COMPLETE-02
  - INV-KNOWLEDGE-02
