schema_version: 1
owner: wrapper/contracts/schemas/execution.yaml
describes: .runtime/executions/<plan-id>/<execution-id>/execution.yaml
concern: execution_records

purpose: >
  Private runtime evidence for one bounded execution of an approved plan. It is
  execution evidence, not Product Knowledge or plan intent. Records are written
  atomically; a partial or contradictory record grants nothing.

layout:
  execution_dir: .runtime/executions/<plan-id>/<execution-id>/
  files:
    execution.yaml: this record
    snapshot/: immutable copy of PLAN.md, plan.yaml, and tasks/ at execution start
    handoff.md: latest worker handoff
    completion.yaml: implementation completion record (written on human completion)
    context-impact.yaml: knowledge reconciliation references (written by coordinator)
    attempts/NNN/worker.yaml: worker attempt record and captured commits
    attempts/NNN/verifier.yaml: independent verifier result for that attempt
    repositories/<repository-id>.yaml: per-repository worktree, branch, base and latest commit

fields:
  schema_version: { type: integer, required: true }
  execution_id: { type: string, required: true, description: exec-<plan-id>-NNN }
  plan: { type: string, required: true }
  plan_revision: { type: string, required: true, description: digest of the snapshot plan.yaml }
  owner: { type: string, required: true, description: writer/session id holding the lock }
  status:
    type: enum
    required: true
    values: [running, verifying, repairing, verified, failed, blocked]
  worker_failures: { type: integer, required: true, description: 0..3 }
  current_attempt: { type: integer, required: true }
  created_at: { type: string, required: true }
  updated_at: { type: string, required: true }

repository_record_fields:
  repository: logical repository id
  worktree: isolated worktree path under .runtime/worktrees/<plan-id>/<repository-id>/
  branch: cc/<plan-id>/<repository-id>
  anchor_branch: recorded user-local anchor branch (default pull-request target)
  base_commit: captured anchor-branch tip at execution start
  latest_commit: latest worker commit inspected by the verifier

rules:
  - INV-EXEC-01
  - INV-EXEC-02
  - INV-EXEC-03
  - INV-REPAIR-01
  - INV-PRESERVE-01
  - INV-RUNTIME-02
  - INV-OWN-01
