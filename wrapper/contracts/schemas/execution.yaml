schema_version: 1
owner: wrapper/contracts/schemas/execution.yaml
describes: .runtime/executions/<plan-id>/<execution-id>/execution.yaml
concern: execution_records

purpose: >
  Private runtime evidence for one bounded execution of an approved plan. It is
  execution evidence, not Product Knowledge or plan intent. Records are written
  atomically; a partial or contradictory record grants nothing.

layout:
  execution_dir: .runtime/executions/<plan-id>/<execution-id>/
  files:
    execution.yaml: this record
    snapshot/: immutable copy of PLAN.md, plan.yaml, and tasks/ at execution start
    handoff.md: latest worker handoff
    completion.yaml: implementation completion record (written on human completion)
    context-impact.yaml: knowledge reconciliation references (written by coordinator)
    attempts/NNN/worker.yaml: worker attempt record and captured commits
    attempts/NNN/verifier.yaml: independent verifier result for that attempt
    attempts/NNN/host-evidence.yaml: >
      additive v0.7.0 per-attempt host evidence — coordinator-observed inference
      wall-clock and the (model, effort) each role ran at (see timing_fields).
      Evidence only; no gate, route, verdict, or counter reads it (INV-HOST-01).
    repositories/<repository-id>.yaml: per-repository worktree, branch, base and latest commit
    grounding/<repository-id>.yaml: repository-grounding manifest discovered for the
      execution worktree (INV-GROUND-01; schema grounding-manifest.yaml)
    brief-<repository-id>.md: the assembled worker brief (deterministic; optional evidence)

fields:
  schema_version: { type: integer, required: true }
  execution_id: { type: string, required: true, description: exec-<plan-id>-NNN }
  plan: { type: string, required: true }
  plan_revision: { type: string, required: true, description: digest of the snapshot plan.yaml }
  owner: { type: string, required: true, description: worker/session id holding the lock }
  status:
    type: enum
    required: true
    values: [running, verifying, repairing, verified, failed, blocked]
  worker_failures: { type: integer, required: true, description: 0..3 }
  current_attempt: { type: integer, required: true }
  created_at: { type: string, required: true }
  updated_at: { type: string, required: true }
  phase_ms:
    type: map
    required: false
    description: >
      Additive v0.7.0 deterministic-phase durations (milliseconds) the engine
      stamps for work it performs itself: base_prepare, grounding_discovery,
      integration_merge, verifier_prepare. Present on running and blocked records
      alike; a blocked trace still records the phases that ran. Best-effort clock
      (0 ms where a phase is sub-second on a host without nanosecond date). Pure
      bookkeeping over existing work — no model prompt, no launch logic
      (INV-RUNTIME-01); evidence only, never a gate (INV-HOST-01 in spirit).

timing_fields:
  purpose: >
    v0.7.0 execution-latency measurement. The two observers are split by
    construction: the engine self-stamps deterministic durations it performs; the
    coordinator records inference wall-clock only it can see. All additive, all
    evidence, none a gate; a v0.6 reader ignores every field.
  engine_stamped:
    execution.phase_ms: deterministic phase durations (above).
    attempts/NNN/worker.yaml.attempt_started_at: per-attempt start boundary.
    attempts/NNN/verifier.yaml.attempt_ended_at: per-attempt end boundary (monotonic).
  coordinator_recorded:
    file: attempts/NNN/host-evidence.yaml
    written_by: runtime action attempt-evidence-record (atomic; INV-RUNTIME-02)
    key_allowlist:
      - worker_wall_s       # launch-to-result for the worker child
      - verifier_wall_s     # launch-to-result for the independent verifier child
      - worker_model        # (model, effort) the worker ran at — host evidence
      - worker_effort
      - verifier_model      # (model, effort) the verifier ran at — host evidence
      - verifier_effort
      - complexity          # per-plan hint applied this attempt, if any
      - escalated           # whether a repair raised the role above its start
    notes: >
      attempt_count is current_attempt in this record, surfaced as a first-class
      timing dimension. A host-blocked verifier records worker_wall_s but no
      verifier_wall_s; the missing value IS the evidence of the block, not a gap.
      Unknown keys and unsafe values are refused so the surface stays bounded and
      credential-free (INV-HOST-01 / INV-SEC-01).

repository_record_fields:
  repository: logical repository id
  worktree: isolated worktree path under .runtime/worktrees/<plan-id>/<repository-id>/
  branch: cc/<plan-id>/<repository-id>
  anchor_branch: recorded user-local anchor branch (default pull-request target)
  base_commit: >
    the execution base tip captured at start. For a plan with no same-repo
    predecessor this is the anchor-branch tip (v0.5, unchanged). For a dependent
    plan (v0.6, INV-CONCURRENCY-02) it is the single predecessor branch tip
    (stack) or a runtime-authored integration merge commit (>=2 predecessors).
  based_on: >
    optional (v0.6). When present, the same-repo predecessor plan ids this
    repository's base was built on. Absent for a plan with no same-repo
    predecessor. The kept base ref lives at refs/cc-base/<plan-id>/<repository-id>.
  latest_commit: latest worker commit inspected by the verifier
  allowed_paths: union of the bounded paths of every task mapped to this repository

rules:
  - INV-EXEC-01
  - INV-EXEC-02
  - INV-EXEC-03
  - INV-REPAIR-01
  - INV-PRESERVE-01
  - INV-RUNTIME-01
  - INV-RUNTIME-02
  - INV-HOST-01
  - INV-OWN-01
  - INV-CONCURRENCY-02
