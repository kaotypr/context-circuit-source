schema_version: 1
owner: wrapper/contracts/schemas/plan.yaml
describes: plans/<plan-id>/plan.yaml
concern: plan_lifecycle

purpose: >
  Machine-readable half of a plan. Owns the canonical stable plan id, human plan
  status, repository map, Product Knowledge references, tasks, dependencies,
  bounded paths, acceptance and verification identifiers, and execution policy.
  PLAN.md is the readable half describing the same plan; plan.yaml is canonical
  for identifiers and status.

plan_status:
  authority: this file
  values: [draft, approved, done]
  transitions:
    - draft -> approved   # explicit human approval, readiness checks pass
    - approved -> done    # explicit human completion, latest execution verified
  notes: >
    Execution status (running, verifying, repairing, verified, failed, blocked)
    is runtime evidence and never replaces plan status.

plan_id:
  form: NNNN-<kebab-slug>
  rules:
    - four zero-padded decimal digits, next after the highest ever allocated
    - lowercase kebab-case slug, no dates, underscores, punctuation, or hashes
    - unique across active and archived plans for the workspace lifetime
    - stable after creation even if title or status changes
    - never reused, including after archive or restore

fields:
  schema_version: { type: integer, required: true }
  plan: { type: string, required: true, description: canonical plan id }
  title: { type: string, required: true }
  status: { type: enum, required: true, values: [draft, approved, done] }
  objective: { type: string, required: true }
  repositories:
    type: list
    required: true
    item:
      id: { type: string, required: true }
      purpose: { type: string, required: false }
  product_knowledge:
    type: list
    required: true
    item:
      id: { type: string, required: true }
      path: { type: string, required: true }
      reason: { type: string, required: true }
  context_grounding:
    type: object
    required: true
    fields: [summary, constraints, decisions]
  knowledge_impact:
    type: object
    required: true
    fields: [expected_context_units, review_on_completion]
  tasks:
    type: list
    required: true
    item:
      id: { type: string, required: true }
      title: { type: string, required: true }
      repositories: { type: list, required: true, description: repositories this task may change }
      paths: { type: list, required: true, description: bounded paths or explicit repo-wide scope }
      depends_on: { type: list, required: true }
      changes: { type: list, required: true }
      acceptance: { type: list, required: true, item: [id, statement] }
      verification: { type: list, required: true, item: [id, command] }
  execution:
    type: object
    required: true
    fields:
      worker: { const: one }
      independent_verifier: { const: required }
      max_worker_failures: { const: 3 }

invariants:
  - every task names at least one declared repository (INV-PLAN-02)
  - every task names bounded paths or an explicit repository-wide scope (INV-PLAN-02)
  - task dependencies reference existing task ids (INV-PLAN-02)
  - acceptance and verification use distinct identifiers
  - each product_knowledge reference has a stable id, path, and reason (INV-PLAN-04)
  - plan status is human-controlled (INV-PLAN-01)

rules:
  - INV-PLAN-01
  - INV-PLAN-02
  - INV-PLAN-03
  - INV-PLAN-04
