schema_version: 1
owner: wrapper/contracts/routes.yaml
stage_a:
  input: human request + host binding + Tier 0
  output: exactly one probe or focused question, blocker, or read-only answer
host_binding:
  owner: wrapper/contracts/routes.yaml
  normalized_ids: [codex, claude-code, cursor-agent]
  evidence_fields: [host_id, observed_version, instruction_surface, session_role, root_capability, child_capability, verifier_capability, resume_capability, permission_mode, provider_status, offline_fallback]
  outcomes: [available, filesystem-only, host-blocked]
  rule: Apply INV-HOST-01, INV-HOST-02, and INV-HOST-03; host capability cannot
    select a competing route, grant authorization, bypass a human gate, or
    replace independent verification.
  unavailable_child: block-missing-child-primitive
  provider_failure: offline-fallback
stage_b:
  required_fields:
    - intent
    - session_kind
    - phase
    - probe
    - eligibility
    - capability
    - authorization
    - reason_codes
    - context_set
    - human_gate
context_set_map:
  owner: wrapper/contracts/routes.yaml
  rule: Map the final normalized action to one registered context-set id; probe and phase labels are not set ids.
  actions:
    orient: orientation
    recommend-next: tier-0
    initialize: initialization
    repository-bootstrap: repository-bootstrap
    present-repository-bootstrap-card: repository-bootstrap
    draft-idea-brief: idea-brief
    draft-prd: prd
    inspect-source: selected-source
    propose-context: context-review
    review-context: context-review
    draft-plan: plan-draft
    review-plan: plan-review
    clarify-target: plan-review
    present-approval-card: gate
    approve-plan: gate
    present-commit-approved-plan-card: gate
    commit-approved-plan: gate
    block-unapproved: recovery
    execute-plan: run-plan
    execute-stack: run-plan
    resume-session: resume
    present-takeover-card: recovery
    takeover-lease: recovery
    block-foreign-owner: recovery
    block-dirty-base: recovery
    block-incomplete-delegation: recovery
    block-missing-child-primitive: recovery
    block-scope-expansion: recovery
    verify-plan: verification
    repair-plan: verification
    present-finish-card: gate
    finish-plan: gate
    recommend-finish: gate
    present-archive-card: gate
    archive-plan: gate
    present-restore-card: gate
    restore-plan: gate
    present-configuration-card: gate
    configure-delivery: gate
    present-delivery-card: gate
    offline-fallback: tier-0
    show-handoff: resume
    inspect-cleanup: gate
    cleanup-runtime: gate
    classify-upgrade: upgrade
    migrate-wrapper: upgrade
    block-unresolved-dependency: recovery
    block-projection-mismatch: recovery
precedence:
  - id: ROUTE-PRECEDENCE-01
    when: conflicting instructions, unsafe paths, corrupt records, or dirty ownership
    result: blocked/recovery
  - id: ROUTE-PRECEDENCE-02
    when: valid child delegation packet
    result: child-entry
  - id: ROUTE-PRECEDENCE-03
    when: explicitly bound non-terminal session
    result: resume after compatibility and ownership checks
  - id: ROUTE-PRECEDENCE-04
    when: workspace identity is accepted and there is an explicit human capability request
    result: preflight named capability without substitution
  - id: ROUTE-PRECEDENCE-05
    when: no explicit action
    result: one read-only next-action recommendation
  - id: ROUTE-PRECEDENCE-06
    when: selected evidence is insufficient
    result: one focused question or orient
  - id: ROUTE-PRECEDENCE-07
    when: workspace identity is uninitialized and the request is not read-only
    result: initialization with an identity-acceptance gate
  - id: ROUTE-PRECEDENCE-08
    when: workspace identity is accepted, the request is write-like, and no named approved capability is selected
    result: draft-plan before implementation
actions:
  - orient
  - recommend-next
  - initialize
  - repository-bootstrap
  - draft-idea-brief
  - draft-prd
  - inspect-source
  - propose-context
  - review-context
  - draft-plan
  - review-plan
  - present-approval-card
  - present-repository-bootstrap-card
  - present-commit-approved-plan-card
  - commit-approved-plan
  - clarify-target
  - approve-plan
  - block-unapproved
  - execute-plan
  - execute-stack
  - resume-session
  - present-takeover-card
  - takeover-lease
  - block-foreign-owner
  - block-dirty-base
  - block-incomplete-delegation
  - block-missing-child-primitive
  - block-scope-expansion
  - verify-plan
  - repair-plan
  - present-finish-card
  - finish-plan
  - recommend-finish
  - present-archive-card
  - archive-plan
  - present-restore-card
  - restore-plan
  - present-configuration-card
  - configure-delivery
  - present-delivery-card
  - offline-fallback
  - show-handoff
  - inspect-cleanup
  - cleanup-runtime
  - classify-upgrade
  - migrate-wrapper
  - block-unresolved-dependency
  - block-projection-mismatch
human_gates:
  - identity-acceptance
  - repository-bootstrap
effect_identifiers:
  owner: wrapper/contracts/routes.yaml
  authorization: never
  not_execute_plan_effects: [git.init, git.clone]
  delegated_effects: subset-of-approved-intent
  undeclared_effect_result: UNDECLARED_EFFECT
  identifiers:
    workspace.accept_identity:
      immediate: [accepted-identity-fields, identity-regions]
      later: []
    workspace.register_repository:
      immediate: [shared-logical-key, optional-url, optional-branch, identity-regions]
      later: [repository-bootstrap, repository-create-empty, execute-plan]
    repository-bootstrap:
      immediate: [clone-destination]
      later: [execute-plan]
    repository-create-empty:
      reserved: true
      activated: false
      immediate: []
      later: []
    git.commit:
      immediate: [isolated-worktree]
      later: [delivery]
    delivery.push:
      immediate: []
      later: [delivery]
