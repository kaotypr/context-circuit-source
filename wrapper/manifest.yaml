schema_version: 1
wrapper_version: 1.0.0
product: context-circuit
artifact_kind: blank-workspace
release_contract: wrapper-owned-files-only
schema_versions:
  workspace: [1]
  session: [1]
  delegation: [1]
  child_start: [1]
  context_receipt: [1]
  lease: [1]
  handoff: [1]
  plan: [1, 2]
  task: [1, 2]
  archive: [1]
  completion: [1]
  stack: [1]
budgets:
  tier_0_bytes: 8192
  orientation_bytes: 20480
  run_plan_bytes: 22528
  writer_bytes: 12288
  verifier_bytes: 11264
  single_plan_lifecycle_bytes: 46080
  three_task_resume_bytes: 58368
  resume_delta_bytes: 12288
  static_reduction_percent: 70
  live_token_reduction_percent: 50
  live_token_evidence: optional-with-waiver
canonical_packet_fixtures:
  owner: wrapper/manifest.yaml
  rule: Schemas remain authoritative; these shipped examples are bounded inputs for initialization and plan drafting.
  files:
    - wrapper/contracts/schemas/context-receipt.yaml
    - wrapper/contracts/schemas/delegation.yaml
    - wrapper/contracts/schemas/plan.yaml
    - wrapper/contracts/schemas/task.yaml
    - docs/templates/plan.md
    - docs/templates/plan.yaml
    - docs/templates/task.md
    - docs/gates.md
release_boundary:
  shipped:
    - root adapters from wrapper/adapters/ (AGENTS.md, CLAUDE.md, WORKFLOW.md, README.md)
    - wrapper/manifest.yaml
    - wrapper/contracts/
    - wrapper/migrations/
    - wrapper/runtime/engine.sh
    - .agents/skills/
    - agents/
    - docs/
  mutable_seed:
    - workspace.yaml
    - context/
    - sources/
    - plans/
  never_ship:
    - .git/
    - .runtime/
    - test/
    - scripts/
    - template/
    - sources/context-circuit-design/
    - maintainer-only docs
    - repositories.local.yaml
    - repositories/
    - plans/context-circuit-plans/
upgrade_boundary:
  wrapper_only:
    - wrapper/
    - .agents/skills/
    - agents/
    - shipped root adapters (including CLAUDE.md)
  preserve:
    - workspace.yaml
    - context/
    - sources/
    - plans/
    - .runtime/
    - repositories.local.yaml
    - registered repositories
identity:
  source_workspace: Context Circuit product source
  instantiated_workspace: uninitialized until human identity confirmation
identity_projection:
  owner: wrapper/contracts/schemas/workspace.yaml
  delimiter: context-circuit:identity-region
  files: [context/WORKSPACE.md, context/PROJECT.md, context/INDEX.md]
  mismatch_result: projection-mismatch
gate_effects:
  owner: wrapper/contracts/routes.yaml
  authorization: never
evidence_layers:
  owner: wrapper/contracts/schemas/plan.yaml
  vocabulary: [schema, store, api, process, browser, human]
  comparison: exact-match-only
  outcomes: [passed, failed, blocked, waived]
  completion_rule: only-passed
  strength_hierarchy: none
  waiver_gate: none
