schema_version: 1
owner: wrapper/manifest.yaml
product: context-circuit
runtime_version: 1.0.0
# Published template release version (see 10-template-publication.md). Stamped
# at publish time; the context-circuit-template git tag is authoritative.
template_version: 0.0.1-alpha.2
artifact_kind: universal-project-workspace-template
release_contract: template-owned-files-only

purpose: >
  Declares the Context Circuit product template boundary: which files are
  shipped and replaceable on upgrade, which blank seed files are copied once,
  and which workspace-owned material an upgrade must always preserve.

accepted_schema_versions:
  workspace: [1]
  repositories-local: [1]
  intent-contract: [1]
  plan: [3]
  task: [1]
  execution: [1]
  worker-handoff: [1]
  verifier-result: [1]
  candidate: [1]
  human-acceptance: [1]
  completion: [1]
  context-impact: [1]
  context-proposal: [1]
  context-index: [1]
  pairing-session: [1]
  publication-config: [1]
  publication-field-intent: [1]
  publication-record: [1]
  publication-thread-record: [1]

runtime:
  entrypoint: wrapper/runtime/engine.sh
  kind: host-neutral-deterministic-library
  excludes:
    - provider-specific child-agent launch
    - model prompts and SDKs
    - Product Knowledge interpretation
    - plan-writing intelligence
    - conversational routing policy
    - confirmation cards or confirmation tokens
    - product test-runner logic
    - automatic pull-request, merge, push, deployment, or cleanup
    - automatic plan completion

release_boundary:
  shipped:
    - wrapper/
    - .agents/skills/
    - agents/
    - docs/
  mutable_seed:
    - template/
  never_ship:
    - .git/
    - .runtime/
    - context/
    - intent/
    - plans/
    - publication/
    - sources/
    - test/
    - scripts/
    - repositories/
    - repositories.local.yaml
    - role-tiering.local.yaml
    - node_modules/

upgrade_boundary:
  wrapper_only:
    - wrapper/
    - .agents/skills/
    - agents/
    - docs/
  preserve:
    - workspace.yaml
    - context/
    - intent/
    - sources/
    - plans/
    - repositories.local.yaml
    - repositories/
    - .runtime/

identity:
  kind: product-template
  product: Context Circuit
  release_seed: template/

host_evidence:
  purpose: provider-neutral bounded evidence only
  authorization: never
  forbids:
    - credentials
    - provider payloads
    - transcripts
    - auth state
