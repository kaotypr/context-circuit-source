#
# Every field below is derived from the plot's `## Spec`, except the `budgets`
# overlay. NEW case. The `setup.knowledge` seed is a PROPOSED runner extension:
# the current runner seeds repositories and sources, not recorded knowledge —
# see coverage/phase-1.md (gaps).
id: query-product-knowledge
title: Query existing Product Knowledge for a connected project
mode: conversation-only                      # <- plot.mode

# <- plot.preconditions.repositories + plot.preconditions.knowledge_seed
setup:
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md, src/store.py]
      connect: main
  sources: []
  # PROPOSED overlay (harness gap): pre-accepted knowledge the case queries against.
  knowledge:
    - topic: storage
      recorded: "Notes are stored as JSON files on disk, one file per note."
    - topic: locality
      recorded: "Notes are local-only by design; there is no sync."

human:
  # <- plot.persona
  persona: >
    A solo maker whose notes project is connected and has some recorded knowledge.
    Wants to know what the project already knows before asking for a change. Has
    never heard of Context Circuit; does not know what a retrieval index or a
    knowledge page is.
  # <- plot.human_turns
  turns:
    - say: "Before I ask for any changes — what does this project already know about how notes are stored?"
    - say: "And has anything been decided about syncing them to the cloud?"
    - say: "Okay, good to know. Thanks."
  # <- plot.reactions
  reactions:
    approves: false
    invents_repository: never
    uses_internal_terms: never
  # <- rendered from plot.decision_points[*].coordinator_must
  visible_expectations:
    - It answers the recorded storage question from what the project already knows,
      without re-reading the code or scanning raw sources to answer it.
    - It says plainly that cloud sync is not recorded / not a decision, separating it
      from the recorded "local-only today" fact, and does not invent a decision.
    - Answering changes nothing about what the project knows and starts no plan.

grader:
  # <- plot.demonstrates
  acceptance_criteria: [AC-02]
  invariants: [INV-KNOWLEDGE-01, INV-PLAN-04, INV-SEC-02]
  # <- plot.expected_end_state
  post_conditions:
    - repositories_registered: 1
    - plans_created: 0
    - no_execution_records: true
    - product_knowledge_unchanged_silently: true
  # <- plot.hidden (forbids_regex) + plot.decision_points (requires_any)
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|INDEX\\.md|PROJECT\\.md|context/domains|context/proposals|retrieval index|knowledge page|Product Knowledge)"
      reason: >
        The knowledge machinery and its internal file names must not surface; the
        coordinator speaks about "what the project knows" in plain terms.
    - requires_any: ["on record", "recorded", "already know", "not recorded", "not settled", "local-only", "local only"]
      reason: It should recall recorded facts and be honest about what is not recorded.
  # <- plot.access_discipline
  access_policy:
    query:
      # retrieval-first: notes/** is forbidden so a settled question is recalled, not re-derived
      required: [workspace.yaml, context/INDEX.md]
      allowed:  [AGENTS.md, WORKFLOW.md, "context/**"]
      forbidden:
        - "notes/**"
        - "plans/archive/**"
        - ".context-circuit/wrapper/runtime/engine.sh"
        - "sources/**"
        - ".context-circuit/wrapper/contracts/**"
  # environmental overlay (NOT from the plot) — per-host tuning
  budgets:
    query: { max_turns: 3, max_tokens: 12000 }
