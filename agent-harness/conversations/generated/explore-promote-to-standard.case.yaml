# generated from plots/explore-promote-to-standard.md — do not edit
#
# Derived from the plot's `## Spec`, except the `budgets` overlay. NEW case (no
# existing scenario counterpart). Full-execution, one continuous arc (pair -> notice
# real -> promote in place). Several post-conditions are id-agnostic / new predicates
# (harness gaps) — see coverage/phase-3.md.
id: explore-promote-to-standard
title: Promote an Explore session in place to a checked Standard change
mode: full-execution

# <- plot.preconditions
setup:
  repositories:
    - id: accounts
      dest: accounts
      default_branch: main
      branches: [main]
      seed_files: [README.md, src/util.js]
      connect: main
  sources: []

human:
  persona: >
    A maker pairing on a small helper that grows into real logic they care about.
    They want it made into a proper, checked change without starting over. Has never
    heard of Context Circuit; does not know what an intent, a tier, or a plan of
    record is.
  turns:
    - say: "Let's work directly on the accounts project — add a small helper in src/util.js that formats a display name."
    - say: "Actually this is turning into real logic I care about. Can we make this a proper, checked change without starting over?"
    - say: "Yes, that goal's right — challenge it and then approve it with the independent check on. Don't build more or ship it yet."
    - say: "Thanks."
  reactions:
    approves: true
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It works the change live (human-supervised, no independent check yet) and offers
      to make it proper rather than restarting when it clearly matters.
    - It attaches a goal for what the session actually did, has it challenged, and
      presents it for a single approval — surfacing criteria and scope, never fabricating them.
    - It says plainly that the change now gets an independent check because it is real,
      without exposing tier labels.
    - It builds on the work already done (not a fresh redo) and honors "don't build
      more or ship it yet".

grader:
  acceptance_criteria: [AC-29, AC-30, AC-33]
  invariants: [INV-PAIR-01, INV-ASSURE-01, INV-INTENT-01, INV-APPROVE-01]
  # NOTE: intent/plan ids are authored live (first-allocated i001/0001 assumed);
  # promoted_in_place is a NEW predicate (harness gap) — see coverage/phase-3.md.
  post_conditions:
    - repositories_registered: 1
    - intent_status: i001-util-helper:approved
    - classified_tier: i001-util-helper:standard
    - plans_created: 1
    - plan_schema: 0001-util-helper:3
    - promoted_in_place: true
    - no_delivery_records: true
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|contract\\.yaml|cc-pair|role-tiering|model|effort|verifier|refs/cc-|Explore|Standard)"
      reason: The promote mechanism, tier labels, and model/role details stay internal.
    - requires_any: ["without starting over", "already", "built on", "independent check", "challenge", "approved", "not redo", "haven't"]
      reason: The dialogue must show promotion in place — reuse of the prior work, an attached+challenged goal, and approval.
  access_policy:
    direct-collaboration:
      required: []
      allowed: [".agents/skills/cc-pair/SKILL.md", "agents/worker.md", "role-tiering.local.yaml", ".runtime/pairing/**", ".runtime/worktrees/cc-pair/**"]
      forbidden: ["plans/archive/**", "wrapper/runtime/engine.sh", "sources/**"]
    promote:
      required: []
      allowed: ["intent/**", "plans/**", "context/**", ".runtime/pairing/**"]
      forbidden: ["plans/archive/**", "wrapper/runtime/engine.sh", "sources/**", "wrapper/contracts/**"]
  # environmental overlay (NOT from the plot) — full-execution tuning
  budgets:
    direct-collaboration: { max_turns: 2, max_tokens: 20000, max_agent_turns: 40, max_cost_usd: 3 }
    promote:              { max_turns: 3, max_tokens: 24000, max_agent_turns: 40, max_cost_usd: 3 }
