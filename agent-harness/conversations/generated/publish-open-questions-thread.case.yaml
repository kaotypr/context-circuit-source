# existing scenario counterpart). Conversation-only, preview-first. `plans_untouched` /
# `no_provider_push` are NEW predicates (harness gaps) — see coverage/phase-6b.md.
id: publish-open-questions-thread
title: Publish a plan's open questions as a self-contained discussion thread, export-only
mode: conversation-only

setup:
  repositories:
    - id: reports
      dest: reports
      default_branch: main
      branches: [main]
      seed_files: [README.md]
      connect: main
  plans:
    - id: 0021-csv-export
      title: Add CSV export to the reports page
      repository: reports
      objective: Add a CSV export to the reports page.
      path: src/reports
      seed_state: draft
      open_questions:
        - Which columns should the export include by default?
        - Should very large exports stream or be capped?
  sources: []

human:
  persona: >
    A maker who wants the team to weigh in on a couple of undecided points before the
    work is built. Has never heard of Context Circuit; does not know what a publication
    or a thread record is. Speaks in plain terms.
  turns:
    - say: "Open a discussion thread for the open questions on the CSV export plan so the team can weigh in."
    - say: "Show me the messages first before you post anything."
    - say: "Good — but hold off posting for now."
    - say: "Thanks."
  reactions:
    approves: false
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It frames a discussion the team can answer — one topic message plus one message per
      open question — sending data outward, separate from the work.
    - Each question is its own message stating the question and the context to answer it,
      with no internal file names, paths, or ids.
    - It posts nothing until an explicit go; a preview posts nothing.
    - It never changes the plan or its status, and never edits or deletes a human reply.

grader:
  acceptance_criteria: []
  invariants: [INV-EXTERNAL-01, INV-EXTERNAL-02, INV-EXTERNAL-03, INV-PLAN-01]
  post_conditions:
    - repositories_registered: 1
    - plan_status: 0021-csv-export:draft
    - plans_untouched: true
    - no_provider_push: true
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|publication/|thread record|source of truth|AC-[0-9]|VR-[0-9])"
      reason: The thread messages and reply must be self-contained — no internal file names, paths, ids, or jargon.
    - requires_any: ["discussion", "thread", "question", "weigh in", "each", "nothing.*posted", "hold off", "preview"]
      reason: It should frame one self-contained message per question and post nothing without a go.
  access_policy:
    publish:
      required: []
      allowed: ["plans/**", "publication/**", "intent/**"]
      forbidden: ["plans/archive/**", ".context-circuit/wrapper/runtime/engine.sh", "sources/**", ".context-circuit/wrapper/contracts/**"]
  # environmental overlay (NOT from the plot) — conversation-only tuning
  budgets:
    publish: { max_turns: 4, max_tokens: 18000 }
