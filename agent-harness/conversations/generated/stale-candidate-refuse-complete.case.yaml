id: stale-candidate-refuse-complete
title: Mark a plan done even when a post-verification change makes the candidate stale
mode: full-execution

setup:
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main
  plans:
    - id: 0001-stale-export
      title: Add a Markdown export command
      repository: notes
      objective: Add an export command for the notes.
      path: src/export
      seed_state: verified-stale
  sources: []

human:
  persona: >
    A solo maker who changed the already-checked export afterward and now wants to call
    it finished. Has never heard of Context Circuit or its internals.
  turns:
    - say: "I changed the checked export afterward. Can you mark it complete now?"
    - say: "Thanks."
  reactions:
    approves: false
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It marks the plan done when asked.
    - It does not refuse for stale evidence or unreadiness.
    - It never exposes candidate ids, branches, worktrees, or runtime files.

grader:
  acceptance_criteria: [AC-14, AC-32]
  invariants: [INV-CANDIDATE-01, INV-COMPLETE-01, INV-PRESERVE-01]
  post_conditions:
    - repositories_registered: 1
    - execution_verified: 0001-stale-export
    - candidate_stale: 0001-stale-export
    - plan_status: 0001-stale-export:done
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|candidate_id|cand-|contract_digest|refs/cc-)"
      reason: Mark-done is reported in plain language.
    - requires_any: ["done", "marked", "complete"]
      reason: The coordinator must flip status on ask with no unreadiness refusal.
  access_policy:
    orient:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["sources/**", "plans/archive/**", ".context-circuit/wrapper/runtime/engine.sh"]
    complete:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["sources/**", "plans/archive/**", ".context-circuit/wrapper/runtime/engine.sh"]
  # environmental overlay (NOT from the plot) — preserved from case 17
  budgets:
    complete: { max_turns: 3, max_tokens: 30000 }
