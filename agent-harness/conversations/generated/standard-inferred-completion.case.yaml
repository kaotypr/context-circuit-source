id: standard-inferred-completion
title: Infer Standard completion only after current acceptance and explicit Gate 2 delivery
mode: full-execution

setup:
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main
  plans:
    - id: 0001-standard-export
      title: Add a Markdown export command
      repository: notes
      objective: Add an export command for the notes.
      path: src/export
      seed_state: verified-accepted
  sources: []

human:
  persona: >
    A solo maker who reviewed the checked result and opened its pull request. They want
    the coordinator to record that delivery and explain what happens next. Has never
    heard of Context Circuit or its internals.
  turns:
    - say: "I reviewed and accept the checked result, and I opened the pull request. Please record that delivery and finish the Standard change."
    - say: "What follow-up remains after it is finished?"
    - say: "Okay, thanks."
  reactions:
    approves: true
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It records delivery only because the human explicitly supplied the Gate 2 event.
    - It infers Standard completion from current acceptance plus delivery; it does not
      ask for a second plan-completion approval.
    - It reports the resulting knowledge-reconciliation follow-up without silently
      changing project knowledge.
    - It never exposes internal runtime details.

grader:
  acceptance_criteria: [AC-14, AC-16, AC-22, AC-35]
  invariants: [INV-CANDIDATE-01, INV-DELIVER-01, INV-COMPLETE-01, INV-COMPLETE-02, INV-KNOWLEDGE-02]
  post_conditions:
    - repositories_registered: 1
    - execution_verified: 0001-standard-export
    - candidate_bound: 0001-standard-export
    - human_acceptance_recorded: 0001-standard-export
    - delivery_recorded: 0001-standard-export
    - completion_kind: 0001-standard-export:inferred
    - completion_recorded: 0001-standard-export
    - plan_status: 0001-standard-export:done
    - knowledge_debt_pending: ">=1"
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|candidate_id|cand-|contract_digest|refs/cc-)"
      reason: Gate 2 and inferred completion must be explained in user language.
    - requires_any: ["pull request", "delivered", "finished", "complete", "follow", "reconcil"]
      reason: The conversation must show explicit delivery, inferred completion, and follow-up.
  access_policy:
    complete:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["sources/**", "plans/archive/**", "wrapper/runtime/engine.sh"]
  # environmental overlay (NOT from the plot) — preserved from case 18
  budgets:
    complete: { max_turns: 3, max_tokens: 36000 }
