# generated from plots/standard-feature-whole-flow.md — do not edit
#
# Derived from the plot's `## Spec`, except the `budgets` overlay. NEW case (the *(opt)*
# whole-flow probe). Full-execution, one continuous lay-user conversation across both
# gates. Its post_conditions are ID-AGNOSTIC (the intent/plan ids are authored live), a
# harness capability this plot requires — see the plot and coverage/phase-6b.md.
id: standard-feature-whole-flow
title: Standard feature, whole flow, one conversation
mode: full-execution

setup:
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main
  sources: []

human:
  persona: >
    A solo maker whose notes project is connected. Has never heard of Context Circuit.
    Speaks in plain goals; makes real decisions but never rubber-stamps.
  turns:
    - say: "I want a command that exports my notes to a Markdown file."
    - say: "That's right — approve it."
    - say: "Looks right to me."
    - say: "Go ahead and open it onto main."
    - say: "Reconcile it."
  reactions:
    approves: true
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It presents the goal, non-goals, and scope as one readable thing, raises the one
      thing the ask doesn't settle (overwrite behavior) in plain language, states the risk
      plainly, and asks for a single approval — not a plan approval.
    - On approval it freezes the decision, reads the real code to plan, derives the plan
      automatically, and does not ask for a second plan approval.
    - It reports the work was built and independently checked against the exact change, and
      never calls it done or shipped yet.
    - On "looks right" it records acceptance of that exact result; still not delivered or complete.
    - On the explicit yes it opens the pull request onto the recorded base branch, then infers
      completion (Standard) without a separate completion approval.
    - It surfaces that merged work has not been folded into what the project knows and asks to
      reconcile now or mark no-update-needed — never accepting knowledge silently.

grader:
  acceptance_criteria: [AC-03, AC-04, AC-06, AC-07, AC-08, AC-14, AC-16, AC-22, AC-35]
  invariants: [INV-INTENT-01, INV-APPROVE-01, INV-EXEC-01, INV-VERIFY-01, INV-CANDIDATE-01, INV-DELIVER-01, INV-COMPLETE-01, INV-COMPLETE-02, INV-KNOWLEDGE-02]
  # ID-AGNOSTIC post-conditions: a fresh whole-flow case authors its own intent/plan ids
  # live, so these cannot be id-keyed like the seeded cases (harness capability required).
  post_conditions:
    - repositories_registered: 1
    - intents_approved: 1
    - plans_created: 1
    - all_plans_done: true
    - deliveries_recorded: 1
    - completion_kind: inferred
    - knowledge_debt_pending: ">=1"
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|cand-|contract_digest|refs/cc-|cc/[0-9])"
      reason: The whole flow must read in plain language across both gates — no internal ids, branches, or digests.
    - requires_any: ["approve", "built", "checked", "looks right", "pull request", "finished", "reconcile"]
      reason: The conversation must carry the two gates, verified-not-complete, inferred completion, and reconciliation.
  access_policy:
    intent:
      required: []
      allowed: ["intent/**", "context/**", AGENTS.md, WORKFLOW.md]
      forbidden: ["plans/archive/**", "wrapper/runtime/engine.sh", "sources/**", "wrapper/contracts/**"]
    execute-deliver:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["plans/archive/**", "wrapper/runtime/engine.sh", "sources/**"]
  # environmental overlay (NOT from the plot) — full-flow tuning
  budgets:
    intent:          { max_turns: 3, max_tokens: 24000 }
    execute-deliver: { max_turns: 6, max_tokens: 80000, max_agent_turns: 90, max_cost_usd: 12 }
