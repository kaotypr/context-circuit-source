id: critical-repair-then-complete
title: A verified-after-repair Critical execution; explicit completion succeeds only after the pass
mode: full-execution

setup:
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main
  plans:
    - id: 0001-md-export
      title: Add a Markdown export command
      repository: notes
      objective: Add an export.py command that exports the notes to a chosen output file.
      tier: critical
      seed_state: verified-after-repair
  sources: []

human:
  persona: >
    A solo maker whose plan was built — it needed one fix but the check passes now.
    The result looks right and they are ready to explicitly complete it. Has never
    heard of Context Circuit or its internals.
  turns:
    - say: "It needed a fix, but it passes now and looks right to me — please explicitly complete it."
    - say: "Anything I should know or follow up on?"
    - say: "Okay, thanks."
  reactions:
    approves: true
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It marks the plan done because the latest build passed its check, and says so in plain terms.
    - It does not claim the plan was done before the check passed.
    - It reports, in plain words, any Product-Knowledge follow-up (a proposed update or
      that nothing needs changing) rather than silently applying anything.
    - It never exposes internal jargon or file names to a lay user.

grader:
  acceptance_criteria: [AC-11, AC-12, AC-15, AC-22]
  invariants: [INV-REPAIR-01, INV-EXEC-04, INV-COMPLETE-01, INV-COMPLETE-02, INV-PRESERVE-01, INV-KNOWLEDGE-02]
  post_conditions:
    - repositories_registered: 1
    - repair_occurred: 0001-md-export
    - execution_verified: 0001-md-export
    - candidate_bound: 0001-md-export
    - execution_tier: 0001-md-export:critical
    - plan_status: 0001-md-export:done
    - completion_recorded: 0001-md-export
    - knowledge_debt_pending: 0
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|repositories\\.local\\.yaml)"
      reason: The coordinator must not expose internals to a lay user.
    - requires_any: ["done", "complete", "verified", "passed", "follow"]
      reason: It should confirm completion after the pass and mention any knowledge follow-up.
  access_policy:
    complete:
      required: []
      allowed:  ["plans/**", ".runtime/**", "context/**"]
      forbidden: ["plans/archive/**", ".context-circuit/wrapper/runtime/engine.sh", "sources/**"]
  # environmental overlay (NOT from the plot) — preserved from case 06
  budgets:
    complete: { max_turns: 3, max_tokens: 30000 }
