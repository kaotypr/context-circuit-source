id: author-system-design-spawns-intents
title: Author a structured system design as source, then spawn one intent per concern
mode: conversation-only

setup:
  repositories:
    - id: app
      dest: app
      default_branch: main
      branches: [main]
      seed_files: [README.md]
      connect: main
  sources: []

human:
  persona: >
    A maker planning a sizeable new capability who wants the shape written down before
    any building, then each part turned into its own thing to approve. Has never heard of
    Context Circuit; does not know what a system design source or an intent is.
  turns:
    - say: "I want to design a whole notifications system for the app — can you structure the design before we build anything?"
    - say: "Good structure. Now turn each of those concerns into its own piece of work I can approve separately."
    - say: "Thanks."
  reactions:
    approves: false
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It writes the design as organized source material and is clear it's a draft to
      shape — it approves nothing, builds nothing, and records no project knowledge yet.
    - It surfaces an undecided point as an open question rather than silently choosing it.
    - It creates a separate approvable piece of work for each genuinely distinct concern —
      one per concern, not one giant catch-all.
    - It leaves each as a draft awaiting the human's separate approval.

grader:
  acceptance_criteria: [AC-30]
  invariants: [INV-INTENT-01, INV-SEC-02, INV-SKILL-01, INV-PLAN-04]
  post_conditions:
    - repositories_registered: 1
    - system_design_authored: true
    - intents_created: ">=2"
    - intents_approved: 0
    - plans_created: 0
    - no_execution_records: true
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|contract\\.yaml|sources/system-design|design\\.md|three-tier|scope envelope)"
      reason: The design and the spawned work must be described in plain terms, not internal file names or jargon.
    - requires_any: ["design", "structure", "concern", "separate", "each", "draft", "approve", "open question", "haven't"]
      reason: It should author a structured design as a draft and spawn one approvable piece per concern.
  access_policy:
    design:
      required: []
      allowed: ["sources/system-design/**", "context/**", AGENTS.md, WORKFLOW.md]
      forbidden: ["plans/archive/**", "wrapper/runtime/engine.sh", "wrapper/contracts/**"]
    spawn-intents:
      required: []
      allowed: ["intent/**", "sources/system-design/**", "context/**"]
      forbidden: ["plans/archive/**", "wrapper/runtime/engine.sh"]
  # environmental overlay (NOT from the plot) — conversation-only tuning
  budgets:
    design:        { max_turns: 3, max_tokens: 24000 }
    spawn-intents: { max_turns: 2, max_tokens: 16000 }
