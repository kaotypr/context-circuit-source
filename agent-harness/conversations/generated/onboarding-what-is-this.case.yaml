# generated from plots/onboarding-what-is-this.md — do not edit
#
# Derived from the plot's `## Spec`, except the `budgets` overlay. NEW case (no
# existing scenario counterpart): the first-contact / onboarding conversation. Would
# slot ahead of orient-new-project in the Orientation & context section.
id: onboarding-what-is-this
title: First contact — explain what the workspace is, what it can do, and how to start
mode: conversation-only

setup:
  repositories: []
  sources: []

human:
  persona: >
    Someone who just set the workspace up from a template and has never heard of Context
    Circuit. They don't have a goal in mind yet — they want to understand what this thing
    is, what it can do for them, and how to begin. Speaks in plain terms.
  turns:
    - say: "I just set this up from a template but I'm honestly not sure what it is — what is this?"
    - say: "Okay — so what can you actually help me do?"
    - say: "How do I get started?"
    - say: "Got it, thanks."
  reactions:
    approves: false
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It recognizes the workspace is blank / not yet set up and says so honestly, then
      explains in plain language what it is for — without exposing internal machinery or
      pretending a project exists.
    - It describes concrete capabilities as effects (plan a change, build it, open a pull
      request when the human decides), using everyday words.
    - It mentions in lay terms that work is checked independently and nothing ships or is
      called done without the human's say-so, without naming the mechanism.
    - When asked how to start, it gives a concrete first step (name a project to connect,
      create a new one, or say what to build) and asks rather than assumes.
    - It never claims a project, plan, or built work exists, and never overstates.

grader:
  acceptance_criteria: [AC-01]
  invariants: [INV-EXEC-01, INV-SEC-02, INV-REPO-04, INV-PLAN-04]
  post_conditions:
    - repositories_registered: 0
    - plans_created: 0
    - no_plan_status: [done]
    - no_execution_records: true
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    # "independent" / "independent check" are ALLOWED (the product surfaces "an
    # independent check" to the user by design); the internal lifecycle vocabulary is not.
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|workspace\\.yaml|repositories\\.local\\.yaml|planner|feasibility check|consequence tier|candidate digest|Gate 1|Gate 2)"
      reason: The coordinator must explain capability and safety in plain terms, exposing no internal file names or lifecycle jargon.
    - requires_any: ["blank", "not.*set up", "plan", "build", "pull request", "independent", "get started", "what.*build", "project"]
      reason: It should orient honestly, describe capability + the safety property in lay terms, and give a concrete first step.
  access_policy:
    orient:
      required: [workspace.yaml, context/INDEX.md]
      allowed:  [AGENTS.md, WORKFLOW.md, "context/*.md"]
      forbidden:
        - "plans/archive/**"
        - ".context-circuit/wrapper/runtime/engine.sh"
        - "sources/**"
        - ".context-circuit/wrapper/contracts/**"
  # environmental overlay (NOT from the plot) — aligned to orient-new-project's budget
  budgets:
    orient: { max_turns: 3, max_tokens: 10000 }
