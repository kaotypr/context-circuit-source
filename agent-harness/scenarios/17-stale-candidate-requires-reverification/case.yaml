id: 17-stale-candidate-requires-reverification
title: Refuse completion when a post-verification change makes the candidate stale
mode: full-execution
setup:
  # The plan was verified, then received a new worker commit. The previous
  # verifier evidence is preserved but no longer names the current candidate.
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main
  plans:
    - id: 0001-stale-export
      title: Add a Markdown export command
      repository: notes
      objective: Add an export command for the notes.
      path: src/export
      seed_state: verified-stale
  sources: []

human:
  persona: >
    A solo maker who changed the already-checked export afterward and now wants
    to call it finished. They accept that the new version needs another check.
    Has never heard of Context Circuit or its internals.
  turns:
    - say: "I changed the checked export afterward. Can you mark it complete now?"
    - say: "Please do not treat the earlier check as enough. Leave it pending until the changed version is checked again."
    - say: "Thanks."
  reactions:
    approves: false
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It says the earlier check no longer covers the changed result.
    - It refuses to complete or deliver the changed result on stale evidence.
    - It preserves the work and explains that a fresh independent check and acceptance are needed.
    - It never exposes candidate ids, branches, worktrees, or runtime files.

grader:
  acceptance_criteria: [AC-14, AC-15, AC-28]
  invariants: [INV-CANDIDATE-01, INV-COMPLETE-01, INV-PRESERVE-01]
  post_conditions:
    - repositories_registered: 1
    - execution_verified: 0001-stale-export
    - candidate_stale: 0001-stale-export
    - plan_status: 0001-stale-export:draft
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|candidate_id|cand-|contract_digest|refs/cc-)"
      reason: Staleness must be communicated as a plain-language need for a fresh check.
    - requires_any: ["stale", "changed", "new check", "check again", "no longer", "fresh"]
      reason: The coordinator must refuse to rely on the earlier verification.
  access_policy:
    orient:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["sources/**", "plans/archive/**", "wrapper/runtime/engine.sh"]
    complete:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["sources/**", "plans/archive/**", "wrapper/runtime/engine.sh"]
  budgets:
    complete: { max_turns: 3, max_tokens: 30000 }

