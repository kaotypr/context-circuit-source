id: 19-knowledge-debt-blocks-next-plan
title: Start overlapping Standard work even if prior Product Knowledge is not yet updated
mode: full-execution
setup:
  # The foundation plan is already marked done at Standard. The follow-up
  # shares its repository and must be allowed to start.
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main
  plans:
    - id: 0001-foundation
      title: Add notes storage
      repository: notes
      objective: Add a small storage foundation for the notes tool.
      path: src/storage
      seed_state: completed-standard
    - id: 0002-follow-up
      title: Add note search
      repository: notes
      objective: Add search on top of the notes storage foundation.
      path: src/search
      seed_state: draft
  sources: []

human:
  persona: >
    A maker whose storage foundation is finished and who immediately wants to
    start a related search feature. They will make the required knowledge
    decision first if the coordinator explains why it is needed.
  turns:
    - say: "The storage foundation is finished. Please start the follow-up search work now."
    - say: "If something is waiting on project notes, don't hold this — go ahead and plan it."
    - say: "Thanks."
  reactions:
    approves: false
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It starts the follow-up rather than holding it for a knowledge update.
    - It does not require a separate knowledge-acceptance decision before the next plan.
    - It never exposes internal runtime files or identifiers.

grader:
  acceptance_criteria: [AC-22, AC-35]
  invariants: [INV-KNOWLEDGE-02, INV-COMPLETE-02, INV-EXEC-01]
  post_conditions:
    - repositories_registered: 1
    - plan_status: 0001-foundation:done
    - knowledge_debt_pending: 0
    - plan_status: 0002-follow-up:draft
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|candidate_id|cand-|contract_digest|refs/cc-)"
      reason: The next-plan path must be explained without exposing storage details.
    - requires_any: ["start", "plan", "search"]
      reason: The coordinator must start the follow-up rather than holding it.
  access_policy:
    orient:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["sources/**", "plans/archive/**", ".context-circuit/wrapper/runtime/engine.sh"]
    execute-plan:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["sources/**", "plans/archive/**", ".context-circuit/wrapper/runtime/engine.sh"]
  budgets:
    execute-plan: { max_turns: 3, max_tokens: 30000 }

