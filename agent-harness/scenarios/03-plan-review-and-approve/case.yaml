id: 03-plan-review-and-approve
title: Review a draft intent, resolve an open question, approve Gate 1, and derive a plan
mode: conversation-only
setup:
  # A connected repo + a DRAFT intent with one open question are seeded at prep
  # time. The conversation reviews the intent, settles the question, approves Gate
  # 1, and lets the coordinator derive the schema-3 plan. There is no plan approval.
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main            # pre-register + bind so the plan can map to it
  intents:
    - id: i0001-md-export
      title: Add a Markdown export command
      repository: notes
      objective: Add a command that exports the notes to a chosen output file.
      open_question: Should exporting overwrite an existing output file, or refuse and ask?
      path: src
      tier: standard
      state: draft
  sources: []

human:
  persona: >
    A solo maker whose notes project is already connected. Has never heard of
    Context Circuit. Wants to look over the proposed change before anything happens and will
    answer a plain question about how it should behave. Knows nothing about
    workspaces, plan files, or how the goal is approved.
  turns:
    - say: "Can you show me what you understand before we do anything?"
    - say: "For that overwrite question — just don't overwrite; treat a missing input file as an error instead."
    - say: "Okay, that looks good — I approve that intent, but don't build anything yet."
    - say: "Thanks."
  reactions:
    approves: true             # but ONLY at the explicit approve turn, never during review
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - When asked to show what it understands, it explains the goal, boundaries, and open question in plain terms.
    - When the human answers the open question, it reflects that decision and does NOT approve or start work yet.
    - It treats approval as a separate explicit Gate 1 step, only settling the goal when the human explicitly says so.
    - After approval, it derives a plan automatically, without asking for a second plan approval, and nothing has been built or run yet.
    - It never exposes internal file names or lifecycle jargon while explaining the change.

grader:
  acceptance_criteria: [AC-03, AC-04]
  invariants: [INV-PLAN-01, INV-APPROVE-01, INV-EXEC-01]
  # A. state post-conditions (hard gate)
  post_conditions:
    - repositories_registered: 1
    - intent_status: i0001-md-export:approved
    - plans_created: 1
    - plan_schema: 0001-md-export:3
    - plan_status: 0001-md-export:draft        # approval is on the intent; the plan is a draft projection
    - no_execution_records: true               # approval is not execution (INV-EXEC-01)
    - product_knowledge_unchanged_silently: true
  # B. transcript checks (hard gate)
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|repositories\\.local\\.yaml)"
      reason: The coordinator must not expose internals to a lay user.
    - requires_any: ["approved", "approve", "open question", "overwrite", "before", "scope"]
      reason: It should discuss the intent/open question and settle Gate 1 explicitly.
  # C. access-discipline audit (hard gate, session-level)
  access_policy:
    review:
      required: []
      allowed:  ["plans/**", "intent/**", "context/**", AGENTS.md, WORKFLOW.md]
      forbidden:
        - "plans/archive/**"
        - "wrapper/runtime/engine.sh"
        - "sources/**"
        - "wrapper/contracts/**"
    approve:
      required: []
      allowed:  ["plans/**", "intent/**"]
      forbidden: ["plans/archive/**", "wrapper/runtime/engine.sh", "sources/**"]
  # D. efficiency ledger (soft, warning-only)
  budgets:
    review:  { max_turns: 2, max_tokens: 12000 }
    approve: { max_turns: 1, max_tokens: 6000 }
