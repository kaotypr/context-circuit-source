id: 18-standard-delivery-inferred-completion
title: Record Gate 2 delivery without marking a Standard plan done
mode: full-execution
setup:
  # The current candidate is already independently verified and accepted. The
  # conversation supplies the explicit Gate 2 delivery event; completion must
  # NOT be inferred from delivery.
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main
  plans:
    - id: 0001-standard-export
      title: Add a Markdown export command
      repository: notes
      objective: Add an export command for the notes.
      path: src/export
      seed_state: verified-accepted
  sources: []

human:
  persona: >
    A solo maker who reviewed the checked result and opened its pull request.
    They want the coordinator to record that delivery and explain what happens
    next. Has never heard of Context Circuit or its internals.
  turns:
    - say: "I reviewed and accept the checked result, and I opened the pull request. Please record that delivery."
    - say: "Is the change done?"
    - say: "Okay, thanks."
  reactions:
    approves: true
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It records delivery only because the human explicitly supplied the Gate 2 event.
    - It does not mark the plan done and does not infer completion from delivery.
    - It reports that recording delivery did not update what the project knows.
    - It never exposes internal runtime details.

grader:
  acceptance_criteria: [AC-14, AC-16, AC-22, AC-35]
  invariants: [INV-CANDIDATE-01, INV-DELIVER-01, INV-COMPLETE-01, INV-COMPLETE-02, INV-KNOWLEDGE-02]
  post_conditions:
    - repositories_registered: 1
    - execution_verified: 0001-standard-export
    - candidate_bound: 0001-standard-export
    - human_acceptance_recorded: 0001-standard-export
    - delivery_recorded: 0001-standard-export
    - plan_status: 0001-standard-export:draft
    - knowledge_debt_pending: 0
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|candidate_id|cand-|contract_digest|refs/cc-)"
      reason: Gate 2 delivery must be explained in user language without inferring done.
    - requires_any: ["pull request", "delivered", "done"]
      reason: The conversation must show explicit delivery without marking the plan done.
  access_policy:
    complete:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["sources/**", "plans/archive/**", "wrapper/runtime/engine.sh"]
  budgets:
    complete: { max_turns: 3, max_tokens: 36000 }

