id: 10-run-approved-stack
title: Run a batch of ten intent-authorized, inter-dependent plans; all verified, nothing completed or delivered
mode: full-execution
setup:
  # One connected repo and TEN real intent-authorized plans of a small task-tracker CLI.
  # The plans build on each other (scaffold -> config/storage/model -> store ->
  # add/list/done -> cli -> help), so the runtime must run them in dependency
  # order, stack dependents on their predecessors, and build integration bases
  # for the fan-ins (0005, 0009, 0010). Disjoint paths keep every merge clean.
  repositories:
    - id: taskkit
      dest: taskkit
      default_branch: main
      branches: [main]
      seed_files: [README.md]
      connect: main
  plans:
    - id: 0001-scaffold
      title: Project scaffold
      repository: taskkit
      objective: Create the project entry point and package layout.
      path: src/app
      seed_state: draft
    - id: 0002-config
      title: Config loader
      repository: taskkit
      objective: Load settings from a config file with sensible defaults.
      path: src/config
      deps: [0001-scaffold]
      seed_state: draft
    - id: 0003-storage
      title: JSON storage helper
      repository: taskkit
      objective: Read and write the task list as JSON on disk.
      path: src/storage
      deps: [0001-scaffold]
      seed_state: draft
    - id: 0004-model
      title: Task data model
      repository: taskkit
      objective: Define the Task record and its fields.
      path: src/model
      deps: [0001-scaffold]
      seed_state: draft
    - id: 0005-store
      title: Task persistence
      repository: taskkit
      objective: Persist tasks through the storage helper and the model.
      path: src/store
      deps: [0003-storage, 0004-model]
      seed_state: draft
    - id: 0006-add
      title: add command
      repository: taskkit
      objective: Implement the add command to create a task.
      path: src/commands/add
      deps: [0005-store]
      seed_state: draft
    - id: 0007-list
      title: list command
      repository: taskkit
      objective: Implement the list command to show tasks.
      path: src/commands/list
      deps: [0005-store]
      seed_state: draft
    - id: 0008-done
      title: done command
      repository: taskkit
      objective: Implement the done command to complete a task.
      path: src/commands/done
      deps: [0005-store]
      seed_state: draft
    - id: 0009-cli
      title: CLI router
      repository: taskkit
      objective: Route command-line arguments to the right command.
      path: src/cli
      deps: [0006-add, 0007-list, 0008-done]
      seed_state: draft
    - id: 0010-help
      title: Help/version and wiring
      repository: taskkit
      objective: Wire help and version output and the config into the CLI.
      path: src/help
      deps: [0002-config, 0009-cli]
      seed_state: draft
  sources: []

human:
  persona: >
    A maker with a batch of plans whose intents they already approved, each building on the
    last. Wants the whole batch built in one go and then a plain-language
    confirmation that everything is done and checked. Has never heard of Context
    Circuit and knows none of its internals.
  turns:
    - say: "Please build plans 0001 through 0010 — run them all in one go."
    - say: "How did that go — is everything built and checked?"
  reactions:
    approves: true             # the plans are already authorized; this is an execute request
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It builds all ten authorized plans in one run, in plain terms, without asking to re-approve them.
    - It reports that every plan was implemented and independently checked/verified.
    - When asked, it says the work is built and verified but leaves marking each plan
      done/complete as a separate step for the human.
    - It never exposes internal jargon, file names, or branch names to a lay user.

grader:
  acceptance_criteria: [AC-06, AC-07, AC-08, AC-14]
  invariants: [INV-EXEC-02, INV-VERIFY-01, INV-CONCURRENCY-02, INV-COMPLETE-01]
  # A. state post-conditions (hard gate)
  post_conditions:
    - repositories_registered: 1
    - execution_verified: 0001-scaffold
    - execution_verified: 0002-config
    - execution_verified: 0003-storage
    - execution_verified: 0004-model
    - execution_verified: 0005-store
    - execution_verified: 0006-add
    - execution_verified: 0007-list
    - execution_verified: 0008-done
    - execution_verified: 0009-cli
    - execution_verified: 0010-help
    # based_on: each fan-in dependent's base names each same-repo predecessor
    - based_on: 0005-store:taskkit:0003-storage,0004-model
    - based_on: 0009-cli:taskkit:0006-add,0007-list,0008-done
    - based_on: 0010-help:taskkit:0002-config,0009-cli
    # built_on: the ORDER proof — the predecessor's verified commit is an ancestor of the dependent's base
    - built_on: 0005-store:taskkit:0003-storage
    - built_on: 0009-cli:taskkit:0006-add
    - built_on: 0010-help:taskkit:0009-cli
    - no_plan_status: [done]
    - product_knowledge_unchanged_silently: true
  # B. transcript checks (hard gate)
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|repositories\\.local\\.yaml|refs/cc-|cc/[0-9])"
      reason: The coordinator must not expose internals (runtime files, branches) to a lay user.
    - requires_any: ["verified", "checked", "built", "not.*done", "complete"]
      reason: It should report a verified build across the stack and leave completion to the human.
  # C. access-discipline audit (session-level; forbidden = hard gate; trace-less in this driver)
  access_policy:
    execute-plan:
      required: []
      allowed:  ["plans/**", ".runtime/**", "context/**"]
      forbidden: ["plans/archive/**", ".context-circuit/wrapper/runtime/engine.sh", "sources/**"]
  # D. efficiency ledger (soft, warning-only) — recalibrated from measured runs.
  # max_tokens = generated output tokens; max_turns = conversational turns;
  # max_agent_turns = agent-loop turns; max_cost_usd = dollars.
  budgets:
    execute-plan: { max_turns: 3, max_tokens: 80000, max_agent_turns: 140, max_cost_usd: 18 }
