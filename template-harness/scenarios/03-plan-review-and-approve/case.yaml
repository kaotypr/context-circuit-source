id: 03-plan-review-and-approve
title: Review a draft plan, resolve an open question, then approve — with no execution
mode: conversation-only
setup:
  # A connected repo + an existing DRAFT plan (with one open question) are seeded at
  # prep time via the engine, so the conversation is purely review -> resolve ->
  # approve. Isolates review/approval behavior (INV-PLAN-01, INV-APPROVE-01,
  # INV-EXEC-01) instead of re-testing plan creation.
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main            # pre-register + bind so the plan can map to it
  plans:
    - id: 0001-md-export
      title: Add a Markdown export command
      repository: notes
      objective: Add a command that exports the notes to a chosen output file.
      open_question: Should exporting overwrite an existing output file, or refuse and ask?
  sources: []

human:
  persona: >
    A solo maker whose notes project is already connected. Has never heard of
    Context Circuit. Wants to look over the plan before anything happens and will
    answer a plain question about how it should behave. Knows nothing about
    workspaces, plan files, or approval mechanics.
  turns:
    - say: "Can you show me the plan before we do anything?"
    - say: "For that overwrite question — just don't overwrite; treat a missing input file as an error instead."
    - say: "Okay, that looks good — go ahead and approve it."
    - say: "Thanks."
  reactions:
    approves: true             # but ONLY at the explicit approve turn, never during review
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - When asked to show the plan, it explains it in plain terms and surfaces the open question.
    - When the human answers the open question, it reflects that decision in the plan and does NOT approve or start work yet.
    - It treats approval as a separate explicit step, only approving when the human explicitly says so.
    - After approving, it says the plan is approved but that nothing has been built or run yet.
    - It never exposes internal file names or jargon while explaining the plan.

grader:
  acceptance_criteria: [AC-03, AC-04]
  invariants: [INV-PLAN-01, INV-APPROVE-01, INV-EXEC-01]
  # A. state post-conditions (hard gate)
  post_conditions:
    - repositories_registered: 1
    - plan_status: 0001-md-export:approved     # the explicit approve flipped ONLY the status
    - no_execution_records: true               # approval is not execution (INV-EXEC-01)
    - product_knowledge_unchanged_silently: true
  # B. transcript checks (hard gate)
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|repositories\\.local\\.yaml)"
      reason: The coordinator must not expose internals to a lay user.
    - requires_any: ["approved", "approve", "open question", "overwrite", "before"]
      reason: It should discuss the plan/open question and settle approval explicitly.
  # C. access-discipline audit (hard gate, session-level)
  access_policy:
    review:
      required: []
      allowed:  ["plans/**", "context/**", AGENTS.md, WORKFLOW.md]
      forbidden:
        - "plans/archive/**"
        - "wrapper/runtime/engine.sh"
        - "sources/**"
        - "wrapper/contracts/**"
    approve:
      required: []
      allowed:  ["plans/**"]
      forbidden: ["plans/archive/**", "wrapper/runtime/engine.sh", "sources/**"]
  # D. efficiency ledger (soft, warning-only)
  budgets:
    review:  { max_turns: 2, max_tokens: 12000 }
    approve: { max_turns: 1, max_tokens: 6000 }
