id: 02-connect-existing-repo
title: Connect an existing local repository, on the branch the human works from
mode: conversation-only
setup:
  # Seeded INSIDE the workspace at prep time (before the coordinator runs), so it
  # is pre-existing code the coordinator only has to CONNECT. Default branch is
  # master, but the human works on develop — proving the base branch is user-selected,
  # never inferred from default_branch (INV-REPO-02).
  repositories:
    - id: my-notes
      dest: my-notes
      default_branch: master
      branches: [master, develop]
      seed_files: [notes.md]
  sources: []

human:
  persona: >
    A solo maker who already has a small notes project in a folder. Has never
    heard of Context Circuit and does not know what a workspace, binding, or
    base branch is. Knows their own code lives in a folder called "my-notes"
    and that they do their work on the "develop" branch. Speaks in plain terms.
  turns:
    - say: "I've already got a little notes project — the code's in a folder called my-notes right here."
    - say: "Can you hook it up so we can work on it together?"
    - say: "I do all my work on the develop branch, so use that one."
    - say: "Great, thanks."
  reactions:
    approves: false            # only connecting; no plan, no approval, no execution
    invents_repository: never  # never invents a repo it does not have
    uses_internal_terms: never
  visible_expectations:
    - It offers to connect the existing folder rather than recreating or cloning it.
    - It asks which branch to work from, or clearly confirms using the develop
      branch the human named, in plain terms.
    - It confirms the connection in plain language without exposing internal file
      names (like binding files), paths, or jargon.
    - It uses the develop branch the human named, not some default it picked.
    - It does not claim to have built, run, planned, or approved anything.

grader:
  acceptance_criteria: [AC-01, AC-26, AC-27]
  invariants: [INV-REPO-01, INV-REPO-02, INV-REPO-04, INV-SEC-01]
  # A. state post-conditions (hard gate)
  post_conditions:
    - repositories_registered: 1              # the named repo is connected...
    - base_branch: my-notes:develop         # ...on the human's branch, not default 'master'
    - no_repository_clone: true               # connected in place; nothing under repositories/
    - plans_created: 0                        # connecting is not planning
    - no_execution_records: true              # nothing ran
    - no_credentials_in_workspace: true       # INV-SEC-01
    - no_machine_path_in_identity: true       # portable identity stays path-free (INV-REPO-01)
  # B. transcript checks (hard gate)
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|repositories\\.local\\.yaml)"
      reason: >
        The coordinator must not expose internals — including the binding file
        name — to a lay user (design: connect "without exposing binding files").
    - requires_any: ["which branch", "work from", "work on", "connect", "hook it up", "branch"]
      reason: It should offer to connect and settle the branch to work from.
  # C. access-discipline audit (hard gate, session-level)
  access_policy:
    orient:
      required: [workspace.yaml]
      allowed:  [AGENTS.md, WORKFLOW.md, "context/*.md", context/INDEX.md]
      forbidden:
        - "plans/archive/**"
        - "wrapper/runtime/engine.sh"
        - "sources/**"
        - "wrapper/contracts/**"
    connect-repo:
      required: [workspace.yaml]
      allowed:  ["context/**"]
      forbidden: ["plans/archive/**", "wrapper/runtime/engine.sh", "sources/**"]
  # D. efficiency ledger (soft, warning-only)
  budgets:
    orient:       { max_turns: 2, max_tokens: 8000 }
    connect-repo: { max_turns: 3, max_tokens: 12000 }
