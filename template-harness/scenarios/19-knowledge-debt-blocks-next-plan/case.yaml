id: 19-knowledge-debt-blocks-next-plan
title: Block overlapping Standard work until the previous delivery's knowledge debt is resolved or deferred
mode: full-execution
setup:
  # The foundation plan is already delivered and completed at Standard, which
  # leaves a pending reconciliation marker. The follow-up shares its repository
  # knowledge scope and must not begin grounding or execution yet.
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main
  plans:
    - id: 0001-foundation
      title: Add notes storage
      repository: notes
      objective: Add a small storage foundation for the notes tool.
      path: src/storage
      seed_state: completed-standard
    - id: 0002-follow-up
      title: Add note search
      repository: notes
      objective: Add search on top of the notes storage foundation.
      path: src/search
      seed_state: draft
  sources: []

human:
  persona: >
    A maker whose storage foundation is finished and who immediately wants to
    start a related search feature. They will make the required knowledge
    decision first if the coordinator explains why it is needed.
  turns:
    - say: "The storage foundation is finished. Please start the follow-up search work now."
    - say: "If the project notes need a decision first, tell me what is pending and leave the follow-up on hold."
    - say: "Thanks."
  reactions:
    approves: false
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It explains that related delivered work has a pending project-knowledge follow-up.
    - It does not start the follow-up while that decision is unresolved.
    - It asks the human to accept, defer, or otherwise dispose of the knowledge update rather than doing so silently.
    - It never exposes internal runtime files or identifiers.

grader:
  acceptance_criteria: [AC-22, AC-35]
  invariants: [INV-KNOWLEDGE-02, INV-COMPLETE-02, INV-EXEC-01]
  post_conditions:
    - repositories_registered: 1
    - plan_status: 0001-foundation:done
    - knowledge_debt_pending: ">=1"
    - plan_status: 0002-follow-up:draft
    - no_execution_for: 0002-follow-up
    - product_knowledge_unchanged_silently: true
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|candidate_id|cand-|contract_digest|refs/cc-)"
      reason: The knowledge gate must be explained without exposing storage details.
    - requires_any: ["knowledge", "reconcil", "update", "decision", "hold", "before"]
      reason: The coordinator must surface the pending follow-up and stop the new work.
  access_policy:
    orient:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["sources/**", "plans/archive/**", "wrapper/runtime/engine.sh"]
    execute-plan:
      required: []
      allowed: ["plans/**", "intent/**", ".runtime/**", "context/**"]
      forbidden: ["sources/**", "plans/archive/**", "wrapper/runtime/engine.sh"]
  budgets:
    execute-plan: { max_turns: 3, max_tokens: 30000 }

