id: 06-repair-then-complete
title: A verified-after-repair execution; human marks it done, completion succeeds only after the pass
mode: full-execution
setup:
  # Seeded pre-state: the plan was executed, the first verify FAILED, the worker
  # repaired with a new commit, and the re-verify PASSED (worker_failures=1,
  # execution verified, plan still approved). The repair MECHANISM is covered by
  # the deterministic lab; here the live conversation tests human completion after
  # a repair — completion succeeds only because a verified execution exists, and
  # reports the repair / knowledge follow-up in plain words (AC-15/22, INV-COMPLETE).
  repositories:
    - id: notes
      dest: notes
      default_branch: main
      branches: [main]
      seed_files: [notes.md]
      connect: main
  plans:
    - id: 0001-md-export
      title: Add a Markdown export command
      repository: notes
      objective: Add an export.py command that exports the notes to a chosen output file.
      seed_state: verified-after-repair
  sources: []

human:
  persona: >
    A solo maker whose plan was built — it needed one fix but the check passes now.
    Ready to close it out. Has never heard of Context Circuit or its internals.
  turns:
    - say: "Looks like it needed a fix but it's passing now — go ahead and mark it done."
    - say: "Anything I should know or follow up on?"
    - say: "Okay, thanks."
  reactions:
    approves: true             # explicit human completion request
    invents_repository: never
    uses_internal_terms: never
  visible_expectations:
    - It marks the plan done because the latest build passed its check, and says so in plain terms.
    - It does not claim the plan was done before the check passed.
    - It reports, in plain words, any Product-Knowledge follow-up (a proposed update
      or that nothing needs changing) rather than silently applying anything.
    - It never exposes internal jargon or file names to a lay user.

grader:
  acceptance_criteria: [AC-11, AC-12, AC-15, AC-22]
  invariants: [INV-REPAIR-01, INV-EXEC-04, INV-COMPLETE-01, INV-COMPLETE-02, INV-PRESERVE-01, INV-KNOWLEDGE-02]
  # A. state post-conditions (hard gate)
  post_conditions:
    - repositories_registered: 1
    - repair_occurred: 0001-md-export           # one verify failed then a repair commit (preserved)
    - execution_verified: 0001-md-export         # the latest execution passed after the repair
    - plan_status: 0001-md-export:done           # human completion succeeded (only after the pass)
    - completion_recorded: 0001-md-export         # implementation completion record written (INV-COMPLETE-02)
    - product_knowledge_unchanged_silently: true  # reconciliation may add proposals; accepted PK unchanged
  # B. transcript checks (hard gate)
  transcript_checks:
    - forbids_regex: "(cc_[a-z_]+|engine\\.sh|worktree|plan\\.yaml|repositories\\.local\\.yaml)"
      reason: The coordinator must not expose internals to a lay user.
    - requires_any: ["done", "complete", "verified", "passed", "follow"]
      reason: It should confirm completion after the pass and mention any knowledge follow-up.
  # C. access-discipline audit (session-level; forbidden = hard gate; trace-less in this driver)
  access_policy:
    complete:
      required: []
      allowed:  ["plans/**", ".runtime/**", "context/**"]
      forbidden: ["plans/.archived/**", "wrapper/runtime/engine.sh", "sources/**"]
  # D. efficiency ledger (soft, warning-only)
  budgets:
    complete: { max_turns: 3, max_tokens: 30000 }
