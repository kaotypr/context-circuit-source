schema_version: 1
result_schema: schemas/documents/validation-result-v1.yaml
validation_execution:
  mode: structural-contract-only
  provider: approved-host-capability
  repository_runtime_required: false
  package_manager_required: false
  command_runtime_required: false
cases:
  valid-okf-concept:
    status: ready
    checks:
      front_matter_extraction: pass
      yaml_parse: pass
      base_okf: pass
      context_circuit_profile: pass
      artifact_schema: pass
    advisories: []
  missing-type:
    status: blocked
    checks:
      front_matter_extraction: pass
      yaml_parse: pass
      base_okf: fail
      context_circuit_profile: fail
      artifact_schema: fail
  profile-missing-status:
    status: blocked
    checks:
      front_matter_extraction: pass
      yaml_parse: pass
      base_okf: pass
      context_circuit_profile: fail
      artifact_schema: fail
  legacy-kind:
    status: ready
    compatibility: normalize-kind-to-type
  matching-kind-type:
    status: ready
    compatibility: retain-type
  conflicting-kind-type:
    status: blocked
    failure: conflicting-kind-type
  verified-mapping:
    status: ready
    normalization: one-item-list
  verified-list:
    status: ready
    normalization: preserve-list
  unknown-extension:
    status: ready
    preserve_unknown_extensions: true
  nested-unknown-extension:
    status: ready
    preserve_unknown_extensions: true
    preserved_paths:
      - sources[].x-source-extension
      - generated.x-generated-extension
      - verified[].x-verified-extension
  later-horizontal-rule:
    status: ready
    front_matter_closes_at: first-standalone-delimiter
    later_rule: body-content
  invalid-yaml:
    status: blocked
    checks:
      front_matter_extraction: pass
      yaml_parse: fail
      base_okf: not-applicable
      context_circuit_profile: not-applicable
      artifact_schema: not-applicable
  unterminated-front-matter:
    status: blocked
    checks:
      front_matter_extraction: fail
      yaml_parse: not-applicable
      base_okf: not-applicable
      context_circuit_profile: not-applicable
      artifact_schema: not-applicable
  invalid-artifact-schema:
    status: blocked
    checks:
      front_matter_extraction: pass
      yaml_parse: pass
      base_okf: not-applicable
      context_circuit_profile: not-applicable
      artifact_schema: fail
  valid-non-okf-task:
    status: ready
    base_okf: not-applicable
    context_circuit_profile: not-applicable
    artifact_schema: pass
  invalid-task-status:
    status: blocked
    base_okf: not-applicable
    context_circuit_profile: not-applicable
    artifact_schema: fail
  advisory-only:
    status: ready
    checks:
      base_okf: pass
      context_circuit_profile: pass
      artifact_schema: pass
    advisories:
      - broken-link
      - missing-optional-index
  non-okf-artifacts:
    status: ready
    base_okf: not-applicable
    context_circuit_profile: not-applicable
    authority: local-non-okf-schema
  compact-plan-bundle:
    status: ready
    canonical: plan.yaml
    companions: []
    task_validation: pass
  complex-plan-bundle:
    status: ready
    canonical: plan.yaml
    companions:
      - requirements.md
      - solution.md
      - risks.md
      - delivery.md
      - acceptance.md
      - verification.md
    task_validation: pass
  historical-full-bundle:
    status: ready
    canonical: plan.yaml
    compatibility: historical-companions-readable
    task_validation: pass
  invalid-task-delimiters:
    status: blocked
    task_validation: front_matter_extraction-fail
  invalid-task-yaml:
    status: blocked
    task_validation: yaml_parse-fail
  invalid-task-required-fields:
    status: blocked
    task_validation: required-field-fail
  invalid-task-enum:
    status: blocked
    task_validation: enum-fail
  invalid-task-nesting:
    status: blocked
    task_validation: nesting-fail
  task-readiness-repair:
    initial_status: blocked
    repaired_status: ready
    validation_sequence:
      - front_matter_extraction
      - yaml_parse
      - required_fields
      - enum_values
      - nested_shapes
      - artifact_schema
    projection_on_block: unchanged
