schema_version: 1
host_id: cursor-agent
observed_version: unavailable
instruction_surface: shared-root
discovery: [AGENTS.md, CLAUDE.md, interactive, print, resume]
host_evidence:
  host_id: cursor-agent
  observed_version: unavailable
  instruction_surface: shared-root
  session_role: root
  root_capability: available
  child_capability: available
  verifier_capability: available
  resume_capability: available
  permission_mode: host-managed
  provider_status: enabled
  offline_fallback: filesystem-only
  live_smoke_status: unavailable
writer_session:
  host_evidence:
    host_id: cursor-agent
    session_role: writer
    child_mapping: task-to-writer-packet
    permission_mode: bounded-write
    worktree: exclusive
    write_worktree: true
    write_plan: false
    write_activity: false
verifier_session:
  host_evidence:
    host_id: cursor-agent
    session_role: verifier
    child_mapping: task-to-verifier-packet
    permission_mode: read-only
    worktree: independent
    write_worktree: false
resume:
  mode: resume
  checks: [receipt, wrapper, git, ownership]
  route: same-two-stage-router
permission:
  host_local: optional
  force_is_authorization: false
offline:
  provider_status: denied
  offline_fallback: filesystem-only
blocked:
  missing_child: verifier
  outcome: host-blocked
  self_verification: forbidden
forbidden_fields: [credentials, tokens, provider-payloads, auth-state]
