schema_version: 1
purpose: Map protections in the legacy monolithic acceptance harness to semantic owners.
legacy_file: test/acceptance.sh
entries:
  - id: ASSERT-001
    legacy: safe_id, path_unsafe, source-boundary assertions
    owner: wrapper/contracts/invariants.yaml#INV-SEC-01
    suite: test/security/test-boundaries.sh
  - id: ASSERT-002
    legacy: route_root and lifecycle routing
    owner: wrapper/contracts/routes.yaml#ROUTE-PRECEDENCE
    suite: test/routing/test-router.sh
  - id: ASSERT-003
    legacy: plan_contract_complete and task projection
    owner: wrapper/contracts/schemas/plan.yaml#canonical-fields
    suite: test/lifecycle/test-lifecycle.sh
  - id: ASSERT-004
    legacy: lease_guard, acquire_lease, valid_lease
    owner: wrapper/contracts/invariants.yaml#INV-OWN-01
    suite: test/ownership/test-ownership.sh
  - id: ASSERT-005
    legacy: scope_guard and verifier_write
    owner: wrapper/contracts/invariants.yaml#INV-OWN-02
    suite: test/ownership/test-ownership.sh
  - id: ASSERT-006
    legacy: packet_complete and packet_matches_session
    owner: wrapper/contracts/schemas/delegation.yaml#required-fields
    suite: test/runtime/test-runtime.sh
  - id: ASSERT-007
    legacy: completion_ready and verification_guard
    owner: wrapper/contracts/invariants.yaml#INV-GATE-03
    suite: test/lifecycle/test-lifecycle.sh
  - id: ASSERT-008
    legacy: stack_graph_complete, frontier, deterministic joins
    owner: wrapper/contracts/schemas/stack.yaml#graph-and-progress
    suite: test/stacks/test-stacks.sh
  - id: ASSERT-009
    legacy: archive eligibility and dependency guards
    owner: wrapper/contracts/schemas/archive.yaml#append-only-events
    suite: test/gates/test-gates.sh
  - id: ASSERT-010
    legacy: release manifest and package-manager exclusion
    owner: wrapper/manifest.yaml#release-boundary
    suite: test/release/test-release.sh
  - id: ASSERT-011
    legacy: dirty worktree and cleanup confirmation
    owner: wrapper/contracts/invariants.yaml#INV-GATE-06
    suite: test/gates/test-gates.sh
  - id: ASSERT-012
    legacy: source provenance and no broad source scan
    owner: wrapper/contracts/invariants.yaml#INV-SEC-02
    suite: test/security/test-boundaries.sh
  - id: ASSERT-013
    legacy: wrapper compatibility and rollback notes
    owner: wrapper/migrations/README.md#compatibility-classifier
    suite: test/upgrades/test-upgrades.sh
  - id: ASSERT-014
    legacy: offline provider fallback and no credential persistence
    owner: docs/integrations.md#offline-fallback
    suite: test/gates/test-gates.sh
coverage_target:
  minimum_unique_routing_cases: 50
  minimum_legacy_protections_mapped: 14
