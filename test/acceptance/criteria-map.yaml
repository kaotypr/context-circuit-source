schema_version: 1
owner: sources/system-design/context-circuit/v0.5/core/design.md
purpose: >
  Maps each Context Circuit v0.5 acceptance criterion (design section 21) to the
  runnable, credential-free semantic suite that demonstrates it.
credential_free: true
provider_neutral: true
implicit_external_checks: false

criteria:
  - id: AC-01
    statement: Register zero or more repositories without machine paths in portable identity.
    suite: test/repositories/test-repositories.sh
  - id: AC-02
    statement: Locate Product Knowledge by concept/domain/repository/decision/constraint via the retrieval index.
    suite: test/contracts/test-contracts.sh
  - id: AC-03
    statement: A plan maps every change to one or more repositories and stays readable.
    suite: test/plans/test-plans.sh
  - id: AC-04
    statement: Plans preserve request detail as requirements, constraints, non-goals, assumptions, questions, risks.
    suite: test/plans/test-plans.sh
  - id: AC-05
    statement: An unapproved plan cannot execute.
    suite: test/runtime/test-runtime.sh
  - id: AC-06
    statement: Approve-and-execute performs both explicit actions without a confirmation card.
    suite: test/plans/test-plans.sh
  - id: AC-07
    statement: Execution creates one isolated branch/worktree per affected repository.
    suite: test/execution/test-execution.sh
  - id: AC-08
    statement: One worker implements all tasks in dependency order across repositories.
    suite: test/execution/test-execution.sh
  - id: AC-09
    statement: The worker commits each affected repository before verification.
    suite: test/execution/test-execution.sh
  - id: AC-10
    statement: An independent verifier checks latest commits without modifying product files or plan status.
    suite: test/runtime/test-runtime.sh
  - id: AC-11
    statement: A verifier failure can initiate worker repair in the same execution.
    suite: test/execution/test-execution.sh
  - id: AC-12
    statement: Every repair produces a new commit rather than amending prior work.
    suite: test/execution/test-execution.sh
  - id: AC-13
    statement: The third worker failure stops execution and preserves all evidence.
    suite: test/runtime/test-runtime.sh
  - id: AC-14
    statement: A verifier pass produces verified evidence but does not mark the plan complete.
    suite: test/completion/test-completion.sh
  - id: AC-15
    statement: Explicit human completion marks done only after successful verification.
    suite: test/completion/test-completion.sh
  - id: AC-16
    statement: Pull request, merge, push, deployment, and cleanup require separate human actions.
    suite: test/delivery/test-delivery.sh
  - id: AC-17
    statement: An agent can execute a plan without reading the full runtime implementation.
    suite: test/runtime/test-runtime.sh
  - id: AC-18
    statement: The refactored runtime contains no provider-specific child-launch logic.
    suite: test/runtime/test-runtime.sh
  - id: AC-19
    statement: Interrupted executions resume or stop read-only without losing commits, worktrees, or evidence.
    suite: test/runtime/test-runtime.sh
  - id: AC-20
    statement: Missing verifier capability blocks execution rather than allowing self-verification.
    suite: test/execution/test-execution.sh
  - id: AC-21
    statement: The suite covers multi-repo mapping, approval, isolation, commits, verifier independence, repair, failure limit, completion, recovery.
    suite: test/execution/test-execution.sh
  - id: AC-22
    statement: Marking done records commits and verifier evidence and reconciles PK without silent acceptance.
    suite: test/completion/test-completion.sh
  - id: AC-23
    statement: New plans receive consistent, stable, human-friendly canonical IDs.
    suite: test/plans/test-plans.sh
  - id: AC-24
    statement: Archiving moves to plans/archive, removes the index row, preserves files/status, performs no validation.
    suite: test/archive/test-archive.sh
  - id: AC-25
    statement: An archived plan's execution continues from its immutable snapshot.
    suite: test/archive/test-archive.sh
  - id: AC-26
    statement: default_branch stays portable guidance; execution validates anchor_branch and its captured tip.
    suite: test/repositories/test-repositories.sh
  - id: AC-27
    statement: The workspace root may bind as `workspace`; new repos default to gitignored repositories/ with clone/init.
    suite: test/repositories/test-repositories.sh
  - id: AC-28
    statement: A pull request uses execution branch as source and anchor_branch as default target; delivery blocks when unavailable.
    suite: test/delivery/test-delivery.sh
  - id: AC-29
    statement: Direct collaboration isolates one repository in its own branch and working copy, keeps only a resumable pointer, remains human-supervised rather than verified, preserves work on close, and blocks delivery drift.
    suite: test/pairing/test-pairing.sh
  - id: AC-30
    statement: An intent is a first-class decision — goal, criteria (executable or manual), scope envelope, tier — with an i-prefixed never-reused id; approval freezes its contract digest and is the single upstream human gate; archive/restore are status-blind moves.
    suite: test/intent/test-intent.sh
  - id: AC-31
    statement: The intent-envelope check re-gates a plan that exceeds the approved scope (new repository, path outside scope, criteria change) and fails upward on any indeterminate comparison, while authorizing a within-scope plan without a separate plan approval.
    suite: test/intent/test-envelope.sh
  - id: AC-32
    statement: A candidate is a deterministic digest over the commit map, bases, and frozen contract digest; verifier results and human acceptance bind to it, and any new commit or criteria change yields a new candidate that voids prior evidence and acceptance (completion refuses stale evidence).
    suite: test/candidate/test-candidate.sh
  - id: AC-33
    statement: Consequence tiering classifies deterministically and fails upward (risk surfaces are Critical; only a single-repo bounded no-signal change is Explore-eligible; anything uncertain is Standard); the runtime enforces the floor — Explore is human-supervised with no verifier and never labeled verified, Standard/Critical require a candidate-bound independent pass — and refuses dropping the verifier (Explore) on a risk surface.
    suite: test/assurance/test-tier.sh
  - id: AC-34
    statement: Completion emits a candidate-keyed reconciliation-debt marker; the next plan's grounding blocks (Standard/Critical) or loudly warns (Explore) while delivered work in its knowledge scope is unreconciled, and an explicit human reconcile or defer clears it without auto-accepting Product Knowledge.
    suite: test/knowledge/test-debt.sh
  - id: AC-35
    statement: Completion is inferred from candidate acceptance plus recorded delivery at Explore/Standard and refused (explicit human completion required) at Critical; a change set of plans delivered as one pull request has one deterministic, order-independent candidate so it is verified and accepted once.
    suite: test/completion/test-inferred.sh
  - id: AC-36
    statement: The v1.0 human-simulated scenarios (Standard feature with two gates and inferred completion, Explore-then-promote, change-set-as-one-PR, envelope-drift re-gate, knowledge-debt block) play end-to-end, and the expected conversations carry the two gates and honest assurance wording with no internal vocabulary.
    suite: test/scenarios/test-scenarios.sh
