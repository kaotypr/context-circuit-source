schema_version: 1
owner: sources/system-design/context-circuit/v0.5/core/design.md
purpose: >
  Maps each Context Circuit v0.5 acceptance criterion (design section 21) to the
  runnable, credential-free semantic suite that demonstrates it.
credential_free: true
provider_neutral: true
implicit_external_checks: false

criteria:
  - id: AC-01
    statement: Register zero or more repositories without machine paths in portable identity.
    suite: test/repositories/test-repositories.sh
  - id: AC-02
    statement: Locate Product Knowledge by concept/domain/repository/decision/constraint via the retrieval index.
    suite: test/contracts/test-contracts.sh
  - id: AC-03
    statement: A plan maps every change to one or more repositories and stays readable.
    suite: test/plans/test-plans.sh
  - id: AC-04
    statement: Plans preserve request detail as requirements, constraints, non-goals, assumptions, questions, risks.
    suite: test/plans/test-plans.sh
  - id: AC-05
    statement: A plan derives from an approved intent and executes on that authorization; there is no automated scope gate (scope-safety is settled at delivery, Gate 2), and a criteria change after approval re-enters Gate 1.
    suite: test/intent/test-feasibility.sh
  - id: AC-06
    statement: Approve-and-execute performs both explicit actions without a confirmation card.
    suite: test/plans/test-plans.sh
  - id: AC-07
    statement: Execution creates one isolated branch/worktree per affected repository.
    suite: test/execution/test-execution.sh
  - id: AC-08
    statement: One worker implements all tasks in dependency order across repositories.
    suite: test/execution/test-execution.sh
  - id: AC-09
    statement: The worker commits each affected repository before verification.
    suite: test/execution/test-execution.sh
  - id: AC-10
    statement: An independent verifier checks latest commits without modifying product files or plan status.
    suite: test/runtime/test-runtime.sh
  - id: AC-11
    statement: A verifier failure can initiate worker repair in the same execution.
    suite: test/execution/test-execution.sh
  - id: AC-12
    statement: Every repair produces a new commit rather than amending prior work.
    suite: test/execution/test-execution.sh
  - id: AC-13
    statement: The third worker failure stops execution and preserves all evidence.
    suite: test/runtime/test-runtime.sh
  - id: AC-14
    statement: A verifier pass produces verified evidence but does not mark the plan complete.
    suite: test/completion/test-completion.sh
  - id: AC-15
    statement: Explicit human completion marks done only after successful verification.
    suite: test/completion/test-completion.sh
  - id: AC-16
    statement: Pull request, merge, push, deployment, and cleanup require separate human actions.
    suite: test/delivery/test-delivery.sh
  - id: AC-17
    statement: An agent can execute a plan without reading the full runtime implementation.
    suite: test/runtime/test-runtime.sh
  - id: AC-18
    statement: The refactored runtime contains no provider-specific child-launch logic.
    suite: test/runtime/test-runtime.sh
  - id: AC-19
    statement: Interrupted executions resume or stop read-only without losing commits, worktrees, or evidence.
    suite: test/runtime/test-runtime.sh
  - id: AC-20
    statement: Missing verifier capability blocks execution rather than allowing self-verification.
    suite: test/execution/test-execution.sh
  - id: AC-21
    statement: The suite covers multi-repo mapping, approval, isolation, commits, verifier independence, repair, failure limit, completion, recovery.
    suite: test/execution/test-execution.sh
  - id: AC-22
    statement: Marking done records commits and verifier evidence and reconciles PK without silent acceptance.
    suite: test/completion/test-completion.sh
  - id: AC-23
    statement: New plans receive consistent, stable, human-friendly canonical IDs.
    suite: test/plans/test-plans.sh
  - id: AC-24
    statement: Archiving moves to plans/archive, removes the index row, preserves files/status, performs no validation.
    suite: test/archive/test-archive.sh
  - id: AC-25
    statement: An archived plan's execution continues from its immutable snapshot.
    suite: test/archive/test-archive.sh
  - id: AC-26
    statement: default_branch stays portable guidance; execution validates base_branch and its captured tip.
    suite: test/repositories/test-repositories.sh
  - id: AC-27
    statement: The workspace root may bind as `workspace`; new repos default to gitignored repositories/ with clone/init.
    suite: test/repositories/test-repositories.sh
  - id: AC-28
    statement: A pull request uses execution branch as source and base_branch as default target; delivery blocks when unavailable.
    suite: test/delivery/test-delivery.sh
  - id: AC-29
    statement: Direct collaboration isolates one repository in its own branch and working copy, keeps only a resumable pointer, remains human-supervised rather than verified, preserves work on close, and blocks delivery drift.
    suite: test/pairing/test-pairing.sh
  - id: AC-30
    statement: An intent is a first-class decision — goal, outcome-level criteria, a coarse optional scope, tier — with an i-prefixed never-reused id; approval freezes its contract digest, confirms the ask was understood, and is the single upstream human gate; archive/restore are status-blind moves.
    suite: test/intent/test-intent.sh
  - id: AC-31
    statement: On approval a planner reads the real code (one child per repository) and writes the plan; the coordinator runs a feasibility check and does not rewrite the child's plan; the runtime keeps only a scope-free authorization (a plan derives from an approved intent, criteria unchanged) with no automated scope gate, and a criteria change re-enters Gate 1 while failing upward on a missing or unapproved intent.
    suite: test/intent/test-feasibility.sh
  - id: AC-32
    statement: A candidate is a deterministic digest over the commit map, bases, and frozen contract digest; verifier results and human acceptance bind to it, and any new commit or criteria change yields a new candidate that voids prior evidence and acceptance for verify and deliver. Mark-done does not refuse stale evidence.
    suite: test/candidate/test-candidate.sh
  - id: AC-33
    statement: Consequence tiering classifies deterministically and fails upward (risk surfaces are Critical; only a single-repo bounded no-signal change is Explore-eligible; anything uncertain is Standard); the runtime enforces the floor — Explore is human-supervised with no verifier and never labeled verified, Standard/Critical require a candidate-bound independent pass — and refuses dropping the verifier (Explore) on a risk surface.
    suite: test/assurance/test-tier.sh
  - id: AC-34
    statement: Unupdated Product Knowledge does not block the next Standard/Critical plan; delivery and mark-done do not emit a reconcile-starting debt marker; the runtime never auto-writes Product Knowledge.
    suite: test/knowledge/test-debt.sh
  - id: AC-35
    statement: A plan becomes done only on an explicit mark-done at Standard and Critical (Explore is planless); delivery and inferred completion do not mark a plan done; a change set of same-repository plans delivered as one pull request has one deterministic tip-map candidate, is accepted once, records delivery without marking members done, and does not spawn a delivery-time verifier; named plans partition by covering tip (a three-deep stack in one repository plus one plan in another is two pull requests; sibling stacks in one repository are two pull requests, not zero).
    suite: test/completion/test-inferred.sh
  - id: AC-36
    statement: The v1.0 human-simulated scenarios (Standard feature with two gates and explicit mark-done, Explore-then-promote, change-set-as-one-PR, criteria-drift re-gate, next plan not blocked by unupdated Product Knowledge) play end-to-end, and the expected conversations carry the two gates and honest assurance wording with no internal vocabulary.
    suite: test/scenarios/test-scenarios.sh
  - id: AC-37
    statement: A grounded task partition remains one bounded plan with ordered embedded tasks when it shares one execution and verification boundary, and becomes stacked dependent plans when execution, verification, dependency, or failure boundaries are independent; wrong combine/split shapes fail without adding an approval gate.
    suite: test/plans/test-decomposition.sh
  - id: AC-38
    statement: The system-design skill authors both a product-level design and an optional intent detail write-up; skipping detail does not block Gate 1; there is no second approval; planning uses detail when present without replacing the post-approval code read; the short five-section intent page stays short.
    suite: test/intent/test-intent-detail.sh
  - id: AC-HOST-01
    statement: Each supported host exposes native project surfaces for worker, verifier, and planner under .claude/, .codex/, and .cursor/.
    suite: test/host-native/test-host-routes.sh
  - id: AC-HOST-02
    statement: Host-native agent and rule files route to .context-circuit/agents or owning invariants and do not copy role bodies or invent a second authorization policy.
    suite: test/host-native/test-host-routes.sh
  - id: AC-HOST-03
    statement: Claude exposes cc-* skills through .claude/skills/cc-*/SKILL.md routes to .agents/skills/cc-* without copying skill bodies.
    suite: test/host-native/test-host-routes.sh
  - id: AC-HOST-04
    statement: Missing required native child creation remains host-blocked; adapters and coordinator never self-verify.
    suite: test/host-native/test-host-routes.sh
  - id: AC-HOST-05
    statement: Source product host-native routes and the blank template seed expose the same roles and owner paths.
    suite: test/host-native/test-host-routes.sh
  - id: AC-HOST-06
    statement: Shipped host folders store no credentials, transcripts, provider payloads, or authentication state.
    suite: test/host-native/test-host-routes.sh
  - id: AC-BAND-01
    statement: Two different members can allocate new intent and plan ids without either waiting for the other to push, and their new ids do not share a numeric prefix.
    suite: test/bands/test-band-allocation.sh
  - id: AC-BAND-02
    statement: New intent and plan ids keep the existing short forms (iNNN-slug and NNNN-slug) with no person or machine token in the id.
    suite: test/bands/test-band-allocation.sh
  - id: AC-BAND-03
    statement: Ordinary authoring never requires the user to state a block or band number; allocation uses a one-time local member identity plus the committed roster.
    suite: test/bands/test-band-contracts.sh
  - id: AC-BAND-04
    statement: Missing local member identity stops once and asks the user to choose an existing roster member (or set up the first member), then writes the local identity — it does not invent a band or ask for numeric ranges in chat.
    suite: test/bands/test-member-roster.sh
  - id: AC-BAND-05
    statement: Archived intent and plan numbers inside a band are never reused; the next id advances past the highest ever used in that band.
    suite: test/bands/test-band-allocation.sh
  - id: AC-BAND-06
    statement: A multi-plan stack from one intent receives consecutive plan ids inside the current member's band, reserved together.
    suite: test/bands/test-band-allocation.sh
  - id: AC-BAND-07
    statement: Execution branches continue to use cc/<plan-id>/<repository-id> with no member token added.
    suite: test/bands/test-band-allocation.sh
  - id: AC-BAND-08
    statement: Existing intents and plans keep their current ids; enabling bands does not rename them.
    suite: test/bands/test-band-allocation.sh
  - id: AC-BAND-09
    statement: Overlapping member bands, or two active/archived ids sharing a numeric prefix, are rejected; a full band fails clearly without wrapping.
    suite: test/bands/test-band-allocation.sh
  - id: AC-LONE-OK
    statement: >
      When the user's entire message is ok, OK, Ok, or oK, with optional
      surrounding whitespace and nothing else, the coordinator's next
      user-visible reply begins with the exact hidden engine line and then
      continues the immediately pending work.
    suite: test/easter-egg/test-ok-easter-egg.sh
  - id: AC-NO-FALSE-TRIGGER
    statement: >
      Messages such as okay, ok., ok!, ok thanks, or any longer text that
      merely contains ok do not trigger the line.
    suite: test/easter-egg/test-ok-easter-egg.sh
  - id: AC-IDLE-OK
    statement: >
      If a lone ok arrives with nothing pending, the line is still said
      and the coordinator does not invent work.
    suite: test/easter-egg/test-ok-easter-egg.sh
  - id: AC-PUNCHLINE-HIDDEN
    statement: >
      The exact punchline string lives in the engine implementation and
      does not appear in coordinator instructions, skills, host adapters,
      Product Knowledge, or ordinary engine help.
    suite: test/easter-egg/test-ok-easter-egg.sh
  - id: AC-ENGINE-NOT-A-ROUTER
    statement: >
      The engine does not read chat, store user text, or decide that a
      message was ok. It only prints a fixed line when the coordinator
      invokes it.
    suite: test/easter-egg/test-ok-easter-egg.sh
