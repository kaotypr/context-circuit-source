schema_version: 3
plan: 0038-role-tiering-config-access
intent: i028-role-tiering-config-access
title: Engine-verb access to role-tiering config, with a committed fallback
status: draft
objective: >
  Any agent on any host learns the effective per-role (model, effort) config by
  invoking one new engine.sh verb instead of reading, finding, or grepping
  role-tiering.local.yaml itself. The verb prints the workspace-root
  role-tiering.local.yaml when present and a new committed
  .context-circuit/role-tiering.fallback.yaml when it is absent, so a checkout
  with no local override still yields a config and the Claude Code RTK
  PreToolUse hook never gets a chance to hide the file.
  .context-circuit/docs/role-tiering.md becomes the sole full statement of that
  access rule and the fallback behavior; the three host adapter surfaces, their
  three root maintainer copies, and the four .context-circuit/agents/ role files
  carry a short pointer to that owner. The verb prints and never selects: host
  group matching and adapter defaults stay a coordinator/host decision
  (INV-RUNTIME-01), and (model, effort) remains bounded host evidence that
  authorizes nothing (INV-HOST-01).
repositories:
  - id: context-circuit-source
    purpose: >
      Owns engine.sh, the shipped .context-circuit/ product tree, the host
      adapter sources under .context-circuit/wrapper/adapters/, the release
      manifest and boundary declarations, and the semantic acceptance suite.
plan_dependencies: []
product_knowledge:
  - id: host-adapters
    path: context/domains/host-adapters/README.md
    reason: >
      Owns the host adapter surface and the per-role (model, effort) host
      evidence this change re-routes; the new access rule changes how every
      adapter obtains that config.
  - id: source-release-and-upgrade
    path: context/domains/source-release-and-upgrade/README.md
    reason: >
      Owns the release boundary and upgrade classification a new committed file
      under .context-circuit/ must be declared in.
context_grounding:
  summary: >
    Grounded at HEAD e66d9da8. engine.sh is a 4179-line POSIX-sh library with a
    single flat dispatch in cc_main (lines 4087-4173) and helpers cc_emit
    (key: value stdout), cc_fail (stderr reason code), cc_scalar, and cc_root_abs.
    cc_member_identity_read (line 850) is the closest precedent for a verb that
    reads a gitignored *.local.yaml from the workspace root and emits one field.
    role-tiering.local.yaml exists at the workspace root with a hosts matrix for
    codex, claude-code, and cursor-agent; .gitignore line 18 ignores it and its
    comment (lines 15-17) still tells coordinators to Read the path directly —
    the intent's non-goals forbid touching .gitignore, so that comment stays and
    is a named residual contradiction. .context-circuit/docs/role-tiering.md
    (172 lines) already owns file shape, adapter defaults, escalate_on_repair,
    verifier independence, and host application; invariants.yaml line 557
    already names it owner of the role_tiering concern, so no invariant edit is
    needed. Six adapter-facing files carry access guidance today: the three
    sources .context-circuit/wrapper/adapters/{AGENTS,CLAUDE,CURSOR}.md that
    release-artifact.sh lines 40-42 copy to the shipped root, plus the three root
    maintainer copies (root CURSOR.md is byte-identical to its adapter source;
    root AGENTS.md and CLAUDE.md are not). Of the four role files,
    coordinator.md (lines 203-213) and worker.md (lines 45-55) name the file
    directly; verifier.md and planner.md mention only (model, effort).
    release-artifact.sh line 37 tars the whole .context-circuit tree, so a new
    file there does reach the artifact, but manifest.yaml release_boundary.shipped
    and upgrade_boundary.wrapper_only list only .context-circuit/{wrapper,agents,docs}/
    prefixes, so .context-circuit/role-tiering.fallback.yaml is classified by
    neither and would never be installed or replaced on upgrade. Acceptance is
    test/acceptance.sh fanning out to per-area suites;
    test/contracts/test-contracts.sh lines 229-247 pin exact strings in
    role-tiering.md and the three adapter sources, and test/bands/test-member-roster.sh
    lines 100-121 show the house pattern for exercising a new verb and its
    failure code. plan-allocate-id fails PLAN_PREFIX_COLLISION on archived
    duplicate prefixes 0001-0016 (plan 0034 recorded the same blocker); the next
    in-band id after 0037 is 0038.
  constraints:
    - Exactly one new engine.sh verb, and it prints only — no host-group
      selection, no adapter-default resolution, no model interpretation
      (INV-RUNTIME-01).
    - Exactly one new committed file, .context-circuit/role-tiering.fallback.yaml.
      Every other touched file already exists.
    - .context-circuit/docs/role-tiering.md is the single full statement of the
      access rule and fallback behavior; the seven pointer files get the
      "Owner: X. Read that file. Do not restate the rule here." shape already
      used by .claude/rules/role-tiering-spawn.md, not a restatement.
    - Do not touch .gitignore, .rtk/filters.toml, any rtk config.toml, or the RTK
      PreToolUse hook configuration; do not un-gitignore any *.local.yaml.
    - Do not change what (model, effort) mean or how a host applies them on a
      spawn; INV-HOST-01 and INV-REPAIR-01 semantics are untouched.
    - Preserve every string test/contracts/test-contracts.sh lines 229-247
      already pin, including "workspace root" in each adapter source,
      "Applying a configured tier on Cursor", "Do not default to inherit", and
      "A missing file in an isolated working copy is not an absent config".
    - Verification greps must target tracked files; rg honors .gitignore, so no
      done-check may depend on rg finding role-tiering.local.yaml.
    - Preserve unrelated and dirty work; run the semantic acceptance suite after
      meaningful phases; commit only on explicit human request.
  decisions:
    - One plan with five embedded tasks. Runtime verb, fallback data, owner doc,
      pointer stubs, boundary declarations, and acceptance proof share one
      execution and one verification boundary — splitting them would publish a
      doc naming a verb that does not exist, or a shipped file no boundary
      classifies. No partition here is independently verifiable or has its own
      failure surface, so no stack.
    - Verb name role-tiering-read ROOT, matching the existing
      member-identity-read naming; stdout is `source: local|fallback`,
      `path: <resolved>`, a `---` line, then the chosen file verbatim; failure
      code ROLE_TIERING_MISSING when neither file exists.
    - The fallback file carries the workspace-root role-tiering.local.yaml hosts
      matrix verbatim with the never-commit comment replaced by a committed-fallback
      comment, because that is the only content the human supplied. Confirm the
      exact bytes at plan review before executing — this file ships to every
      template consumer.
    - The pointer lands in both the three adapter sources and the three root
      maintainer copies, so the rule is discoverable in the shipped product and
      in this checkout.
    - The new committed file is declared in manifest.yaml, scripts/release-manifest.txt,
      and test/release/test-release.sh, so the boundary that governs it is
      explicit rather than an accident of the tar in release-artifact.sh.
    - cc-execute, cc-trace, and cc-pair keep their current "workspace root"
      access wording. AC-POINTERS-PRESENT enumerates its files exactly, the
      skills are not among them, and test-contracts.sh pins those strings;
      the residual drift is a named risk for a follow-up intent.
knowledge_impact:
  expected_context_units:
    - host-adapters
    - source-release-and-upgrade
  review_on_completion: true
tasks:
  - id: RT-001
    title: Add the role-tiering-read verb and the committed fallback file
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
      - .context-circuit/role-tiering.fallback.yaml
    evidence_anchors:
      - .context-circuit/wrapper/runtime/engine.sh
      - role-tiering.local.yaml
    depends_on: []
    changes:
      - Add cc_role_tiering_read ROOT beside cc_member_identity_read (engine.sh
        around line 848). Resolve ROOT with cc_root_abs, prefer
        <root>/role-tiering.local.yaml, else <root>/.context-circuit/role-tiering.fallback.yaml,
        else cc_fail ROLE_TIERING_MISSING.
      - Emit `source: local` or `source: fallback` and `path: <resolved path>` via
        cc_emit, then a `---` line, then the chosen file verbatim on stdout.
      - Add `role-tiering-read) cc_role_tiering_read "$@" ;;` to the cc_main
        dispatch near the member-* entries.
      - Keep the verb print-only — no host-group lookup, no adapter defaults, no
        model-id interpretation, no writes, no records.
      - Create .context-circuit/role-tiering.fallback.yaml holding the
        workspace-root hosts matrix verbatim, with a header comment saying it is
        the committed fallback used when no local override exists.
    acceptance:
      - id: RT-AC-ENGINE-VERB
        statement: >
          One engine.sh verb prints the effective role-tiering config, choosing
          the workspace-root role-tiering.local.yaml when present and
          .context-circuit/role-tiering.fallback.yaml otherwise, and reporting
          which source it used.
      - id: RT-AC-FALLBACK-FILE
        statement: >
          .context-circuit/role-tiering.fallback.yaml exists, is tracked by git
          (not ignored), and holds the supplied host role-tiering content.
      - id: RT-AC-PRINT-ONLY
        statement: >
          The verb prints and never selects: no host-group match, no adapter
          default resolution, and no model interpretation enters engine.sh.
    verification:
      - id: RT-VT-001
        command: sh .context-circuit/wrapper/runtime/engine.sh role-tiering-read . | head -2 | grep -qx 'source: local' && sh .context-circuit/wrapper/runtime/engine.sh role-tiering-read . | grep -q '^hosts:'
      - id: RT-VT-002
        command: t=$(mktemp -d) && mkdir -p "$t/.context-circuit" && cp .context-circuit/role-tiering.fallback.yaml "$t/.context-circuit/role-tiering.fallback.yaml" && sh .context-circuit/wrapper/runtime/engine.sh role-tiering-read "$t" | grep -qx 'source: fallback' && rm -rf "$t"
      - id: RT-VT-003
        command: t=$(mktemp -d); out=$(sh .context-circuit/wrapper/runtime/engine.sh role-tiering-read "$t" 2>&1 || true); rm -rf "$t"; printf '%s\n' "$out" | grep -q ROLE_TIERING_MISSING
      - id: RT-VT-004
        command: ! git check-ignore -q .context-circuit/role-tiering.fallback.yaml && git ls-files --error-unmatch .context-circuit/role-tiering.fallback.yaml
      - id: RT-VT-005
        command: grep -q 'role-tiering-read' .context-circuit/wrapper/runtime/engine.sh && ! grep -qE 'claude-opus|gpt-5|composer-|sonnet|haiku' .context-circuit/wrapper/runtime/engine.sh
  - id: RT-002
    title: Make role-tiering.md the sole owner of the access rule
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/docs/role-tiering.md
    evidence_anchors:
      - .context-circuit/docs/role-tiering.md
    depends_on:
      - RT-001
    changes:
      - Rewrite the "Where the config lives" section so obtaining the config is
        one instruction: invoke the engine verb. State plainly that an agent must
        not Read, find, or grep role-tiering.local.yaml itself, and why — on some
        hosts a search wrapper never emits a gitignored path, so a search that
        finds nothing is not evidence the config is absent.
      - Document the fallback: the verb prints the workspace-root local override
        when present, else the committed
        .context-circuit/role-tiering.fallback.yaml, and reports which source it
        used, so a checkout with no override still yields a config.
      - Keep the existing pinned sentences intact, including "workspace root",
        "planner", and "A missing file in an isolated working copy is not an
        absent config", and keep the file free of the word "tracer".
      - Leave file shape, adapter defaults, escalate_on_repair, verifier
        independence, and host application unchanged; state that the verb prints
        and never selects.
    acceptance:
      - id: RT-AC-OWNER-DOC
        statement: >
          .context-circuit/docs/role-tiering.md states the access rule — invoke
          the verb, never Read/find/grep the file — and the fallback behavior,
          and is the only place that states either in full.
      - id: RT-AC-NO-SEMANTIC-DRIFT
        statement: >
          The doc still teaches the same file shape, adapter defaults,
          escalate_on_repair ladder, verifier independence, and host application
          it taught before.
    verification:
      - id: RT-VT-006
        command: rg -n 'role-tiering-read' .context-circuit/docs/role-tiering.md && rg -n 'fallback' .context-circuit/docs/role-tiering.md && rg -n 'never .*(Read|find|grep)|do not (Read|find|grep)' .context-circuit/docs/role-tiering.md
      - id: RT-VT-007
        command: rg -qF 'A missing file in an isolated working copy is not an absent config' .context-circuit/docs/role-tiering.md && rg -qF 'workspace root' .context-circuit/docs/role-tiering.md && rg -q 'planner' .context-circuit/docs/role-tiering.md && ! rg -q 'tracer' .context-circuit/docs/role-tiering.md
      - id: RT-VT-008
        command: rg -q 'escalate_on_repair' .context-circuit/docs/role-tiering.md && rg -q 'Adapter defaults' .context-circuit/docs/role-tiering.md && rg -q 'independen' .context-circuit/docs/role-tiering.md
  - id: RT-003
    title: Point the adapter surfaces and role files at the owner doc
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/adapters/AGENTS.md
      - .context-circuit/wrapper/adapters/CLAUDE.md
      - .context-circuit/wrapper/adapters/CURSOR.md
      - AGENTS.md
      - CLAUDE.md
      - CURSOR.md
      - .context-circuit/agents/coordinator.md
      - .context-circuit/agents/worker.md
      - .context-circuit/agents/verifier.md
      - .context-circuit/agents/planner.md
    evidence_anchors:
      - .context-circuit/wrapper/adapters/AGENTS.md
      - .context-circuit/wrapper/adapters/CLAUDE.md
      - .context-circuit/wrapper/adapters/CURSOR.md
      - .context-circuit/agents/coordinator.md
      - .context-circuit/agents/worker.md
    depends_on:
      - RT-002
    changes:
      - Add a short pointer to .context-circuit/docs/role-tiering.md in each of
        the three adapter sources, in the same "Owner: X. Read that file. Do not
        restate the rule here." shape as .claude/rules/role-tiering-spawn.md, and
        replace only the self-read instruction ("read the file from the workspace
        root") with "obtain it by invoking the engine verb, per the owner doc".
      - Mirror the same pointer in the three root maintainer copies (AGENTS.md,
        CLAUDE.md, CURSOR.md), keeping root CURSOR.md byte-identical to its
        adapter source and keeping the root files' @AGENTS.md imports intact.
      - Add the same pointer to .context-circuit/agents/{coordinator,worker,verifier,planner}.md.
        For coordinator.md and worker.md, replace the direct-read instruction
        with the pointer; for verifier.md and planner.md the pointer is additive.
      - Restate no detail in any of the ten files: no fallback path, no source
        precedence, no reason the file is invisible to search. Keep each host's
        own spawn-application guidance unchanged.
    acceptance:
      - id: RT-AC-POINTERS-PRESENT
        statement: >
          AGENTS.md, CLAUDE.md, CURSOR.md (both the shipped adapter sources and
          this checkout's root copies) and each of
          .context-circuit/agents/{coordinator,worker,verifier,planner}.md carry
          a short pointer naming .context-circuit/docs/role-tiering.md as owner.
      - id: RT-AC-POINTERS-THIN
        statement: >
          No pointer file restates the rule's detail, and no file other than the
          owner doc explains the fallback or the search-invisibility reason.
      - id: RT-AC-HOST-APPLY-INTACT
        statement: >
          Each host's own guidance for setting (model, effort) on a child spawn is
          unchanged, and every string the acceptance suite pins in those files
          still matches.
    verification:
      - id: RT-VT-009
        command: for f in .context-circuit/wrapper/adapters/AGENTS.md .context-circuit/wrapper/adapters/CLAUDE.md .context-circuit/wrapper/adapters/CURSOR.md AGENTS.md CLAUDE.md CURSOR.md .context-circuit/agents/coordinator.md .context-circuit/agents/worker.md .context-circuit/agents/verifier.md .context-circuit/agents/planner.md; do rg -qF '.context-circuit/docs/role-tiering.md' "$f" || { echo "missing pointer: $f"; exit 1; }; done
      - id: RT-VT-010
        command: ! rg -l 'role-tiering.fallback.yaml' .context-circuit/wrapper/adapters/ .context-circuit/agents/ AGENTS.md CLAUDE.md CURSOR.md
      - id: RT-VT-011
        command: cmp CURSOR.md .context-circuit/wrapper/adapters/CURSOR.md && rg -qF '@AGENTS.md' CLAUDE.md && rg -qF '@AGENTS.md' CURSOR.md && rg -qF 'context-circuit-source repository safety' AGENTS.md
      - id: RT-VT-012
        command: sh test/contracts/test-contracts.sh
  - id: RT-004
    title: Declare the fallback file in the release and upgrade boundary
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/manifest.yaml
      - scripts/release-manifest.txt
      - test/release/test-release.sh
    evidence_anchors:
      - .context-circuit/wrapper/manifest.yaml
      - scripts/release-manifest.txt
      - scripts/release-artifact.sh
    depends_on:
      - RT-001
    changes:
      - Add .context-circuit/role-tiering.fallback.yaml to
        release_boundary.shipped and upgrade_boundary.wrapper_only in
        .context-circuit/wrapper/manifest.yaml, leaving the never_ship entry for
        role-tiering.local.yaml untouched.
      - Add `required .context-circuit/role-tiering.fallback.yaml` to
        scripts/release-manifest.txt in the runtime/contracts block.
      - Add a require_file assertion for the staged artifact copy in
        test/release/test-release.sh.
    acceptance:
      - id: RT-AC-BOUNDARY-DECLARED
        statement: >
          The committed fallback is classified by the declared product boundary:
          it ships in the release artifact and an upgrade replaces it, while the
          gitignored local override remains never-ship.
      - id: RT-AC-FALLBACK-FILE
        statement: >
          The release assembly fails if
          .context-circuit/role-tiering.fallback.yaml is missing from the staged
          artifact.
    verification:
      - id: RT-VT-013
        command: rg -qF '.context-circuit/role-tiering.fallback.yaml' .context-circuit/wrapper/manifest.yaml && rg -qF 'required .context-circuit/role-tiering.fallback.yaml' scripts/release-manifest.txt && rg -qF 'role-tiering.local.yaml' .context-circuit/wrapper/manifest.yaml
      - id: RT-VT-014
        command: sh test/release/test-release.sh
  - id: RT-005
    title: Prove the verb, the owner doc, and the pointers in the acceptance suite
    repositories: [context-circuit-source]
    paths:
      - test/runtime/
      - test/contracts/test-contracts.sh
      - test/acceptance.sh
    evidence_anchors:
      - test/bands/test-member-roster.sh
      - test/contracts/test-contracts.sh
      - test/acceptance.sh
    depends_on:
      - RT-001
      - RT-002
      - RT-003
      - RT-004
    changes:
      - Add test/runtime/test-role-tiering-read.sh following the
        test/bands/test-member-roster.sh pattern: a disposable workspace where the
        local override is present (source: local, body echoed), one where only the
        fallback exists (source: fallback), and one where neither exists
        (ROLE_TIERING_MISSING via expect_code).
      - Assert in the same suite that engine.sh contains no model id and no host
        group selection, so the print-only boundary is proven rather than trusted.
      - Extend test/contracts/test-contracts.sh near the existing role-tiering
        block with: the owner doc names the verb and the fallback; each of the ten
        pointer files names the owner doc; no pointer file names the fallback
        path; and .gitignore, .rtk, and rtk config are unchanged by this plan.
      - Wire test/runtime/test-role-tiering-read.sh into test/acceptance.sh after
        test/runtime/test-runtime.sh.
    acceptance:
      - id: RT-AC-PROVEN
        statement: >
          The semantic acceptance suite fails if the verb, its fallback
          precedence, its missing-file failure code, the owner doc's rule, or any
          of the ten pointers regresses.
      - id: RT-AC-NO-RTK-CHANGE
        statement: >
          No .rtk/filters.toml, rtk config.toml, RTK hook configuration, or
          .gitignore entry is added or modified by this change, and coverage
          proves it.
    verification:
      - id: RT-VT-015
        command: sh test/runtime/test-role-tiering-read.sh
      - id: RT-VT-016
        command: rg -qF 'test/runtime/test-role-tiering-read.sh' test/acceptance.sh
      - id: RT-VT-017
        command: ! git status --porcelain | grep -E '(\.gitignore|\.rtk/|config\.toml)$'
      - id: RT-VT-018
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
