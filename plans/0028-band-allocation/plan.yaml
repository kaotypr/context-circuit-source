schema_version: 3
plan: 0028-band-allocation
intent: i021-id-number-blocks
title: Band-scoped intent and plan id allocation
status: done
objective: >
  intent-allocate-id, plan-allocate-id, and plan-stack-materialize allocate only
  inside the current member's bands — next id is highest ever used in that band
  among active and archived entries plus one, stacks reserve consecutive in-band ids,
  archived numbers are never reused, and band exhaustion or prefix collision fails
  clearly without wrapping — while existing ids and cc/<plan-id>/<repo> branches
  stay unchanged.
repositories:
  - id: context-circuit-source
    purpose: >
      Owns engine.sh allocation and materialization changes, shared band-sequence
      helpers, and acceptance tests proving parallel members, stack reservation,
      never-reuse, and exhaustion behavior.
plan_dependencies:
  - id: 0027-member-roster
    reason: >
      Band-scoped allocation requires committed roster validation and resolved local
      member identity from member-band-resolve helpers.
product_knowledge:
  - id: plan-review
    path: context/domains/plan-review/README.md
    reason: >
      Owns plan id form, never-reuse rule, and cc_plan_allocate_id / validate surface
      that band allocation extends in place.
  - id: run-stack
    path: context/domains/run-stack/README.md
    reason: >
      plan-stack-materialize reserves consecutive plan ids today workspace-wide;
      AC-BAND-06 requires the same behavior scoped to the member's plan band.
context_grounding:
  summary: >
    Grounded at HEAD 7db954f. cc_intent_allocate_id increments from global max across
    intent/ and intent/archive/ with i999 ceiling. cc_plan_allocate_id and
    cc_plan_stack_materialize use cc_plan_max_sequence across active plans, archived
    plans, and .runtime/materialization/*/allocation.tsv reservations — global
    consecutive ranges, 9999 ceiling. Execution branches are cc/<plan-id>/<repo>
    with no member token (engine.sh cc_wp_branch). Archive moves do not recycle ids.
    Plan 0027 adds roster and identity resolution; this plan rewires allocation to
    band-scoped high-water marks while scanning the same directory trees filtered
    by numeric prefix within the member's inclusive bounds.
  constraints:
    - Preserve id forms iNNN-slug and NNNN-slug and execution branch cc/<plan-id>/<repo>.
    - Never reuse archived numbers inside a band; materialization reservations in a
      band count toward the high-water mark.
    - Two members with distinct bands must allocate without push ordering dependency
      (fixture proves non-overlapping prefixes from band boundaries).
    - Do not rename or remint existing intents/plans (AC-BAND-08).
    - Preserve unrelated and dirty work; run semantic acceptance after meaningful phases.
  decisions:
    - Replace global max with band-scoped max helpers shared by intent allocation,
      plan allocation, and stack materialization; reserved materialization ranges
      stay keyed by invocation but numbers must fall inside the caller's plan band.
    - Prefix uniqueness is workspace-wide — validate that a newly allocated numeric
      prefix does not collide with any active/archived intent or plan outside the
      band scan path (fail closed on duplicate prefix AC-BAND-09).
    - Band exhaustion returns clear PLAN_ID_EXHAUSTED / INTENT_ID_EXHAUSTED variants
      scoped to the member band; resolution is roster extension, not wrap or recycle.
    - Keep existing single-plan verbs and latency materialization fixtures working
      with roster/identity present in test workspaces (update fixtures, not behavior
      unrelated to bands).
knowledge_impact:
  expected_context_units:
    - plan-review
    - run-stack
  review_on_completion: true
tasks:
  - id: BA-001
    title: Band-scoped intent id allocation
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
      - test/bands/test-band-allocation.sh
      - test/intent/test-intent.sh
      - test/lib/fixture.sh
    depends_on: []
    changes:
      - >
        Add cc_intent_max_in_band (or equivalent) scanning intent/ and intent/archive/
        for ids whose numeric prefix falls within the resolved member intent band;
        include archived folders so archived numbers are never reused.
      - >
        Rewire cc_intent_allocate_id to require resolved member identity, compute next
        as band high-water plus one, reject when next exceeds band upper bound, and
        reject duplicate workspace-wide intent prefixes if present.
      - >
        Update test fixtures (cc_fx_ws and intent suite) to seed roster and identity;
        extend test/bands/test-band-allocation.sh with two-member parallel intent cases.
    acceptance:
      - id: BA-AC-01
        statement: >
          Two members each allocate new intent ids in their own bands without sharing
          numeric prefixes and without requiring the other to push first.
      - id: BA-AC-05
        statement: >
          Archived intent numbers inside a band are never reused; next id advances past
          the highest ever used in that band.
    verification:
      - id: BA-VT-01
        command: sh test/bands/test-band-allocation.sh --case intent-parallel
      - id: BA-VT-02
        command: sh test/intent/test-intent.sh
  - id: BA-002
    title: Band-scoped plan allocation and stack reservation
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
      - test/bands/test-band-allocation.sh
      - test/plans/test-plans.sh
      - test/latency/test-approval-plan.sh
    depends_on: [BA-001]
    changes:
      - >
        Add cc_plan_max_in_band mirroring cc_plan_max_sequence but restricted to the
        member plan band and including materialization allocation.tsv entries whose
        plan numbers fall in-band.
      - >
        Rewire cc_plan_allocate_id and cc_plan_stack_materialize consecutive reservation
        to use band-scoped starting next and fail when the stack would exceed the band
        upper bound; preserve idempotent retry by invocation identity.
      - >
        Keep execution branch form cc/<plan-id>/<repository-id> unchanged.
      - >
        Update plan and latency fixtures for roster/identity; prove consecutive stack
        ids stay inside one member's plan band.
    acceptance:
      - id: BA-AC-02
        statement: >
          New plan ids keep NNNN-slug form with no person or machine token and execution
          branches stay cc/<plan-id>/<repository-id>.
      - id: BA-AC-06
        statement: >
          A multi-plan stack from one intent receives consecutive plan ids inside the
          current member's band, reserved together.
    verification:
      - id: BA-VT-03
        command: sh test/bands/test-band-allocation.sh --case plan-stack-consecutive
      - id: BA-VT-04
        command: sh test/plans/test-plans.sh
      - id: BA-VT-05
        command: sh test/latency/test-approval-plan.sh --case materialize-smoke
  - id: BA-003
    title: Prefix collision and band exhaustion guards
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
      - test/bands/test-band-allocation.sh
      - test/acceptance.sh
    depends_on: [BA-002]
    changes:
      - >
        Fail closed when roster bands overlap, when an allocated id would duplicate an
        existing workspace-wide numeric prefix (active or archived), or when the next
        in-band id would exceed the band upper bound; emit stable error codes for each.
      - >
        Wire test/bands/test-band-allocation.sh into test/acceptance.sh; add exhaustion
        and overlap fixtures.
    acceptance:
      - id: BA-AC-09
        statement: >
          Overlapping member bands or duplicate numeric prefixes are rejected; a full
          band fails clearly without wrapping or recycling.
      - id: BA-AC-08
        statement: >
          Existing intents and plans keep their ids; only new allocation uses bands.
    verification:
      - id: BA-VT-06
        command: sh test/bands/test-band-allocation.sh
      - id: BA-VT-07
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
