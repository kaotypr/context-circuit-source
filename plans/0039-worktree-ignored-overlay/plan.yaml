schema_version: 3
plan: 0039-worktree-ignored-overlay
intent: i027-runnable-worktrees
title: Overlay the checkout's gitignored paths into every new worktree
status: done
objective: >
  After git worktree add creates a tree with tracked files only, the runtime
  copies every gitignored file and folder that exists on disk in the bound
  checkout into the new tree, including .env, using copy-on-write when the
  filesystem supports it and a real copy otherwise — never a symlink into the
  checkout. Untracked files that are not gitignored are not copied. The overlay
  runs for execution worktrees (cc_worktree_prepare and cc_base_prepare) and for
  Explore worktrees (cc_pair_begin), before any worker or Explore session is
  attached, and a failed overlay blocks setup instead of yielding a half-ready
  tree. Because context-circuit-source is bound at the workspace root, the
  overlay excludes the workspace's own runtime state and host-local identity
  files so it can never copy .runtime/ into a worktree that lives inside it.
repositories:
  - id: context-circuit-source
    purpose: >
      Owns .context-circuit/wrapper/runtime/engine.sh, where every worktree is
      created, and the semantic acceptance suite under test/ that proves the
      runtime's behavior.
plan_dependencies: []
product_knowledge:
  - id: repository-grounding
    path: context/domains/repository-grounding/README.md
    reason: >
      Owns worktree hardening and the prepared-environment story this overlay
      becomes the first step of; its "full dependency provisioning is a later
      phase" statement is the behavior being changed.
  - id: plan-execution
    path: context/domains/plan-execution/README.md
    reason: >
      Owns execution setup, where cc_worktree_prepare and cc_base_prepare run
      and where a setup failure becomes a blocked execution rather than a worker
      failure.
  - id: direct-collaboration
    path: context/domains/direct-collaboration/README.md
    reason: >
      Owns the Explore worktree created by cc_pair_begin, which gains overlay
      preparation it has never had while staying a light pointer, not an
      execution record.
context_grounding:
  summary: >
    Grounded at HEAD 7d72f468. engine.sh is 4206 lines of POSIX sh (dash-safe,
    no local, no arrays) with one flat cc_main dispatch at 4106-4173 and the
    helpers cc_emit (key: value on stdout), cc_fail (reason code on stderr),
    cc_atomic_write, cc_digest, and cc_root_abs. Exactly three functions create
    a worktree: cc_worktree_prepare (1229) for a plain execution, cc_base_prepare
    (1571) for a stacked or integration base, and cc_pair_begin (1305) for
    Explore. cc_worktree_prepare returns early with worktree_reused true when the
    directory already exists (1237-1243); cc_base_prepare has its own reuse
    branch (1591-1607) and, in the integration case, a runtime-authored merge
    (1636) after worktree add. cc_execution_begin (2501-2535) calls one of the
    first two, writes .runtime/executions/<plan>/<exec>/repositories/<repo>.yaml,
    then cc_discover_repo_grounding; each setup failure there sets execution
    status blocked with a blocked_reason (2517, 2529, 2534). cc_pair_begin does
    none of that: it adds the worktree at 1334 and immediately writes the
    pointer, with no grounding, hardening, or environment report anywhere in the
    Explore path. Nothing in engine.sh today reads .gitignore, lists ignored
    paths, or copies a directory — grep for reflink, clonefile, ls-files
    --others, overlay, or node_modules returns nothing. The decisive local fact
    is repositories.local.yaml: context-circuit-source is bound at `path: .`,
    so the bound checkout is the workspace root and its ignored set (.gitignore
    lines 1-3, 6-35) contains .runtime/ — the parent of every worktree this
    function creates — plus /repositories/, dist/, and the three workspace-root
    *.local.yaml files the contract's non-goals exclude. Cleanup already handles
    the copies: cc_worktree_drop (1464) removes a worktree with
    `git worktree remove --force`, which discards ignored files, and
    cc_runtime_cleanup (1495) drops dead Explore trees. test/lib/fixture.sh
    builds workspaces and repositories for the suites; test/acceptance.sh (line
    10 onward) fans out to per-area suites and has no worktree suite yet.
    plan-allocate-id fails PLAN_PREFIX_COLLISION on archived duplicate prefixes
    0001-0016 (plans 0034 and 0038 recorded the same blocker); the next in-band
    ids after 0038 are 0039, 0040, 0041.
  constraints:
    - POSIX sh only, dash-safe: no local, no arrays, no bashisms, no process
      substitution. Every new function returns 0 or fails with a reason code.
    - The overlay never symlinks into the bound checkout. Copy-on-write is
      attempted first and a real recursive copy is the fallback; both are real
      independent content in the worktree.
    - The ignored-path listing is Git's own (`ls-files --others --ignored
      --exclude-standard`), never a hand-maintained per-repository list
      (INV-GROUND-01 / the intent's no-CC-side-profile non-goal).
    - Untracked-but-not-ignored files are never copied.
    - The overlay excludes only a fixed workspace self-protection set matched at
      the top level of the source checkout - .runtime/, /repositories/, and
      role-tiering.local.yaml, member.local.yaml, repositories.local.yaml.
      No per-repository or per-ecosystem entry is added to it.
    - Overlay runs only when a worktree is freshly created. A reused worktree is
      left exactly as the worker left it (INV-PRESERVE-01).
    - An overlay failure blocks setup: the execution is blocked with a stable
      blocked_reason and no brief is assembled; an Explore session leaves no
      resumable pointer.
    - The runtime emits data, never prompt text (INV-RUNTIME-01), and stores no
      credential or file content in any record (INV-SEC-01) - overlaid content
      is never echoed, logged, or digested into a record.
    - Preserve unrelated and dirty work; run the semantic acceptance suite after
      meaningful phases; commit only on explicit human request, with no AI
      attribution (INV-COMMIT-01).
  decisions:
    - Three plans, not one. This plan is filesystem overlay: no network, fully
      offline-provable, and its failure surface is copy semantics and path
      exclusion. Plan 0040 is dependency provisioning: it may use the network,
      owns a runtime-constant toolchain table, and can fail for reasons that
      have nothing to do with copying. Plan 0041 is truth-telling - contracts,
      the brief, Product Knowledge, and end-to-end proof - and can only be
      verified once both behaviors exist. Each is independently executable and
      independently verifiable against a distinct subset of the contract's
      acceptance criteria, so they stack rather than collapse.
    - One overlay function with one call shape, cc_overlay_ignored SRC DST,
      invoked from all three creation sites rather than inlined three times.
      Exposed as the `worktree-overlay` dispatch verb so the suite and a host
      adapter can exercise it directly.
    - Copy mode is probed once per overlay, not assumed per platform - try
      `cp -c` (APFS clonefile), then `cp --reflink=auto` (GNU coreutils), then
      plain recursive copy - and the chosen mode is emitted as `copy_mode` so a
      reviewer can see whether the tree was cloned or copied.
    - The exclusion set is a runtime constant guarding the workspace's own
      state, justified by context-circuit-source being bound at `path: .`. It is
      matched only at the top level of the source checkout, so a repository that
      legitimately ignores a nested path of the same name is unaffected.
    - Overlay is skipped on the reuse paths of cc_worktree_prepare and
      cc_base_prepare. Re-overlaying a live worktree would silently overwrite a
      worker's local state.
    - cc_pair_begin removes the worktree and branch it just created when overlay
      fails, so a failed Explore setup leaves nothing half-ready to resume. This
      is the one place the plan deletes something it created; it deletes nothing
      that existed beforehand.
knowledge_impact:
  expected_context_units:
    - repository-grounding
    - plan-execution
    - direct-collaboration
  review_on_completion: true
tasks:
  - id: OV-001
    title: Add the copy-mode probe and the gitignored overlay function
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
    evidence_anchors:
      - .context-circuit/wrapper/runtime/engine.sh
      - .gitignore
      - repositories.local.yaml
    depends_on: []
    changes:
      - Add cc_copy_mode DIR, which probes the destination filesystem once and
        prints clone, reflink, or copy by trying `cp -c`, then
        `cp --reflink=auto`, then plain `cp -R` against a throwaway probe file
        it removes.
      - Add cc_copy_path MODE SRC DST, which copies one file or directory using
        that mode with a plain recursive copy as the last resort, and fails
        OVERLAY_COPY_FAILED with the relative path on error. It never creates a
        symlink and never follows a symlink out of SRC.
      - Add the runtime constant CC_OVERLAY_EXCLUDE listing the top-level
        workspace self-protection entries - .runtime, repositories,
        role-tiering.local.yaml, member.local.yaml, repositories.local.yaml -
        with a comment naming the reason (context-circuit-source is bound at
        `path: .`, so an unfiltered overlay would copy .runtime/ into a worktree
        that lives inside .runtime/).
      - Add cc_overlay_ignored SRC DST, which requires both directories, lists
        ignored paths with `git -C SRC ls-files -z --others --ignored
        --exclude-standard --directory --no-empty-directory`, drops any entry
        whose first path segment is in CC_OVERLAY_EXCLUDE, creates each parent
        directory under DST, and copies each remaining entry with cc_copy_path.
        Handle NUL-separated names so a path with spaces survives.
      - Emit `copy_mode: <mode>` and `overlay_paths: <count>` on success; fail
        OVERLAY_FAILED (or the more specific OVERLAY_COPY_FAILED) on any error,
        leaving no partial claim of success. Never print a copied file's
        contents or name-value pair from it.
      - Add `worktree-overlay) cc_overlay_ignored "$@" ;;` to the cc_main
        dispatch beside worktree-prepare.
    acceptance:
      - id: OV-AC-IGNORED-COPIED
        statement: >
          Given a checkout holding gitignored files and folders on disk,
          including .env and a directory such as node_modules, the overlay
          reproduces each of them in the destination tree with the same content.
      - id: OV-AC-UNTRACKED-EXCLUDED
        statement: >
          An untracked file that is not gitignored is not copied into the
          destination tree.
      - id: OV-AC-NOT-SYMLINK
        statement: >
          No overlaid path in the destination is a symbolic link, and no
          overlaid path resolves into the source checkout.
      - id: OV-AC-WORKSPACE-PROTECTED
        statement: >
          When the source checkout is the workspace root, .runtime/,
          /repositories/, and the three workspace-root *.local.yaml files are
          not copied, while every other ignored path still is.
    verification:
      - id: OV-VT-001
        command: sh test/worktree/test-overlay.sh
      - id: OV-VT-002
        command: grep -q 'cc_overlay_ignored()' .context-circuit/wrapper/runtime/engine.sh && grep -q 'worktree-overlay)' .context-circuit/wrapper/runtime/engine.sh
      - id: OV-VT-003
        command: grep -q 'ls-files -z --others --ignored --exclude-standard' .context-circuit/wrapper/runtime/engine.sh && ! grep -qE 'ln -s|--symbolic-link' .context-circuit/wrapper/runtime/engine.sh
      - id: OV-VT-004
        command: grep -q 'CC_OVERLAY_EXCLUDE' .context-circuit/wrapper/runtime/engine.sh
  - id: OV-002
    title: Overlay every freshly created execution worktree, and block on failure
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
    evidence_anchors:
      - .context-circuit/wrapper/runtime/engine.sh
    depends_on:
      - OV-001
    changes:
      - In cc_worktree_prepare, call cc_overlay_ignored with the resolved
        checkout path and the new tree after a successful `git worktree add`
        (both the existing-branch and new-branch arms) and before the
        worktree/branch/base_commit emissions; fail WORKTREE_OVERLAY_FAILED on
        error. Leave the worktree_reused true early return untouched so a reused
        tree is never re-overlaid.
      - In cc_base_prepare, call cc_overlay_ignored once the base content is
        final - after the integration merge in the multi-predecessor arm, and
        after `git worktree add` in the base and stack arms - and before the
        emissions; fail WORKTREE_OVERLAY_FAILED on error. Leave the stale-reuse
        early return untouched.
      - In cc_execution_begin, treat an overlay failure the same way a worktree
        failure is treated today: set execution status blocked with
        blocked_reason WORKTREE_OVERLAY_FAILED and return the existing
        EXECUTION_WORKTREE_FAILED shape, so no grounding manifest is written and
        no brief can be assembled for that repository.
      - Pass the overlay's copy_mode through to the caller's stdout so an
        execution's setup evidence shows whether the tree was cloned or copied,
        without adding a field to any persisted schema in this plan.
    acceptance:
      - id: OV-AC-EXEC-OVERLAID
        statement: >
          A newly created execution worktree contains the bound checkout's
          gitignored files and folders, including .env, before any worker is
          attached.
      - id: OV-AC-EXEC-REUSE-UNTOUCHED
        statement: >
          Preparing an already-existing execution worktree does not re-overlay
          it and does not modify any file the worker left there.
      - id: OV-AC-EXEC-FAIL-CLOSED
        statement: >
          When the overlay fails, the execution is recorded blocked with a
          stable reason, no grounding manifest is written for that repository,
          and no worker brief can be assembled.
    verification:
      - id: OV-VT-005
        command: sh test/worktree/test-overlay.sh
      - id: OV-VT-006
        command: sh test/execution/test-execution.sh
      - id: OV-VT-007
        command: sh test/run-stack/test-run-stack.sh
      - id: OV-VT-008
        command: grep -q 'WORKTREE_OVERLAY_FAILED' .context-circuit/wrapper/runtime/engine.sh
  - id: OV-003
    title: Overlay the Explore worktree before the pairing pointer exists
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
    evidence_anchors:
      - .context-circuit/wrapper/runtime/engine.sh
      - .context-circuit/wrapper/contracts/schemas/pairing-session.yaml
    depends_on:
      - OV-001
    changes:
      - In cc_pair_begin, call cc_overlay_ignored with the resolved repository
        path and the new pairing worktree immediately after `git worktree add`
        succeeds and before the pointer is written.
      - On overlay failure, remove the just-created worktree with cc_worktree_drop
        and delete the just-created pairing branch, then fail
        PAIR_WORKTREE_OVERLAY_FAILED. Nothing that existed before the call is
        removed, and no pointer.yaml is written, so a failed Explore setup is
        not resumable.
      - Emit copy_mode on pair-begin stdout alongside the existing session,
        repository, worktree, branch, base_commit, and supervision lines. Add no
        field to pairing-session.yaml - the pointer keeps its five fields
        (INV-PAIR-01).
    acceptance:
      - id: OV-AC-EXPLORE-OVERLAID
        statement: >
          A newly created Explore worktree contains the bound checkout's
          gitignored files and folders, including .env, before the human starts
          working in it.
      - id: OV-AC-EXPLORE-FAIL-CLOSED
        statement: >
          When the Explore overlay fails, pair-begin fails with a stable reason
          and leaves no pointer, no branch, and no worktree behind.
      - id: OV-AC-POINTER-UNCHANGED
        statement: >
          The pairing pointer still carries exactly schema_version, repo,
          worktree, branch, and base, and records no environment, evidence, or
          execution state.
    verification:
      - id: OV-VT-009
        command: sh test/pairing/test-pairing.sh
      - id: OV-VT-010
        command: sh test/worktree/test-overlay.sh
      - id: OV-VT-011
        command: grep -q 'PAIR_WORKTREE_OVERLAY_FAILED' .context-circuit/wrapper/runtime/engine.sh
      - id: OV-VT-012
        command: grep -c '^  [a-z_]*:' .context-circuit/wrapper/contracts/schemas/pairing-session.yaml >/dev/null && grep -q 'base: { type: string' .context-circuit/wrapper/contracts/schemas/pairing-session.yaml && ! grep -q 'environment' .context-circuit/wrapper/contracts/schemas/pairing-session.yaml
  - id: OV-004
    title: Prove the overlay offline, including the workspace-root hazard
    repositories: [context-circuit-source]
    paths:
      - test/worktree/test-overlay.sh
      - test/acceptance.sh
      - test/lib/fixture.sh
      - test/security/test-boundaries.sh
    evidence_anchors:
      - test/grounding/test-grounding.sh
      - test/pairing/test-pairing.sh
      - test/lib/fixture.sh
      - test/acceptance.sh
    depends_on:
      - OV-002
      - OV-003
    changes:
      - Add test/worktree/test-overlay.sh following the house pattern of
        test/grounding/test-grounding.sh - source test/lib/assert.sh and
        test/lib/fixture.sh, build a workspace with cc_fx_ws, and trap-clean it.
      - Add a fixture helper (in test/lib/fixture.sh) that gives a repository a
        .gitignore plus gitignored on-disk content - .env with a fake value, a
        node_modules/ directory with a nested file - and one untracked,
        non-ignored file, committing only the .gitignore and tracked sources.
      - Cover, for an execution worktree - .env present with matching content,
        node_modules/ present with its nested file, the untracked non-ignored
        file absent, no overlaid path is a symlink (`! test -L`), and
        `git -C <worktree> status --porcelain` shows nothing (the copies are
        still ignored and uncommitted).
      - Cover the same for an Explore worktree created by cc_pair_begin, plus
        the fail-closed case - force an overlay failure and assert pair-begin
        fails and leaves no pointer, branch, or worktree.
      - Cover the workspace-root hazard directly - bind a repository at the
        workspace root, create a worktree under .runtime/, and assert the new
        tree contains no .runtime/, no repositories/, and none of the three
        *.local.yaml files, while an ordinary ignored file is still present.
      - Cover the reuse path - prepare a worktree, write a local change into an
        overlaid file, prepare again, and assert the file is untouched.
      - Wire test/worktree/test-overlay.sh into test/acceptance.sh next to the
        grounding and pairing suites.
      - Extend test/security/test-boundaries.sh so its credential-term scan is
        asserted to cover the runtime and shipped files only, and add an
        assertion that no overlaid content path is ever written into a runtime
        record.
    acceptance:
      - id: OV-AC-PROVEN
        statement: >
          The semantic acceptance suite fails if the overlay stops copying
          ignored paths, starts copying untracked non-ignored files, produces a
          symlink, re-overlays a reused worktree, copies workspace runtime or
          host-local state, or stops failing closed.
      - id: OV-AC-OFFLINE
        statement: >
          The new suite runs with no network access and no dependency on any
          package manager being installed.
    verification:
      - id: OV-VT-013
        command: sh test/worktree/test-overlay.sh
      - id: OV-VT-014
        command: grep -qF 'test/worktree/test-overlay.sh' test/acceptance.sh
      - id: OV-VT-015
        command: sh test/security/test-boundaries.sh
      - id: OV-VT-016
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
