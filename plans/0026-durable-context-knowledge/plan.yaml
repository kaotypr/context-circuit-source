schema_version: 3
plan: 0026-durable-context-knowledge
intent: i019-durable-context-knowledge
title: Context files hold only durable product knowledge
status: done
objective: >
  Product Knowledge writing follows a durable-only rule owned in the contract:
  live context files never name a particular plan, intent file, or sources file,
  and never name a sources/ path; DECISIONS.md records what is now true about
  the product, not file paths or ephemeral artifacts; existing maintainer context
  and the blank template seed are rewritten; checks prove the rule on every
  write path the coordinator owns.
repositories:
  - id: context-circuit-source
    purpose: >
      Owns invariants, product-knowledge docs, coordinator and cc-complete
      procedure, maintainer context/, template/context/, release manifest, and
      acceptance tests.
plan_dependencies: []
product_knowledge:
  - id: conventions
    path: context/CONVENTIONS.md
    reason: >
      Records accepted Product Knowledge writing conventions; must gain the
      durable-only rule and lose provenance footnotes that name sources paths.
  - id: decisions
    path: context/DECISIONS.md
    reason: >
      The exemplar for knowledge-change recording; many entries currently cite
      plans, commits, and sources paths and must be rewritten to the new shape.
  - id: context-index
    path: context/INDEX.md
    reason: >
      The retrieval catalog; references context/sources.yaml and particular
      plan ids today and must align with the retired provenance ledger.
  - id: product-knowledge-doc
    path: .context-circuit/docs/product-knowledge.md
    reason: >
      Shipped owner doc for what context/ is; must state the durable-only
      writing rule and drop sources.yaml guidance.
context_grounding:
  summary: >
    Grounded at HEAD 9ddcc59. INV-KNOWLEDGE-01/02 govern retrieval and in-place
    updates but no invariant bans ephemeral citations in context pages.
    context/sources.yaml exists with retired comments; context/SOURCES.md and
    template/context/SOURCES.md instruct agents to record provenance there and
    name sources/ paths. Twenty-six live context files contain intent/, plans/,
    or sources/ strings — mostly Provenance footnotes, DECISIONS history, and
    INDEX pointers — not concept-only explanations. scripts/release-manifest.txt
    still requires context/sources.yaml in the shipped seed.
    .context-circuit/agents/coordinator.md and cc-complete describe reconcile
    but not DECISIONS shape or the ephemeral-citation ban. test/knowledge/
    covers INV-KNOWLEDGE-02 debt only; no suite scans context/ for forbidden
    citations. i015 (draft) explicitly non-goals rewriting Product Knowledge
    pages; i019 is the dedicated rewrite. One plan with four ordered tasks
    shares one worker lifecycle and one acceptance.sh boundary; rule without
    rewrite would fail AC-REWRITE-EXISTING; rewrite without template/release
    would fail AC-ALL-WRITES for new workspaces.
  constraints:
    - One owner per rule — add INV-KNOWLEDGE-03 in invariants.yaml, not a
      skill-only copy.
    - Invariant IDs and shipped contract or adapter paths remain nameable.
    - Explaining product concepts plan, intent, and sources stays allowed;
      path patterns like intent/<id>/ for structure are not particular-file cites.
    - Do not change i015 catalog-selection work or rewrite sources/, plan/, or
      intent/ artifacts themselves.
    - Linking between durable context units remains allowed.
    - Preserve unrelated and dirty work; run the semantic acceptance suite after
      meaningful phases.
  decisions:
    - One plan, four tasks — contract and procedure (DCK-001), maintainer
      context rewrite (DCK-002), template and release seed (DCK-003), acceptance
      suite (DCK-004). Stacked plans would split one verification surface
      without independent failure boundaries.
    - Add INV-KNOWLEDGE-03 as a new invariant; extend INV-KNOWLEDGE-01 provenance
      metadata guidance in context-index.yaml rather than a parallel owner.
    - Delete context/sources.yaml and template/context/sources.yaml; rewrite
      SOURCES.md in both trees to describe passive source material without any
      sources/ path literal or sources.yaml reference.
    - Retire Provenance footnotes on domain pages that name sources paths or
      particular plans; keep Implementation references to shipped contract paths.
    - Rewrite DECISIONS.md entries to decision/rationale/consequence without
      file paths, commit hashes, or particular plan or intent ids.
knowledge_impact:
  expected_context_units:
    - conventions
    - decisions
    - context-index
    - all domain pages with provenance footnotes
    - terminology
    - sources-page
  review_on_completion: true
tasks:
  - id: DCK-001
    title: Add durable-only Product Knowledge invariant and write paths
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/contracts/invariants.yaml
      - .context-circuit/wrapper/contracts/schemas/context-index.yaml
      - .context-circuit/docs/product-knowledge.md
      - .context-circuit/docs/templates/domain-context.md
      - context/CONVENTIONS.md
      - template/context/CONVENTIONS.md
      - .context-circuit/agents/coordinator.md
      - .agents/skills/cc-complete/SKILL.md
    depends_on: []
    changes:
      - >
        Add INV-KNOWLEDGE-03 to invariants.yaml — live context/ holds durable
        product knowledge only; it never names a particular plan, intent file,
        or sources file, and never names a sources/ path; DECISIONS.md records
        what is now true about the product, not edited paths or ephemeral
        artifacts; explaining the concepts plan, intent, and sources remains
        allowed; invariant IDs and shipped contract or adapter paths remain
        nameable.
      - >
        Update context-index.yaml and product-knowledge.md to describe the
        durable-only rule and retire sources.yaml as a context provenance
        ledger; update domain-context.md template with DECISIONS entry shape.
      - >
        Extend context/CONVENTIONS.md and template/context/CONVENTIONS.md with
        the writing rule. Extend coordinator gather-context and mark-done
        reconcile sections and cc-complete with the same durable-only and
        DECISIONS-shape requirements so every in-place write path follows the
        rule.
    acceptance:
      - id: DCK-AC-01
        statement: >
          INV-KNOWLEDGE-03 exists in invariants.yaml and product-knowledge.md
          states the durable-only writing rule as the normative owner alongside
          INV-KNOWLEDGE-01/02.
      - id: DCK-AC-02
        statement: >
          Coordinator and cc-complete instruct gather-context and mark-done
          reconcile to follow the durable-only rule and DECISIONS knowledge-change
          shape.
    verification:
      - id: DCK-VT-01
        command: >
          rg -n 'INV-KNOWLEDGE-03' .context-circuit/wrapper/contracts/invariants.yaml
          .context-circuit/docs/product-knowledge.md
      - id: DCK-VT-02
        command: >
          rg -n 'durable-only|durable product knowledge|particular plan'
          .context-circuit/agents/coordinator.md .agents/skills/cc-complete/SKILL.md
          context/CONVENTIONS.md
  - id: DCK-002
    title: Rewrite maintainer live context and remove sources.yaml
    repositories: [context-circuit-source]
    paths:
      - context/
    depends_on: [DCK-001]
    changes:
      - >
        Delete context/sources.yaml. Rewrite context/SOURCES.md so it explains
        passive source material without any sources/ path literal or
        sources.yaml reference.
      - >
        Rewrite context/DECISIONS.md entries to record decision, rationale, and
        product consequence without naming particular plans, intent files,
        sources files, edited file paths, or commit hashes; add a decision entry
        for this durable-only rule.
      - >
        Rewrite context/INDEX.md, context/TERMINOLOGY.md, context/DESIGN-DELTAS.md,
        context/roles/, and every context/domains/ page — remove Provenance
        footnotes and inline cites that name particular plan or intent ids,
        sources/ paths, or context/sources.yaml; keep concept explanations and
        shipped contract path references.
    acceptance:
      - id: DCK-AC-03
        statement: >
          No live maintainer context file names a particular plan, intent file,
          sources file, or sources/ path; context/sources.yaml is absent.
      - id: DCK-AC-04
        statement: >
          DECISIONS.md entries record product knowledge changes, not file paths
          or ephemeral artifacts behind them.
      - id: DCK-AC-05
        statement: >
          Domain and architecture pages still explain plan, intent, and sources
          as product concepts.
    verification:
      - id: DCK-VT-03
        command: test ! -f context/sources.yaml
      - id: DCK-VT-04
        command: >
          ! rg -n 'sources/' context/ && ! rg -n 'sources\.yaml' context/
          && ! rg -n 'intent/i[0-9]{3}-' context/
          && ! rg -n 'plans/[0-9]{4}-|plans/context-circuit' context/
      - id: DCK-VT-05
        command: >
          rg -n 'intent/<id>|plans/<id>|Gate 1|passive source'
          context/domains/intent/README.md context/SOURCES.md
  - id: DCK-003
    title: Align template seed and release manifest with durable-only context
    repositories: [context-circuit-source]
    paths:
      - template/context/
      - scripts/release-manifest.txt
      - scripts/release-artifact.sh
      - test/release/
    depends_on: [DCK-001]
    changes:
      - >
        Delete template/context/sources.yaml. Rewrite template/context/SOURCES.md
        and template/context/CONVENTIONS.md to match the durable-only rule without
        sources/ path literals.
      - >
        Remove context/sources.yaml from scripts/release-manifest.txt required
        paths; keep context/SOURCES.md as the concept page. Update release tests
        if they assert sources.yaml presence.
    acceptance:
      - id: DCK-AC-06
        statement: >
          The blank template seed and release manifest ship durable-only context
          guidance and do not require or include context/sources.yaml.
    verification:
      - id: DCK-VT-06
        command: test ! -f template/context/sources.yaml
      - id: DCK-VT-07
        command: >
          ! grep -q 'context/sources.yaml' scripts/release-manifest.txt
          && ! rg -n 'sources/' template/context/
      - id: DCK-VT-08
        command: sh test/release/test-release.sh
  - id: DCK-004
    title: Add acceptance checks for durable-only Product Knowledge
    repositories: [context-circuit-source]
    paths:
      - test/knowledge/
      - test/contracts/test-contracts.sh
      - test/acceptance.sh
    depends_on: [DCK-002, DCK-003]
    changes:
      - >
        Add test/knowledge/test-durable-context.sh that fails on particular
        plan ids, particular intent ids, sources/ paths, and sources.yaml in
        context/ and template/context/, and asserts INV-KNOWLEDGE-03 presence.
      - >
        Wire the suite into test/acceptance.sh and extend test-contracts.sh
        invariant roster for INV-KNOWLEDGE-03.
    acceptance:
      - id: DCK-AC-07
        statement: >
          Automated checks prove the durable-only rule on maintainer and template
          context trees and INV-KNOWLEDGE-03 is in the contract roster.
      - id: DCK-AC-08
        statement: >
          The full semantic acceptance suite remains green and credential-free.
    verification:
      - id: DCK-VT-09
        command: sh test/knowledge/test-durable-context.sh
      - id: DCK-VT-10
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
