schema_version: 3
plan: 0034-number-intent-open-questions
intent: i025-number-intent-open-questions
title: Number open questions on the intent page
status: done
objective: >
  Teach and use a numbered 1, 2, 3 list for human-facing intent Open questions —
  same shape as The plans, stable numbers when answered, next unused number for
  later questions, and an unnumbered empty-state line — across the intent template,
  filled example, cc-intent skill, intent domain page, and approval ask, without
  rewriting existing intents or adding machine ids to the contract.
repositories:
  - id: context-circuit-source
    purpose: >
      Owns intent templates, cc-intent skill, intent Product Knowledge, release
      manifest entries for shipped templates, and semantic acceptance tests.
plan_dependencies: []
product_knowledge:
  - id: intent
    path: context/domains/intent/README.md
    reason: >
      Owns Gate 1, the five-section INTENT.md surface, and phase-aware Open
      questions behavior that must document the numbered convention.
context_grounding:
  summary: >
    Grounded at HEAD 05e384ed. Open questions today use bold question plus italic
    answer under ## Open questions but are not numbered; The plans already uses
    1. **title** / _After this:_ form. Authoring surfaces live at
    .context-circuit/docs/templates/intent.md and intent.example.md (the example
    shows one unnumbered answered question), .agents/skills/cc-intent/SKILL.md
    (phase-aware Open questions and Gate 1 approval ask), and
    context/domains/intent/README.md. Thin host routes under .claude/ and
    template/.claude/skills/cc-intent/ only point at the skill owner.
    scripts/release-manifest.txt already ships both intent templates. No runtime
    schema, engine verb, or contract field change is required. Existing intents
    (including i026 with an unnumbered answered question) stay as authored.
    plan-allocate-id fails PLAN_PREFIX_COLLISION on archived duplicate numeric
    prefixes; next in-band id is 0034 after 0033-align-github-names.
  constraints:
    - Keep exactly five INTENT.md sections; numbering rationale stays off the human page.
    - Numbering is human-facing only; do not add open-question ids to contract.yaml or contract_digest.
    - One owner per rule — document numbering in template, cc-intent skill, and intent domain page only.
    - Do not rewrite already-written intents, planner findings, or plan open questions.
    - Leave template/ and wrapper/ unchanged except if release manifest already lists the edited paths.
    - Preserve unrelated and dirty work; run semantic acceptance after meaningful phases.
  decisions:
    - One plan with two embedded tasks — authoring-surface updates and acceptance
      proof share one execution and verification boundary for this convention change.
    - Use .context-circuit/docs/templates/ as the canonical path (not legacy docs/templates/).
    - intent.example.md shows one numbered answered question (1.) matching The plans style; skill text carries stable-number and empty-state rules rather than adding a second example question.
    - New focused suite test/intent/test-open-questions-numbering.sh wired into test/acceptance.sh; no criteria-map AC id addition required because intent ACs map to the intent test suites collectively.
knowledge_impact:
  expected_context_units:
    - intent
  review_on_completion: true
tasks:
  - id: NQ-001
    title: Teach numbered open questions on intent authoring surfaces
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/docs/templates/intent.md
      - .context-circuit/docs/templates/intent.example.md
      - .agents/skills/cc-intent/
      - context/domains/intent/README.md
    evidence_anchors:
      - .context-circuit/docs/templates/intent.md
      - .context-circuit/docs/templates/intent.example.md
      - .agents/skills/cc-intent/SKILL.md
      - context/domains/intent/README.md
    depends_on: []
    changes:
      - Update intent.md template HTML guidance so Open questions use the same numbered list shape as The plans, keep the unnumbered empty-state line, and show bold question plus italic answer under each number.
      - Number the answered question in intent.example.md as 1. **…** with _Answer:_ beneath it.
      - Extend cc-intent Open questions and Gate 1 approval guidance so new intents number questions, answers stay under the same number, later questions take the next unused number, the approval ask invites answering by number, and already-written intents are not rewritten.
      - Mirror the numbered convention and phase-aware rules on context/domains/intent/README.md without duplicating policy into other skills.
    acceptance:
      - id: NQ-AC-NUMBERED
        statement: >
          When an intent has one or more open questions, authoring guidance shows
          each as a numbered item a person can refer to by that number.
      - id: NQ-AC-STABLE
        statement: >
          Guidance states that answering keeps the number, later questions receive
          the next unused number, and earlier numbers are not reshuffled.
      - id: NQ-AC-EMPTY
        statement: >
          The empty-state line stays unnumbered and guidance forbids inventing a
          dummy numbered item when there are no questions.
      - id: NQ-AC-STYLE
        statement: >
          Numbering matches The plans list style — number, bold question, italic
          answer line beneath.
      - id: NQ-AC-AUTHORING
        statement: >
          Template, example, skill, and approval ask teach and use the numbered form
          for new intents.
      - id: NQ-AC-EXISTING-UNTOUCHED
        statement: >
          Guidance explicitly leaves already-written intents unchanged; this task
          does not renumber historical intent files.
    verification:
      - id: NQ-VT-001
        command: rg -n 'Open questions' .context-circuit/docs/templates/intent.md .context-circuit/docs/templates/intent.example.md .agents/skills/cc-intent/SKILL.md context/domains/intent/README.md && rg -n '^1\. \*\*' .context-circuit/docs/templates/intent.example.md && rg -n 'numbered|next unused|answer by number|1, 2, 3' .context-circuit/docs/templates/intent.md .agents/skills/cc-intent/SKILL.md
      - id: NQ-VT-002
        command: rg -n 'next unused|keep the question|no known unresolved|no dummy|do not invent|already-written|not rewrite|leave.*untouched' .agents/skills/cc-intent/SKILL.md context/domains/intent/README.md .context-circuit/docs/templates/intent.md && ! rg -n '^1\. \*\*' intent/i026-compiled-runtime/INTENT.md
  - id: NQ-002
    title: Prove numbered open questions in the acceptance suite
    repositories: [context-circuit-source]
    paths:
      - test/intent/
      - test/acceptance.sh
    depends_on:
      - NQ-001
    changes:
      - Add test/intent/test-open-questions-numbering.sh with deterministic checks for template, example, skill, and domain wording plus a fixture intent that authors numbered questions and empty state correctly.
      - Wire the new suite into test/acceptance.sh after existing intent suites.
    acceptance:
      - id: NQ-AC-NUMBERED
        statement: >
          Acceptance coverage fails if numbered Open questions guidance is missing
          from the shipped authoring surfaces.
      - id: NQ-AC-STABLE
        statement: >
          Acceptance coverage fails if stable-number or next-unused-number rules regress.
      - id: NQ-AC-EMPTY
        statement: >
          Acceptance coverage fails if the unnumbered empty state or no-dummy rule regresses.
      - id: NQ-AC-AUTHORING
        statement: >
          The semantic acceptance suite includes the new intent open-questions checks.
    verification:
      - id: NQ-VT-003
        command: sh test/intent/test-open-questions-numbering.sh
      - id: NQ-VT-004
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
