schema_version: 3
plan: 0043-enforce-role-context-boundaries
intent: i031-enforce-role-context-boundaries
title: Enforce role-specific context boundaries
status: draft
objective: >
  Make every strict Agent Harness scenario declare and enforce a normal or
  explicitly expanded context envelope for each created role, keeping available,
  provided, active-read, and charged measurements distinct and producing fail or
  honest inconclusive outcomes when boundaries or evidence do not support a pass.
repositories:
  - id: agent-harness
    purpose: Owns scenario contracts, native context evidence, role ledgers, grading, reports, tests, and documentation.
product_knowledge:
  - id: agent-harness-product-boundary
    path: README.md
    reason: >
      Defines the standalone disposable-run product, supported native drivers,
      observable evidence boundary, and current scenario controls.
context_grounding:
  summary: >
    Grounded at clean agent-harness revision
    93ebd8b99b30eb667b02e47e15299e1aa4f6b85d. Scenario resolution currently
    freezes host, prompt, capability, child-role, duration, and usage-ceiling
    inputs. Native drivers retain root and child identity, observations, and a
    single host usage object; run_host applies only capability and child-role
    checks, and aggregate reduces native passing hosts. There is no context
    envelope, expansion authority, resource-event model, per-role ledger,
    boundary/budget grader, contributor report, or unavailable-measurement rule.
  constraints:
    - Normal-request envelopes are mandatory defaults for coordinator, planner, worker, and verifier roles actually created by each scenario.
    - Keep available, provided, active-read, and host-charged context as separate evidence dimensions; input tokens supplement and never replace resource evidence.
    - An expansion must preserve the exact prompt clause, affected role, named additional surface, purpose, stopping condition, and revised budget, without authorizing adjacent resources or roles.
    - A forbidden active read or undeclared provided resource fails a strict scenario; unavailable or unattributable required measurement is inconclusive, never zero or pass.
    - Keep background indexing separate from agent-delivered and active-read context whenever the host exposes that distinction.
    - Attribute every ledger to the native root or linked child role; flattened activity cannot establish a strict pass.
    - Preserve streaming redaction, disposable-world isolation, ambient authentication, unchanged human prompts, and existing native terminal and topology requirements.
    - Do not inspect private model reasoning, grade exact prose, or broaden access to another repository, source, archive, history, or diagnostic surface by implication.
  decisions:
    - Use one plan because the declarative envelope, native event normalization, ledger, grader, and strict end-to-end report are one compatibility and verification seam across all supported hosts.
    - Extend the resolved scenario record with schema-validated role envelopes, budgets, and optional exact expansion authorities so reproduction freezes the same authorization and limits.
    - Normalize resource events into a host-neutral ledger only when native evidence supplies a role/session link and resource identity; retain native evidence references and explicit unavailable or unattributed states.
    - Grade each role and dimension before host aggregation, with boundary failures outranking budget results and missing required proof yielding inconclusive.
    - Compute largest contributors and baseline deltas from measured ledger entries, while treating host token usage as enforceable only when trustworthy role-level attribution is present.
knowledge_impact:
  expected_context_units: [agent-harness-product-boundary]
  review_on_completion: true
tasks:
  - id: CB-001
    title: Define and freeze role context contracts
    repositories: [agent-harness]
    paths:
      - src/agent_harness/workspace.py
      - scenarios/
      - tests/test_contracts.py
      - tests/test_context_contracts.py
    evidence_anchors:
      - src/agent_harness/workspace.py:13
      - src/agent_harness/workspace.py:39
      - scenarios/real-host-smoke.yaml:1
    depends_on: []
    changes:
      - Add schema-versioned normal context envelopes for every coordinator, planner, worker, and verifier created by a scenario, including exact allowed and forbidden resource identities and per-role ceilings for provided bytes, active-read bytes, resource count, and attributable input tokens.
      - Add optional expanded mode records containing the exact human prompt clause, affected role, additional named surfaces and purposes, stopping condition, and revised budget; reject implicit, adjacent, cross-role, or prompt-unmatched expansion.
      - Freeze validated envelopes and expansions into resolved inputs and scenario digests so builds and reproductions cannot silently change context authority.
      - Update shipped scenarios with explicit normal envelopes and focused invalid examples covering missing roles, ambiguous resources, incomplete expansions, and invalid budgets.
    acceptance:
      - id: CB-AC-01
        statement: Every scenario declares the expected normal context envelope and hard resource budgets for every coordinator, planner, worker, and verifier role it creates.
      - id: CB-AC-02
        statement: Expanded authority is accepted only when it records the exact prompt clause, role, added surface, purpose, stopping condition, and revised budget and never spreads to adjacent resources or roles.
      - id: CB-AC-03
        statement: Scenario resolution and reproduction freeze the validated context authority and budgets as exact run inputs.
    verification:
      - id: CB-VT-001
        command: python3 -m unittest tests.test_context_contracts -v
      - id: CB-VT-002
        command: python3 -m unittest tests.test_contracts tests.test_reproduction -v
  - id: CB-002
    title: Build attributed role context ledgers
    repositories: [agent-harness]
    paths:
      - src/agent_harness/observations.py
      - src/agent_harness/drivers/base.py
      - src/agent_harness/drivers/codex.py
      - src/agent_harness/drivers/claude.py
      - src/agent_harness/drivers/cursor.py
      - tests/host_protocol_fixtures/
      - tests/test_context_evidence.py
      - tests/test_codex_driver.py
      - tests/test_claude_driver.py
      - tests/test_cursor_driver.py
    evidence_anchors:
      - src/agent_harness/observations.py:30
      - src/agent_harness/drivers/base.py:50
      - src/agent_harness/drivers/base.py:95
      - src/agent_harness/drivers/base.py:102
    depends_on: [CB-001]
    changes:
      - Define redacted context evidence for available, provided, active-read, charged, and background-index activity with role, native session, resource identity, context kind, bytes or tokens, authority, and native evidence reference.
      - Translate supported Codex, Claude Code, and Cursor structured events into separate root and native-child ledgers without inferring roles from model names or treating process-wide usage as role-attributed usage.
      - Preserve unavailable and unattributed measurements explicitly, including hosts that cannot distinguish indexing from agent context or cannot positively evidence active reads.
      - Track totals and largest contributors per role and dimension while retaining the underlying native event link and streaming redaction guarantees.
    acceptance:
      - id: CB-AC-04
        statement: Results distinguish available, provided, active-read, and charged context and attribute delivered and read events to the originating native root or child role.
      - id: CB-AC-05
        statement: Context ledger entries identify resource, size, authority, evidence, and largest contributors without flattening child activity or background indexing into root-agent usage.
      - id: CB-AC-06
        statement: Unsupported, unavailable, or unattributable context telemetry remains explicit and is never represented as zero usage.
    verification:
      - id: CB-VT-003
        command: python3 -m unittest tests.test_context_evidence -v
      - id: CB-VT-004
        command: python3 -m unittest tests.test_codex_driver tests.test_claude_driver tests.test_cursor_driver -v
      - id: CB-VT-005
        command: python3 -m unittest tests.test_session_evidence tests.test_reliability -v
  - id: CB-003
    title: Enforce boundaries and budgets in strict grading
    repositories: [agent-harness]
    paths:
      - src/agent_harness/context_grading.py
      - src/agent_harness/hosts.py
      - src/agent_harness/runs.py
      - tests/test_context_grading.py
      - tests/test_host_matrix.py
    evidence_anchors:
      - src/agent_harness/hosts.py:9
      - src/agent_harness/hosts.py:26
      - src/agent_harness/runs.py:10
    depends_on: [CB-002]
    changes:
      - Grade every created role against its normal or exact expanded envelope, failing undeclared provided context, forbidden active reads, adjacent expansion, and hard file, byte, resource, or attributable token ceiling breaches.
      - Produce an inconclusive context result when required enforcement, role attribution, active-read evidence, or trustworthy role-level token measurement is unavailable, without replacing an observed boundary failure.
      - Add per-role dimension totals, largest contributors, authority, evidence references, budget headroom, and baseline deltas to durable reports before host and matrix aggregation.
      - Make strict host and aggregate outcomes require all applicable context checks to pass while preserving existing native provenance, terminal, capability, and child-topology gates.
    acceptance:
      - id: CB-AC-07
        statement: A strict scenario cannot pass after forbidden active reads, undeclared delivered context, adjacent expansion, or a role-specific hard resource budget breach.
      - id: CB-AC-08
        statement: Missing required context measurement or attribution produces an honest inconclusive result rather than false zero-use or pass.
      - id: CB-AC-09
        statement: Durable per-role results expose totals, largest contributors, budgets, deltas, authority, and evidence before matrix aggregation.
    verification:
      - id: CB-VT-006
        command: python3 -m unittest tests.test_context_grading -v
      - id: CB-VT-007
        command: python3 -m unittest tests.test_host_matrix tests.test_run_lifecycle -v
  - id: CB-004
    title: Prove strict context behavior end to end
    repositories: [agent-harness]
    paths:
      - src/agent_harness/cli.py
      - scenarios/
      - tests/test_context_end_to_end.py
      - tests/test_real_host_acceptance.py
      - README.md
      - pyproject.toml
    evidence_anchors:
      - src/agent_harness/cli.py:89
      - tests/test_real_host_acceptance.py:1
      - README.md:11
    depends_on: [CB-003]
    changes:
      - Exercise normal and explicitly expanded scenarios through resolve, disposable build, native evidence collection, role grading, finalization, and selected-host and matrix reports.
      - Cover forbidden and adjacent reads, undeclared packets, each resource budget, attributable and unavailable token usage, unattributed child activity, background indexing, contributor ranking, and unchanged-prompt expansion authority.
      - Keep deterministic protocol tests separate from opt-in live acceptance; require live strict runs to prove either enforced unavailability or positive role-attributed evidence for each required boundary.
      - Document envelope authoring, exact expansion, measurement dimensions, budget semantics, inconclusive outcomes, contributor reports, and host capability differences.
    acceptance:
      - id: CB-AC-10
        statement: Automated normal and expanded stories prove exact role boundaries and budgets from scenario resolution through durable selected-host and matrix reports.
      - id: CB-AC-11
        statement: Opt-in live strict runs accept only hosts that can enforce forbidden-resource unavailability or provide positive role-attributed context evidence.
      - id: CB-AC-12
        statement: Documentation explains context contracts, exact expansion, measurement limits, strict grading, and host-specific inconclusive behavior.
    verification:
      - id: CB-VT-008
        command: python3 -m unittest tests.test_context_end_to_end -v
      - id: CB-VT-009
        command: python3 -m unittest discover -s tests -v
      - id: CB-VT-010
        command: python3 -m compileall -q src tests
      - id: CB-VT-011
        command: AGENT_HARNESS_REAL_HOSTS=codex,claude,cursor python3 -m unittest tests.test_real_host_acceptance -v
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
