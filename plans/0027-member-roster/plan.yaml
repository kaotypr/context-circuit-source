schema_version: 3
plan: 0027-member-roster
intent: i021-id-number-blocks
title: Member roster and local identity
status: draft
objective: >
  The shared workspace carries a committed member roster mapping each member to
  non-overlapping intent and plan number bands, and each machine has a gitignored
  local identity file naming one roster member — set once like repositories.local.yaml
  — so allocation can resolve bands without the user naming a block in chat.
repositories:
  - id: context-circuit-source
    purpose: >
      Owns roster and local-identity contract schemas, runtime read/validate verbs,
      workspace bootstrap, gitignore and release manifest entries, cc-workspace
      guidance, and acceptance tests for roster shape and identity binding.
plan_dependencies: []
product_knowledge:
  - id: repository-binding
    path: context/domains/repository-binding/README.md
    reason: >
      Host-local gitignored files (repositories.local.yaml, role-tiering.local.yaml)
      are the established pattern for once-per-machine settings; member identity
      follows the same convention beside the committed portable roster.
  - id: plan-review
    path: context/domains/plan-review/README.md
    reason: >
      Documents current global sequential plan id allocation that band allocation
      will extend without changing id form or branch naming.
context_grounding:
  summary: >
    Grounded at HEAD 7db954f. engine.sh allocates intent and plan ids from a single
    workspace-wide high-water mark (cc_intent_allocate_id scans intent/ and
    intent/archive/; cc_plan_allocate_id uses cc_plan_max_sequence across plans/,
    plans/archive/, and materialization reservations). No member roster, band map,
    or local identity file exists. Host-local conventions already use
    repositories.local.yaml and role-tiering.local.yaml at the workspace root with
    matching gitignore and manifest deny entries. cc_workspace_init seeds
    repositories.local.yaml but not any member artifact. cc-workspace orients
    bindings but has no member-identity path. Intent i021 open questions are
    answered in contract.yaml; enabling bands must not rename existing i015–i021
    intents or 0002–0026 plans — only new allocation changes.
  constraints:
    - One owner per rule — roster grammar and local identity shape live in contract
      schemas and runtime verbs, not skill-only copies.
    - Committed roster is portable; member.local.yaml is host-local and never
      shipped (mirror repositories.local.yaml / role-tiering.local.yaml).
    - Do not change id allocation behavior in this plan — band-scoped allocation
      is plan 0028-band-allocation.
    - Preserve unrelated and dirty work; run the semantic acceptance suite after
      meaningful phases.
  decisions:
    - Three-plan stack — roster/identity (0027), band allocation runtime (0028),
      contracts/docs/checks (0029) — matches the intent's three independently
      verifiable milestones and distinct failure surfaces (schema/bootstrap vs
      allocation math vs product surface alignment).
    - Committed roster file members.yaml at workspace root; local identity file
      member.local.yaml at workspace root (plan-resolution, not intent-revision).
    - Bootstrap this maintainer workspace with a first member band i001–i099 /
      0001–0999 so all existing ids remain valid and the next allocation stays
      in-band; adding members appends non-overlapping bands per contract defaults.
    - Missing local identity fails closed in runtime with a stable error; cc-workspace
      and cc-intent handle the one-time human choice and write member.local.yaml —
      allocation never asks for numeric ranges in chat.
    - Roster overlap, unknown member refs, and invalid band bounds are rejected at
      validate time before any allocation call.
knowledge_impact:
  expected_context_units:
    - repository-binding
    - plan-review
  review_on_completion: true
tasks:
  - id: MR-001
    title: Author roster and local-identity contract schemas
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/contracts/schemas/members.yaml
      - .context-circuit/wrapper/contracts/schemas/member-local.yaml
      - .context-circuit/wrapper/contracts/invariants.yaml
      - .gitignore
      - template/.gitignore
      - .context-circuit/wrapper/manifest.yaml
      - members.yaml
      - template/members.yaml
    depends_on: []
    changes:
      - >
        Add members.yaml schema — committed roster listing members with stable ids,
        display names, and non-overlapping intent_band and plan_band ranges
        (inclusive bounds, default 99 intents and 999 plans per new member).
      - >
        Add member-local.yaml schema — gitignored host-local file with schema_version
        and member id referencing exactly one roster entry.
      - >
        Add invariant coverage for roster ownership and local identity (update
        INV-INTENT-01 / INV-PLAN-03 wording only where needed to reference bands
        without changing allocation behavior yet).
      - >
        Gitignore member.local.yaml at workspace root and template seed; add to
        manifest deny list alongside repositories.local.yaml and role-tiering.local.yaml.
      - >
        Bootstrap members.yaml for this workspace with a first member whose bands
        cover existing intent and plan prefixes; ship a minimal template/members.yaml
        example without machine-specific data.
    acceptance:
      - id: MR-AC-01
        statement: >
          A committed members.yaml and gitignored member.local.yaml schema exist with
          one contract owner each; overlapping bands are structurally rejectable.
      - id: MR-AC-02
        statement: >
          This workspace and the template seed carry a valid bootstrap roster and
          ignore member.local.yaml from portable artifacts.
    verification:
      - id: MR-VT-01
        command: sh test/bands/test-member-roster.sh --case schema-bootstrap
  - id: MR-002
    title: Runtime roster validate and member identity resolution
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
      - test/bands/test-member-roster.sh
      - test/lib/fixture.sh
    depends_on: [MR-001]
    changes:
      - >
        Add runtime verbs member-roster-validate, member-identity-read, and
        member-band-resolve (names earned against engine.sh dispatch style) that
        load members.yaml, read member.local.yaml when present, return the active
        member's intent and plan bands, and fail closed on overlap, unknown member,
        missing roster, or out-of-range band definitions.
      - >
        Do not change cc_intent_allocate_id or cc_plan_allocate_id yet; expose
        band lookup so plan 0028 can call shared helpers.
      - >
        Add fixture helpers to create roster and identity files in ephemeral workspaces.
    acceptance:
      - id: MR-AC-03
        statement: >
          Runtime validates a committed roster, resolves local identity to one member,
          and rejects overlapping or malformed band definitions deterministically.
      - id: MR-AC-04
        statement: >
          Missing member.local.yaml yields a stable identity-missing error without
          inventing a band or accepting a numeric range on the command line.
    verification:
      - id: MR-VT-02
        command: sh test/bands/test-member-roster.sh --case runtime-validate
  - id: MR-003
    title: Workspace guidance and member identity setup flow
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-workspace/SKILL.md
      - .agents/skills/cc-intent/SKILL.md
      - .context-circuit/docs/getting-started.md
      - .context-circuit/agents/coordinator.md
      - test/bands/test-member-roster.sh
      - test/acceptance.sh
    depends_on: [MR-002]
    changes:
      - >
        Update cc-workspace to orient member identity alongside repository bindings:
        report whether member.local.yaml exists, list roster members when identity
        is missing, and write member.local.yaml after a one-time human choice of an
        existing roster member (or bootstrap the first member when the roster is empty).
      - >
        Update cc-intent and coordinator guidance to require resolved member identity
        before intent-allocate-id; never prompt for a block number in chat.
      - >
        Wire test/bands/test-member-roster.sh into test/acceptance.sh.
    acceptance:
      - id: MR-AC-05
        statement: >
          Product guidance describes the one-time local member identity setup using
          the roster; ordinary authoring never asks the user to state a band number.
      - id: MR-AC-06
        statement: >
          The member-roster acceptance suite passes and the full semantic acceptance
          suite stays green with allocation still globally sequential.
    verification:
      - id: MR-VT-03
        command: sh test/bands/test-member-roster.sh
      - id: MR-VT-04
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
