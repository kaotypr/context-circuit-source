schema_version: 3
plan: 0040-worktree-toolchain-provision
intent: i027-runnable-worktrees
title: Make the worktree's toolchain match this commit
status: draft
objective: >
  After the gitignored overlay lands, the runtime makes the new worktree's
  dependency tree match the commit it was created from. A cloned install tree is
  kept only when it was built from the same lockfile content as this worktree's
  lockfile; otherwise a frozen install runs inside the worktree from the
  worktree's own lockfile. Detection stops being a bare existence test: a
  runtime-constant table keyed by the detected lockfile or manifest gives every
  key either an install tree plus a frozen install command, or an explicit
  "no per-worktree install tree" outcome. environment ready is emitted only
  after preparation actually succeeded, and a provisioning failure blocks
  execution setup and Explore setup rather than attaching anyone to a tree that
  cannot run.
repositories:
  - id: context-circuit-source
    purpose: >
      Owns cc_harden_worktree, cc_discover_repo_grounding, cc_execution_begin,
      and cc_pair_begin in .context-circuit/wrapper/runtime/engine.sh, and the
      acceptance suite that proves the environment field is honest.
plan_dependencies:
  - id: 0039-worktree-ignored-overlay
    reason: >
      Provisioning decides whether to keep a *cloned* install tree, and that
      tree only reaches the worktree through 0039's gitignored overlay. Without
      the overlay every worktree would always take the install branch, so the
      keep path could be neither implemented nor verified.
product_knowledge:
  - id: repository-grounding
    path: context/domains/repository-grounding/README.md
    reason: >
      Owns worktree hardening and states today that "full dependency
      provisioning is a later phase" - this plan is that phase, and changes what
      environment ready means.
  - id: plan-execution
    path: context/domains/plan-execution/README.md
    reason: >
      Owns execution setup and the blocked-execution outcomes a provisioning
      failure must join.
  - id: direct-collaboration
    path: context/domains/direct-collaboration/README.md
    reason: >
      Owns the Explore worktree, which must also be runnable before the human
      starts and must fail closed when it cannot be.
context_grounding:
  summary: >
    Grounded at HEAD 7d72f468. cc_harden_worktree (engine.sh 1668-1684) is the
    whole of the current behavior: it loops a hard-coded list of 15 filenames -
    package-lock.json, pnpm-lock.yaml, yarn.lock, bun.lockb, bun.lock, go.mod,
    Cargo.lock, Gemfile.lock, requirements.txt, poetry.lock, composer.lock,
    pom.xml, build.gradle, build.gradle.kts - and emits `environment: ready`
    plus `toolchain: <file>` the moment one exists, otherwise
    `environment: no-toolchain`. Its own comment (1666-1667) admits "no network,
    no per-worktree install here (full provisioning is a later phase)", so ready
    today means only that a lockfile was seen. That value flows straight into the
    grounding manifest via cc_discover_repo_grounding (1706) and from there into
    the worker brief: cc_worker_brief_assemble (1788-1789) prints "Ready:
    dependencies provisioned, commit hooks handled. Do NOT install or modify
    dependencies." - a claim nothing currently makes true. The manifest schema
    .context-circuit/wrapper/contracts/schemas/grounding-manifest.yaml already
    fixes environment to the two values [ready, no-toolchain] and describes ready
    as "a toolchain was detected and prepared". cc_execution_begin (2530-2534)
    calls cc_discover_repo_grounding and already knows how to turn a failure
    there into status blocked with blocked_reason GROUNDING_DISCOVERY_FAILED.
    cc_pair_begin (1305) calls neither hardening nor grounding at all. The
    existing test test/grounding/test-grounding.sh asserts `environment: ready`
    from nothing more than an empty package-lock.json placed in a fixture repo
    (its line writing `{ "name": "widgets" }`), and separately calls
    cc_harden_worktree directly - both assertions change meaning under this plan
    and must be reworked, not deleted. engine.sh is POSIX sh, dash-safe, with no
    existing network call, no PATH probe, and no notion of a per-ecosystem
    command anywhere.
  constraints:
    - POSIX sh only, dash-safe. No local, no arrays, no bashisms.
    - The keep-or-install decision is made from lockfile content, never from
      guessing at an install tree's freshness. A cloned tree with no recorded
      provenance and a differing lockfile is always a mismatch.
    - The toolchain table is a runtime constant keyed by the detected lockfile
      or manifest. No per-repository profile, no config file, no plan.yaml
      field (INV-GROUND-01).
    - Greenfield - no lockfile and no manifest - stays no-toolchain and installs
      nothing.
    - environment ready is emitted only after overlay and, when a toolchain
      exists, after the worktree can run that toolchain. A detected lockfile
      alone is never ready.
    - A provisioning failure blocks setup - a blocked execution with a stable
      reason and no assembled brief, or a pair-begin failure with no pointer,
      branch, or worktree left behind.
    - The frozen install may use the network, but the acceptance suite must not.
      Every branch is proved offline.
    - The runtime emits data, never prompt text (INV-RUNTIME-01), and records no
      credential or provider payload (INV-SEC-01). Install output is not
      captured into any workspace record.
    - No workaround is documented in the brief - hardening eliminates it
      (INV-GROUND-03). Do not add a verify-deps flag, a shared install tree, or
      a --no-verify escape.
    - Preserve unrelated and dirty work; run the semantic acceptance suite after
      meaningful phases; commit only on explicit human request, with no AI
      attribution (INV-COMMIT-01).
  decisions:
    - Matching is decided by lockfile content digest, not by inspecting the
      install tree. cc_digest of the source checkout's on-disk lockfile is
      compared with cc_digest of the worktree's lockfile, and the runtime writes
      a small stamp inside the prepared install tree recording the digest it was
      provisioned from. The stamp is authoritative when present; the source
      lockfile digest is the first-run fallback; absence plus a differing
      lockfile is a mismatch. This is correct even for cc-pair, where the
      checkout may be dirty, because the on-disk lockfile is exactly what the
      on-disk install tree was built from.
    - Every one of the 15 existing detection keys gets an explicit row - install
      tree plus frozen command, or "no per-worktree install tree, ready without
      installing" for ecosystems whose cache is global (go.mod, pom.xml,
      build.gradle, build.gradle.kts). No key falls through silently. The exact
      command strings are named in the task and flagged for the coordinator to
      confirm at plan review, because they ship to every template consumer and
      several ecosystems have more than one defensible frozen form.
    - The install command is invoked through one indirection point
      (cc_toolchain_install) so the acceptance suite can observe whether it ran
      without executing a package manager. That is a testability seam in the
      runtime, not a configuration hook - it reads no file and takes no flag.
    - When the table's command names a tool that is not on PATH, provisioning
      fails closed rather than degrading to ready. A tree nobody can run is not
      ready, and silently continuing is exactly the workaround INV-GROUND-03
      forbids.
    - environment keeps its two values, ready and no-toolchain. A third value
      would let a caller treat "prepared" and "detected" as different kinds of
      ready; the contract wants failure to block, not to be reported as a state.
    - cc_pair_begin provisions inline and emits environment on stdout only. No
      grounding manifest and no new pointer field: an Explore session stays a
      light pointer, not an execution record (INV-PAIR-01).
knowledge_impact:
  expected_context_units:
    - repository-grounding
    - plan-execution
    - direct-collaboration
  review_on_completion: true
tasks:
  - id: TC-001
    title: Add the toolchain table and the lockfile-match decision
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
    evidence_anchors:
      - .context-circuit/wrapper/runtime/engine.sh
    depends_on: []
    changes:
      - Add cc_toolchain_row KEY, a runtime-constant table printing
        `tree: <relative install dir or ->` and `install: <frozen command or ->`
        for each of the 15 keys cc_harden_worktree already detects, preserving
        that detection order so behavior stays deterministic.
      - Populate node ecosystems with node_modules plus the frozen form for each
        manager (npm ci; pnpm install --frozen-lockfile; yarn install
        --immutable; bun install --frozen-lockfile), the python ecosystems with
        their virtualenv-scoped frozen installs, composer.lock with vendor plus
        composer install, Cargo.lock with a locked fetch, and Gemfile.lock with
        a frozen bundle install. Give go.mod, pom.xml, build.gradle, and
        build.gradle.kts the explicit no-per-worktree-tree row. Mark the exact
        strings for confirmation at plan review in a comment above the table.
      - Add cc_toolchain_stamp_path TREE and the stamp read/write helpers, where
        the stamp is a single-line file holding the lockfile digest the tree was
        provisioned from, written inside the install tree so 0039's overlay
        carries it along.
      - Add cc_toolchain_matches SRC WORKTREE KEY, returning success when the
        stamp inside the worktree's install tree equals cc_digest of the
        worktree's lockfile, or - with no stamp - when cc_digest of the source
        checkout's lockfile equals cc_digest of the worktree's lockfile and the
        install tree is present and non-empty. Any other case is a mismatch.
    acceptance:
      - id: TC-AC-TABLE-TOTAL
        statement: >
          Every lockfile or manifest key the runtime detects has an explicit
          table row - an install tree plus a frozen install command, or an
          explicit no-per-worktree-install-tree outcome. No key is unhandled.
      - id: TC-AC-MATCH-BY-LOCKFILE
        statement: >
          A cloned install tree is reported as matching only when the lockfile
          content it was provisioned from equals this worktree's lockfile
          content; an unstamped tree beside a differing lockfile never matches.
    verification:
      - id: TC-VT-001
        command: sh test/worktree/test-provision.sh
      - id: TC-VT-002
        command: grep -q 'cc_toolchain_row()' .context-circuit/wrapper/runtime/engine.sh && grep -q 'cc_toolchain_matches()' .context-circuit/wrapper/runtime/engine.sh
      - id: TC-VT-003
        command: for k in package-lock.json pnpm-lock.yaml yarn.lock bun.lockb bun.lock go.mod Cargo.lock Gemfile.lock requirements.txt poetry.lock composer.lock pom.xml build.gradle build.gradle.kts; do sh .context-circuit/wrapper/runtime/engine.sh toolchain-row "$k" | grep -q '^tree: ' || exit 1; done
  - id: TC-002
    title: Provision the worktree, and only then report ready
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
    evidence_anchors:
      - .context-circuit/wrapper/runtime/engine.sh
      - .context-circuit/wrapper/contracts/schemas/grounding-manifest.yaml
    depends_on:
      - TC-001
    changes:
      - Add cc_toolchain_install WORKTREE KEY as the single point that runs a
        table command inside the worktree. It refuses when the command's first
        word is not on PATH (cc_fail TOOLCHAIN_TOOL_MISSING), fails
        TOOLCHAIN_INSTALL_FAILED on a non-zero exit, and captures no output into
        any workspace record.
      - Add cc_provision_worktree SRC WORKTREE, which detects the key in the
        existing order, returns no-toolchain when none is found, keeps the tree
        and writes/refreshes the stamp when cc_toolchain_matches succeeds, and
        otherwise removes the stale install tree, runs cc_toolchain_install, and
        writes the stamp. Emit `toolchain: <key>`, `provision: kept|installed|
        none`, and `environment: ready`.
      - Rewrite cc_harden_worktree to take the source checkout as well as the
        worktree and to delegate to cc_provision_worktree, so it emits ready
        only after preparation succeeded and propagates the failure otherwise.
        Keep its existing emission keys and detection order; update the function
        comment, which today says provisioning is a later phase.
      - Update cc_discover_repo_grounding to pass the source checkout through,
        and to fail rather than defaulting the environment line when hardening
        fails - the current `|| cc_dg_env=no-toolchain` fallback (engine.sh
        1706) would otherwise turn a provisioning failure into a cheerful
        manifest.
      - Add `toolchain-row`, `toolchain-provision`, and the updated
        `harden-worktree` entries to the cc_main dispatch.
    acceptance:
      - id: TC-AC-RUNNABLE
        statement: >
          When the worktree has a toolchain lockfile or manifest with a
          per-worktree install tree, that tree is present and built from this
          worktree's lockfile before anyone is attached, so the repository's
          normal commands run without the worker installing anything.
      - id: TC-AC-LOCKFILE-CORRECT
        statement: >
          A cloned install tree is kept when it matches this worktree's
          lockfile, and replaced by a frozen install from the worktree's own
          lockfile when it does not.
      - id: TC-AC-HONEST-READY
        statement: >
          environment ready is emitted only after preparation succeeded.
          Detecting a lockfile without a prepared tree never reports ready.
      - id: TC-AC-GREENFIELD
        statement: >
          A repository with no lockfile and no manifest reports no-toolchain,
          installs nothing, and does not block.
    verification:
      - id: TC-VT-004
        command: sh test/worktree/test-provision.sh
      - id: TC-VT-005
        command: sh test/grounding/test-grounding.sh
      - id: TC-VT-006
        command: grep -q 'cc_provision_worktree()' .context-circuit/wrapper/runtime/engine.sh && ! grep -q 'full provisioning is a later phase' .context-circuit/wrapper/runtime/engine.sh
      - id: TC-VT-007
        command: grep -q 'TOOLCHAIN_TOOL_MISSING' .context-circuit/wrapper/runtime/engine.sh && grep -q 'TOOLCHAIN_INSTALL_FAILED' .context-circuit/wrapper/runtime/engine.sh
  - id: TC-003
    title: Block execution and Explore setup when provisioning fails
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
    evidence_anchors:
      - .context-circuit/wrapper/runtime/engine.sh
    depends_on:
      - TC-002
    changes:
      - In cc_execution_begin, run provisioning as part of the existing
        grounding step for each affected repository and, on failure, set status
        blocked with blocked_reason TOOLCHAIN_PROVISION_FAILED using the same
        shape as the current GROUNDING_DISCOVERY_FAILED path, so no brief is
        assembled and no worker is attached.
      - In cc_pair_begin, run cc_provision_worktree after 0039's overlay and
        before the pointer is written; on failure remove the just-created
        worktree and branch and fail PAIR_TOOLCHAIN_PROVISION_FAILED, leaving no
        resumable session. Emit `environment:` on pair-begin stdout only.
      - Leave the worker-brief environment text alone in this plan - it already
        claims dependencies are provisioned, and becomes true here. Plan 0041
        owns re-reading and, if needed, re-wording it.
    acceptance:
      - id: TC-AC-EXEC-FAIL-CLOSED
        statement: >
          A provisioning failure records the execution blocked with a stable
          reason and prevents brief assembly, rather than attaching a worker to
          a tree that cannot run.
      - id: TC-AC-EXPLORE-FAIL-CLOSED
        statement: >
          A provisioning failure in pair-begin leaves no pointer, no branch, and
          no worktree, and reports a stable reason.
      - id: TC-AC-EXPLORE-READY
        statement: >
          A successful Explore setup reports its prepared environment on
          pair-begin output while the pairing pointer keeps exactly its five
          fields.
    verification:
      - id: TC-VT-008
        command: sh test/worktree/test-provision.sh
      - id: TC-VT-009
        command: sh test/execution/test-execution.sh
      - id: TC-VT-010
        command: sh test/pairing/test-pairing.sh
      - id: TC-VT-011
        command: grep -q 'TOOLCHAIN_PROVISION_FAILED' .context-circuit/wrapper/runtime/engine.sh && grep -q 'PAIR_TOOLCHAIN_PROVISION_FAILED' .context-circuit/wrapper/runtime/engine.sh
  - id: TC-004
    title: Prove keep, install, skip, and fail-closed without a network
    repositories: [context-circuit-source]
    paths:
      - test/worktree/test-provision.sh
      - test/grounding/test-grounding.sh
      - test/acceptance.sh
      - test/lib/fixture.sh
    evidence_anchors:
      - test/grounding/test-grounding.sh
      - test/lib/fixture.sh
      - test/acceptance.sh
    depends_on:
      - TC-003
    changes:
      - Add test/worktree/test-provision.sh in the house pattern, covering the
        keep path (an overlaid install tree plus an identical lockfile digest -
        assert provision kept, environment ready, and that no install command
        ran), the install path (a changed lockfile in the worktree - assert
        provision installed and the stamp now records the worktree's digest),
        the no-install-tree path (a go.mod fixture - assert environment ready
        with nothing installed), and the greenfield path (no lockfile - assert
        no-toolchain).
      - Cover fail-closed by giving a fixture a lockfile whose table command
        names a tool absent from PATH, then asserting the execution is blocked
        with the stable reason, no brief exists, and pair-begin leaves no
        pointer, branch, or worktree.
      - Rework the two assertions in test/grounding/test-grounding.sh that today
        derive `environment: ready` from an empty package-lock.json placeholder
        and from a direct cc_harden_worktree call, so they exercise the prepared
        meaning instead of the detected one. Keep every other assertion in that
        suite intact.
      - Add whatever fixture helper the above needs to test/lib/fixture.sh
        (a repository with a lockfile plus a pre-built install tree and stamp),
        reusing 0039's ignored-content helper rather than duplicating it.
      - Wire test/worktree/test-provision.sh into test/acceptance.sh beside the
        overlay suite.
    acceptance:
      - id: TC-AC-PROVEN
        statement: >
          The semantic acceptance suite fails if a matching install tree stops
          being kept, a mismatching one stops being replaced, a greenfield
          repository starts installing, ready is emitted without preparation, or
          a provisioning failure stops blocking setup.
      - id: TC-AC-OFFLINE
        statement: >
          Every branch is proved with no network access and without any package
          manager being installed on the machine running the suite.
    verification:
      - id: TC-VT-012
        command: sh test/worktree/test-provision.sh
      - id: TC-VT-013
        command: grep -qF 'test/worktree/test-provision.sh' test/acceptance.sh
      - id: TC-VT-014
        command: sh test/grounding/test-grounding.sh
      - id: TC-VT-015
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
