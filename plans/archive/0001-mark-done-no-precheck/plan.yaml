schema_version: 3
plan: 0001-mark-done-no-precheck
intent: i016-mark-done-no-precheck
title: Lock in mark-done without an agent pre-check
status: draft
objective: Make mark-done's no-pre-check rule explicit for one or several named plans, and prove the runtime readiness refusal stays intact.
repositories:
  - id: context-circuit-source
    purpose: Owns the cc-complete skill, coordinator instructions, and the
      completion runtime verb/gate.
plan_dependencies: []
product_knowledge:
  - id: completion
    path: context/domains/completion/README.md
    reason: >-
      Owning domain for mark-done; already documents completion-ready as the
      sole gate and that verification/candidate-acceptance/delivery never
      mark a plan done — the plan must preserve this and only make the
      no-pre-check behavior explicit and proven.
context_grounding:
  summary: >-
    Traced against the real code (intent/i016-mark-done-no-precheck/trace/context-circuit-source.yaml):
    .agents/skills/cc-complete/SKILL.md and agents/coordinator.md already
    describe calling plan-complete directly with no pre-check step, and
    wrapper/runtime/engine.sh's cc_plan_complete/cc_completion_ready already
    implement the runtime-only readiness gate. No separate pre-check code
    exists to remove. The work is to make the no-pre-check rule explicit and
    unambiguous in the agent-facing instructions (including the several-named-
    plans case) and to add verification proving no pre-check language exists
    and that the runtime refusal path is unchanged.
  constraints:
    - Do not weaken or change cc_completion_ready or its refusal codes.
    - Do not change what triggers mark-done (still an explicit human ask).
    - Do not change verification, candidate acceptance, or delivery so any of
      them mark a plan done.
    - Do not change in-place Product Knowledge reconcile after mark-done.
  decisions:
    - One plan, one bounded task: this is a single coherent instruction
      clarification and proof task in one repository, one worker lifecycle,
      one independent verification boundary. The tracer's task_partition
      proposed exactly this shape (task_partition: one-plan).
knowledge_impact:
  expected_context_units:
    - completion
  review_on_completion: true
tasks:
  - id: MDP-001
    title: Make no-pre-check explicit for one or several named plans
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-complete/SKILL.md
      - agents/coordinator.md
      - test/acceptance.sh
      - test/completion/
    depends_on: []
    changes:
      - >-
        In .agents/skills/cc-complete/SKILL.md, state explicitly that on a
        mark-done ask the agent does not inspect, verify, or otherwise check
        that the named plan's work or evidence exist before calling
        plan-complete; readiness is decided only by the runtime
        completion-ready gate.
      - >-
        State explicitly that naming several plans in one ask marks each
        named plan done via the same direct plan-complete call, with no
        added inspection step for any of them individually or as a batch.
      - >-
        Confirm/align agents/coordinator.md so it does not describe or imply
        an agent-side inspection step before mark-done.
      - >-
        Add or extend acceptance-suite coverage proving (a) no pre-check
        language remains in the cc-complete skill or coordinator
        instructions, (b) completion-ready's refusal codes/paths are
        unchanged, and (c) marking several named plans done in one ask
        follows the same direct path as one plan.
    acceptance:
      - id: MDP-AC-001
        statement: >-
          Asking to mark a plan done, or several named plans done, marks
          each named plan done without an agent step that inspects whether
          that plan's work or evidence exist (AC-NO-PRECHECK).
      - id: MDP-AC-002
        statement: >-
          If a named plan is not ready to be done, mark-done refuses and
          that is reported plainly, with no separate agent-side look at
          work or evidence (AC-RUNTIME-REFUSES).
      - id: MDP-AC-003
        statement: >-
          A plan still becomes done only on an explicit mark-done ask;
          verification, candidate acceptance, and delivery do not mark it
          done (AC-STILL-EXPLICIT).
    verification:
      - id: MDP-VT-001
        command: >-
          grep -rniE 'inspect.*work|check.*work|verify.*work|evidence.*before.*done'
          .agents/skills/cc-complete/ agents/coordinator.md
      - id: MDP-VT-002
        command: >-
          grep -n 'cc_completion_ready\|cc_plan_complete' wrapper/runtime/engine.sh
      - id: MDP-VT-003
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
