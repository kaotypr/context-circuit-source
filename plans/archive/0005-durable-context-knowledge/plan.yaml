schema_version: 3
plan: 0005-durable-context-knowledge
intent: i019-durable-context-knowledge
title: Make context hold only durable product knowledge
status: draft
objective: Live context files, the blank seed, and every path that writes them hold only durable product knowledge. They never name a plan, an intent file, or a sources file. DECISIONS.md records the knowledge change, not files.
repositories:
  - id: context-circuit-source
    purpose: >
      Owns the Product Knowledge contract, gather and mark-done writing
      paths, live context/, and the blank context seed.
plan_dependencies: []
product_knowledge:
  - id: completion
    path: context/domains/completion/README.md
    reason: >
      Owns mark-done reconcile of live context files. That write path must
      follow the durable-only rule; when knowledge is written does not change.
  - id: conventions
    path: context/CONVENTIONS.md
    reason: >
      Currently tells agents to name exact source files and record
      provenance in context. That conflicts with the approved rule.
  - id: sources
    path: context/SOURCES.md
    reason: >
      Currently records sources paths in live context. Must become a concept
      page with no sources path.
  - id: decisions
    path: context/DECISIONS.md
    reason: >
      Currently records proposals, file-edit lists, and particular intent
      and sources artifacts. Must record the knowledge change only.
  - id: index
    path: context/INDEX.md
    reason: >
      Retrieval catalog; currently points at context/sources.yaml as
      provenance rules.
context_grounding:
  summary: >
    Grounded in intent/i019-durable-context-knowledge/trace/context-circuit-source.yaml
    at HEAD 4245a80. Twenty-six live context files carry sixty-eight
    plans/|intent/|sources/ path-citation lines, plus provenance footnotes
    and a DECISIONS.md history style that cites proposals and file edits.
    The writing-path owners (INV-KNOWLEDGE-01/02, product-knowledge.md,
    WORKFLOW.md, coordinator, cc-complete, domain-context template) do not
    state the durable-only rule. template/context/ still teaches
    path-bearing provenance. One repository, one write-rule plus rewrite
    plus proof, one independent verification surface.
  constraints:
    - The durable-only writing rule lives with Product Knowledge
      conventions and the knowledge invariants, not as a skill-only copy.
    - Linking between durable context units remains allowed.
    - Invariant IDs and shipped contract or adapter paths may still be named.
    - Do not change when knowledge is written (gather and mark-done still
      write in place; delivery still does not).
    - Do not rewrite sources files, plan files, or intent files themselves.
    - Explaining the product concepts plan, intent, and sources remains
      allowed.
    - Preserve unrelated and dirty work; run the semantic acceptance suite
      after meaningful phases.
  decisions:
    - One plan with five ordered tasks in this repository. The contract,
      writing paths, live rewrite, seed, and tests share one verification
      surface (path-citation checks plus acceptance.sh). Stacked plans
      would invent false independence: a seed-only change would leave live
      context teaching the old habit, and a rewrite-only change would leave
      the next gather reintroducing citations.
    - Keep generic product-layout notation in domain pages
      (plans/<id>/, intent/<id>/INTENT.md) as concept. Strip particular
      artifact ids (intent/iNNN-..., plans/NNNN-..., plans/context-circuit-plans)
      and every sources path, including sources/system-design/... and the
      path sources/.
    - context/sources.yaml must not name a sources path. Keep it as a
      comment-free empty catalog (sources: []) so workspace identity and
      the release seed still have a file to point at. INDEX and SOURCES.md
      stop treating it as a place that records sources paths. Same for
      template/context/sources.yaml.
    - context-index provenance metadata must not mean a sources path. If
      the field remains, it is non-path (freshness or a durable context
      unit), not a sources file.
    - DECISIONS.md historical entries keep the durable decision substance
      (what became true) and drop proposal citations, file-edit lists, and
      particular plan/intent/sources artifacts. New entries follow that
      style. Domain Provenance footnotes that name a sources/ scan are
      removed; acceptance dates may stay.
knowledge_impact:
  expected_context_units:
    - conventions
    - sources
    - decisions
    - index
    - completion
  review_on_completion: true
tasks:
  - id: DCK-001
    title: Add the durable-only rule to the knowledge owners
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/contracts/invariants.yaml
      - .context-circuit/docs/product-knowledge.md
      - .context-circuit/wrapper/contracts/schemas/context-index.yaml
      - context/CONVENTIONS.md
    depends_on: []
    changes:
      - >
        Add to INV-KNOWLEDGE-01 (and the write side of INV-KNOWLEDGE-02)
        that live context holds only durable product knowledge and never
        names a plan, an intent file, or a sources file. Keep in-place
        reconcile after mark-done; runtime still never writes PK.
      - >
        State the same rule in product-knowledge.md, including that
        DECISIONS.md records the knowledge change, not files.
      - >
        Stop CONVENTIONS.md from requiring source-file paths to be
        recorded in context. Keep naming exact source files before a
        request-scoped read; that read stays outside context/.
      - >
        If context-index provenance currently means a sources path, stop
        that. The field may remain only as non-path metadata.
    acceptance:
      - id: DCK-AC-001
        statement: >
          The knowledge invariants and product-knowledge doc state that
          live context is durable-only and never names a plan, an intent
          file, or a sources file.
      - id: DCK-AC-002
        statement: >
          CONVENTIONS.md no longer requires recording a sources path in
          context. Index provenance does not mean a sources path.
    verification:
      - id: DCK-VT-001
        command: >
          rg -q 'durable' .context-circuit/wrapper/contracts/invariants.yaml
          && rg -q 'durable' .context-circuit/docs/product-knowledge.md
      - id: DCK-VT-002
        command: >
          ! rg -n 'record provenance' context/CONVENTIONS.md
  - id: DCK-002
    title: Teach gather and mark-done writes the durable-only rule
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/adapters/WORKFLOW.md
      - .context-circuit/agents/coordinator.md
      - .agents/skills/cc-complete/SKILL.md
      - .context-circuit/docs/templates/domain-context.md
    depends_on: [DCK-001]
    changes:
      - >
        Gather-context (WORKFLOW.md, coordinator) writes durable product
        knowledge only. It does not name a plan, an intent file, or a
        sources file, and it does not record sources paths in context.
      - >
        Mark-done reconcile (cc-complete, coordinator) follows the same
        rule, including DECISIONS.md as knowledge-not-files. When
        knowledge is written does not change.
      - >
        The domain-context template drops a Provenance section that lists
        selected sources files or keeps raw text in sources/.
    acceptance:
      - id: DCK-AC-003
        statement: >
          Every path that generates or updates context files states the
          durable-only rule.
    verification:
      - id: DCK-VT-003
        command: >
          rg -q 'durable' .context-circuit/agents/coordinator.md
          && rg -q 'durable' .context-circuit/wrapper/adapters/WORKFLOW.md
          && rg -q 'durable' .agents/skills/cc-complete/SKILL.md
          && ! rg -n 'keeping raw text in `sources/`' .context-circuit/docs/templates/domain-context.md
  - id: DCK-003
    title: Rewrite live context so none of it names an ephemeral file
    repositories: [context-circuit-source]
    paths:
      - context/
    depends_on: [DCK-001]
    changes:
      - >
        Rewrite every live context file that names a plan, an intent
        file, or a sources file so only durable product knowledge
        remains. Keep concept explanations. Keep generic layout notation
        plans/<id>/ and intent/<id>/.... Strip particular artifact ids
        and every sources path.
      - >
        Rewrite DECISIONS.md entries so each records what became true
        about the product, not proposal citations, file-edit lists, or
        particular plan/intent/sources artifacts.
      - >
        Rewrite SOURCES.md as the sources concept (passive, request-scoped,
        named by the user) with no sources path. Stop INDEX from pointing
        at context/sources.yaml as a provenance-path catalog.
      - >
        Keep context/sources.yaml as a comment-free empty catalog
        (sources: []). It must not name a sources path.
    acceptance:
      - id: DCK-AC-004
        statement: >
          No live context file names a plan, an intent file, or a sources
          file, including context/sources.yaml.
      - id: DCK-AC-005
        statement: >
          DECISIONS.md records durable product-knowledge decisions, not
          file edits and not the artifacts the change came from.
      - id: DCK-AC-006
        statement: >
          Product Knowledge still explains the product concepts plan,
          intent, and sources.
    verification:
      - id: DCK-VT-004
        command: >
          test $(rg -l 'sources/|context/sources\.yaml|intent/i[0-9]{3}-|plans/context-circuit-plans|sources/system-design/' context/ | wc -l | tr -d ' ') -eq 0
      - id: DCK-VT-005
        command: >
          ! rg -n 'Accepted from proposal|context/proposals/' context/DECISIONS.md
      - id: DCK-VT-006
        command: >
          rg -q 'Gate 1|first-class intent' context/domains/intent/README.md
          && rg -q 'archive|restore' context/domains/plan-organization/README.md
          && rg -q 'passive|read only when named' context/SOURCES.md
  - id: DCK-004
    title: Align the blank context seed with the durable-only rule
    repositories: [context-circuit-source]
    paths:
      - template/context/SOURCES.md
      - template/context/sources.yaml
      - template/context/DECISIONS.md
      - template/context/INDEX.md
      - workspace.yaml
      - scripts/release-manifest.txt
    depends_on: [DCK-001, DCK-002]
    changes:
      - >
        Rewrite template/context/ so a new workspace does not teach
        path-bearing provenance or decisions that reference plans.
      - >
        Keep template/context/sources.yaml as a comment-free empty
        catalog if the release allowlist still requires the file.
        workspace.yaml may still point at context/sources.yaml; that
        pointer is not a context file naming a sources path.
    acceptance:
      - id: DCK-AC-007
        statement: >
          The blank context seed does not name a plan, an intent file, or
          a sources file, and it tells agents that DECISIONS records the
          knowledge change, not files.
    verification:
      - id: DCK-VT-007
        command: >
          test $(rg -l 'sources/|intent/i[0-9]{3}-|plans/context-circuit-plans|sources/system-design/' template/context/ | wc -l | tr -d ' ') -eq 0
          && rg -q 'durable' template/context/DECISIONS.md
  - id: DCK-005
    title: Prove live context cannot depend on an ephemeral file
    repositories: [context-circuit-source]
    paths:
      - test/contracts/test-contracts.sh
      - test/
    depends_on: [DCK-002, DCK-003, DCK-004]
    changes:
      - >
        Stop test/contracts/test-contracts.sh from requiring
        intent/<id>/detail/ and sources/system-design/ paths in live
        domain pages. Keep concept-level assertions.
      - >
        Add semantic checks that fail if live context or the blank seed
        names a banned path, if DECISIONS.md cites proposals, or if a
        writing-path owner omits the durable-only rule.
      - >
        Run the semantic acceptance suite after those updates.
    acceptance:
      - id: DCK-AC-008
        statement: >
          Checks fail if live context or the blank seed names a plan, an
          intent file, or a sources file, or if DECISIONS.md records
          proposal citations instead of the knowledge change.
    verification:
      - id: DCK-VT-008
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
