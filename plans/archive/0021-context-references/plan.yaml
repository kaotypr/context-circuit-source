schema_version: 2
plan: 0021-context-references
title: External-service reference knowledge category (context/references/)
status: done
objective: >-
  Give Product Knowledge a defined, correctly named home for reference knowledge
  about external services the workspace consumes but does not own, by
  introducing a first-class plural context/references/ category - registered in
  the layout index and stated once in the conventions - without a core contract
  bump or a new index-metadata field.
repositories:
  - id: context-circuit-source
    purpose: Hosts the context/ layout index, conventions, and the blank template seed.
plan_dependencies:
  - id: 0003-context-lifecycle
    reason: Owns the context/ Product Knowledge layer this category extends.
product_knowledge:
  - id: conventions
    path: context/CONVENTIONS.md
    reason: States the owned-vs-external rule and where each kind of knowledge lives.
  - id: context-index
    path: wrapper/contracts/schemas/context-index.yaml
    reason: The retrieval-catalog shape, confirmed unchanged by the directory approach.
context_grounding:
  summary: >-
    Knowledge the workspace owns is organized by concept under domains/ and
    scoped by the repositories index field; an external service it consumes but
    does not own is neither, so it needs its own category. A wrapper repo's own
    behavior stays in domains/; the third-party service goes under references/.
  constraints:
    - references/ is plural, per the collection-directory convention (domains/, roles/, proposals/).
    - Owned knowledge is unchanged; a wrapper/gateway repo stays in domains/ tagged by repositories.
    - No core contract bump; the context-index schema is not changed.
    - The directory need not exist empty; it is created when the first service is documented.
  decisions:
    - Formalize the instinct the agent already had (a reference folder), not a new tagging scheme.
    - Defer an external_services index-metadata field and the wrapper->service binding link.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: CTXREF-001
    title: Register the references category in the layout and conventions
    repositories: [context-circuit-source]
    paths:
      - context/INDEX.md
      - context/CONVENTIONS.md
      - template/context/INDEX.md
      - template/context/CONVENTIONS.md
    depends_on: []
    changes:
      - Add the external-references route (context/references/) to the layout index and the template seed.
      - State the owned-vs-external convention once in the conventions and the seed.
    acceptance:
      - id: CTXREF-AC-01
        statement: The layout index and its template seed list the external-references route.
      - id: CTXREF-AC-02
        statement: The conventions state that external-service knowledge lives under references/ while a wrapper repo's own knowledge stays in domains/ tagged by repositories.
    verification:
      - id: CTXREF-VT-01
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
