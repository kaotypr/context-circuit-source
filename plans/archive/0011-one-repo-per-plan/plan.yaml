schema_version: 3
plan: 0011-one-repo-per-plan
intent: i009-one-repo-per-plan
title: One plan, one repository, one worker
status: draft
objective: >-
  A plan maps to exactly one repository and is executed by one worker who
  changes only that repository. An approved intent whose scope covers two or
  more repositories must derive at least one plan per repository.
repositories:
  - id: context-circuit-source
    purpose: Owns tracing, planning, and execution contracts for worker and repository bounds.
plan_dependencies: []
product_knowledge:
  - id: tracing
    path: context/domains/tracing/README.md
    reason: Owns task_partition and stacked-plan derivation.
  - id: plan-execution
    path: context/domains/plan-execution/README.md
    reason: Currently allows one worker across mapped repositories; this plan tightens that boundary.
  - id: plan-authorization
    path: context/domains/plan-authorization/README.md
    reason: One intent may still authorize several plans with no second gate.
  - id: architecture
    path: context/ARCHITECTURE.md
    reason: States the current one-worker-across-repos execution model.
context_grounding:
  summary: >-
    Derived from the approved i009 contract without a tracer, at explicit
    human request. This replaces the current one-worker-across-mapped-
    repositories execution boundary with one worker, one repository, per plan.
  constraints:
    - No second human approval of the derived plans.
    - Plan count is not a proxy for assurance tier.
    - Delivery may still present more than one finished plan as one pull request.
  decisions:
    - Keep one plan with three sequential tasks. The rule, the split, and the proof share one execution and verification boundary in this source repository.
knowledge_impact:
  expected_context_units:
    - tracing
    - plan-execution
    - plan-authorization
  review_on_completion: true
tasks:
  - id: ORP-001
    title: Make the one-repository rule the rule
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/
      - context/domains/plan-execution/
      - context/domains/tracing/
      - context/ARCHITECTURE.md
      - docs/
    depends_on: []
    changes:
      - Replace the one-worker-across-all-mapped-repositories execution boundary with one worker, one repository, per plan. A plan that lists two or more repositories is invalid.
    acceptance:
      - id: ORP-AC-001
        statement: Every derived plan names exactly one repository; a plan that lists two or more repositories is invalid.
      - id: ORP-AC-002
        statement: The worker for a plan changes only that plan's repository.
    verification:
      - id: ORP-VT-001
        command: rg -n 'one repository|one worker|mapped repositories|INV-EXEC-02' wrapper/contracts/invariants.yaml context/domains/plan-execution/README.md context/ARCHITECTURE.md
  - id: ORP-002
    title: Split a two-repository intent into two plans
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-trace/
      - .agents/skills/cc-plan/
      - agents/coordinator.md
      - agents/tracer.md
      - context/domains/tracing/
    depends_on:
      - ORP-001
    changes:
      - When tracing an intent whose scope covers two repositories, derive at least two plans, one per repository, with plan_dependencies when one depends on the other.
    acceptance:
      - id: ORP-AC-003
        statement: An intent whose scope covers two repositories produces at least two plans, one per repository, with explicit ordering when one depends on the other.
      - id: ORP-AC-004
        statement: The split remains derived from the approved intent and the tracer; it does not add a second human approval.
      - id: ORP-AC-005
        statement: Finished per-repository plans can still be delivered together later.
    verification:
      - id: ORP-VT-002
        command: rg -n 'one repository|stacked|plan_dependencies|task_partition' .agents/skills/cc-trace/SKILL.md .agents/skills/cc-plan/SKILL.md context/domains/tracing/README.md
  - id: ORP-003
    title: Prove the split
    repositories: [context-circuit-source]
    paths:
      - test/
    depends_on:
      - ORP-002
    changes:
      - Add coverage that fails if one plan or one worker is asked to change two repositories.
    acceptance:
      - id: ORP-AC-001
        statement: A two-repository intent cannot collapse into one plan or one worker.
    verification:
      - id: ORP-VT-003
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
