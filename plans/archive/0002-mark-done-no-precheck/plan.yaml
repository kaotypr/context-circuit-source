schema_version: 3
plan: 0002-mark-done-no-precheck
intent: i016-mark-done-no-precheck
title: Flip plan status on ask, with no check
status: done
objective: When a human asks to mark a plan done, or several plans done, each named plan's status becomes done with no look at work or evidence and no unreadiness refusal.
repositories:
  - id: context-circuit-source
    purpose: >
      Owns the completion contract, mark-done verb, coordinator packet, and
      Product Knowledge that currently gate draft → done on unreadiness.
plan_dependencies: []
product_knowledge:
  - id: completion
    path: context/domains/completion/README.md
    reason: >
      Owning domain for mark-done. Today it still gates draft → done on a
      verified latest execution and completion-ready. This plan rewrites that
      domain so asking flips status with no look, while keeping explicit
      mark-done, Explore planless, and in-place reconcile after a successful
      flip.
  - id: assurance
    path: context/domains/assurance/README.md
    reason: >
      Documents the verifier floor as enforced inside completion-ready at
      mark-done. The floor stays at intent-approve and verifier spawn; it
      must stop being a complete gate.
  - id: verification
    path: context/domains/verification/README.md
    reason: >
      Verification must still not change plan status (AC-STILL-EXPLICIT).
  - id: delivery
    path: context/domains/delivery/README.md
    reason: >
      Delivery must still not mark a plan done and must not start Product
      Knowledge reconcile (AC-STILL-EXPLICIT).
context_grounding:
  summary: >
    Grounded in intent/i016-mark-done-no-precheck/trace/context-circuit-source.yaml
    at HEAD a128cdd. The unreadiness gate is real and layered: INV-COMPLETE-01
    requires a candidate-bound independent pass before mark-done; completion.yaml
    preconditions and required evidence fields refuse never-built plans;
    cc_plan_complete calls cc_completion_ready and fails COMPLETION_NO_EXECUTION;
    cc_completion_finalize still refuses missing acceptor/revision/candidate;
    cc-complete tells the coordinator not to change status when failed, blocked,
    or stale. Verification, candidate acceptance, delivery-record,
    change-set-complete, and completion-infer already do not mark done and must
    stay that way. An earlier archived derivation of this intent (0001) treated
    the runtime refusal as something to keep; this plan follows the approved
    contract instead and removes that refusal.
  constraints:
    - Update the owning completion contract so mark-done no longer requires a
      readiness gate; do not leave a skill-only exception that the runtime still
      refuses.
    - The same mark-done path applies to one named plan and to several named
      plans in one ask (loop the existing one-plan verb).
    - Do not mark a plan done without an explicit human ask.
    - Do not change verification, candidate acceptance, or delivery so any of
      them mark a plan done.
    - Do not change in-place Product Knowledge reconcile after mark-done.
    - Explore stays planless; keep COMPLETION_EXPLORE_PLANLESS.
    - Preserve unrelated and dirty work; run the semantic acceptance suite
      after meaningful phases.
  decisions:
    - One plan with four ordered tasks in this repository. Contract, runtime,
      skill/PK, and tests share one mark-done verb, one worker lifecycle, and
      one independent verification surface. A skill-only change would leave
      the engine refusing; an engine-only change would leave the contract and
      cc-complete teaching a look. Stacked plans would invent false
      independence.
    - When there is no execution, acceptor, candidate, or revision, still flip
      draft → done. Write a full completion.yaml only when those files exist;
      never let a missing or sparse record block the status change.
    - Keep completion-ready as a read-only eligibility query for the verifier
      floor and candidate honesty. Disconnect it from plan-complete. Stop
      saying it refuses to complete.
    - Several named plans in one ask: loop existing plan-complete per id. No
      new multi-plan engine verb.
    - Already-done stays a status-machine refusal (COMPLETION_PLAN_NOT_OPEN),
      not unreadiness of work. Explore-tier executions stay refused.
knowledge_impact:
  expected_context_units:
    - completion
    - assurance
  review_on_completion: true
tasks:
  - id: UGD-001
    title: Drop the unreadiness floor from the completion contract
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/invariants.yaml
      - wrapper/contracts/schemas/completion.yaml
      - wrapper/contracts/schemas/plan.yaml
    depends_on: []
    changes:
      - >
        Rewrite INV-COMPLETE-01 so Standard and Critical become done only on
        explicit mark-done, with no completion-ready / candidate-bound
        independent-pass floor on that flip. Keep Explore planless, and keep
        verification, candidate acceptance, and delivery from marking done.
      - >
        Rewrite INV-COMPLETE-02 so the status change is not preconditioned on
        a fully populated implementation record. Keep in-place Product
        Knowledge reconcile after mark-done when the plan affected knowledge;
        delivery still does not start reconcile or mark done.
      - >
        Decouple INV-CANDIDATE-01 and INV-ASSURE-01 from mark-done: stale or
        missing evidence still voids verify/deliver, and the verifier floor
        still holds at intent-approve and verifier spawn, but completion-ready
        must no longer be described as refusing to complete.
      - >
        Drop completion-ready and candidate-bound evidence as preconditions
        of completion.yaml. Evidence fields must not be required for the
        status flip. Keep explicit human mark-done and the non_effects that
        verify/accept/delivery never perform this transition.
      - >
        Rewrite plan.yaml's draft → done note: explicit mark-done only; no
        inferred-from-acceptance-plus-delivery language; no readiness or
        evidence precondition.
    acceptance:
      - id: UGD-AC-001
        statement: >
          The owning completion contract no longer requires a readiness or
          evidence look before mark-done can succeed.
      - id: UGD-AC-002
        statement: >
          Verification, candidate acceptance, and delivery still do not mark
          a plan done in the contract.
    verification:
      - id: UGD-VT-001
        command: >
          rg -n 'completion-ready refuses to complete|Completion-ready enforces
          the tier floor' wrapper/contracts/invariants.yaml; test $? -ne 0
      - id: UGD-VT-002
        command: >
          rg -n 'inferred from candidate acceptance' wrapper/contracts/schemas/plan.yaml;
          test $? -ne 0
  - id: UGD-002
    title: Ungate plan-complete so asking flips status
    repositories: [context-circuit-source]
    paths:
      - wrapper/runtime/engine.sh
    depends_on: [UGD-001]
    changes:
      - >
        cc_plan_complete no longer looks up a latest execution as a
        requirement, no longer calls cc_completion_ready, and no longer fails
        COMPLETION_NO_EXECUTION, COMPLETION_BLOCKED, COMPLETION_NOT_VERIFIED,
        COMPLETION_CANDIDATE_STALE, or COMPLETION_NO_ACCEPTANCE. A never-built
        Standard/Critical draft becomes done when asked.
      - >
        Keep COMPLETION_EXPLORE_PLANLESS when the named plan's execution is
        Explore. Keep COMPLETION_PLAN_NOT_OPEN for a non-draft plan.
      - >
        cc_completion_finalize must not refuse missing candidate_id,
        plan_revision, or acceptor. Flip status with cc_plan_set_status and
        upsert the index even when those files are absent. Write a full
        completion.yaml only when the evidence files exist.
      - >
        Leave cc_completion_ready as a query. Leave cc_delivery_record,
        cc_change_set_complete, cc_human_acceptance_record, and
        cc_completion_infer not setting plan status done
        (completion-infer still COMPLETION_INFER_REQUIRES_EXPLICIT).
      - >
        Keep one PLAN argument. Several named plans are the same verb looped
        by the skill.
    acceptance:
      - id: UGD-AC-003
        statement: >
          Asking to mark a never-built, failed, unverified, stale, or
          unaccepted plan done changes that plan's status to done.
      - id: UGD-AC-004
        statement: >
          Delivery, candidate acceptance, change-set complete, and inferred
          completion still do not set plan status done. Explore stays
          planless.
    verification:
      - id: UGD-VT-003
        command: >
          awk '/^cc_plan_complete\(\)/,/^}/' wrapper/runtime/engine.sh |
          grep -E 'cc_completion_ready|COMPLETION_BLOCKED|COMPLETION_NO_EXECUTION|COMPLETION_NOT_VERIFIED|COMPLETION_CANDIDATE_STALE|COMPLETION_NO_ACCEPTANCE';
          test $? -ne 0
      - id: UGD-VT-004
        command: >
          awk '/^cc_delivery_record\(\)/,/^}/' wrapper/runtime/engine.sh |
          grep -q cc_plan_set_status; test $? -ne 0;
          awk '/^cc_change_set_complete\(\)/,/^}/' wrapper/runtime/engine.sh |
          grep -q cc_plan_set_status; test $? -ne 0;
          awk '/^cc_completion_infer\(\)/,/^}/' wrapper/runtime/engine.sh |
          grep -q COMPLETION_INFER_REQUIRES_EXPLICIT
  - id: UGD-003
    title: Stop teaching a look before mark-done
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-complete/SKILL.md
      - .agents/skills/cc-execute/SKILL.md
      - agents/coordinator.md
      - context/domains/completion/README.md
      - context/domains/assurance/README.md
    depends_on: [UGD-002]
    changes:
      - >
        Rewrite cc-complete: on an explicit mark-done ask for one named plan
        or several in one ask, run plan-complete for each named plan with no
        look at work or evidence and no unreadiness refusal. Drop "Mark a
        verified plan done", the completion-ready precheck, and "if failed
        or blocked or stale, do not change status". Keep: delivery,
        candidate acceptance, and verification do not mark done; Explore is
        planless; in-place Product Knowledge reconcile happens after a
        successful flip when the plan affected knowledge.
      - >
        In cc-execute, stop naming completion-ready as a mark-done gate.
        Keep that plans are not auto-completed and that verification never
        marks the plan done.
      - >
        In the coordinator, keep routing mark-complete to cc-complete. Add
        that several named plans in one ask use the same path with no
        unreadiness look, including never-built / failed / no-evidence
        plans.
      - >
        Rewrite the completion domain so draft → done is ungated on ask.
        Keep explicit mark-done, Explore planless, verify/accept/delivery
        never complete, and reconcile-after-mark-done.
      - >
        Rewrite the assurance domain so the verifier floor is not taught as
        a complete gate via completion-ready. Keep the floor at
        intent-approve and verifier spawn.
    acceptance:
      - id: UGD-AC-005
        statement: >
          Agent instructions and Product Knowledge no longer refuse or
          inspect before flipping status on a mark-done ask, including for
          several named plans.
      - id: UGD-AC-006
        statement: >
          Agent instructions still say verification, candidate acceptance,
          and delivery do not mark a plan done, Explore is planless, and
          knowledge update after mark-done stays as it is.
    verification:
      - id: UGD-VT-005
        command: >
          rg -n 'refuses unless|do not change status|completion-ready'
          .agents/skills/cc-complete/SKILL.md; test $? -ne 0
      - id: UGD-VT-006
        command: >
          rg -n 'completion-ready refuses|gated on a verified latest execution|flips
          Standard or Critical `draft → done` when `completion-ready`'
          context/domains/completion/README.md context/domains/assurance/README.md;
          test $? -ne 0
  - id: UGD-004
    title: Invert unreadiness tests; keep verify-and-deliver-are-not-done
    repositories: [context-circuit-source]
    paths:
      - test/completion/test-completion.sh
      - test/completion/test-inferred.sh
      - test/runtime/test-runtime.sh
      - test/assurance/test-tier.sh
      - test/candidate/test-candidate.sh
      - agent-harness/conversations/plots/stale-candidate-refuse-complete.md
      - agent-harness/scenarios/17-stale-candidate-requires-reverification/case.yaml
    depends_on: [UGD-003]
    changes:
      - >
        Invert test/completion/test-completion.sh so plan-complete succeeds
        on an unverified execution, a failed execution, a never-built draft
        (no execution), and a draft with no human-acceptance. Keep the happy
        path that explicit plan-complete after ready still sets done and may
        still write completion.yaml when evidence exists. Cover two named
        drafts each becoming done via the same plan-complete path.
      - >
        Invert the stale-candidate block in test/completion/test-inferred.sh
        so an extra post-verify commit does not prevent plan-complete from
        setting done. Keep every assertion that acceptance, delivery-record,
        completion-infer, and change-set-complete do not mark done.
      - >
        Invert test/runtime/test-runtime.sh "failed execution cannot
        complete". Keep the happy path that verify is not done until
        plan-complete.
      - >
        Keep test/assurance and test/candidate completion-ready assertions
        as query tests if that verb remains. Do not add expect_failure
        plan-complete there. Optionally add plan-complete succeeding on a
        stale candidate.
      - >
        Rewrite plot stale-candidate-refuse-complete and harness case 17 so
        asking to mark complete on stale evidence flips status to done.
        Rewrite the conflicting "leave it pending" follow-up. Regenerate
        the generated case from the plot; do not hand-edit it as source of
        truth. Keep plots that prove verify ≠ done and delivery ≠ done.
    acceptance:
      - id: UGD-AC-007
        statement: >
          Semantic tests prove mark-done succeeds with no execution, failed
          execution, missing acceptance, and stale candidate, and that two
          named plans each become done on the same path.
      - id: UGD-AC-008
        statement: >
          Semantic tests still prove verification, candidate acceptance,
          delivery, inferred completion, and change-set complete do not mark
          a plan done.
    verification:
      - id: UGD-VT-007
        command: sh test/completion/test-completion.sh
      - id: UGD-VT-008
        command: sh test/completion/test-inferred.sh
      - id: UGD-VT-009
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
