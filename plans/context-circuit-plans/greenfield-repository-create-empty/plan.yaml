schema_version: 2
id: greenfield-repository-create-empty
number: CC-007
title: Explicit greenfield repository creation
status: draft
repository: context-circuit-source
source: sources/wrapper-action-cost-and-integrity-prd.md
product_knowledge:
  - context/ARCHITECTURE.md
  - context/CONVENTIONS.md
  - context/DECISIONS.md
  - docs/configuration.md
  - docs/gates.md
  - wrapper/contracts/invariants.yaml
  - wrapper/contracts/routes.yaml
  - wrapper/contracts/schemas/workspace.yaml
objective: >-
  Give an accepted greenfield workspace an explicit, confirmed way to create
  and bind an empty local Git repository without allowing execute-plan to
  provision product Git or weakening the existing clone/bootstrap boundary.
scope:
  - repository-create-empty route, context, card, and confirmation
  - bounded destination and existing-path validation
  - empty Git repository initialization and host-local binding
  - shared repository registration through canonical projection operations
  - execute preflight guidance, recovery, security, release, and semantic tests
non_goals:
  - changing or replacing repository-bootstrap clone behavior
  - creating a repository during execute-plan
  - creating a remote repository, pushing, publishing, or storing credentials
  - requiring the instantiated wrapper workspace itself to be a Git repository
dependencies:
  - repository-bootstrap
  - workspace-projection-and-gate-effects
tasks:
  - id: GRE-001
    title: Define the create-empty action and confirmation contract
    path: tasks/001-contracts-and-route.md
  - id: GRE-002
    title: Create and bind an empty repository safely
    path: tasks/002-engine-and-binding.md
  - id: GRE-003
    title: Verify recovery, security, release, and compatibility
    path: tasks/003-verification.md
acceptance:
  - id: GRE-AC-01
    outcome: >-
      An accepted workspace with no usable repository can select a distinct
      repository-create-empty action that presents the exact logical key,
      destination, branch, existing-path result, and immediate effects.
  - id: GRE-AC-02
    outcome: >-
      Only current explicit confirmation may create the destination, initialize
      an empty Git repository, write its host-local binding, and register its
      credential-free shared identity.
  - id: GRE-AC-03
    outcome: >-
      Existing paths, traversal, unsafe symlinks, incomplete fields, ambiguous
      ownership, and partial initialization fail without overwrite,
      substitution, credential access, or hidden scanning.
  - id: GRE-AC-04
    outcome: >-
      execute-plan never clones, creates, or initializes a product repository;
      it proceeds only after the resulting binding is valid and the source is
      clean.
  - id: GRE-AC-05
    outcome: >-
      Repository creation updates shared projections atomically, preserves the
      ignored local-binding boundary, and remains resumable after interruption.
  - id: GRE-AC-06
    outcome: >-
      Existing repository-bootstrap, external binding, worktree isolation,
      upgrade, and release behavior remains unchanged.
verification:
  - id: GRE-VT-01
    command: sh test/contracts/test-contracts.sh
    proves: The new action, effect, shared identity, and local-binding fields have canonical owners.
  - id: GRE-VT-02
    command: sh test/routing/test-router.sh
    proves: Greenfield requests route to a distinct gated action and execute names the correct blocker.
  - id: GRE-VT-03
    command: sh test/ownership/test-ownership.sh
    proves: Created repositories remain clean bound sources and execution writes only isolated worktrees.
  - id: GRE-VT-04
    command: sh test/recovery/test-recovery.sh
    proves: Interrupted creation and binding fail or resume without partial authoritative state.
  - id: GRE-VT-05
    command: sh test/security/test-boundaries.sh
    proves: Destination, symlink, credential, existing-path, and external-activity boundaries fail safely.
  - id: GRE-VT-06
    command: sh test/upgrades/test-upgrades.sh
    proves: Upgrade and rollback preserve created repositories and local bindings.
  - id: GRE-VT-07
    command: sh test/release/test-release.sh
    proves: Created repositories and bindings never enter the released artifact.
  - id: GRE-VT-08
    command: sh test/acceptance.sh
    proves: Complete semantic acceptance after greenfield repository integration.
human_gates:
  - plan-approval
  - repository-create-empty
  - execution-trigger
  - delivery
  - publication
  - cleanup
created_at: 2026-08-22T18:30:00Z
updated_at: 2026-08-22T18:30:00Z
