schema_version: 2
id: verification-evidence-layers
number: CC-010
title: Acceptance evidence-layer enforcement
status: draft
repository: context-circuit-source
source: sources/wrapper-action-cost-and-integrity-prd.md
product_knowledge:
  - context/ARCHITECTURE.md
  - context/CONVENTIONS.md
  - context/DECISIONS.md
  - docs/planning.md
  - docs/runtime-contract.md
  - docs/host-capabilities.md
  - wrapper/contracts/invariants.yaml
  - wrapper/contracts/schemas/plan.yaml
  - wrapper/contracts/schemas/task.yaml
  - wrapper/contracts/schemas/delegation.yaml
  - wrapper/contracts/schemas/completion.yaml
objective: >-
  Require every acceptance criterion to name the evidence layer it promises
  and prevent independent verification from passing on weaker evidence, while
  recording unavailable host capability as an explicit limitation or waiver
  rather than false success.
scope:
  - evidence-layer vocabulary for schema, store, API, process, browser, and human checks
  - plan, task, delegation, handoff, and completion mappings
  - verifier comparison of required and observed evidence layers
  - explicit capability limitation and waiver evidence
  - compatibility, documentation, host, security, and semantic tests
non_goals:
  - embedding a browser, provider SDK, model API, or host automation framework
  - allowing a waiver to count as verification success
  - weakening independent verification or allowing the verifier to repair
  - retroactively inventing evidence for completed plans
dependencies:
  - multi-host-agent-support
  - engine-owned-runtime-records
tasks:
  - id: VEL-001
    title: Define evidence-layer contracts and compatibility
    path: tasks/001-contracts.md
  - id: VEL-002
    title: Enforce required layers in verifier evidence
    path: tasks/002-verifier-enforcement.md
  - id: VEL-003
    title: Verify host limitations, migration, and semantic behavior
    path: tasks/003-verification.md
acceptance:
  - id: VEL-AC-01
    outcome: >-
      Every new acceptance criterion declares one required evidence layer from
      schema, store, API, process, browser, or human, and every verification
      mapping declares the layer it actually produces.
  - id: VEL-AC-02
    outcome: >-
      Delegation and completion validation reject a verification mapping whose
      observed evidence is weaker than the criterion's required layer.
  - id: VEL-AC-03
    outcome: >-
      A build, schema check, text assertion, or process smoke cannot prove a
      browser or human interaction criterion.
  - id: VEL-AC-04
    outcome: >-
      Missing host capability is recorded provider-neutrally as unavailable,
      host-blocked, or an explicit human-visible waiver and is never converted
      into a verifier pass.
  - id: VEL-AC-05
    outcome: >-
      The verifier remains read-only, treats writer evidence as a claim, and
      reports failed, blocked, waived, and passed criteria distinctly without
      repairing implementation.
  - id: VEL-AC-06
    outcome: >-
      Legacy plans remain readable; unfinished legacy work must acquire an
      explicit evidence-layer mapping before new verification, while completed
      historical evidence is not rewritten.
  - id: VEL-AC-07
    outcome: >-
      Release, upgrade, host, security, and complete semantic suites preserve
      credential-free and provider-payload-free evidence boundaries.
verification:
  - id: VEL-VT-01
    command: sh test/contracts/test-contracts.sh
    proves: Evidence-layer enums, mappings, schemas, and compatibility rules have canonical owners.
  - id: VEL-VT-02
    command: sh test/runtime/test-runtime.sh
    proves: Delegation, handoff, and completion reject missing or weaker observed evidence.
  - id: VEL-VT-03
    command: sh test/hosts/test-host-adapters.sh
    proves: Host capability limitations and waivers remain provider-neutral and never become false passes.
  - id: VEL-VT-04
    command: sh test/security/test-boundaries.sh
    proves: Evidence records exclude credentials, provider payloads, transcripts, and unauthorized external activity.
  - id: VEL-VT-05
    command: sh test/upgrades/test-upgrades.sh
    proves: Legacy plans and evidence remain readable with explicit mapping required for future verification.
  - id: VEL-VT-06
    command: sh test/release/test-release.sh
    proves: Evidence-layer contracts and verifier guidance ship without maintainer or runtime evidence.
  - id: VEL-VT-07
    command: sh test/acceptance.sh
    proves: Complete semantic acceptance after evidence-layer enforcement.
human_gates:
  - plan-approval
  - execution-trigger
  - delivery
  - publication
  - cleanup
created_at: 2026-08-22T18:30:00Z
updated_at: 2026-08-22T18:30:00Z
