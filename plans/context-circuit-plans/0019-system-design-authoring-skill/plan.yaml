schema_version: 2
plan: 0019-system-design-authoring-skill
title: cc-system-design authoring skill
status: done
objective: >-
  Ship a skill that teaches an agent to author and structure a system design as
  source material - location, the three-tier layout, detail-per-file altitude,
  and scope-by-concern separation - adding no lifecycle, status, gate, or runtime.
repositories:
  - id: context-circuit-source
    purpose: Hosts the cc-system-design skill and its release-allowlist wiring.
plan_dependencies:
  - id: 0010-release-assembly-and-publication
    reason: The skill ships via the release allowlist and assembler wiring.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: The skill is a read-as-procedure packet under INV-SKILL-01.
  - id: conventions
    path: context/CONVENTIONS.md
    reason: The system-design layout and altitude conventions it teaches.
context_grounding:
  summary: >-
    A system design is one kind of source, not a lifecycle stage; the skill owns
    the authoring rubric and adds no engine function, schema, or WORKFLOW action.
  constraints:
    - Purely skill-invoked; no WORKFLOW action and no first-class design/ area.
    - Adds no runtime, schema, invariant, or plan.yaml field.
    - Ships only at .agents/skills/cc-system-design/SKILL.md (INV-SKILL-01).
  decisions:
    - The skill points authors at this repo's own sources/system-design as the reference.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: SDA-001
    title: Author the skill and wire the release allowlist
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-system-design/SKILL.md
      - scripts/release-manifest.txt
      - scripts/release-artifact.sh
      - test/release/test-release.sh
      - test/contracts/test-contracts.sh
    depends_on: []
    changes:
      - Author the rubric (location, three-tier layout, altitude, scope-by-concern).
      - Add the skill to the release manifest, assembler allowlist, and tests.
    acceptance:
      - id: SDA-AC-01
        statement: The skill body carries the layout, altitude, and scope-separation rubric.
      - id: SDA-AC-02
        statement: The skill is shipped in the template and resolved only by path.
    verification:
      - id: SDA-VT-01
        command: sh test/release/test-release.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
