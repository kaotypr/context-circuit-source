schema_version: 2
plan: 0009-delivery
title: Delivery boundary
status: done
objective: >-
  Keep pull-request creation, merge, push, and deployment as separate
  human-requested actions that use each execution branch as source and the
  repository's recorded anchor branch as target, blocking rather than inferring a
  remote.
repositories:
  - id: context-circuit-source
    purpose: Hosts the delivery boundary in the workflow and the cc-deliver skill.
plan_dependencies:
  - id: 0005-approval-and-execution
    reason: Delivery opens a pull request from the execution branches it produced.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: INV-DELIVER-01/02 apply here.
  - id: decisions
    path: context/DECISIONS.md
    reason: Delivery is a separate explicit action, never inferred.
context_grounding:
  summary: >-
    A pull request sources each execution branch and targets the recorded
    anchor_branch; it never substitutes default_branch or follows a moving remote.
  constraints:
    - PR/merge/push/deploy are separate human-requested actions (INV-DELIVER-01).
    - Target is the recorded anchor_branch, never default_branch (INV-DELIVER-01).
    - Delivery blocks when source/provider/target is unavailable (INV-DELIVER-02).
  decisions:
    - The runtime never performs automatic push/merge/publish (INV-RUNTIME-01).
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: DEL-001
    title: Delivery boundary and anchor-targeted pull request
    repositories: [context-circuit-source]
    paths:
      - wrapper/adapters/WORKFLOW.md
      - wrapper/runtime/engine.sh
    depends_on: []
    changes:
      - Define delivery as a separate explicit action in the workflow contract.
      - Compute source (execution branch) and target (anchor_branch) for a PR.
      - Block and report when a source, provider, or target is unavailable.
    acceptance:
      - id: DEL-AC-01
        statement: A pull request targets the recorded anchor branch, never default_branch.
      - id: DEL-AC-02
        statement: Missing source/provider/target blocks delivery instead of inferring a remote.
    verification:
      - id: DEL-VT-01
        command: sh test/delivery/test-delivery.sh
  - id: DEL-002
    title: Author the cc-deliver skill
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-deliver/SKILL.md
    depends_on: [DEL-001]
    changes:
      - Map "open a pull request", "merge", and "push" language to explicit delivery.
    acceptance:
      - id: DEL-AC-03
        statement: Each delivery verb is a distinct explicit action, never a side effect.
    verification:
      - id: DEL-VT-02
        command: sh test/delivery/test-delivery.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
