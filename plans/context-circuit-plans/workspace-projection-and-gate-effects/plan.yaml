schema_version: 2
id: workspace-projection-and-gate-effects
number: CC-006
title: Atomic workspace projections and explicit gate effects
status: draft
repository: context-circuit-source
source: sources/wrapper-action-cost-and-integrity-prd.md
product_knowledge:
  - context/ARCHITECTURE.md
  - context/CONVENTIONS.md
  - context/DECISIONS.md
  - wrapper/contracts/invariants.yaml
  - wrapper/contracts/routes.yaml
  - wrapper/contracts/schemas/workspace.yaml
  - docs/gates.md
objective: >-
  Make workspace.yaml the enforceable source for human-facing identity
  projections and make every consequential gate declare the immediate and
  later effects it presents, so confirmation cannot silently invent fields or
  leave workspace summaries inconsistent.
scope:
  - canonical projection fields and validation for workspace identity summaries
  - atomic rendering of context/WORKSPACE.md, context/PROJECT.md, and context/INDEX.md
  - canonical immediate-effect and later-effect declarations for human gates
  - rejection of omitted confirmation fields and undeclared delegated effects
  - repository-registration integration, migration, documentation, and semantic tests
non_goals:
  - creating or cloning a product repository
  - changing the plan lifecycle or weakening any existing human gate
  - generating runtime session, receipt, delegation, or completion records
  - implementing evidence-layer verification or host-specific UI state
dependencies:
  - repository-bootstrap
tasks:
  - id: WPE-001
    title: Define projection and gate-effect contracts
    path: tasks/001-contracts.md
  - id: WPE-002
    title: Render and validate projections atomically
    path: tasks/002-engine-and-gates.md
  - id: WPE-003
    title: Integrate migration, documentation, and semantic verification
    path: tasks/003-verification.md
acceptance:
  - id: WPE-AC-01
    outcome: >-
      workspace.yaml remains canonical and one engine operation atomically
      renders or validates WORKSPACE.md, PROJECT.md, and INDEX.md without
      changing accepted identity implicitly.
  - id: WPE-AC-02
    outcome: >-
      Entry and write preflight fail with a stable projection-mismatch result
      when any required workspace summary disagrees with workspace.yaml.
  - id: WPE-AC-03
    outcome: >-
      Every consequential card distinguishes effects of the current
      confirmation from effects that require a later authorized action, using
      fields owned by the canonical route and gate contracts.
  - id: WPE-AC-04
    outcome: >-
      Every field affected by confirmation is either displayed with its value
      or rejected as incomplete, and delegated effects outside approved intent
      fail before a child starts.
  - id: WPE-AC-05
    outcome: >-
      Registering a logical repository updates all shared identity projections
      in the same operation while machine-specific paths remain only in
      repositories.local.yaml.
  - id: WPE-AC-06
    outcome: >-
      Existing initialization, approval, repository-bootstrap, execution,
      delivery, and release behavior remains gated and contract-valid.
verification:
  - id: WPE-VT-01
    command: sh test/contracts/test-contracts.sh
    proves: Projection fields, effect ownership, schemas, and repository identity remain canonical.
  - id: WPE-VT-02
    command: sh test/gates/test-gates.sh
    proves: Gate cards expose complete immediate and later effects without weakening confirmation.
  - id: WPE-VT-03
    command: sh test/routing/test-router.sh
    proves: Projection mismatch and incomplete effects fail through canonical route outcomes.
  - id: WPE-VT-04
    command: sh test/recovery/test-recovery.sh
    proves: Interrupted projection updates do not publish partial workspace summaries.
  - id: WPE-VT-05
    command: sh test/upgrades/test-upgrades.sh
    proves: Upgrade and rollback preserve mutable workspace identity and safely migrate projection rules.
  - id: WPE-VT-06
    command: sh test/release/test-release.sh
    proves: The blank seed and released wrapper contain the projection contract without maintainer state.
  - id: WPE-VT-07
    command: sh test/acceptance.sh
    proves: Complete semantic acceptance after projection and gate-effect integration.
human_gates:
  - plan-approval
  - execution-trigger
  - delivery
  - publication
  - cleanup
created_at: 2026-08-22T18:30:00Z
updated_at: 2026-08-22T18:30:00Z
