schema_version: 2
id: workspace-projection-and-gate-effects
number: CC-006
title: Bounded identity projections and explicit gate effects
status: done
repository: context-circuit-source
source: sources/wrapper-action-cost-and-integrity-prd.md
product_knowledge:
  - context/ARCHITECTURE.md
  - context/CONVENTIONS.md
  - context/DECISIONS.md
  - wrapper/contracts/invariants.yaml
  - wrapper/contracts/routes.yaml
  - wrapper/contracts/schemas/workspace.yaml
  - docs/gates.md
  - docs/getting-started.md
objective: >-
  Keep workspace.yaml as the canonical workspace identifier and context/ as
  Product Knowledge, while a bounded identity projection in WORKSPACE.md,
  PROJECT.md, and INDEX.md must agree with that identifier, and every
  consequential gate must display proposed defaults and separate immediate
  effects from later authorized effects.
scope:
  - canonical identity fields in workspace.yaml, including displayed
    identity-acceptance defaults for mode, repositories or project items,
    roles, and default branches
  - one contract-owned delimited identity region in WORKSPACE.md, PROJECT.md,
    and INDEX.md; authored Product Knowledge outside that region is preserved
  - atomic render and validation of only that identity region
  - identity-acceptance and repository-registration card templates
  - canonical immediate-effect and later-effect identifiers on existing
    route and gate owners
  - displayed proposed defaults for omitted confirmation fields
  - repository-registration updates to shared identity and identity regions
  - migration, documentation, and semantic tests
non_goals:
  - generating or replacing Product Knowledge from workspace.yaml
  - creating or cloning a product repository
  - activating repository-create-empty
  - changing the plan lifecycle or weakening any existing human gate
  - generating runtime session, receipt, delegation, or completion records
  - implementing evidence-layer verification or host-specific UI state
  - adding a second effect-policy owner
dependencies:
  - repository-bootstrap
tasks:
  - id: WPE-001
    title: Define identity-projection and gate-effect contracts
    path: tasks/001-contracts.md
  - id: WPE-002
    title: Render identity regions and present complete gate cards
    path: tasks/002-engine-and-gates.md
  - id: WPE-003
    title: Integrate migration, documentation, and semantic verification
    path: tasks/003-verification.md
acceptance:
  - id: WPE-AC-01
    outcome: >-
      workspace.yaml remains canonical identity metadata and one engine
      operation atomically renders or validates only the bounded identity
      region in WORKSPACE.md, PROJECT.md, and INDEX.md without rewriting
      authored Product Knowledge or changing accepted identity implicitly.
  - id: WPE-AC-02
    outcome: >-
      Entry and write preflight fail with a stable projection-mismatch result
      when the bounded identity region in any required summary disagrees with
      workspace.yaml.
  - id: WPE-AC-03
    outcome: >-
      Every consequential card distinguishes effects of the current
      confirmation from effects that require a later authorized action, using
      the locked effect identifiers owned by the canonical route and gate
      contracts.
  - id: WPE-AC-04
    outcome: >-
      Omitted confirmation fields are shown as proposed defaults on the
      current card and confirmation records those displayed values; fields
      with no default remain incomplete and reject; no field is invented
      after confirmation; delegated effects outside approved intent fail
      before a child starts.
  - id: WPE-AC-05
    outcome: >-
      Registering a logical repository updates workspace.yaml shared identity
      and the bounded identity region in all three summaries in the same
      operation while machine-specific paths remain only in
      repositories.local.yaml.
  - id: WPE-AC-06
    outcome: >-
      Existing initialization, identity-acceptance, approval,
      repository-bootstrap, execution, delivery, and release behavior remains
      gated and contract-valid.
verification:
  - id: WPE-VT-01
    command: sh test/contracts/test-contracts.sh
    proves: Identity-projection fields, effect identifiers, schemas, and repository identity remain canonical.
  - id: WPE-VT-02
    command: sh test/gates/test-gates.sh
    proves: Identity-acceptance, repository-registration, and other cards expose defaults plus immediate and later effects without weakening confirmation.
  - id: WPE-VT-03
    command: sh test/routing/test-router.sh
    proves: Projection mismatch and incomplete effects fail through canonical route outcomes.
  - id: WPE-VT-04
    command: sh test/recovery/test-recovery.sh
    proves: Interrupted identity-region updates do not publish partial regions or leave summaries disagreeing.
  - id: WPE-VT-05
    command: sh test/upgrades/test-upgrades.sh
    proves: Upgrade and rollback preserve authored Product Knowledge and accepted identity while inserting or restoring the identity region.
  - id: WPE-VT-06
    command: sh test/release/test-release.sh
    proves: The blank seed and released wrapper contain the projection contract without maintainer state.
  - id: WPE-VT-07
    command: sh test/acceptance.sh
    proves: Complete semantic acceptance after identity-projection and gate-effect integration.
human_gates:
  - plan-approval
  - execution-trigger
  - delivery
  - publication
  - cleanup
created_at: 2026-08-22T18:30:00Z
updated_at: 2026-08-22T19:15:00Z
