schema_version: 2
plan: 0006-verification-and-repair
title: Independent verification and repair
status: done
objective: >-
  Add one independent, read-only verifier that checks the latest commit of every
  affected repository, and a bounded repair loop that routes failures back to the
  same worker as new commits, stopping after three failures.
repositories:
  - id: context-circuit-source
    purpose: Hosts the verifier role, runtime result enforcement, and cc-verify.
plan_dependencies:
  - id: 0005-approval-and-execution
    reason: There must be committed work to verify and a worker to repair it.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: INV-VERIFY-01/02 and INV-REPAIR-01 apply here.
  - id: architecture
    path: context/ARCHITECTURE.md
    reason: Verifier is a separate read-only actor.
  - id: decisions
    path: context/DECISIONS.md
    reason: No verifier means blocked; never self-verify.
context_grounding:
  summary: >-
    The verifier inspects latest commits and replays acceptance evidence,
    strictly read-only; without an independent verifier the execution is blocked.
  constraints:
    - The verifier never edits product files, repairs, or self-verifies (INV-VERIFY-01).
    - No independent verifier means host-blocked, not self-verification (INV-VERIFY-02).
    - The failure counter increments per rejection and stops at three (INV-REPAIR-01).
  decisions:
    - The initial implementation counts as attempt one.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: VER-001
    title: Verifier-result schema, verifier role, read-only enforcement
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/schemas/verifier-result.yaml
      - agents/verifier.md
      - wrapper/runtime/engine.sh
    depends_on: []
    changes:
      - Author the verifier-result record shape (passed/failed/blocked).
      - Define the independent read-only verifier role.
      - Enforce read-only at the runtime when recording a verifier result.
    acceptance:
      - id: VER-AC-01
        statement: The verifier is a separate actor and cannot modify product files.
      - id: VER-AC-02
        statement: A missing independent verifier yields a blocked execution.
    verification:
      - id: VER-VT-01
        command: sh test/execution/test-execution.sh
  - id: VER-002
    title: Repair loop and three-failure counter
    repositories: [context-circuit-source]
    paths:
      - wrapper/runtime/engine.sh
    depends_on: [VER-001]
    changes:
      - Route a failed verification to the same worker for a new commit.
      - Increment the failure counter per rejection and stop at three.
      - Distinguish a blocked execution from an invented worker failure.
    acceptance:
      - id: VER-AC-03
        statement: A repair is a new commit; execution stops preserving evidence at the third failure.
    verification:
      - id: VER-VT-02
        command: sh test/execution/test-execution.sh
  - id: VER-003
    title: Author the cc-verify skill
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-verify/SKILL.md
    depends_on: [VER-002]
    changes:
      - Author the procedure to prepare read-only access and launch the verifier.
    acceptance:
      - id: VER-AC-04
        statement: The skill launches an independent verifier and never self-verifies.
    verification:
      - id: VER-VT-03
        command: sh test/execution/test-execution.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
