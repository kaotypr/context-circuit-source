schema_version: 2
plan: 0014-run-stack-scheduling
title: "Run-stack scheduling, run action, and delivery drift guard"
status: done
objective: >-
  Add the deterministic readiness and scheduling loop that runs the ready plans
  of a stack, contains failures to the affected sub-tree, exposes the run-stack
  conversational action, and rebases-then-re-verifies a plan whose base drifted
  before it is delivered.
repositories:
  - id: context-circuit-source
    purpose: Hosts the scheduling runtime, cc-run-stack skill, and drift guard.
plan_dependencies:
  - id: 0013-run-stack-substrate
    reason: Consumes plan dependencies, leases, and execution bases.
  - id: 0006-verification-and-repair
    reason: The loop drives the worker/verifier/repair cycle per plan.
  - id: 0009-delivery
    reason: The drift guard extends the single-plan delivery boundary.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: INV-DELIVER-01 drift extension and the run_stack action apply here.
  - id: design-deltas
    path: context/DESIGN-DELTAS.md
    reason: Run-stack scheduling and drift-guard rationale.
context_grounding:
  summary: >-
    A plan becomes runnable when its dependencies are verified and its leases are
    free; the coordinator decides launch concurrency; delivery rebases a drifted
    base and re-verifies before the pull request opens.
  constraints:
    - The runtime detects readiness; the coordinator decides launch (INV-RUNTIME-01).
    - Each plan is still separately approved, verified, completed, and delivered.
    - A plan is never merged from a base that no longer reflects the anchor (INV-DELIVER-01).
  decisions:
    - Failure containment holds descendants of a failed plan without touching siblings.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: RSC-001
    title: Readiness, scheduling loop, and failure containment
    repositories: [context-circuit-source]
    paths:
      - wrapper/runtime/engine.sh
    depends_on: []
    changes:
      - Evaluate readiness (dependencies verified AND leases free).
      - Drive the ready set; hold descendants of a failed plan, spare siblings.
    acceptance:
      - id: RSC-AC-01
        statement: A plan runs only when its dependencies are verified and leases are free.
      - id: RSC-AC-02
        statement: A failed plan blocks only its descendants, not unrelated siblings.
    verification:
      - id: RSC-VT-01
        command: sh test/run-stack/test-run-stack.sh
  - id: RSC-002
    title: Run-stack action and cc-run-stack skill
    repositories: [context-circuit-source]
    paths:
      - wrapper/adapters/WORKFLOW.md
      - .agents/skills/cc-run-stack/SKILL.md
    depends_on: [RSC-001]
    changes:
      - Add the "run the ready stack / execute plans X..Z" conversational action.
      - Author the cc-run-stack read-as-procedure packet.
    acceptance:
      - id: RSC-AC-03
        statement: The run-stack action executes only already-approved plans.
    verification:
      - id: RSC-VT-02
        command: sh test/run-stack/test-run-stack.sh
  - id: RSC-003
    title: Delivery drift guard
    repositories: [context-circuit-source]
    paths:
      - wrapper/runtime/engine.sh
      - wrapper/adapters/WORKFLOW.md
    depends_on: [RSC-002]
    changes:
      - Detect base divergence when a sibling has already merged.
      - Rebase onto the current anchor tip and re-verify before opening the PR.
    acceptance:
      - id: RSC-AC-04
        statement: A drifted plan is rebased and re-verified before its pull request opens.
    verification:
      - id: RSC-VT-03
        command: sh test/delivery/test-delivery.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
