schema_version: 2
id: approval-gate-ux-performance
number: CC-004
title: Fast and explicit plan approval confirmation flow
status: approved
repository: context-circuit-source
source: repository-evidence
product_knowledge:
  - wrapper/contracts/routes.yaml
  - wrapper/contracts/invariants.yaml
  - wrapper/runtime/engine.sh
  - wrapper/adapters/README.md
  - wrapper/adapters/WORKFLOW.md
  - agents/coordinator.md
  - docs/gates.md
  - docs/planning.md
  - docs/routing.md
objective: >-
  Make plan approval feel immediate and unambiguous while preserving the
  session-bound confirmation gate, the separation between approval and
  execution, and status-only maintainer changes. The confirmed path must use
  one canonical transition and avoid avoidable formatting and verification
  churn.
scope:
  - approval request routing and confirmation-card wording
  - canonical confirmed approval transition and task-status projection
  - coordinator guidance for bounded approval handling
  - regression coverage for two-turn approval, no-op pre-confirmation, and
    status-only post-confirmation changes
  - clear final handoff language distinguishing approval from execution
  - semantic acceptance and independent review of the changed flow
non_goals:
  - removing or weakening explicit human confirmation
  - combining plan approval with execution, lease acquisition, or worktree creation
  - changing the canonical lifecycle, route owner, or ownership model
  - adding provider credentials, external calls, telemetry payloads, or UI state
  - modifying the prior session, its runtime state, or unrelated dirty files
dependencies: []
tasks:
  - id: AGF-001
    title: Clarify the approval card and two-stage human interaction
    path: tasks/001-approval-card.md
  - id: AGF-002
    title: Make confirmed approval a single bounded status transition
    path: tasks/002-bounded-transition.md
  - id: AGF-003
    title: Add regression coverage and complete independent acceptance
    path: tasks/003-verification.md
acceptance:
  - id: AGF-AC-01
    outcome: >-
      Approve plan <id> presents a current session-bound approval card,
      performs no mutation, and explicitly states that confirmation is still
      required.
  - id: AGF-AC-02
    outcome: >-
      Confirm approval of plan <id> changes only plan.yaml draft → approved
      and included task projections draft → ready, preserving task bodies,
      file endings, and unrelated working-tree changes.
  - id: AGF-AC-03
    outcome: >-
      The confirmed path invokes one canonical transition and one bounded
      verification phase; it does not create a worktree, claim a lease, start
      implementation, or repeat avoidable repair edits.
  - id: AGF-AC-04
    outcome: >-
      The final response clearly says that approval is complete but execution
      has not started, and names Run approved plan <id> as the separate next
      action.
  - id: AGF-AC-05
    outcome: >-
      Existing route, lifecycle, gate, host-adapter, ownership, and release
      acceptance suites continue to pass without adding a competing policy
      authority.
verification:
  - id: AGF-VT-01
    command: sh test/routing/test-router.sh
    proves: Initial and confirmed approval requests retain the canonical two-stage route and authorization states.
  - id: AGF-VT-02
    command: sh test/lifecycle/test-lifecycle.sh
    proves: Confirmation is required and plan/task lifecycle projections remain valid and idempotence-safe.
  - id: AGF-VT-03
    command: sh test/approval/test-approval-flow.sh
    proves: The approval transaction is two-turn, mutation-free before confirmation, status-only after confirmation, and formatting-preserving.
  - id: AGF-VT-04
    command: sh test/acceptance.sh
    proves: Complete semantic acceptance across contracts, routing, lifecycle, gates, ownership, hosts, recovery, security, and release boundaries.
human_gates:
  - plan-approval
  - execution-trigger
  - delivery
  - publication
  - cleanup
created_at: 2026-08-22T00:00:00Z
updated_at: 2026-08-22T00:00:00Z
