schema_version: 2
plan: 0005-approval-and-execution
title: Approval and multi-repository execution
status: done
objective: >-
  Add the explicit approval gate and the single-worker, deterministic execution
  that runs an approved plan across all mapped repositories in isolated
  worktrees, committing each repository before verification and preserving all
  evidence on failure or interruption.
repositories:
  - id: context-circuit-source
    purpose: Hosts the execution runtime, writer role, and cc-execute skill.
plan_dependencies:
  - id: 0004-planning
    reason: Executes only an approved plan produced by the planning contract.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: INV-APPROVE-01, INV-EXEC-01..04, INV-PRESERVE-01 apply here.
  - id: architecture
    path: context/ARCHITECTURE.md
    reason: Worker role and worktree isolation model.
  - id: decisions
    path: context/DECISIONS.md
    reason: Approval and execution are separate authorizations.
context_grounding:
  summary: >-
    Approval is a conversational gate with no confirmation card; execution
    creates one branch and worktree per repo from the captured anchor tip, holds
    one writer lock, snapshots the plan, and commits before verifying.
  constraints:
    - Only an approved plan may execute (INV-EXEC-01).
    - Branch cc/<plan-id>/<repo-id>; the anchor checkout is never written (INV-EXEC-03).
    - Commit before verify; repairs are new commits, never amendments (INV-EXEC-04).
    - Failed or interrupted work is preserved, never silently cleaned (INV-PRESERVE-01).
  decisions:
    - At most one active writer per execution via an atomic lock (INV-OWN-01).
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: EXE-001
    title: Approval gate and execution/handoff record schemas
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/schemas/execution.yaml
      - wrapper/contracts/schemas/worker-handoff.yaml
      - wrapper/runtime/engine.sh
    depends_on: []
    changes:
      - Implement plan-approve as an atomic draft->approved transition after checks.
      - Author execution and worker-handoff record shapes under .runtime/.
    acceptance:
      - id: EXE-AC-01
        statement: Approval changes status only after deterministic readiness checks, no card.
      - id: EXE-AC-02
        statement: An unapproved plan cannot begin execution.
    verification:
      - id: EXE-VT-01
        command: sh test/execution/test-execution.sh
  - id: EXE-002
    title: Execution-begin, worktrees, worker role, commit
    repositories: [context-circuit-source]
    paths:
      - wrapper/runtime/engine.sh
      - agents/writer.md
    depends_on: [EXE-001]
    changes:
      - Capture anchor tips (reject dirty), snapshot the plan, acquire the lock.
      - Create one branch and worktree per affected repository from the anchor tip.
      - Have the single worker implement tasks in order and commit each repository.
    acceptance:
      - id: EXE-AC-03
        statement: All work occurs in isolated worktrees; the anchor checkout is untouched.
      - id: EXE-AC-04
        statement: Every changed repository is committed before verification.
    verification:
      - id: EXE-VT-02
        command: sh test/execution/test-execution.sh
  - id: EXE-003
    title: Recovery, ownership, and preservation
    repositories: [context-circuit-source]
    paths:
      - wrapper/runtime/engine.sh
    depends_on: [EXE-002]
    changes:
      - Enforce the one-writer lock; a competing writer is read-only or blocked.
      - Provide recovery inspection and resume eligibility by revision + ownership.
      - Preserve branches, worktrees, commits, handoffs, and records on failure.
    acceptance:
      - id: EXE-AC-05
        statement: A live lock is never silently stolen by a competing writer.
      - id: EXE-AC-06
        statement: Interruption preserves all evidence and never cleans up silently.
    verification:
      - id: EXE-VT-03
        command: sh test/execution/test-execution.sh
  - id: EXE-004
    title: Author the cc-execute approve/execute/repair skill
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-execute/SKILL.md
    depends_on: [EXE-003]
    changes:
      - Map "approve", "execute", and "approve and execute" language to the gate + run.
      - Refuse to execute an unapproved plan.
    acceptance:
      - id: EXE-AC-07
        statement: "Approve and execute" is handled as two sequential explicit actions.
    verification:
      - id: EXE-VT-04
        command: sh test/execution/test-execution.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
