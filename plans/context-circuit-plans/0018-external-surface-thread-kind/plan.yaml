schema_version: 2
plan: 0018-external-surface-thread-kind
title: "External surface: the thread publication kind"
status: done
objective: >-
  Add a second publication kind on the same backbone: publish a plan's open
  questions to a chat discussion as a parent message plus one fully-described
  reply per question, with discussion-safe idempotency.
repositories:
  - id: context-circuit-source
    purpose: Hosts the thread record schema and the thread branch of cc-publish.
plan_dependencies:
  - id: 0017-external-surface-plan-kind
    reason: Adds a kind onto the existing cc-publish backbone and dispatch.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: Reuses INV-EXTERNAL-01/02/03 and INV-PLAN-04 (open questions).
  - id: design-deltas
    path: context/DESIGN-DELTAS.md
    reason: The thread-kind design on the shared backbone.
context_grounding:
  summary: >-
    The thread kind reads a plan's open questions, posts a parent message and one
    reply per question, and edits only its own messages, never human replies.
  constraints:
    - Reads only plan open questions (INV-PLAN-04); export-only (INV-EXTERNAL-02).
    - Idempotency edits only its own messages and appends for new questions.
    - It never touches or deletes a human reply or any other message.
  decisions:
    - Slack-first, ts-based record; other chat providers share the shape.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: THR-001
    title: Thread record schema and the thread kind in cc-publish
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/schemas/publication-thread-record.yaml
      - .agents/skills/cc-publish/SKILL.md
    depends_on: []
    changes:
      - Author the thread record shape keyed by thread and questions.
      - Add the thread-kind branch: parent message plus one reply per question.
      - Implement discussion-safe idempotency over its own messages only.
    acceptance:
      - id: THR-AC-01
        statement: Publishing a thread creates one parent and one reply per open question.
      - id: THR-AC-02
        statement: Re-publishing edits only its own messages and never a human reply.
    verification:
      - id: THR-VT-01
        command: sh test/external-surface/test-external-surface.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
