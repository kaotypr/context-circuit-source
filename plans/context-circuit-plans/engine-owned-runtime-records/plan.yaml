schema_version: 2
id: engine-owned-runtime-records
number: CC-009
title: Engine-owned runtime records and child packets
status: draft
repository: context-circuit-source
source: sources/wrapper-action-cost-and-integrity-prd.md
product_knowledge:
  - context/ARCHITECTURE.md
  - context/CONVENTIONS.md
  - context/DECISIONS.md
  - docs/runtime-contract.md
  - docs/host-capabilities.md
  - wrapper/contracts/invariants.yaml
  - wrapper/contracts/schemas/session.yaml
  - wrapper/contracts/schemas/context-receipt.yaml
  - wrapper/contracts/schemas/delegation.yaml
  - wrapper/contracts/schemas/completion.yaml
objective: >-
  Replace handmade runtime reconstruction with validated engine operations
  that atomically create sessions, receipts, delegations, child-start evidence,
  and completion records, while keeping the delegation packet as the only
  child scope and host capability as evidence only.
scope:
  - atomic constructors for root and child runtime records
  - engine-owned timestamps, versions, revisions, byte counts, and digests
  - ownership-graph and delegation validation before child launch
  - bounded child prompt projection and handoff skeleton
  - interruption, resume, migration, host, security, and semantic verification
non_goals:
  - implementing a scheduler, host CLI, model API, SDK, or provider transport
  - granting authorization through a validation token or host permission mode
  - changing plan approval, execution, finish, delivery, or cleanup gates
  - allowing a coordinator prompt to expand validated delegation scope
dependencies:
  - repository-bootstrap
  - multi-host-agent-support
  - route-context-packet-enforcement
tasks:
  - id: ERR-001
    title: Define atomic runtime record operations
    path: tasks/001-record-contracts.md
  - id: ERR-002
    title: Generate and validate the ownership graph
    path: tasks/002-engine-and-delegation.md
  - id: ERR-003
    title: Integrate lifecycle, resume, and host adapters
    path: tasks/003-lifecycle-and-hosts.md
  - id: ERR-004
    title: Verify interruption, compatibility, and release boundaries
    path: tasks/004-verification.md
acceptance:
  - id: ERR-AC-01
    outcome: >-
      Engine operations create schema-valid session, context-receipt,
      delegation, child-start, handoff skeleton, and completion records with
      real timestamps, versions, revisions, byte counts, and digests.
  - id: ERR-AC-02
    outcome: >-
      Every record is staged, validated, and atomically published; interruption
      leaves no partial record that can grant ownership, resume, verification,
      or completion eligibility.
  - id: ERR-AC-03
    outcome: >-
      A child cannot start until the engine validates session ancestry, lease,
      repository, worktree, host evidence, receipt, delegation scope, and
      expected handoff as one ownership graph.
  - id: ERR-AC-04
    outcome: >-
      The launch projection contains only role, assigned root, delegation
      locator, and handoff locator; disagreement between prompt, host binding,
      and packet fails before work.
  - id: ERR-AC-05
    outcome: >-
      Writers and verifiers consume only their validated packets, preserve
      exclusive-write and read-only boundaries, and stop rather than searching
      the repository for record or handoff templates.
  - id: ERR-AC-06
    outcome: >-
      Resume and completion validate current primary evidence and cannot use a
      placeholder, stale digest, foreign owner, or host capability as
      authorization.
  - id: ERR-AC-07
    outcome: >-
      Legacy readable records remain recoverable through explicit compatibility
      handling, and release artifacts ship constructors and schemas without
      runtime state.
verification:
  - id: ERR-VT-01
    command: sh test/contracts/test-contracts.sh
    proves: Record fields, ownership relationships, host evidence, and schema inventory remain canonical.
  - id: ERR-VT-02
    command: sh test/runtime/test-runtime.sh
    proves: Constructors validate and atomically publish complete records with real revisions and digests.
  - id: ERR-VT-03
    command: sh test/ownership/test-ownership.sh
    proves: Ownership graph, lease, worktree, child permissions, and launch validation fail closed.
  - id: ERR-VT-04
    command: sh test/recovery/test-recovery.sh
    proves: Interruption, stale receipts, partial records, and resume preserve authoritative evidence boundaries.
  - id: ERR-VT-05
    command: sh test/hosts/test-host-adapters.sh
    proves: Host mappings launch the same packet or report host-blocked without scope expansion.
  - id: ERR-VT-06
    command: sh test/security/test-boundaries.sh
    proves: Record paths, digests, prompts, provider data, and foreign runtime writes fail safely.
  - id: ERR-VT-07
    command: sh test/upgrades/test-upgrades.sh
    proves: Upgrade and rollback preserve readable runtime evidence and apply explicit compatibility handling.
  - id: ERR-VT-08
    command: sh test/release/test-release.sh
    proves: Constructors and schemas ship while sessions, leases, worktrees, and handoffs do not.
  - id: ERR-VT-09
    command: sh test/acceptance.sh
    proves: Complete semantic acceptance after runtime record integration.
human_gates:
  - plan-approval
  - execution-trigger
  - delivery
  - publication
  - cleanup
created_at: 2026-08-22T18:30:00Z
updated_at: 2026-08-22T18:30:00Z
