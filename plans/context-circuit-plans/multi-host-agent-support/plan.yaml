schema_version: 2
id: multi-host-agent-support
number: CC-002
title: Full development support for Codex, Claude Code, and Cursor CLI
status: approved
repository: context-circuit-source
source: repository-evidence
product_knowledge:
  - context/ARCHITECTURE.md
  - context/CONVENTIONS.md
  - context/DECISIONS.md
  - docs/agent-workspace-workflow.md
  - docs/host-capabilities.md
  - docs/runtime-contract.md
  - wrapper/contracts/invariants.yaml
  - wrapper/contracts/routes.yaml
  - wrapper/contracts/context-sets.yaml
objective: >-
  Make the Context Circuit development workflow portable and verifiable across
  Codex CLI, Claude Code, and Cursor Agent CLI while keeping one canonical
  router, lifecycle, ownership model, filesystem evidence boundary, and
  credential-free workspace contract.
scope:
  - provider-neutral host capability and session evidence fields
  - shared AGENTS.md discovery for Codex and Cursor CLI
  - Claude Code CLAUDE.md adapter importing the shared instructions
  - host mappings for root, writer, and independent verifier sessions
  - host-specific resume, permission, and missing-child fallback behavior
  - static, offline, and explicitly opt-in live host verification fixtures
  - release, migration, onboarding, troubleshooting, and compatibility docs
  - semantic acceptance and artifact checks for all three hosts
non_goals:
  - embedding or reimplementing any host CLI, model API, SDK, MCP server, or scheduler
  - storing credentials, tokens, provider payloads, transcripts, or host auth state
  - auto-installing, auto-authenticating, or auto-invoking a host provider
  - adding a second router, plan lifecycle, ownership authority, or completion path
  - making a host's permission mode or child feature an authorization grant
  - requiring live provider access in offline CI or making external calls implicitly
dependencies: []
tasks:
  - id: MHS-001
    title: Define the cross-host capability contract and acceptance matrix
    path: tasks/001-host-contract.md
  - id: MHS-002
    title: Complete the Codex CLI adapter and child-session mapping
    path: tasks/002-codex.md
  - id: MHS-003
    title: Complete the Claude Code adapter and release surface
    path: tasks/003-claude-code.md
  - id: MHS-004
    title: Complete the Cursor Agent CLI adapter and permission boundary
    path: tasks/004-cursor-cli.md
  - id: MHS-005
    title: Add cross-host semantic and optional live verification
    path: tasks/005-cross-host-verification.md
  - id: MHS-006
    title: Integrate release, migration, documentation, and independent review
    path: tasks/006-release-and-review.md
acceptance:
  - id: MHS-AC-01
    outcome: >-
      Codex CLI, Claude Code, and Cursor Agent CLI enter the same Context
      Circuit workflow and cannot create a competing route or lifecycle.
  - id: MHS-AC-02
    outcome: >-
      Host identity, version/capability evidence, root/child role, and
      unavailable-provider fallback are recorded provider-neutrally without
      credentials or provider payloads.
  - id: MHS-AC-03
    outcome: >-
      Codex uses the shared AGENTS.md and cc-* discovery surfaces, maps native
      subagents to bounded writer/verifier packets, and blocks safely when a
      required child primitive is unavailable.
  - id: MHS-AC-04
    outcome: >-
      Claude Code loads a shipped CLAUDE.md adapter that imports the shared
      AGENTS.md contract, preserves root/child/verifier boundaries, and keeps
      Claude-specific instructions thin and non-authoritative.
  - id: MHS-AC-05
    outcome: >-
      Cursor Agent CLI works from the released root AGENTS.md/CLAUDE.md
      surfaces in interactive, print, and resume modes; host-local permission
      configuration remains optional and never bypasses Context Circuit gates.
  - id: MHS-AC-06
    outcome: >-
      All three hosts preserve exclusive writer worktrees, independent
      read-only verification, interruption/resume evidence, offline fallback,
      context budgets, and explicit human gates.
  - id: MHS-AC-07
    outcome: >-
      The release artifact contains the required host adapters and excludes
      maintainer plans, runtime state, test harnesses, and host credentials;
      upgrade and rollback preserve user workspace data.
  - id: MHS-AC-08
    outcome: >-
      The offline semantic suite passes for every host fixture, while live
      host smoke evidence is explicitly marked pass, unavailable, or blocked
      and is never represented as a false success.
verification:
  - id: MHS-VT-01
    command: sh test/contracts/test-contracts.sh
    proves: Host evidence fields, ownership, schema inventory, and forbidden credential/payload fields remain contract-valid.
  - id: MHS-VT-02
    command: sh test/routing/test-router.sh
    proves: Every host selects the same two-stage route and missing child capability produces a safe block.
  - id: MHS-VT-03
    command: sh test/hosts/test-host-adapters.sh
    proves: Codex, Claude Code, and Cursor CLI instruction surfaces, role mappings, resume probes, and offline fixtures.
  - id: MHS-VT-04
    command: sh test/behavior-matrix/test-matrix.sh
    proves: Cross-host success, child-blocked, host-blocked, recovery, and gate outcomes share canonical reason codes.
  - id: MHS-VT-05
    command: sh test/ownership/test-ownership.sh
    proves: Host-specific child mappings preserve exclusive leases, isolated worktrees, and read-only verifier permissions.
  - id: MHS-VT-06
    command: sh test/context-budget/test-budgets.sh
    proves: Host instruction overlays do not exceed tier, orientation, writer, verifier, or resume context ceilings.
  - id: MHS-VT-07
    command: sh test/security/test-boundaries.sh
    proves: Host configuration and optional live probes cannot persist credentials, escape assigned paths, or authorize external activity.
  - id: MHS-VT-08
    command: sh test/upgrades/test-upgrades.sh
    proves: Wrapper-only migration and rollback preserve host-local configuration, workspace data, and runtime evidence.
  - id: MHS-VT-09
    command: sh test/release/test-release.sh
    proves: The assembled artifact contains the shipped host adapters and excludes maintainer-only source and runtime state.
  - id: MHS-VT-10
    command: sh test/acceptance.sh
    proves: Complete semantic acceptance after all multi-host work packages.
human_gates:
  - plan-approval
  - execution-trigger
  - delivery
  - publication
  - cleanup
