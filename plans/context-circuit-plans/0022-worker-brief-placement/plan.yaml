schema_version: 2
plan: 0022-worker-brief-placement
title: Relocate the runtime worker-brief template out of the workspace root
status: done
objective: >-
  Keep the shipped template workspace root clean of internal runtime machinery by
  relocating the promoted worker-brief template from the user-facing root into
  wrapper/runtime/ (beside the runtime that consumes it), re-pointing the engine
  lookup and the release manifest, with the source of truth and grounding
  behavior unchanged and no core contract bump.
repositories:
  - id: context-circuit-source
    purpose: Hosts release assembly, the runtime engine, and the brief template.
plan_dependencies:
  - id: 0015-repository-grounding
    reason: Owns the brief assembly and repository-grounding behavior that consumes the template.
  - id: 0010-release-assembly-and-publication
    reason: Owns the assembler and manifest that promote the template into the shipped tree.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: INV-GROUND names the brief source of truth and grounding ownership, unchanged here.
context_grounding:
  summary: >-
    The workspace root is user-facing surface; a runtime-only template promoted
    there reads as clutter. The promoted copy moves to wrapper/runtime/, beside
    engine.sh; the source of truth stays under wrapper/adapters/ and the engine
    keeps that fallback for source checkouts.
  constraints:
    - Source of truth stays at wrapper/adapters/ (INV-GROUND ownership unchanged).
    - Engine prefers the new shipped location, then falls back to wrapper/adapters/.
    - No user-visible grounding behavior change; only the unfilled template's location moves.
    - No core contract bump.
  decisions:
    - The template is the runtime's own artifact, so it belongs beside the runtime, not at the bare root.
    - This plan owns the template's LOCATION; its name (worker- vs writer-) is owned by 0024-worker-role-naming.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: BRIEF-001
    title: Move the promoted brief to wrapper/runtime and re-point lookup and manifest
    repositories: [context-circuit-source]
    paths:
      - scripts/release-artifact.sh
      - scripts/release-manifest.txt
      - wrapper/runtime/engine.sh
      - agents/coordinator.md
      - .agents/skills/cc-execute/SKILL.md
      - .agents/skills/cc-run-stack/SKILL.md
    depends_on: []
    changes:
      - Stage the promoted brief to wrapper/runtime/ instead of the root; mark it required there in the manifest.
      - Point the engine lookup at the new location, keeping the wrapper/adapters/ fallback for source checkouts.
      - Reword prose that implied a root path.
    acceptance:
      - id: BRIEF-AC-01
        statement: The shipped brief is required at wrapper/runtime/ and no longer promoted to the workspace root.
      - id: BRIEF-AC-02
        statement: The engine prefers the wrapper/runtime/ brief and falls back to wrapper/adapters/ for source checkouts, with grounding behavior unchanged.
    verification:
      - id: BRIEF-VT-01
        command: sh test/release/test-release.sh
      - id: BRIEF-VT-02
        command: sh test/grounding/test-grounding.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
