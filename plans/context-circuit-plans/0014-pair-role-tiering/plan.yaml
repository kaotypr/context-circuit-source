schema_version: 3
plan: 0014-pair-role-tiering
intent: i012-pair-role-tiering
title: Honor role-tiering.local.yaml in Explore
status: draft
objective: >-
  role-tiering.local.yaml must apply during Explore (cc-pair) the same way it
  applies during cc-execute. The cc-pair skill must include the same
  Model & effort per role step so the Explore worker runs at the configured
  model and effort.
repositories:
  - id: context-circuit-source
    purpose: Owns cc-pair, cc-execute role-tiering guidance, and host-local config.
plan_dependencies: []
product_knowledge:
  - id: direct-collaboration
    path: context/domains/direct-collaboration/README.md
    reason: Owns Explore worker spawn.
  - id: host-adapters
    path: context/domains/host-adapters/README.md
    reason: Role tiering is bounded host evidence; model never selects a gate.
  - id: role-tiering
    path: docs/role-tiering.md
    reason: Owns the host-local role-tiering.local.yaml shape and adapter defaults.
context_grounding:
  summary: >-
    Derived from the approved i012 contract without a tracer, at explicit
    human request. Observed failure: Explore worker ignored
    role-tiering.local.yaml.
  constraints:
    - Role tiering changes cost and speed only, never meaning or independence.
    - Adapter defaults still apply when no local file is present.
  decisions:
    - Keep one plan with three sequential tasks.
knowledge_impact:
  expected_context_units:
    - direct-collaboration
  review_on_completion: true
tasks:
  - id: PRT-001
    title: Honor role-tiering.local.yaml in Explore
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-pair/
      - docs/role-tiering.md
      - wrapper/adapters/
    depends_on: []
    changes:
      - When role-tiering.local.yaml sets the worker model and effort, an Explore worker is launched with that pair, not an ignoring default.
    acceptance:
      - id: PRT-AC-001
        statement: When role-tiering.local.yaml sets the worker model and effort, an Explore worker is launched with that model and effort.
      - id: PRT-AC-003
        statement: Applying the setting does not change Explore's meaning, drop or add a verifier, or alter independence or the failure limit.
    verification:
      - id: PRT-VT-001
        command: rg -n 'role-tiering|Model & effort|worker' .agents/skills/cc-pair/SKILL.md docs/role-tiering.md
  - id: PRT-002
    title: Add the Model & effort step to cc-pair
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-pair/
      - .agents/skills/cc-execute/
    depends_on:
      - PRT-001
    changes:
      - Include in cc-pair the same Model & effort per role step that cc-execute already has, so the coordinator applies the setting before spawning the worker.
    acceptance:
      - id: PRT-AC-002
        statement: The cc-pair skill includes a Model & effort per role step equivalent to cc-execute.
    verification:
      - id: PRT-VT-002
        command: rg -n 'Model & effort per role' .agents/skills/cc-pair/SKILL.md .agents/skills/cc-execute/SKILL.md
  - id: PRT-003
    title: Prove the Explore worker follows it
    repositories: [context-circuit-source]
    paths:
      - test/pairing/
      - test/acceptance.sh
    depends_on:
      - PRT-002
    changes:
      - Add coverage that fails if an Explore worker ignores role-tiering.local.yaml.
    acceptance:
      - id: PRT-AC-001
        statement: Ignoring role-tiering.local.yaml in Explore is proven to fail.
    verification:
      - id: PRT-VT-003
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
