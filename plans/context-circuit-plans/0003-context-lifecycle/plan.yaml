schema_version: 2
plan: 0003-context-lifecycle
title: Product Knowledge and context lifecycle
status: done
objective: >-
  Give the workspace durable Product Knowledge optimized for agent retrieval and
  a proposal gate, so accepted facts ground plans and no context update is ever
  silently accepted by completion, verification, or a code change.
repositories:
  - id: context-circuit-source
    purpose: Hosts the context/ Product Knowledge and its retrieval catalog.
plan_dependencies:
  - id: 0001-contracts-runtime-foundation
    reason: Uses the runtime skeleton and the invariant owner map.
product_knowledge:
  - id: architecture
    path: context/ARCHITECTURE.md
    reason: Places Product Knowledge as a workspace layer.
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: INV-KNOWLEDGE-01/02 are owned by context/INDEX.md and schemas.
  - id: sources
    path: context/SOURCES.md
    reason: Provenance rules for proposed knowledge.
context_grounding:
  summary: >-
    The context index is a retrieval catalog (stable ids, summaries, domains,
    freshness, provenance), not a copy of page content; updates enter only by an
    explicit human decision.
  constraints:
    - Retrieval-first index remains human-readable (INV-KNOWLEDGE-01).
    - No silent context accept from completion/verification/worker (INV-KNOWLEDGE-02).
    - A plan may be done while a proposal is pending.
  decisions:
    - Proposals carry provenance and an impact status before acceptance.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: CTX-001
    title: Define the context index, proposal, and impact schemas
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/schemas/context-index.yaml
      - wrapper/contracts/schemas/context-proposal.yaml
      - wrapper/contracts/schemas/context-impact.yaml
    depends_on: []
    changes:
      - Author the retrieval catalog shape (INDEX metadata per unit).
      - Author the proposal record shape with provenance and impact status.
      - Author the context-impact shape used at completion reconciliation.
    acceptance:
      - id: CTX-AC-01
        statement: The index carries retrieval metadata, not a copy of page bodies.
      - id: CTX-AC-02
        statement: A proposal records provenance and an explicit impact status.
    verification:
      - id: CTX-VT-01
        command: sh test/contracts/test-contracts.sh
  - id: CTX-002
    title: Seed the context tree and retrieval catalog
    repositories: [context-circuit-source]
    paths:
      - context/INDEX.md
      - context/proposals
    depends_on: [CTX-001]
    changes:
      - Author context/INDEX.md as the agent retrieval catalog and human aid.
      - Establish the context/proposals/ area for pending, un-accepted updates.
    acceptance:
      - id: CTX-AC-03
        statement: Retrieval selects units by concept without reading the whole tree.
      - id: CTX-AC-04
        statement: A pending proposal never mutates accepted knowledge implicitly.
    verification:
      - id: CTX-VT-02
        command: sh test/contracts/test-contracts.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
