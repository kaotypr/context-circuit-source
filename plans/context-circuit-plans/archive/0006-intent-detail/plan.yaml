schema_version: 3
plan: 0006-intent-detail
intent: i004-intent-detail
title: Intent detail via the system-design skill
status: draft
objective: >-
  Let a human request, or be recommended, a fuller by-concern write-up of one
  intent before they approve it, authored by the existing system-design skill
  at intent/<id>/detail/, with the short approval page unchanged and later
  planning following those topics.
repositories:
  - id: context-circuit-source
    purpose: Owns skills, guidance, Product Knowledge, tests, and the leftover unsolicited design tree.
plan_dependencies: []
product_knowledge:
  - id: system-design-authoring
    path: context/domains/system-design-authoring/README.md
    reason: Owns the three-tier rubric and must document both authoring homes.
  - id: intent
    path: context/domains/intent/README.md
    reason: Owns Gate 1, the five-section approval page, and optional recommend/request.
  - id: tracing
    path: context/domains/tracing/README.md
    reason: Keeps the post-approval code read distinct from pre-approval detail authoring.
  - id: plan-authorization
    path: context/domains/plan-authorization/README.md
    reason: Preserves a single intent gate and automatic plan derivation.
  - id: planning
    path: docs/planning.md
    reason: Consumes detail when present as confirmed topic shape alongside the trace.
context_grounding:
  summary: >-
    The i004 look-over found a single bounded skills-guidance-tests surface,
    no out-of-scope required modify, and no unresolved intent-level question.
    Engine validate already allows extra intent files; the contract digest
    hashes only contract.yaml. The unsolicited v1.1.0 draft files are gone;
    empty directories remain to be removed.
  constraints:
    - Keep Gate 1 as the only conversational approval.
    - Do not add an engine verb, schema field, invariant, or new skill.
    - Do not modify wrapper/, template/, or agent-harness/.
    - Discard sources/system-design/context-circuit/v1.1.0/ rather than using it as spec.
    - Preserve unrelated and dirty work.
  decisions:
    - Keep one plan with three embedded tasks: one repository, one change surface, one worker and independent-check lifecycle, and sequential task order. The three human-facing slices are not independently executable or verifiable.
    - Recommend detail when a draft has several concerns (several numbered plans, several independent outcomes, or several already-described parts). Always honor an explicit request. Never require it.
    - Leave template/ and agent-harness/ unchanged; skill, domain, and test checks prove the outcomes.
knowledge_impact:
  expected_context_units:
    - system-design-authoring
    - intent
    - tracing
    - plan-authorization
  review_on_completion: true
tasks:
  - id: IDT-001
    title: Teach the design helper both homes
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-system-design/
      - context/domains/system-design-authoring/
      - docs/terminology.md
      - sources/system-design/context-circuit/v1.1.0/
    depends_on: []
    changes:
      - Refactor cc-system-design so it authors either sources/system-design/... or intent/<id>/detail/ with the same three-tier, split-when-earned, by-concern rubric.
      - Preserve the product-level path and authoring-only boundary; do not add a runtime surface.
      - Distinguish intent detail from product-level system design in terminology.
      - Remove remaining empty sources/system-design/context-circuit/v1.1.0/ directories and do not revive that tree as specification.
    acceptance:
      - id: IDT-AC-001
        statement: The system-design skill still authors a product-level design under sources/system-design/, and can also author an intent's fuller write-up under intent/<id>/detail/ with the same three-tier layout and split-when-earned rule.
      - id: IDT-AC-004
        statement: This capability is specified and shipped through the system-design skill and related guidance, not through a new sources/system-design scope written for this feature.
    verification:
      - id: IDT-VT-001
        command: rg -n 'sources/system-design/|intent/<id>/detail/|three-tier|split when|by concern' .agents/skills/cc-system-design/SKILL.md context/domains/system-design-authoring/README.md && rg -n 'sources/system-design/' .agents/skills/cc-system-design/SKILL.md && rg -n 'intent/.*/detail|intent/<id>/detail' .agents/skills/cc-system-design/SKILL.md
      - id: IDT-VT-004
        command: test ! -e sources/system-design/context-circuit/v1.1.0 && test ! -e .agents/skills/cc-intent-detail && rg -n 'intent/<id>/detail|intent/.*/detail' .agents/skills/cc-system-design/SKILL.md .agents/skills/cc-intent/SKILL.md && ! rg -n 'v1.1.0/intent-detail' .agents/skills/cc-system-design/SKILL.md .agents/skills/cc-intent/SKILL.md .agents/skills/cc-plan/SKILL.md context/domains/system-design-authoring/README.md context/domains/intent/README.md
  - id: IDT-002
    title: Offer detail while preparing a change; use it when planning
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-intent/
      - .agents/skills/cc-plan/
      - .agents/skills/cc-trace/
      - agents/coordinator.md
      - context/domains/intent/
      - context/domains/tracing/
      - context/domains/plan-authorization/
      - docs/templates/intent.md
      - docs/planning.md
    depends_on:
      - IDT-001
    changes:
      - Recommend or honor a request for intent/<id>/detail/ without blocking approval or lengthening INTENT.md.
      - Keep cc-intent from duplicating the three-tier rubric; invoke cc-system-design for that write-up.
      - When detail/ exists, cc-plan uses it as the confirmed topic shape without replacing the post-approval code read.
      - Keep tracing code-first; detail is not a tracing output and is not part of contract_digest.
    acceptance:
      - id: IDT-AC-002
        statement: A human can request the fuller write-up, or be recommended it when one intent has several concerns; skipping it does not block approving the intent, and a small single-outcome intent can stay short.
      - id: IDT-AC-003
        statement: Approving the intent remains the one conversational decision; there is no separate approval of the detail, and plan derivation after approval is unchanged.
      - id: IDT-AC-005
        statement: When an intent has a detail write-up, later planning uses it as the confirmed shape of what to build so plans and tasks follow those topics, without replacing the post-approval read of the real code.
      - id: IDT-AC-006
        statement: The human-facing intent page stays the short five-section approval surface; the fuller write-up is extra files with the intent, not a longer approval page.
    verification:
      - id: IDT-VT-002
        command: rg -n -i 'recommend|request|optional|several concerns|does not block|not required|skip' .agents/skills/cc-intent/SKILL.md context/domains/intent/README.md agents/coordinator.md
      - id: IDT-VT-003
        command: rg -n -i 'no separate approval|no second.*(gate|approval)|Gate 1|single.*(upstream|conversational)|detail.*(not|never).*approv' .agents/skills/cc-intent/SKILL.md .agents/skills/cc-plan/SKILL.md context/domains/intent/README.md context/domains/plan-authorization/README.md docs/planning.md && sh test/intent/test-feasibility.sh
      - id: IDT-VT-005
        command: rg -n -i 'detail/|confirmed shape|topic|when.*detail.*exist|without replacing|trace manifest' .agents/skills/cc-plan/SKILL.md docs/planning.md context/domains/tracing/README.md
      - id: IDT-VT-006
        command: rg -n 'five sections|exactly five|Intention|Expectations|The plans|How carefully this is checked|Open questions' docs/templates/intent.md .agents/skills/cc-intent/SKILL.md context/domains/intent/README.md && ! rg -n '## Detail|sixth section|detail/design.md' docs/templates/intent.md docs/templates/intent.example.md
  - id: IDT-003
    title: Prove the two paths
    repositories: [context-circuit-source]
    paths:
      - test/contracts/
      - test/intent/
      - test/acceptance.sh
      - test/acceptance/criteria-map.yaml
    depends_on:
      - IDT-002
    changes:
      - Extend contracts assertions for dual-root wording while keeping product-level root and no-runtime-surface checks.
      - Add deterministic coverage that extra detail files do not affect validate, approve, or digest, and that a short intent can skip detail.
      - Wire new coverage into the semantic acceptance suite and criteria map without weakening credential-free checks.
    acceptance:
      - id: IDT-AC-001
        statement: Dual-root authoring is proven by the contracts suite as well as skill wording.
      - id: IDT-AC-002
        statement: Optional and recommended detail is proven; skipping does not block approval.
      - id: IDT-AC-003
        statement: No second approval gate is introduced.
      - id: IDT-AC-004
        statement: The unsolicited v1.1.0 specification tree is absent and no cc-intent-detail skill exists.
      - id: IDT-AC-005
        statement: Planning-consumes-detail guidance is present and still requires the post-approval code read.
      - id: IDT-AC-006
        statement: The five-section approval surface remains short.
    verification:
      - id: IDT-VT-007
        command: sh test/contracts/test-contracts.sh
      - id: IDT-VT-008
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
