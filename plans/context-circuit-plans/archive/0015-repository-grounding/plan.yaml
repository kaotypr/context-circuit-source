schema_version: 2
plan: 0015-repository-grounding
title: "Repository grounding: discovery, manifest, and generated writer brief"
status: done
objective: >-
  Ground the writer in the target repository's own agent guidance, discovered
  live from the execution worktree, and deliver it through a brief assembled by
  deterministic slot substitution, so the coordinator delivers repository facts
  and never authors them.
repositories:
  - id: context-circuit-source
    purpose: Hosts the discovery runtime, grounding manifest, and writer brief.
plan_dependencies:
  - id: 0005-approval-and-execution
    reason: Discovery runs during worktree preparation and grounds the worker.
  - id: 0013-run-stack-substrate
    reason: Rides the shared v0.6 bump and scans the selected execution base.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: INV-GROUND-01/02/03 are owned here.
  - id: design-deltas
    path: context/DESIGN-DELTAS.md
    reason: The repository-grounding rationale and precedence model.
context_grounding:
  summary: >-
    A deterministic runtime scan emits a grounding manifest (files, skills,
    environment); a fixed brief template is filled by slot substitution; a
    preflight refuses a brief missing the required grounding slot.
  constraints:
    - Discovery emits data, never prompt text (INV-RUNTIME-01, INV-GROUND-01).
    - Brief scope/safety is authoritative on what/where; repo guidance on how (INV-GROUND-02).
    - The coordinator authors only a one-line task focus, never fact sections (INV-GROUND-03).
  decisions:
    - Repository guidance is referenced, never captured into Product Knowledge.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: RGD-001
    title: Live discovery and grounding manifest
    repositories: [context-circuit-source]
    paths:
      - wrapper/runtime/engine.sh
      - wrapper/contracts/schemas/grounding-manifest.yaml
      - wrapper/contracts/schemas/execution.yaml
    depends_on: []
    changes:
      - Scan the worktree for AGENTS.md, CLAUDE.md, .cursor/rules, copilot, skills.
      - Emit a grounding manifest and record its snapshot in the execution record.
    acceptance:
      - id: RGD-AC-01
        statement: Discovery is a deterministic scan emitting a manifest, not prompt text.
      - id: RGD-AC-02
        statement: A doc-less repository yields a valid empty manifest.
    verification:
      - id: RGD-VT-01
        command: sh test/grounding/test-grounding.sh
  - id: RGD-002
    title: Writer-brief template, slot-fill, and preflight
    repositories: [context-circuit-source]
    paths:
      - wrapper/adapters/writer-brief.md
      - wrapper/runtime/engine.sh
    depends_on: [RGD-001]
    changes:
      - Author the fixed brief template with the required grounding slot.
      - Fill fact sections by deterministic slot substitution from the manifest.
      - Refuse to deliver a brief whose grounding slot is missing or unfilled.
    acceptance:
      - id: RGD-AC-03
        statement: A brief missing the repository-grounding slot is refused at preflight.
    verification:
      - id: RGD-VT-02
        command: sh test/grounding/test-grounding.sh
  - id: RGD-003
    title: Worker and coordinator grounding contract
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/invariants.yaml
      - agents/coordinator.md
      - agents/writer.md
    depends_on: [RGD-002]
    changes:
      - Add INV-GROUND-01/02/03 and the worker read-and-honor obligation.
      - Make the coordinator deliver the brief and author only the task focus.
    acceptance:
      - id: RGD-AC-04
        statement: Repository guidance never overrides a Context Circuit safety or scope rule.
    verification:
      - id: RGD-VT-03
        command: sh test/grounding/test-grounding.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
