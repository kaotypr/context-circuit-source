schema_version: 3
plan: 0007-drop-code-review-graph
intent: i005-drop-code-review-graph
title: Drop the leftover .code-review-graph folder
status: draft
objective: >-
  A Context Circuit template and an instantiated workspace must not keep a
  leftover .code-review-graph folder. Remove it from what is shipped and from
  a workspace that still has it, without changing intent, tracing, planning,
  execution, or delivery behavior.
repositories:
  - id: context-circuit-source
    purpose: Owns the template seed, ignore rules, and release assembly.
plan_dependencies: []
product_knowledge:
  - id: source-release-and-upgrade
    path: context/domains/source-release-and-upgrade/README.md
    reason: Owns what the template ships and the ignore boundary.
  - id: intent
    path: context/domains/intent/README.md
    reason: Confirms lifecycle behavior must stay unchanged.
context_grounding:
  summary: >-
    Derived from the approved i005 contract without a tracer, at explicit
    human request. One repository, one leftover-folder surface, one worker
    and independent-verifier lifecycle.
  constraints:
    - Do not change intent, tracing, planning, execution, or delivery.
    - Preserve unrelated and dirty work.
  decisions:
    - Keep one plan with two sequential tasks. Tracing was skipped by human request.
knowledge_impact:
  expected_context_units: []
  review_on_completion: true
tasks:
  - id: CRG-001
    title: Stop keeping .code-review-graph
    repositories: [context-circuit-source]
    paths:
      - template/
      - wrapper/
      - docs/
    depends_on: []
    changes:
      - Remove .code-review-graph from the shipped template and any ignore or assembly path that would keep it as project material.
    acceptance:
      - id: CRG-AC-001
        statement: A newly instantiated workspace from the template does not include a .code-review-graph folder.
      - id: CRG-AC-002
        statement: A workspace that already has a leftover .code-review-graph folder no longer keeps it after this change lands.
    verification:
      - id: CRG-VT-001
        command: ! find template wrapper -name '.code-review-graph' -o -path '*/.code-review-graph/*' | grep -q .
  - id: CRG-002
    title: Prove a fresh workspace is clean
    repositories: [context-circuit-source]
    paths:
      - test/
    depends_on:
      - CRG-001
    changes:
      - Add or extend a check that a fresh template workspace does not include .code-review-graph, and that lifecycle tests still pass.
    acceptance:
      - id: CRG-AC-003
        statement: Intent approval, tracing, planning, execution, verification, and delivery continue to work as they do today.
    verification:
      - id: CRG-VT-002
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
