schema_version: 2
plan: 0011-human-simulated-harness
title: Human-simulated test harness mechanism
status: done
objective: >-
  Build the source-only harness that assembles the template into an isolated
  workspace, spawns the real product coordinator, drives it with an ignorant
  human-simulator, and grades the transcript deterministically.
repositories:
  - id: context-circuit-source
    purpose: Hosts the maintainer-only harness under template-harness/ (never shipped).
plan_dependencies:
  - id: 0010-release-assembly-and-publication
    reason: The harness assembles and exercises the released template artifact.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: The grader maps every finding back to an invariant id.
  - id: architecture
    path: context/ARCHITECTURE.md
    reason: The coordinator/worker/verifier roles it spawns and observes.
context_grounding:
  summary: >-
    A human-simulator (a lay user) talks to the real coordinator in an isolated
    workspace; a deterministic grader checks state, transcript, and access.
  constraints:
    - Source-only maintainer tooling; nothing ships into the template.
    - The grader is mechanical (no model call); findings map to AC + invariant ids.
    - Results live under a disposable, gitignored per-run directory.
  decisions:
    - The coordinator-under-test is the real product coordinator, not a new file.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: HRN-001
    title: Human-simulator role and coordinator spawn contract
    repositories: [context-circuit-source]
    paths:
      - .claude/agents/cc-human-simulator.md
      - template-harness/human
    depends_on: []
    changes:
      - Author the ignorant-lay-user persona contract and per-turn protocol.
      - Define spawning the real coordinator in an isolated workspace, no test metadata.
    acceptance:
      - id: HRN-AC-01
        statement: The coordinator is spawned with no awareness it is under test.
    verification:
      - id: HRN-VT-01
        command: sh template-harness/test-template-runtime.sh
  - id: HRN-002
    title: Scenario schema, runner, and anchor case
    repositories: [context-circuit-source]
    paths:
      - template-harness/human/run-scenario.sh
      - template-harness/scenarios
    depends_on: [HRN-001]
    changes:
      - Author the case.yaml human/grader split and the scenarios/ layout.
      - Assemble, isolate, snapshot baseline, apply fixtures, drive the turn loop.
      - Author the anchor case as a fully worked example.
    acceptance:
      - id: HRN-AC-02
        statement: A run captures transcript, file-access trace, and telemetry to the run dir.
    verification:
      - id: HRN-VT-02
        command: sh template-harness/test-template-runtime.sh
  - id: HRN-003
    title: Deterministic grader dimensions A-D
    repositories: [context-circuit-source]
    paths:
      - template-harness/human/grade.sh
    depends_on: [HRN-002]
    changes:
      - Evaluate state post-conditions, transcript checks, and access discipline.
      - Map each finding to an acceptance criterion and invariant id.
    acceptance:
      - id: HRN-AC-03
        statement: State and transcript checks are hard gates; the efficiency ledger is soft.
    verification:
      - id: HRN-VT-03
        command: sh template-harness/test-template-runtime.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
