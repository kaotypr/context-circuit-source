schema_version: 2
plan: 0024-worker-role-naming
title: Unify the implementing execution role name on worker
status: done
objective: >-
  Give the plan-execution implementing role one name - worker - everywhere it
  appears, retiring writer as a synonym across roles, contracts, runtime,
  adapters, skills, tests, and Product Knowledge, and renaming the brief to the
  worker brief. A pure rename: no behavior, authority, gate, or contract
  semantics change, and no core contract bump.
repositories:
  - id: context-circuit-source
    purpose: Hosts the role files, contracts, runtime, adapters, skills, docs, and tests.
plan_dependencies:
  - id: 0005-approval-and-execution
    reason: Owns the worker execution role and the one-worker lock this rename renames.
  - id: 0015-repository-grounding
    reason: Owns the brief the rename retitles from writer brief to worker brief.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: The owner-map values and INV-OWN / INV-GROUND prose nouns are reworded here.
  - id: terminology
    path: context/TERMINOLOGY.md
    reason: The glossary must define worker directly, not as the writer role.
context_grounding:
  summary: >-
    The implementing role is named two ways: the role file is agents/writer.md
    while the owner-map value and schema (worker-handoff.yaml) already say worker,
    and the glossaries define worker circularly as the writer role. Worker is the
    dominant, user-facing term; unify on it and remove writer.
  constraints:
    - Rule IDs and semantics are unchanged; only the noun changes.
    - No core contract bump and no new owner; the owner map is edited in place.
    - The brief follows the role name (writer brief -> worker brief) in concept, file, function, and command.
    - No retroactive history rewrite; completed plans and prior designs keep writer.
  decisions:
    - Worker is the sole name; writer is retired from every live product surface.
    - Acceptance is that no live product surface names the role writer (grep the aliases out).
    - Location of the brief is owned by 0022-worker-brief-placement; this plan owns only its name.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: RENAME-001
    title: Rename the role and brief to worker across all live surfaces
    repositories: [context-circuit-source]
    paths:
      - agents/worker.md
      - agents/coordinator.md
      - agents/verifier.md
      - wrapper/contracts/invariants.yaml
      - wrapper/runtime/engine.sh
      - wrapper/adapters/worker-brief.md
      - .agents/skills/cc-execute/SKILL.md
      - .agents/skills/cc-run-stack/SKILL.md
      - scripts/release-artifact.sh
      - scripts/release-manifest.txt
      - context/TERMINOLOGY.md
      - docs/terminology.md
    depends_on: []
    changes:
      - Rename agents/writer.md to agents/worker.md and update the owner-map path value.
      - Reword INV-OWN and INV-GROUND prose nouns from writer to worker (IDs and semantics unchanged).
      - Rename the brief concept, file, engine function, and assemble command to worker.
      - Fix the glossaries to define worker directly; update tests and harness strings.
    acceptance:
      - id: RENAME-AC-01
        statement: No live product surface (roles, contracts, runtime, adapters, skills, docs, tests) names the implementing role writer.
      - id: RENAME-AC-02
        statement: The brief is the worker brief in concept, file, engine function, and command, with its content and preflight unchanged; rule IDs and semantics are unchanged and no core contract is bumped.
    verification:
      - id: RENAME-VT-01
        command: sh test/acceptance.sh
      - id: RENAME-VT-02
        command: sh test/contracts/test-contracts.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
