schema_version: 2
plan: 0017-external-surface-plan-kind
title: "External surface and the plan publication kind"
status: done
objective: >-
  Add an opt-in, manually-triggered, config-driven way to publish workspace data
  to external systems, fully orthogonal to the core workflow, and implement the
  first kind - publishing a plan and its tasks to a task tracker via cc-publish.
repositories:
  - id: context-circuit-source
    purpose: Hosts the external-surface contracts, schemas, and cc-publish skill.
plan_dependencies:
  - id: 0004-planning
    reason: A publication reads plans and their tasks to export them.
  - id: 0009-delivery
    reason: Vacates the word "publish" from the git-delivery vocabulary.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: INV-EXTERNAL-01/02/03 are owned here.
  - id: design-deltas
    path: context/DESIGN-DELTAS.md
    reason: The external-surface orthogonality model.
context_grounding:
  summary: >-
    A publication is a peer command, never a phase; it reads only the artifact
    types its config names and writes only its own records under
    publication/<name>/published/, export-only and credential-free.
  constraints:
    - No core phase or runtime triggers or is affected by a publication (INV-EXTERNAL-01).
    - Nothing is written under plans/; core state is never mutated (INV-EXTERNAL-02).
    - External artifacts are self-contained and leak no workspace path or id (INV-EXTERNAL-03).
  decisions:
    - Provider/network calls go through the host or MCP layer, never the runtime.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: EXT-001
    title: Isolation invariants and publish vocabulary split
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/invariants.yaml
      - wrapper/manifest.yaml
    depends_on: []
    changes:
      - Add INV-EXTERNAL-01/02/03 and their owner-map entries.
      - Vacate "publish" from the git side (deliver/runtime wording -> push/PR).
    acceptance:
      - id: EXT-AC-01
        statement: No core-workflow phase references, triggers, or waits on a publication.
    verification:
      - id: EXT-VT-01
        command: sh test/external-surface/test-external-surface.sh
  - id: EXT-002
    title: Config and record schemas and the publication layout
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/schemas/publication-config.yaml
      - wrapper/contracts/schemas/publication-record.yaml
    depends_on: [EXT-001]
    changes:
      - Author the config.yaml shape (kind, provider, direction, reads, mapping).
      - Author the plan-kind record shape keyed by plan and task items.
    acceptance:
      - id: EXT-AC-02
        statement: A publication reads only the artifact types its config names.
    verification:
      - id: EXT-VT-02
        command: sh test/external-surface/test-external-surface.sh
  - id: EXT-003
    title: cc-publish skill - the plan kind
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-publish/SKILL.md
    depends_on: [EXT-002]
    changes:
      - Author cc-publish with kind dispatch and the plan-kind procedure.
      - Map plan->work-item and task->child-item with idempotent re-runs.
    acceptance:
      - id: EXT-AC-03
        statement: A re-publish updates in place via a synced digest, not duplicates.
      - id: EXT-AC-04
        statement: External items are self-contained and carry only a stable plan id marker.
    verification:
      - id: EXT-VT-03
        command: sh test/external-surface/test-external-surface.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
