schema_version: 2
id: route-context-packet-enforcement
number: CC-008
title: Route-selected context packet enforcement
status: approved
repository: context-circuit-source
source: sources/wrapper-action-cost-and-integrity-prd.md
product_knowledge:
  - context/ARCHITECTURE.md
  - context/CONVENTIONS.md
  - context/DECISIONS.md
  - docs/agent-workspace-workflow.md
  - docs/host-capabilities.md
  - wrapper/contracts/context-sets.yaml
  - wrapper/contracts/routes.yaml
  - wrapper/contracts/tier0.yaml
  - wrapper/contracts/schemas/context-receipt.yaml
objective: >-
  Make every route select one registered, shipped context packet with an exact
  path allowlist and measured byte ceiling, so agents can perform named
  actions without reading router implementation, sibling workspaces, or
  undeclared evidence.
scope:
  - explicit route-to-context-set mapping using registered context-set ids
  - complete initialization and plan-draft packets and shipped canonical fixtures
  - host-neutral packet loading, path enforcement, byte accounting, and receipts
  - product-source orientation and plan-draft packet selection
  - live-overread fixtures, migration, release, documentation, and semantic tests
non_goals:
  - adding a second router, scheduler, lifecycle, or host-specific policy table
  - generating session, delegation, lease, handoff, or completion records
  - reading broad sources or sibling workspaces to populate packets
  - changing approval, execution, delivery, or cleanup authorization
dependencies:
  - multi-host-agent-support
  - approval-gate-ux-performance
  - interactive-plan-review
tasks:
  - id: RCP-001
    title: Align routes with registered context packets
    path: tasks/001-route-and-context-contracts.md
  - id: RCP-002
    title: Load and account for bounded packets
    path: tasks/002-loader-and-receipts.md
  - id: RCP-003
    title: Ship canonical packet fixtures
    path: tasks/003-shipped-fixtures.md
  - id: RCP-004
    title: Fail live overread and complete semantic verification
    path: tasks/004-verification.md
acceptance:
  - id: RCP-AC-01
    outcome: >-
      Every root route emits a context_set id present in
      wrapper/contracts/context-sets.yaml plus one exact allowlist and byte
      budget; probe or phase names are never emitted as undeclared set ids.
  - id: RCP-AC-02
    outcome: >-
      Initialization and plan drafting complete from shipped packets containing
      only the required schemas, templates, selected evidence, and canonical
      examples, without tests, sibling workspaces, or maintainer plans.
  - id: RCP-AC-03
    outcome: >-
      Ordinary route handling invokes engine primitives without loading
      engine.sh, routes.yaml, or invariants.yaml into model context unless a
      declared blocked or recovery packet requires selected contract evidence.
  - id: RCP-AC-04
    outcome: >-
      The loader rejects undeclared paths, records actual selected bytes and
      digests in the receipt, and fails CONTEXT_BUDGET_EXCEEDED before silently
      broadening a packet.
  - id: RCP-AC-05
    outcome: >-
      Product-source read-only orientation, draft-plan, named-plan review, and
      execution preflight select their declared packets while preserving all
      existing human gates and host-neutral routing.
  - id: RCP-AC-06
    outcome: >-
      Semantic fixtures fail redundant Tier 0 loads, broad wrapper or docs
      discovery, sibling-workspace reads, and undeclared source reads during
      initialization and plan drafting.
  - id: RCP-AC-07
    outcome: >-
      Release and upgrade provide every canonical packet fixture and preserve
      compatible receipts without shipping maintainer or customer evidence.
verification:
  - id: RCP-VT-01
    command: sh test/contracts/test-contracts.sh
    proves: Every route context id, packet field, receipt, and canonical fixture has one shipped owner.
  - id: RCP-VT-02
    command: sh test/routing/test-router.sh
    proves: Root actions select registered context ids and preserve named, read-only, gated, and blocked outcomes.
  - id: RCP-VT-03
    command: sh test/context-budget/test-budgets.sh
    proves: Declared and actual packet bytes stay within hard per-route and lifecycle ceilings.
  - id: RCP-VT-04
    command: sh test/hosts/test-host-adapters.sh
    proves: All supported hosts use the same packet loader and do not create host-specific route tables.
  - id: RCP-VT-05
    command: sh test/security/test-boundaries.sh
    proves: Allowlist, source, sibling-workspace, traversal, and receipt-digest boundaries fail safely.
  - id: RCP-VT-06
    command: sh test/upgrades/test-upgrades.sh
    proves: Upgrade and rollback preserve compatible receipts and install canonical packet fixtures.
  - id: RCP-VT-07
    command: sh test/release/test-release.sh
    proves: Released artifacts include required packets and exclude maintainer or customer evidence.
  - id: RCP-VT-08
    command: sh test/acceptance.sh
    proves: Complete semantic acceptance after route-context enforcement.
human_gates:
  - plan-approval
  - execution-trigger
  - delivery
  - publication
  - cleanup
created_at: 2026-08-22T18:30:00Z
updated_at: 2026-08-22T18:30:00Z
