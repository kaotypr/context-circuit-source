schema_version: 2
id: interactive-plan-review
number: CC-005
title: Named-plan review with optional host question prompts
status: draft
repository: context-circuit-source
source: repository-evidence
product_knowledge:
  - wrapper/contracts/routes.yaml
  - wrapper/contracts/invariants.yaml
  - wrapper/contracts/context-sets.yaml
  - wrapper/contracts/schemas/session.yaml
  - wrapper/runtime/engine.sh
  - docs/plan-review.md
  - docs/planning.md
  - docs/host-capabilities.md
  - docs/getting-started.md
  - docs/gates.md
  - .agents/skills/cc-plan/SKILL.md
  - agents/coordinator.md
objective: >-
  Let a human name one plan and get a read-only review that understands the
  bundle, surfaces risks and open questions, and then asks at most three
  focused choices. When the current host exposes an optional native question
  prompt, use that UI; otherwise keep the same choices in the Review Card.
  Review still never changes status or authorizes a gate.
scope:
  - natural-language trigger for a named plan review, including missing-target
    clarification
  - thin cc-review-plan skill for host discovery, with cc-plan remaining the
    draft/prepare adapter
  - Review Card wording for risks, open questions, and 0-3 human decisions
  - optional host question-prompt presentation and conversational fallback
  - routing fixtures, skill/release allowlists, and semantic coverage
  - coordinator and docs guidance that cite owners instead of adding policy
non_goals:
  - making review mutate plan.yaml, task status, leases, runtime, or Git
  - treating a question-prompt answer as approval, execution, or any other gate
  - adding a second router, lifecycle owner, or host-specific route table
  - requiring a native question prompt or recording question transcripts into
    host_evidence
  - adding Cursor slash commands, .cursor/rules, or other host-local policy
  - combining review with draft-plan, approve-plan, or run-plan
  - expanding the plan-review context set into unrelated plans or sources/
dependencies: []
tasks:
  - id: IPR-001
    title: Make named-plan review a specific request and skill
    path: tasks/001-review-trigger.md
  - id: IPR-002
    title: Present review decisions through optional host question prompts
    path: tasks/002-host-question-prompt.md
  - id: IPR-003
    title: Lock routing, release, and read-only review behavior in tests
    path: tasks/003-verification.md
acceptance:
  - id: IPR-AC-01
    outcome: >-
      Review plan <id> and equivalent named-plan phrasing route to
      review-plan, load only the plan-review context set, and stay
      authorization: read-only.
  - id: IPR-AC-02
    outcome: >-
      A review request with no usable plan id routes to clarify-target or an
      equivalent focused question and does not inspect an unrelated plan.
  - id: IPR-AC-03
    outcome: >-
      Hosts can discover a dedicated cc-review-plan skill; humans do not have
      to type the skill name. cc-plan continues to own draft and prepare only.
  - id: IPR-AC-04
    outcome: >-
      The Review Card still reports outcome, risks/assumptions, open
      questions, and at most three focused human decisions. When the host
      exposes an optional native question prompt, those decisions are also
      offered there. Missing or unavailable prompts fall back to the card
      text.
  - id: IPR-AC-05
    outcome: >-
      Choosing an option never changes plan or task status. A next-action
      label such as Approve this plan may continue only into the existing
      first card for that route; it cannot skip confirmation.
  - id: IPR-AC-06
    outcome: >-
      Existing semantic, host-adapter, and release suites continue to pass.
      The new skill is an expected shipped adapter, not a leaked legacy name.
human_gates:
  - plan-approval
  - execution-trigger
  - delivery
  - publication
  - cleanup
verification:
  - id: IPR-VT-01
    command: sh test/routing/test-router.sh
    proves: Named review, unnamed review, and nearby phrasing keep the canonical two-stage review-plan or clarify-target routes.
  - id: IPR-VT-02
    command: sh test/lifecycle/test-lifecycle.sh
    proves: Plan review remains read-only and the Review Card still names risks and human decisions.
  - id: IPR-VT-03
    command: sh test/hosts/test-host-adapters.sh
    proves: The new skill is a host discovery adapter and does not become a second router or authorization path.
  - id: IPR-VT-04
    command: sh test/release/test-release.sh
    proves: cc-review-plan is an allowed shipped skill and does not fail the unexpected-skill allowlist.
  - id: IPR-VT-05
    command: sh test/acceptance.sh
    proves: Complete semantic acceptance across contracts, routing, lifecycle, gates, ownership, hosts, and release boundaries.
created_at: 2026-08-22T16:00:00Z
updated_at: 2026-08-22T16:00:00Z
