schema_version: 3
plan: 0001-conversation-spec-library
intent: i0001-conversation-spec-library
title: Establish the conversation-spec library as the living harness specification
status: draft
objective: >-
  Make agent-harness/conversations/ the descriptive, whole-surface and
  generative source of the agent harness: plots specify expected human and
  coordinator behavior, including expected coordinator outputs; deterministic
  generation produces the live scenario cases; the harness checks conversation
  fidelity, grounded artifacts, and bidirectional drift; and the existing 22
  cases retain their calibrated behavior while becoming generated projections.
repositories:
  - id: context-circuit-source
    purpose: Hosts the source-only agent harness, conversation plots, generator, grader, and live scenario cases.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: Owns the product rules cited by descriptive plots.
  - id: acceptance-surface
    path: test/acceptance/criteria-map.yaml
    reason: Owns the AC-* definitions and their deterministic suite ownership.
  - id: architecture
    path: context/ARCHITECTURE.md
    reason: Grounds current coordinator, worker, verifier, and assurance ownership.
  - id: intent
    path: context/domains/intent/README.md
    reason: Grounds Gate 1 and automatic intent-to-plan derivation.
  - id: tracing
    path: context/domains/tracing/README.md
    reason: Grounds post-approval tracing and feasibility before planning.
  - id: assurance
    path: context/domains/assurance/README.md
    reason: Grounds Explore, Standard, and Critical behavior.
  - id: conversation-spec-library-proposal
    path: context/proposals/0034-add-conversation-spec-library.md
    reason: Records the pending source-only library proposal and its coverage intent.
context_grounding:
  summary: >-
    The approved Standard intent is feasible and scoped to agent-harness/. The
    repository has 39 plots and 39 generated-looking cases but no generator or
    drift guard, while the live runner still executes 22 hand-maintained
    scenarios. The plots express coordinator expectations but do not yet
    generically check intent, trace, and plan artifact outputs.
  constraints:
    - All changes stay under agent-harness/.
    - wrapper/, template/, sources/, invariants, and acceptance criteria remain untouched.
    - The library remains descriptive and cites existing INV-* and AC-* rules.
    - Existing scenario seeds, budgets, identities, and AC-36 behavior are preserved.
    - The generated-case overlay is limited to host lane and per-host budgets.
  decisions:
    - Use coordinator_must descriptions for expected coordinator outputs and keep internal filenames out of the human-facing Dialogue.
    - Use the existing agent-harness/test-template-runtime.sh acceptance bridge rather than modifying test/acceptance.sh.
    - Keep Product Knowledge impact empty; this source-only harness change does not silently write durable context.
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: CSL-001
    title: Define the plot source and refit stale v1.0 conversations
    repositories: [context-circuit-source]
    paths:
      - agent-harness/conversations/README.md
      - agent-harness/conversations/FLOW.md
      - agent-harness/conversations/coverage/
      - agent-harness/conversations/plots/
      - agent-harness/README.md
      - agent-harness/scenarios/README.md
    depends_on: []
    changes:
      - Establish the external-surface inventory and plot/spec/dialogue parsing conventions.
      - Make coordinator_must descriptions explicit about expected coordinator outputs, including intent artifacts and downstream trace/plan outputs, while keeping Dialogues free of internal filenames.
      - Refit feasibility, product-knowledge, system-design, delivery, tier, and legacy-label documentation to current v1.0 behavior.
      - Correct stale counts and acceptance-criterion mappings without editing the externally owned criteria map.
    acceptance:
      - id: CSL-AC-001
        statement: Every catalog entry has one complete plot with Spec and Dialogue, and every plot names coordinator expectations, reporting rules, and an expected terminal outcome.
      - id: CSL-AC-002
        statement: Intent-flow plots describe the expected intent, trace, and plan outputs in coordinator expectations while their human-facing Dialogues do not expose internal filenames, ids, or mechanics.
      - id: CSL-AC-003
        statement: All plot citations resolve to the current invariant and acceptance surfaces, and the refit contains no retired lifecycle rule or stale operation name.
    verification:
      - id: CSL-VT-001
        command: sh agent-harness/conversations/test-library.sh --check descriptive-only
      - id: CSL-VT-002
        command: sh agent-harness/conversations/test-library.sh --check reporting-rules
      - id: CSL-VT-003
        command: sh agent-harness/conversations/test-library.sh --check dialogue-faithful
  - id: CSL-002
    title: Generate cases deterministically and guard inventory-to-live drift
    repositories: [context-circuit-source]
    paths:
      - agent-harness/conversations/generate.sh
      - agent-harness/conversations/test-library.sh
      - agent-harness/conversations/generated/
      - agent-harness/scenarios/
    depends_on: [CSL-001]
    changes:
      - Implement plot-only deterministic generation with full semantic-field propagation and a bounded host/budget overlay.
      - Define the canonical generated-to-live scenario relationship and enforce bijection, orphan, hand-edit, and plot-edit drift failures.
      - Add mutation checks for non-decorative and decorative Spec fields.
    acceptance:
      - id: CSL-AC-004
        statement: Regeneration of all cases is byte-identical outside the enumerated overlay, reads no committed generated case as input, and every semantic Spec field is traceably propagated.
      - id: CSL-AC-005
        statement: The generated case set and live scenario set have the documented bijective relationship, and inventory, plot, generated case, and live scenario drift fails mechanically.
      - id: CSL-AC-006
        statement: Only the host lane and per-host budgets are overlay data; all other case semantics derive from plots.
    verification:
      - id: CSL-VT-004
        command: sh agent-harness/conversations/generate.sh --check-all
      - id: CSL-VT-005
        command: sh agent-harness/conversations/test-library.sh --check wiring
      - id: CSL-VT-006
        command: sh agent-harness/conversations/test-library.sh --check drift
  - id: CSL-003
    title: Add artifact-aware grading and required harness capabilities
    repositories: [context-circuit-source]
    paths:
      - agent-harness/human/run-scenario.sh
      - agent-harness/human/grade.sh
      - agent-harness/human/run-matrix.sh
      - agent-harness/human/drivers/
      - agent-harness/fixtures/
      - agent-harness/human/test-*.sh
    depends_on: [CSL-002]
    changes:
      - Add intent, trace, and plan artifact/state predicates needed by coordinator expectations and post-conditions.
      - Add id-agnostic entity binding, falsifiable post-condition negatives, new seeds, faults, and host-aware access auditing.
      - Preserve disposable workspace setup and the Codex/Cursor access-audit degradation.
    acceptance:
      - id: CSL-AC-007
        statement: Intent-flow cases can verify the expected intent artifacts and downstream trace/plan state without requiring fixed generated ids or exposing internal names to the simulated human.
      - id: CSL-AC-008
        statement: Every generated post-condition is individually falsifiable, and every enumerated new fixture or predicate has a failing negative fixture.
      - id: CSL-AC-009
        statement: Host-specific access evidence remains honest and no credentials or provider payloads enter the harness artifacts.
    verification:
      - id: CSL-VT-007
        command: sh agent-harness/conversations/test-library.sh --check id-agnostic
      - id: CSL-VT-008
        command: sh agent-harness/conversations/test-library.sh --check falsifiable
      - id: CSL-VT-009
        command: sh agent-harness/conversations/test-library.sh --check new-fixtures
  - id: CSL-004
    title: Rebuild the corpus and wire the live execution floor
    repositories: [context-circuit-source]
    paths:
      - agent-harness/conversations/generated/
      - agent-harness/scenarios/
      - agent-harness/conversations/coverage/
      - agent-harness/test-template-runtime.sh
      - agent-harness/human/
    depends_on: [CSL-003]
    changes:
      - Regenerate the 22 existing cases from plots while preserving calibrated seeds, budgets, and identities.
      - Add and execute the frozen net-new successful conversation cases through the live coordinator when host lanes are available.
      - Gate the library checks through the existing acceptance bridge and keep AC-36 deterministic scenario behavior unchanged.
    acceptance:
      - id: CSL-AC-010
        statement: The 22 existing cases retain their calibrated setup and assertion strength, and AC-36 remains unchanged and green.
      - id: CSL-AC-011
        statement: Every frozen net-new successful conversation case reaches its expected live grade, while explicitly expected failure cases assert their specific failure mode.
      - id: CSL-AC-012
        statement: The implementation diff is fenced to agent-harness/ and the baseline acceptance suite remains green.
    verification:
      - id: CSL-VT-010
        command: sh agent-harness/conversations/test-library.sh --check regeneration-equivalence
      - id: CSL-VT-011
        command: sh test/scenarios/test-scenarios.sh
      - id: CSL-VT-012
        command: sh test/acceptance.sh
      - id: CSL-VT-013
        command: sh agent-harness/human/run-matrix.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
