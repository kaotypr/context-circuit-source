schema_version: 2
plan: 0013-run-stack-substrate
title: "Run-stack substrate: plan dependencies, path leases, and execution bases"
status: done
objective: >-
  Add the substrate for running a set of approved plans together: optional
  inter-plan dependencies, (repository, path) leases, and runtime-selected
  execution bases, so any conflict becomes a scheduling decision before a worker
  runs, never a merge collision after.
repositories:
  - id: context-circuit-source
    purpose: Hosts the plan schema bump, lease schema, and base-selection runtime.
plan_dependencies:
  - id: 0004-planning
    reason: Extends the plan contract with inter-plan plan_dependencies.
  - id: 0005-approval-and-execution
    reason: Generalizes the one-writer lock and worktree/branch model.
product_knowledge:
  - id: invariants
    path: wrapper/contracts/invariants.yaml
    reason: INV-PLAN-05, INV-CONCURRENCY-01/02 are owned here.
  - id: design-deltas
    path: context/DESIGN-DELTAS.md
    reason: The v0.6 coordinated contract bump and run-stack rationale.
context_grounding:
  summary: >-
    plan.yaml gains optional plan_dependencies (requires schema_version 2); path
    leases generalize the one-writer lock to path regions; the runtime selects a
    base per repository (anchor, single predecessor, or integration merge).
  constraints:
    - Declaring plan_dependencies requires schema_version 2; the graph is acyclic (INV-PLAN-05).
    - A lease is held from execution start until delivery, not merely verification (INV-CONCURRENCY-01).
    - An integration merge is runtime-authored and never counts as a worker attempt (INV-CONCURRENCY-02).
  decisions:
    - This plan owns the shared v0.6 bump (plan schema [1,2], runtime_version 0.6.0).
knowledge_impact:
  expected_context_units: []
  review_on_completion: false
tasks:
  - id: RSS-001
    title: Plan-dependency contract and coordinated version bump
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/schemas/plan.yaml
      - wrapper/manifest.yaml
      - wrapper/runtime/engine.sh
    depends_on: []
    changes:
      - Add optional plan_dependencies to plan.yaml and require schema_version 2.
      - Accept plan schema [1, 2] and set runtime_version 0.6.0 in the manifest.
      - Validate acyclic, existing, non-self dependency references.
    acceptance:
      - id: RSS-AC-01
        statement: A plan declaring plan_dependencies without schema_version 2 is rejected.
      - id: RSS-AC-02
        statement: A cyclic or unknown dependency reference is rejected.
    verification:
      - id: RSS-VT-01
        command: sh test/contracts/test-contracts.sh
  - id: RSS-002
    title: Path leases
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/schemas/lease.yaml
      - wrapper/runtime/engine.sh
    depends_on: [RSS-001]
    changes:
      - Author the lease record shape under .runtime/locks/paths/.
      - Implement acquire/check/release with overlap and descendant-exemption rules.
    acceptance:
      - id: RSS-AC-03
        statement: A non-descendant plan cannot acquire an overlapping path region.
      - id: RSS-AC-04
        statement: A live lease is never silently stolen; a competitor is read-only or blocked.
    verification:
      - id: RSS-VT-02
        command: sh test/concurrency/test-leases.sh
  - id: RSS-003
    title: Execution base selection
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/schemas/execution.yaml
      - wrapper/runtime/engine.sh
    depends_on: [RSS-002]
    changes:
      - Select the base per repository (anchor, single predecessor, or merge).
      - Record based_on/base_commit and keep base refs at refs/cc-base/<plan>/<repo>.
      - Rebuild a stale base when a predecessor is repaired.
    acceptance:
      - id: RSS-AC-05
        statement: A two-or-more predecessor base is a runtime-authored integration merge.
      - id: RSS-AC-06
        statement: A base that cannot be built cleanly is blocked, not a worker failure.
    verification:
      - id: RSS-VT-03
        command: sh test/run-stack/test-run-stack.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
