schema_version: 3
plan: 0013-cleanup-explore-worktrees
intent: i011-cleanup-explore-copies
title: Runtime cleanup also removes Explore worktrees
status: draft
objective: >-
  An explicit human request to clean up runtime leftovers must also remove
  Explore worktrees under .runtime/explore/. Cleanup remains a separate
  explicit action and must not delete a still-live session.
repositories:
  - id: context-circuit-source
    purpose: Owns runtime cleanup and Explore worktree lifecycle.
plan_dependencies:
  - id: 0012-explore-session-path
    reason: Cleanup must target .runtime/explore/ and human-chosen names.
product_knowledge:
  - id: direct-collaboration
    path: context/domains/direct-collaboration/README.md
    reason: Closing a clean session preserves the worktree until explicit cleanup.
  - id: plan-execution
    path: context/domains/plan-execution/README.md
    reason: Failed work is never silently cleaned up.
context_grounding:
  summary: >-
    Derived from the approved i011 contract without a tracer, at explicit
    human request. Stacked after 0012 so cleanup targets the new Explore path.
  constraints:
    - Cleanup is never automatic on session close.
    - A still-live Explore session is not removed without an explicit request.
  decisions:
    - Keep one plan with two sequential tasks, stacked on 0012.
knowledge_impact:
  expected_context_units:
    - direct-collaboration
  review_on_completion: true
tasks:
  - id: CLN-001
    title: Teach cleanup about Explore worktrees
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/
      - wrapper/runtime/
      - agents/coordinator.md
      - context/domains/direct-collaboration/
    depends_on: []
    changes:
      - An explicit runtime-cleanup request removes Explore worktrees under .runtime/explore/ as well as plan-execution worktrees.
    acceptance:
      - id: CLN-AC-001
        statement: An explicit runtime-cleanup request removes Explore worktrees as well as plan-execution worktrees.
      - id: CLN-AC-002
        statement: After Explore worktrees move to .runtime/explore/, cleanup still finds and removes them there.
      - id: CLN-AC-003
        statement: Closing a clean Explore session does not delete its worktree by itself, and a still-live session is not removed unless cleanup was explicitly asked.
    verification:
      - id: CLN-VT-001
        command: rg -n 'cleanup|runtime/explore|pair-close|worktree' .agents/skills/cc-pair/SKILL.md agents/coordinator.md wrapper/runtime/engine.sh context/domains/direct-collaboration/README.md
  - id: CLN-002
    title: Prove Explore worktrees are included
    repositories: [context-circuit-source]
    paths:
      - test/pairing/
      - test/acceptance.sh
    depends_on:
      - CLN-001
    changes:
      - Add coverage that fails if a cleanup request leaves Explore worktrees behind, and fails if a live Explore session is deleted without asking.
    acceptance:
      - id: CLN-AC-001
        statement: Cleanup inclusion and no-silent-delete are proven.
    verification:
      - id: CLN-VT-002
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
