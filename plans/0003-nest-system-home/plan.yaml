schema_version: 3
plan: 0003-nest-system-home
intent: i017-nest-system-home
title: Nest Context Circuit system files under .context-circuit
status: done
objective: >
  Context Circuit's shipped wrapper, role files, and product docs live
  under .context-circuit/ so the workspace root is the project's. Hosts
  still enter through thin root pointers and .agents/. New and upgraded
  workspaces match without moving the user's project files.
repositories:
  - id: context-circuit-source
    purpose: >
      Owns the shipped layer, role files, product docs, assembler, skills,
      tests, and Product Knowledge that currently assume top-level
      wrapper/, agents/, and docs/.
plan_dependencies: []
product_knowledge:
  - id: host-adapters
    path: context/domains/host-adapters/README.md
    reason: >
      Hosts enter through root AGENTS.md / WORKFLOW.md and thin adapters.
      After the nest those files stay at root as pointers into
      .context-circuit and must not become a second copy of the product.
  - id: source-release-and-upgrade
    path: context/domains/source-release-and-upgrade/README.md
    reason: >
      Assembler, shipped/never-ship sets, and upgrade preservation. The
      shipped layer's shape becomes nested; template/ stays the source-root
      seed; workspace-owned files stay unmoved.
  - id: repository-grounding
    path: context/domains/repository-grounding/README.md
    reason: >
      Worker-brief lives beside the runtime. The lookup must follow the
      nested wrapper or grounding and pairing fail.
  - id: tracing
    path: context/domains/tracing/README.md
    reason: >
      Schema and role paths move with the product home; intent/ stays at
      the workspace root.
context_grounding:
  summary: >
    Grounded in intent/i017-nest-system-home/trace/context-circuit-source.yaml
    at HEAD 50cb84d. The product home is hardcoded across the engine's
    worker-brief lookup (engine.sh 1455-1456), release-artifact.sh staging
    of top-level wrapper/agents/docs, skills that invoke
    wrapper/runtime/engine.sh, test/lib/assert.sh, every test eng() helper,
    and ~30 harness plots. Completeness proof found 718 old-home path
    references. Host discovery and skill discovery stay at root. Four
    topic slices share one execution and one independent verification
    surface (test/acceptance.sh); stacked plans would invent false
    independence because a move without retargeting fails every suite.
  constraints:
    - Nested home is .context-circuit/wrapper, .context-circuit/agents,
      and .context-circuit/docs. Nest, do not flatten.
    - Host-required discovery stays at the surfaces hosts already look at.
      .agents/ stays at the workspace root.
    - The blank template seed remains template/ at the source root.
    - An upgrade may replace template-owned files and must preserve
      workspace-owned files; report migration-needed when meaning changes.
    - Do not change gates, tracer, verifier floor, or self-verify.
    - Do not move workspace-owned files into .context-circuit.
    - Do not rename the wrapper or drop the wrapper/template split.
    - Do not add a new host, router, or runtime scheduler.
    - Preserve unrelated and dirty work; run the semantic acceptance suite
      after meaningful phases.
  decisions:
    - One plan with four ordered tasks in this repository. Move, host
      front door, assembler/upgrade, and leftover retarget share one worker
      lifecycle and one independent verification surface. A move-only
      change leaves assert.sh and skills pointing at a missing engine;
      an assembler-only change ships the old layout from an unmoved source.
    - Engine-internal lookups use a single product-home helper
      (.context-circuit/wrapper from the workspace root), used by
      worker-brief assemble and a workspace-validate nested-home probe.
      Skills, tests, and harness invoke
      .context-circuit/wrapper/runtime/engine.sh explicitly. No second
      runtime and no path-rewriting layer.
    - No new upgrade engine verb. Document the layout move in
      wrapper/migrations/README.md and upgrade_boundary. The assembler
      emits the nested home. An existing workspace is upgraded by replacing
      template-owned product trees and root pointers while preserving
      workspace-owned files. If a record's meaning still depends on
      top-level wrapper/, report migration-needed. repository-binding-migrate
      stays the workspace-owned-file precedent.
    - Source-checkout AGENTS.md stays maintainer-specific, retargeted to
      nested paths. Instantiated workspaces and the assembled artifact get
      the thin product pointer copied from
      .context-circuit/wrapper/adapters/AGENTS.md.
    - cc_workspace_validate gains a nested-home probe so a workspace
      missing .context-circuit/wrapper fails closed.
    - template/ stays at the source root as seed identity. Assembly still
      copies product trees from the source checkout.
    - Source-only docs/release.md moves with docs/ in this checkout and
      remains excluded from the release-manifest ship set.
    - .agents/ stays at the workspace root (already answered). docs/ moves
      (already answered).
knowledge_impact:
  expected_context_units:
    - host-adapters
    - source-release-and-upgrade
    - repository-grounding
    - tracing
  review_on_completion: true
tasks:
  - id: NEST-001
    title: Move wrapper, agents, and docs under .context-circuit and retarget the runtime
    repositories: [context-circuit-source]
    paths:
      - wrapper/
      - agents/
      - docs/
      - .context-circuit/
    depends_on: []
    changes:
      - >
        Git-move wrapper/, agents/, and docs/ to .context-circuit/wrapper,
        .context-circuit/agents, and .context-circuit/docs as folders. Do
        not flatten contents into .context-circuit/. Do not move .agents/,
        context/, plans/, intent/, template/, or .runtime/.
      - >
        Add a product-home helper in engine.sh that resolves
        .context-circuit/wrapper from the workspace root. Use it in
        cc_worker_brief_assemble (today hardcoded
        $cc_wb_root/wrapper/runtime/worker-brief.md and
        wrapper/adapters/worker-brief.md) and in a cc_workspace_validate
        probe that fails when the nested wrapper is missing. Keep the
        rest of validate's current shape.
      - >
        Retarget wrapper/manifest.yaml runtime.entrypoint,
        release_boundary.shipped, and upgrade_boundary.wrapper_only to the
        nested paths. Keep .agents/skills/ at workspace root in shipped.
      - >
        Retarget invariants.yaml owner map values under wrapper/, agents/,
        and docs/ to .context-circuit/... Keep skill_packets at
        .agents/skills/, authority_order at WORKFLOW.md, source_boundary
        at AGENTS.md, product_knowledge at context/INDEX.md.
      - >
        Retarget schema owner: fields under wrapper/contracts/schemas/ to
        the nested prefix, including trace-manifest.yaml and
        intent-contract.yaml cites.
      - >
        Update wrapper/migrations/README.md product-folder sentences to
        the nested home (layout-upgrade steps land in NEST-003).
    acceptance:
      - id: NEST-AC-001
        statement: >
          In the source checkout, .context-circuit/wrapper,
          .context-circuit/agents, and .context-circuit/docs exist, and
          there is no leftover product wrapper/, agents/, or docs/ at the
          workspace root.
      - id: NEST-AC-002
        statement: >
          The runtime finds the nested home: worker-brief assemble and
          engine invoke use .context-circuit/wrapper/.... A workspace
          missing that nested wrapper fails validate loudly.
    verification:
      - id: NEST-VT-001
        command: >
          test -d .context-circuit/wrapper && test -d .context-circuit/agents
          && test -d .context-circuit/docs && test ! -e wrapper && test ! -e
          agents && test ! -d docs
      - id: NEST-VT-002
        command: >
          awk '/^cc_worker_brief_assemble\(\)/,/^}/'
          .context-circuit/wrapper/runtime/engine.sh |
          grep -F '.context-circuit/wrapper';
          awk '/^cc_workspace_validate\(\)/,/^}/'
          .context-circuit/wrapper/runtime/engine.sh |
          grep -F '.context-circuit/wrapper'
  - id: NEST-002
    title: Keep workspace-root host discovery as thin pointers
    repositories: [context-circuit-source]
    paths:
      - .context-circuit/wrapper/adapters/
      - AGENTS.md
      - WORKFLOW.md
      - CLAUDE.md
      - CURSOR.md
      - .cursor/rules/role-tiering-spawn.mdc
    depends_on: [NEST-001]
    changes:
      - >
        Rewrite .context-circuit/wrapper/adapters/AGENTS.md, CLAUDE.md,
        CURSOR.md, and WORKFLOW.md so coordinator, role, contract, engine
        invoke, and docs/role-tiering paths point at
        .context-circuit/agents, .context-circuit/wrapper, and
        .context-circuit/docs. Keep .agents/ at workspace root. These
        adapter files remain the product text under the nested home.
      - >
        Source-checkout root CLAUDE.md, CURSOR.md, and
        .cursor/rules/role-tiering-spawn.mdc become thin pointers into
        .context-circuit (same as today's import of adapters). Root
        AGENTS.md stays maintainer-specific source safety, retargeted to
        nested paths, and is not a second copy of the product adapter.
        Root WORKFLOW.md retargets its adapter pointer.
      - >
        After NEST-003's assembler copy, instantiated-workspace root
        AGENTS.md / WORKFLOW.md / CLAUDE.md / CURSOR.md are the thin
        adapter copies, not the maintainer source AGENTS.md.
    acceptance:
      - id: NEST-AC-003
        statement: >
          Root AGENTS.md / WORKFLOW.md / CLAUDE.md / CURSOR.md exist and
          point into .context-circuit. They do not carry a second copy of
          the product. .agents/ remains at the workspace root.
    verification:
      - id: NEST-VT-003
        command: >
          test -f AGENTS.md && test -f WORKFLOW.md && test -d .agents/skills
          && rg -n '\\.context-circuit' AGENTS.md WORKFLOW.md CLAUDE.md
          CURSOR.md
      - id: NEST-VT-004
        command: >
          test -f .context-circuit/wrapper/adapters/AGENTS.md &&
          test ! -d wrapper/adapters &&
          rg -n 'must not read' AGENTS.md; test $? -ne 0
  - id: NEST-003
    title: Ship the nested home in the template and in upgrades
    repositories: [context-circuit-source]
    paths:
      - scripts/release-artifact.sh
      - scripts/release-manifest.txt
      - scripts/build-dist.sh
      - .context-circuit/wrapper/migrations/README.md
      - test/release/
      - agent-harness/test-template-runtime.sh
    depends_on: [NEST-001]
    changes:
      - >
        release-artifact.sh stages .agents plus
        .context-circuit/{wrapper,agents,docs}; mkdir .context-circuit in
        the stage tree. Adapter copies to root AGENTS.md CLAUDE.md
        CURSOR.md WORKFLOW.md README.md read from
        .context-circuit/wrapper/adapters/*. Worker-brief promote target
        is .context-circuit/wrapper/runtime/worker-brief.md. Schema
        fixture loop and runtime_version read use the nested manifest and
        schemas. Keep the leaked-adapters exclusion.
      - >
        Prefix every required wrapper/, agents/, and docs/ path in
        scripts/release-manifest.txt with .context-circuit/. Keep required
        .agents/skills/* and root adapter files.
      - >
        build-dist.sh reads
        .context-circuit/wrapper/manifest.yaml. Retarget
        scripts/resolve-release-version.sh only if it names
        wrapper/manifest.yaml.
      - >
        Document the layout upgrade in wrapper/migrations/README.md: an
        existing workspace with root wrapper/, agents/, or docs/ has those
        template-owned trees moved under .context-circuit/; root pointers
        are retargeted; context/, plans/, intent/, .runtime/, identity,
        and bindings are preserved. If a record's meaning still depends on
        top-level wrapper/, report migration-needed and preserve the old
        state. No new engine verb.
      - >
        Update test/release/test-release.sh, test/release/test-publish.sh,
        and agent-harness/test-template-runtime.sh to expect nested
        artifact paths and a nested engine in the instantiated workspace.
    acceptance:
      - id: NEST-AC-004
        statement: >
          The assembled template artifact uses
          .context-circuit/{wrapper,agents,docs}, not root wrapper/. Root
          adapters and .agents/ still ship.
      - id: NEST-AC-005
        statement: >
          Upgrade guidance moves template-owned product folders under
          .context-circuit/, preserves workspace-owned files, and reports
          migration-needed when a record's meaning still depends on a
          top-level wrapper/ path.
    verification:
      - id: NEST-VT-005
        command: >
          rg -n 'tar .*wrapper|stage .agents agents docs wrapper'
          scripts/release-artifact.sh; test $? -ne 0;
          rg -n '\\.context-circuit/wrapper' scripts/release-artifact.sh
          scripts/release-manifest.txt scripts/build-dist.sh
      - id: NEST-VT-006
        command: sh test/release/test-release.sh && sh agent-harness/test-template-runtime.sh
  - id: NEST-004
    title: Retarget leftover product paths and prove the old root homes are gone
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/
      - test/
      - agent-harness/
      - context/
      - README.md
    depends_on: [NEST-001, NEST-002, NEST-003]
    changes:
      - >
        Retarget every skill invoke and path cite of wrapper/, agents/,
        and docs/ (cc-intent, cc-execute, cc-trace, cc-verify, cc-run-stack,
        cc-pair, cc-publish, and any other cc-* skill that names those
        homes) to .context-circuit/.... Keep .agents/ at workspace root.
      - >
        Retarget test/lib/assert.sh to source
        $ROOT/.context-circuit/wrapper/runtime/engine.sh. Retarget
        test/contracts W= and agents/docs assertions, every test eng()
        helper and $ROOT/wrapper/runtime/engine.sh invoke, grounding
        fixtures, and agent-harness ENGINE paths
        (test-template-runtime.sh, human/run-scenario.sh, grade.sh,
        test-direct-collaboration-scenario.sh).
      - >
        Update ~30 agent-harness scenario forbidden/allowed engine and
        role paths, and the matching conversation plots. Regenerate
        generated/*.case.yaml from plots; do not hand-edit generated
        cases as source of truth. Keep forbidden sources/** and
        plans/archive/**.
      - >
        Retarget Product Knowledge path cites in context/domains/*,
        context/TERMINOLOGY.md, context/DECISIONS.md,
        context/ARCHITECTURE.md, context/INDEX.md, and maintainer README
        layout lists. Keep historical decision titles that name the
        2026-08-21 wrapper/template split as history, but any instruction
        that names the live product home uses .context-circuit/....
      - >
        Prove workspace-owned trees stayed at root. Do not move
        .agents/, context/, plans/, intent/, template/, or .runtime/.
    acceptance:
      - id: NEST-AC-006
        statement: >
          Skills, tests, harness plots, and Product Knowledge that named
          the old homes now name .context-circuit/.... The leftover-path
          completeness check has zero actionable matches.
      - id: NEST-AC-007
        statement: >
          Workspace-owned trees (context/, plans/, intent/, template/,
          identity, runtime evidence) stay at the workspace root and are
          not under .context-circuit/.
      - id: NEST-AC-008
        statement: >
          Lifecycle, one-owner-per-rule, invoke-not-read, and host-blocked
          fail-closed are unchanged.
    verification:
      - id: NEST-VT-007
        command: >
          rg -n --glob '!**/archive/**' --glob '!**/intent/archive/**'
          --glob '!**/plans/context-circuit-plans/**' --glob '!**/sources/**'
          --glob '!intent/i017-nest-system-home/**' --glob '!**/.claude/**'
          '(^|[[:space:]`\"'"'"'(])wrapper/|(^|[[:space:]`\"'"'"'(])agents/|(^|[[:space:]`\"'"'"'(])docs/|\$ROOT/wrapper|\$W/|wrapper/runtime/engine\.sh|agents/(coordinator|worker|verifier|tracer)\.md'
          .context-circuit .agents context template test agent-harness
          scripts .cursor AGENTS.md WORKFLOW.md CLAUDE.md CURSOR.md README.md;
          test $? -ne 0
      - id: NEST-VT-008
        command: >
          test -d context && test -d plans && test -d intent && test -d
          template && test ! -e .context-circuit/context && test ! -e
          .context-circuit/plans && test -d .agents/skills && test ! -e
          .context-circuit/.agents
      - id: NEST-VT-009
        command: sh test/acceptance.sh
execution:
  worker: one
  independent_verifier: required
  max_worker_failures: 3
