version: 1
template_version: 1.0.0
workspace:
  name: uninitialized-workspace
  mode: solo
  default_branch: main
# Shared repository identity belongs here. Host-local paths belong only in the
# ignored root repositories.local.yaml file.
repositories: {}
context:
  sources_file: context/sources.yaml
workflow:
  human_gates:
    - identity-acceptance
    - context-acceptance
    - plan-approval
    - execution-trigger
    - status-change
    - takeover
    - delivery
    - archive
    - cleanup
  wrapper_change_policy: preserve-runtime

identity:
  kind: instantiated-workspace
  status: uninitialized
