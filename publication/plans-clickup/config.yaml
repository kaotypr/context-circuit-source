schema_version: 1
publication: plans-clickup
kind: plan
provider: clickup
direction: export
trigger: manual
instructions: >-
  Publish the 20 maintainer implementation plans under an existing ClickUp story
  as a dated 4-week work schedule. Author in English (the source plan language),
  plain and self-contained per INV-EXTERNAL-03: no workspace paths, file names,
  or internal AC-/VR- ids in external text. Each plan becomes a subtask of the
  story; each plan's tasks become nested subtasks; acceptance is a markdown
  checklist in the subtask description. Enrich each plan (best-effort, one-way):
  native Dates (start_date/due_date) and native Time estimate. Schedule model:
  a single-track workday calendar starting 2026-08-17, 8 hours per workday,
  weekends skipped, effort complexity-weighted across plans and summing to 20
  workdays (160 hours) so the span is exactly four weeks (2026-08-17 to
  2026-09-11); Time estimate is workdays x 8h. Plan dependencies and task
  depends_on are realized as ClickUp "waiting on" links. Status is one-way todo.
reads:
  - plans
  - tasks
