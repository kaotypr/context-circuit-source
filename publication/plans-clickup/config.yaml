schema_version: 1
publication: plans-clickup
kind: plan
provider: clickup
direction: export
trigger: manual
instructions: >-
  Publish the 25 maintainer implementation plans (the v0.5/v0.6 set 0001-0020
  and the v0.6.1 refinements 0021-0025) under an existing ClickUp story as a
  dated work schedule. Author in English (the source plan language), plain and
  self-contained per INV-EXTERNAL-03: no workspace paths, file names, or internal
  AC-/VR- ids in external text. Each plan becomes a subtask of the story; each
  plan's tasks become nested subtasks; acceptance is a markdown checklist in the
  subtask description. Enrich each plan (best-effort, one-way): native Dates
  (start_date/due_date) and native Time estimate. Schedule model: a single-track
  workday calendar starting 2026-08-17, 8 hours per workday, weekends skipped.
  The base set 0001-0020 is effort complexity-weighted and sums to 20 workdays
  (160 hours), so its span is four weeks (2026-08-17 to 2026-09-11); Time
  estimate there is workdays x 8h. The v0.6.1 refinements 0021-0025 are appended
  after that span, continuing from the next workday (2026-09-14) on the same
  single-track calendar; because that work is AI-assisted, each estimate is
  smaller than a full workday and several pack into one 8-hour day - 0021 2h,
  0022 3h, 0023 2h on 2026-09-14, then 0024 4h, 0025 2h on 2026-09-15 - and Time
  estimate is the AI-assisted hours. Plan dependencies and task depends_on are
  realized as ClickUp "waiting on" links. Status is one-way todo.
reads:
  - plans
  - tasks
