version: 1
template_version: 0.3.0

workspace:
  name: uninitialized-workspace
  mode: team
  default_branch: development

# An empty registry is a valid first-run state. Initialization may replace this
# with one or more repository/project entries after the user confirms their
# paths, roles, and default active branches.
repositories: {}

context:
  sources_file: context/sources.yaml

workflow:
  human_gates:
    - plan-approval
    - status-change
    - publication
    - archive
  wrapper_change_policy: pull-request
