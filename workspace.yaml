version: 1
template_version: 1.0.0

workspace:
  name: context-circuit-source
  mode: solo
  default_branch: development

repositories:
  context-circuit-source:
    canonical_url: https://github.com/kaotypr/context-circuit.git
    default_branch: main

context:
  sources_file: context/sources.yaml

workflow:
  human_gates:
    - source-release
    - wrapper-change
    - publication
  wrapper_change_policy: pull-request
identity:
  kind: product-source
  product: Context Circuit
  release_seed: template/
