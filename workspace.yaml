version: 1
template_version: 0.3.0

workspace:
  name: uninitialized-workspace
  mode: team
  default_branch: development

repositories:
  context-circuit:
    path: .
    mode: submodule
    role: Context Circuit framework source; Product Knowledge and workflow
      capability is developed through plan-scoped repository worktrees.
    agent: repository-worker
    default_branch: development

context:
  sources_file: context/sources.yaml

workflow:
  human_gates:
    - plan-approval
    - task-selection
    - status-change
    - publication
    - archive
  wrapper_change_policy: pull-request
