version: 1
template_version: 0.2.0

workspace:
  name: uninitialized-workspace
  mode: team
  default_branch: main

repositories: {}

activity:
  provider: none
  access: auto
  required_capabilities: []
  optional_capabilities: []

workflow:
  human_gates:
    - plan-approval
    - task-selection
    - merge
  maximum_repair_attempts: 2
  wrapper_change_policy: pull-request
