version: 1
template_version: 0.2.1

workspace:
  name: uninitialized-workspace
  mode: team
  default_branch: main

repositories:
  context-circuit:
    path: .
    mode: submodule
    role: Context Circuit framework source; Product Knowledge and workflow capability
      is developed in-place by maintainer commits, not run-task worktree fan-out.
    agent: repository-worker
    default_branch: main

activity:
  provider: none
  access: auto
  required_capabilities: []
  optional_capabilities: []

workflow:
  human_gates:
    - plan-approval
    - task-selection
    - scope-expansion
    - merge
  maximum_repair_attempts: 2
  wrapper_change_policy: pull-request
