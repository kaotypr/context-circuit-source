schema_version: 2
intent: i007-intent-page-status
title: Keep INTENT.md status truthful after a feasible tracer
goal: >
  After the tracer finishes with no follow-up questions and the coordinator
  marks the intent feasible, the INTENT.md status line is updated to match
  that completed feasible tracer so it cannot stay behind that fact.
  contract.yaml remains the authority for identifiers and approval.

non_goals:
  - Replacing contract.yaml as the machine authority for approval and digest.
  - Adding a second human approval of plans.
  - Changing what intent approval means, except as needed to keep the
    INTENT.md status line in sync after a feasible tracer.
  - Delivering, publishing, merging, or committing the implementation implicitly.

constraints:
  - INTENT.md stays the short five-section human file; do not add a sixth
    section to explain status.
  - The chosen rule must be one owner, not a skill-only note that INTENT.md
    then ignores.
  - The INTENT.md status line stays and must stay in sync after a feasible
    tracer with no follow-up questions.
  - Preserve unrelated and dirty work, and run the semantic acceptance suite
    after meaningful phases.

acceptance_criteria:
  - id: AC-NO-STALE-STATUS
    statement: >
      After a tracer completes with no follow-up questions and the feasibility
      check marks the intent feasible, INTENT.md does not keep a status that
      still looks like waiting, incomplete, or otherwise behind that fact.
  - id: AC-ONE-RULE
    statement: >
      The INTENT.md status line is kept and updated to match a completed
      feasible tracer; it is not removed.
  - id: AC-CONTRACT-REMAINS
    statement: >
      contract.yaml remains the authority for approval identity and frozen
      criteria; dropping or updating the INTENT.md status line does not
      create a second source of approval.

scope:
  repositories:
    - id: context-circuit-source

tier: standard
status: approved
contract_digest: sha256:749813cbdbe9be1113c63e4ba03d10c0714745e1e041f08ed8c07d5c00a0797b
