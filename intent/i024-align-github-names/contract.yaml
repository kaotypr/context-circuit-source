schema_version: 2
intent: i024-align-github-names
title: Align GitHub names with source and product identity
goal: >
  GitHub names match the three identities: this maintainer source lives at
  kaotypr/context-circuit-source, and the published Context Circuit template
  lives at kaotypr/context-circuit. This source's publication binding, publish
  Action, and workspace canonical URL follow those names. The swap does not
  itself publish a new template version or change the assembled product.

non_goals:
  - Publishing a new template version, GitHub Release, or GitLab Release solely
    because the GitHub names changed.
  - Changing template assembly, template_version, runtime_version, or any
    shipped product file in a way that would make the assembled tree differ.
  - Renaming or retargeting the GitLab mirror (GITLAB_TEMPLATE_PROJECT).
  - Changing how instantiated workspaces work, or migrating existing
    workspaces.
  - Rewriting historical design documents under sources/ as a required part of
    this change.
  - Replacing GitHub as the canonical template destination.
  - Mixing this change into unrelated dirty work already in the checkout.
  - Delivering, merging, or committing the implementation implicitly.

constraints:
  - Rename GitHub kaotypr/context-circuit to kaotypr/context-circuit-source
    before renaming kaotypr/context-circuit-template to kaotypr/context-circuit,
    so the short name is free. Do not fetch this clone against the old short
    name once the template occupies it.
  - GitHub remains the canonical published template; GitLab remains an optional
    mirror of the already-published tree (2026-09-09 decision).
  - Conceptual identities stay distinct: context-circuit-source (this
    checkout), context-circuit-template (the distributable product), and an
    instantiated project workspace.
  - Do not edit shipped files only to retarget GitHub names; that would force
    a template content bump.
  - Preserve unrelated and dirty work, and run the semantic acceptance suite
    after meaningful phases.
  - Credentials stay in GitHub Actions secrets (including TEMPLATE_REPO_TOKEN
    if it must be re-granted to the renamed template). Workspace files stay
    credential-free.

acceptance_criteria:
  - id: AC-SOURCE-GITHUB
    statement: >
      This maintainer source's GitHub repository is kaotypr/context-circuit-source.
  - id: AC-TEMPLATE-GITHUB
    statement: >
      The published template's GitHub repository is kaotypr/context-circuit.
  - id: AC-PUBLISH-TARGET
    statement: >
      The next template publication checks out and creates the GitHub Release
      on kaotypr/context-circuit, not kaotypr/context-circuit-template.
  - id: AC-WORKSPACE-URL
    statement: >
      This workspace's canonical GitHub URL names kaotypr/context-circuit-source.
  - id: AC-SOURCE-LINKS
    statement: >
      Source-side records that currently mean this repository's GitHub issues
      still mean this source after kaotypr/context-circuit is the template.
  - id: AC-NO-TEMPLATE-RELEASE
    statement: >
      This change does not publish a new template version and does not change
      the assembled product tree.
  - id: AC-GITLAB-UNCHANGED
    statement: >
      The GitLab mirror project path is not renamed or retargeted as part of
      this change.

scope:
  repositories:
    - id: context-circuit-source

tier: standard
status: approved
