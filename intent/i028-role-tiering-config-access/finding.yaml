open_questions:
  - id: 1
    disposition: plan-resolution
    question: >
      The approved intent says the fallback file holds "content you supplied"
      verbatim, but no bytes are recorded in INTENT.md, contract.yaml, or a
      detail/ directory. Two candidate contents exist in the checkout: the
      workspace-root role-tiering.local.yaml host matrix (this machine's real
      preference — claude-opus-5 / gpt-5.6-luna / composer-2.5-fast, no
      escalate_on_repair keys) and agent-harness/fixtures/role-tiering.yaml (a
      tracked, neutral, fully-specified matrix with escalate_on_repair on every
      role).
    carried_as: >
      The plan uses the workspace-root role-tiering.local.yaml hosts matrix
      verbatim (comment header replaced, no schema_version invented), because
      that is the only content the human actually supplied in this workspace.
      Flagged for the coordinator to confirm the exact bytes at plan review,
      since this file is committed and ships to every template consumer.
  - id: 2
    disposition: plan-resolution
    question: >
      Which files does AC-POINTERS-PRESENT mean by "AGENTS.md, CLAUDE.md,
      CURSOR.md"? In this source checkout the root copies are maintainer-facing
      and the shipped root files are built from
      .context-circuit/wrapper/adapters/{AGENTS,CLAUDE,CURSOR}.md
      (scripts/release-artifact.sh lines 40-42). Root CURSOR.md is byte-identical
      to its adapter source; root AGENTS.md and CLAUDE.md are not.
    carried_as: >
      The plan adds the pointer to both the three adapter sources (so the product
      ships it) and the three root maintainer copies (so this checkout's own
      agents see it) — six files, plus the four
      .context-circuit/agents/*.md role files.
  - id: 3
    disposition: plan-resolution
    question: >
      .context-circuit/role-tiering.fallback.yaml sits at the .context-circuit/
      root, which is inside no prefix of manifest.yaml release_boundary.shipped
      (.context-circuit/{wrapper,agents,docs}/) and inside no prefix of
      upgrade_boundary.wrapper_only, so the declared product boundary would not
      classify it even though release-artifact.sh tars the whole
      .context-circuit tree and would in fact copy it.
    carried_as: >
      The plan registers the path explicitly in manifest.yaml
      (release_boundary.shipped and upgrade_boundary.wrapper_only),
      scripts/release-manifest.txt (as `required`), and test/release/test-release.sh
      (require_file on the staged artifact). No new file beyond the one the
      contract names is added; only declarations are edited.
  - id: 4
    disposition: plan-resolution
    question: >
      What is the verb's name and stdout shape, given the runtime must stay
      model-blind (INV-RUNTIME-01) and must not resolve host groups or adapter
      defaults?
    carried_as: >
      `role-tiering-read ROOT`, matching the existing `member-identity-read`
      naming. It emits `source: local|fallback` and `path: <resolved path>` via
      cc_emit, then a `---` line, then the chosen file verbatim, and fails
      ROLE_TIERING_MISSING when neither file exists. It never selects a host
      group, applies a default, or interprets a model id — selection stays a
      coordinator/host decision.
  - id: 5
    disposition: plan-resolution
    question: >
      Three shipped skills already instruct an agent to read the file directly:
      .agents/skills/cc-execute/SKILL.md, cc-trace/SKILL.md, and
      cc-pair/SKILL.md all carry "workspace root" role-tiering access guidance,
      and test/contracts/test-contracts.sh pins those exact strings. Left as-is,
      the superseded access instruction survives in three places the owner doc
      now claims to own.
    carried_as: >
      Not changed under this intent. AC-POINTERS-PRESENT enumerates its seven
      files exactly, the skills are not among them, and existing acceptance
      assertions pin the skills' current wording. The plan records it as a named
      residual drift risk for the coordinator to spin into a follow-up intent.
tier_signal: >
  Standard confirmed. The change is additive and read-only at runtime: one new
  dispatch verb that prints an existing config file, one committed data file, and
  documentation pointers. It touches no gate, lease, execution record, candidate,
  verification, or completion semantics, and INV-HOST-01 / INV-RUNTIME-01 are
  unaffected because the verb prints and never selects. No tier escalation signal
  found; no tier lowering requested.
