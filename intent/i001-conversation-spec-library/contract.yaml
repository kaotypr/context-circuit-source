schema_version: 1
intent: i001-conversation-spec-library
title: Establish specification-by-example as the living specification of the agent harness
goal: >
  Make the specification-by-example ("conversation-spec-first") expected-conversation
  library the LIVING specification and generative source of the agent harness. One
  decision, realized end to end: author the whole-surface plots (a `## Spec` the grader
  consumes plus a readable `## Dialogue`) covering every lay-user interaction across the
  lifecycle; make those plots GENERATE the live scenario cases (each live
  scenarios/*/case.yaml IS a build artifact derived from a plot, never hand-authored);
  build the harness capability the plots need and run them against the live coordinator;
  and keep the library GROWING safely — editing a plot first is the only way to change a
  case, guarded so neither a hand-edited case nor an un-regenerated plot can linger. The
  harness's expected behavior is thereby defined by example, whole, per version, and
  cannot silently drift. The library stays descriptive: it references INV-*/AC-* and
  defines no rule.

non_goals:
  - Changing any product behavior, runtime, contract, invariant, or acceptance
    criterion. The library and this work stay descriptive; one-rule-one-owner intact.
  - Displacing the deterministic five-family suite (test/scenarios/test-scenarios.sh,
    AC-36); it stays the owner of the end-to-end families and stays unchanged.
  - Recreating the existing scenario cases from scratch; they are evolved (regenerated
    from plots) with their calibration preserved.
  - The file-rename, diagram-format, and flow-metadata organization enhancements
    (deferred).
  - Merging, pushing, publishing, or otherwise delivering this work (separate Gate 2).
  - Porting the runtime to a typed language.

constraints:
  - Source-only. Writes stay under agent-harness/ (the plots, the generator, the
    runner/grader, and the generated scenarios/*/case.yaml). No writes under
    wrapper/contracts/, the template/ seed, or sources/. The release manifest excludes
    the harness; nothing here ships in context-circuit-template.
  - Descriptive only — reference INV-*/AC-*, never define a rule; avoid the noun
    "contract" in the library (it collides with the intent contract.yaml).
  - The five acceptance-criteria corrections are case-file changes, not
    test/acceptance/criteria-map.yaml edits (the criteria map is owned elsewhere).
  - Regeneration preserves each case's calibrated seeds and per-host budgets exactly.
  - The environmental overlay is a FIXED, enumerated field set (per-host budgets and
    the host lane, and nothing else); every case field not in that set is plot-derived.
  - The net-new plot set is enumerated and frozen when the plan of record is authored —
    every plot the coverage docs mark as new (a plot with no rewired existing case).
  - On any plot/case disagreement, the plot is authoritative.
  - Conventional Commits (INV-COMMIT-01); no AI attribution. Run the semantic
    acceptance suite after meaningful phases.

# Criteria hardened across several review passes: each is
# falsifiable and non-gameable — no criterion is satisfiable by a generator that echoes
# or table-embeds committed cases, by a parallel generated tree beside untouched live
# cases, by vacuous post-conditions, by dumping nondeterminism into the overlay, or by
# weakening the suite. The third pass closed the completeness and drift-resolution gaps:
# the surface inventory is anchored to an external product enumeration (not self-drawn),
# plot citations must resolve to live invariants, drift is gated across all three layers
# (inventory↔plot↔case), the Dialogue must stay faithful to the Spec, and the
# live-execution floor cannot be dodged.
#
# Accepted residuals (a final confirming pass surfaced five reachable
# satisfy-and-still-wrong loopholes; the human accepted all five as known risks —
# none folded into the criteria, the contract was not edited):
#   1. AC-SURFACE-COVERAGE's "justified gap" hatch has no cap or closed reason enum —
#      one real plot plus everything-else-"deferred" passes.
#   2. AC-DESCRIPTIVE-ONLY only checks that cited ids resolve; a plot can still state
#      its own uncited rule ("retries 3 times") and pass (one-rule-one-owner leak).
#   3. AC-REGEN-EQUIV's pre-change live-execution floor is self-attested — the same
#      author can under-declare the "before" baseline.
#   4. The "avoid the noun 'contract' in the library" constraint has no enforcing
#      criterion; it lives in prose only.
#   5. AC-REGEN-EQUIV's seed/budget "intended edit" exception is unbounded — drift
#      can be waved through as intended.
acceptance_criteria:
  - id: AC-WHOLE-SURFACE
    statement: >
      Every entry in the plot catalog has a plot file (`## Spec` YAML + `## Dialogue`)
      under plots/ and a generated case under generated/; plot count == generated-case count.
    method: command
    surface: agent-harness/conversations/{plots,generated}
  - id: AC-SURFACE-COVERAGE
    statement: >
      The inventory of lay-user interactions is ANCHORED to an independently-owned external
      enumeration — the shipped product surface (the `.agents/skills/*` verb set and the
      WORKFLOW.md lifecycle phases) plus the AC-* acceptance surface — not a self-drawn list.
      The enumeration ALSO spans the coordinator's cross-cutting conversational outcomes that
      no single skill or phase names — at minimum out-of-scope/refusal, host-blocked, and
      clarification/orientation turns — so an interaction not expressible as a skill, phase,
      or AC still has a home in the oracle. A mechanical check asserts every lay-user entry
      point in that enumeration (skills, phases, AC-*, and the cross-cutting outcomes) appears
      as an inventory entry (a narrow inventory that omits real entry points FAILS), every
      inventory entry maps to at least one plot, and each intentional omission is a named,
      justified gap recorded AGAINST that external list rather than silence.
    method: command
    surface: the external surface enumeration + the inventory + the plot catalog
  - id: AC-DESCRIPTIVE-ONLY
    statement: >
      Every plot references invariant and/or acceptance-criterion ids and defines no rule
      or parallel policy of its own; and every INV-*/AC-* id a plot cites RESOLVES to a
      currently-defined id in its owning contract (wrapper/contracts/ for INV-*, the
      acceptance surface for AC-*). A stale, renamed, or typo'd citation FAILS in the
      acceptance suite, so a plot cannot drift away from the live rule set it describes.
    method: command
    surface: the plot files + wrapper/contracts/ + the acceptance surface
  - id: AC-REPORTING-RULES
    statement: >
      A static lint over every plot's Dialogue gates in the acceptance suite: it denies
      internal file-name/path/id/digest/branch/model patterns and flags overstated
      assurance, so a new or edited plot that leaks internals or overstates fails — not a
      one-time manual review.
    method: static
    surface: the lint + the plot dialogues
  - id: AC-DIALOGUE-FAITHFUL
    statement: >
      Each plot's readable `## Dialogue` is structurally consistent with its `## Spec`: the
      actors, the turn structure, and the terminal outcome shown in the Dialogue match the
      Spec's post-conditions and expected result. A plot whose Dialogue depicts a
      conversation or outcome its Spec does not grade (a Dialogue that lies about its Spec)
      FAILS — so the human-readable half cannot silently diverge from the graded half.
    method: test
    surface: the plot files + the consistency check
  - id: AC-GEN-DERIVES
    statement: >
      The generator reads NO committed generated/*.case.yaml as input, and derives every
      case from its plot's Spec: regenerating ALL plots reproduces every committed case
      except the enumerated overlay. Every Spec field is either propagated traceably into
      the generated case or explicitly enumerated as decorative — there is no silently
      ignored Spec field. The mutation test runs over the FULL set of non-decorative Spec
      fields of ANY plot (not an author-chosen "load-bearing" subset and not a fixed
      sample): mutating any such field produces the corresponding change in its regenerated
      case, and no plot change produces no case change. A field enumerated "decorative" is
      not taken on the author's word: a reverse mutation test PROVES it inert — mutating a
      decorative field must yield a byte-identical regenerated case AND no grade change
      across all cases; a decorative-labelled field whose mutation changes anything FAILS.
      So no semantically important Spec field can be hidden from the mutation test behind a
      decorative label. Two consecutive generations on a clean checkout are byte-identical
      outside the overlay (no wall-clock, host, or unordered-iteration inputs).
    method: command
    surface: the generator + all plot/case pairs
  - id: AC-OVERLAY-BOUNDED
    statement: >
      The overlay region of every generated case is exactly the fixed enumerated set
      (per-host budgets + host lane) and no other field; a fixture that widens the overlay
      FAILS.
    method: command
    surface: the generator + generated cases
  - id: AC-WIRED-SOURCE
    statement: >
      The live scenario cases the acceptance suite executes ARE the generator's output:
      a bijection by identity between plots and live scenarios/*/case.yaml, the suite runs
      those generated files, deleting a plot removes its live case, a live case with no
      source plot FAILS, and a plot with no generated case FAILS. There is no parallel
      hand-authored live case beside the generated tree.
    method: test
    surface: agent-harness/scenarios/ + the suite wiring
  - id: AC-ID-AGNOSTIC
    statement: >
      Id-agnostic post-conditions are insensitive to the specific generated id string but
      remain bound to the correct entity kind, count, and terminal state; every flow
      carrying entity-bound post-conditions (not only whole-flow and explore-promote) is
      evaluated, with at least one wrong-entity/kind/count negative fixture per flow that
      FAILS.
    method: test
    surface: grader + the flows' cases + their negative fixtures
  - id: AC-FALSIFIABLE-GRADES
    statement: >
      Every generated post-condition is INDIVIDUALLY falsifiable: for each case and each
      post-condition, a targeted negative fixture flips the grade to FAIL, so no
      vacuous/always-true post-condition can ride along.
    method: test
    surface: every generated case + per-condition negative fixtures
  - id: AC-NEW-FIXTURES-EXERCISED
    statement: >
      Every new seed state, fault, and state predicate the coverage docs enumerate is
      EXERCISED by at least one case and carries a negative fixture proving it can fail
      when the bad behavior it names occurs.
    method: test
    surface: agent-harness runner + grader + the exercising cases
  - id: AC-REGEN-EQUIV
    statement: >
      Every existing scenario case is regenerated from its plot; a mechanical pre/post
      diff asserts the seed and per-host budget fields are byte-unchanged (zero diff)
      outside itemized intended edits; case count is unchanged (or removals are itemized);
      every retired inline expectation is machine-shown equivalent-or-stronger (its
      negative fixture also FAILS the corresponding generated post-condition); and the
      acceptance suite stays green INCLUDING the AC-36 five-family suite, whose case count
      and identity are asserted unmodified. The set of regenerated existing cases executed
      against the live coordinator (versus checked deterministically only) is named
      explicitly and is NOT author-minimizable: it must include every existing case that
      represents a successful lifecycle completion (parity with the AC-NEW-CASES-RUN live
      floor), and it may not shrink below the set that was live-executed before this change
      — any case live-executed pre-change stays live-executed. Each live-executed case is
      asserted to reach its expected grade against the live coordinator, so a regenerated
      case cannot silently regress live while passing only structural and drift checks. A
      "net-new vs existing" reclassification that moves a successful-completion flow out of
      either live floor FAILS.
    method: test
    surface: agent-harness/scenarios/ + test/acceptance.sh + test/scenarios/
  - id: AC-CORRECTIONS-MECHANICAL
    statement: >
      The retired acceptance-criterion tags and their corrected target ids are recorded as a
      fixed mapping in the coverage docs, and every corrected target id in that mapping is
      validated (read-only) against the externally-owned acceptance surface — each corrected
      id RESOLVES to a currently-defined id there (per AC-DESCRIPTIVE-ONLY) and the mapping
      entry carries provenance citing the owner's definition. A mechanical check then asserts
      zero references to each retired tag across all coverage artifacts and that each of cases
      01, 16, 17, 19, 20 maps to its specific corrected id — mapping a case to any other id,
      or to an id that does not resolve in the external surface, FAILS. The oracle is the
      externally-owned surface, not internal self-consistency; this check reads it and never
      edits the criteria map (owned elsewhere).
    method: command
    surface: the five scenario case files + the coverage-docs mapping + the external acceptance surface
  - id: AC-DRIFT-BIDIRECTIONAL
    statement: >
      A drift guard runs INSIDE the acceptance suite (gating) and covers the FULL case
      including seed and budget fields, detecting staleness by content hash / regeneration
      equality (never mtime): it FAILS when a generated case is hand-edited away from its
      plot, when a plot is inconsistent with its generated case, when a live case has no
      source plot, and when a plot has no generated case. It ALSO gates the inventory↔plot
      layer: it FAILS when a plot has no inventory entry, and when an inventory entry has no
      plot — so as the library grows a new plot cannot be added, nor a plot deleted, without
      the inventory staying in bijection. Safe growth is gated across all three layers
      (inventory↔plot↔case), not two.
    method: test
    surface: the drift check + the inventory + CI wiring
  - id: AC-NEW-CASES-RUN
    statement: >
      Every plot in the frozen net-new set produces a running case that reaches grade
      PASS against the live coordinator through the human-sim harness, reproducibly by
      invoking the suite (not a stored one-shot artifact). Every net-new plot representing a
      SUCCESSFUL lifecycle completion MUST reach live PASS — this floor cannot be dodged by
      labelling it "expects failure." The "expects failure" hatch is bounded: it applies
      only to a plot whose Spec explicitly expects failure, and such a plot must assert its
      SPECIFIC triaged failure mode as a checked post-condition (not merely that it failed),
      with a negative fixture proving a different outcome would FAIL.
    method: test
    surface: the frozen net-new generated cases
  - id: AC-SCOPE-FENCED
    statement: >
      The change's diff touches only agent-harness/; there are zero changes under
      wrapper/ (contracts, invariants, the criteria map) or template/.
    method: command
    surface: the change diff

done_when: >
  All acceptance criteria pass: the whole-surface library is authored and its inventory is
  anchored to the external product surface (not a self-drawn list), with plot citations
  resolving to live invariants; the generator derives the live cases from the plots and
  they ARE the suite's source; the overlay is bounded; the harness supports and exercises
  id-agnostic post-conditions and new fixtures with per-condition negative fixtures; the
  existing cases are regenerated with seeds/budgets provably unchanged, assertion power
  machine-shown non-regressed, the five corrections mechanically confirmed, and the AC-36
  suite unchanged; the bidirectional drift guard gates the suite; every frozen net-new
  case runs to PASS against the live coordinator; and the diff stays fenced to agent-harness/.

scope:
  repositories:
    - id: workspace
      paths:
        - agent-harness/

tier: standard

