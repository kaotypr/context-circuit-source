task_partition:
  - id: IDW-001
    title: Update the owned intent identity contract and runtime mechanics
    repositories: [context-circuit-source]
    paths: [wrapper/runtime/, wrapper/contracts/, docs/, context/, .agents/skills/]
    boundary: >-
      Change the canonical grammar, allocator formatting and scan, validation,
      and lifecycle call-site assumptions while leaving approval, authorization,
      archive/restore status behavior, tiering, and plan id grammar unchanged.
    dependencies: []
  - id: IDW-002
    title: Rename current intent records and relationship references
    repositories: [context-circuit-source]
    paths: [intent/, plans/]
    boundary: >-
      Rename i0001→i001, i0002→i002, and i0003→i003 wherever they are current
      canonical records, update directory names and fields together, preserve the
      i0001 trace contents, and keep existing statuses and plan parent meaning.
    dependencies: [IDW-001]
  - id: IDW-003
    title: Migrate shipped fixtures and scenario-generated intent ids
    repositories: [context-circuit-source]
    paths: [test/, agent-harness/, template/]
    boundary: >-
      Update deterministic fixtures, generated conversation cases, scenarios,
      human-simulated setup, and the shipped template so synthetic ids and dynamic
      plan-to-intent mappings use i001-style ids while plan ids remain NNNN-slug.
    dependencies: [IDW-001]
  - id: IDW-004
    title: Prove completeness and lifecycle preservation
    repositories: [context-circuit-source]
    paths: [test/, intent/, plans/, wrapper/runtime/]
    boundary: >-
      Add stale-reference and directory/contract consistency checks, exercise
      allocation and old-form rejection, and run the semantic acceptance suite;
      verify no lifecycle gate, status, authorization, tier, or delivery meaning
      changed.
    dependencies: [IDW-002, IDW-003]

risks:
  - >-
    The current approved intents are i0001, i0002, and i0003; there are three active
    intent directories and zero archived intent directories. Existing i0001 also has
    an active plan and trace manifest that must move with the record. The approved
    contract now includes agent-harness/ and template/, so their references are in
    the migration boundary rather than an out-of-scope reach.
  - >-
    cc_intent_contract_digest excludes only status and contract_digest, so changing
    the canonical intent field necessarily changes the digest for approved records.
    The approved contract requires recomputing that frozen digest with the existing
    algorithm after the identity-only rename. If it is not migrated atomically,
    cc_intent_authorized will reject plans whose parent intent still appears approved.
    Changing the digest algorithm would change a lifecycle identity rule and is not
    authorized by this intent.
  - >-
    The allocator currently recognizes only four-digit directories and emits %04d;
    the three-digit grammar introduces a representational ceiling at i999 while the
    current allocator has no overflow branch.
  - >-
    The runtime's archive and restore operations use cc_safe_id rather than
    cc_intent_id_valid. Updating the shared grammar alone will not make those entry
    points reject malformed or old-form ids, so their intended validation boundary
    must be decided without changing their status-blind move semantics.
  - >-
    Fixture and scenario code derives intent ids by prefixing four-digit plan ids
    (i$pid). A mechanical textual replacement can accidentally alter plan ids or
    create i0001-style ids that the new validator rejects.
  - >-
    The trace manifest itself records old-form references as historical grounding
    evidence. Post-migration stale-reference checks must exclude trace manifests or
    distinguish evidence from active references, otherwise the proof becomes
    self-invalidating.
  - >-
    The approved contract's INTENT.md still says "draft, waiting for your approval"
    while its contract and active index say approved. This pre-existing artifact
    inconsistency is outside the requested semantic change but should not be
    silently worsened during the rename.

done_checks:
  - criterion: AC-INTENT-ID-FORM
    command: >-
      sh -c '. wrapper/runtime/engine.sh; cc_intent_id_valid i001-checkout-retries
      && ! cc_intent_id_valid i0001-checkout-retries'
    expect: exit 0; new three-digit form is accepted and old four-digit form is rejected
  - criterion: AC-INTENT-ID-FORM
    command: >-
      sh wrapper/runtime/engine.sh intent-allocate-id . migration-check
    expect: exactly i004-migration-check after the migrated i001-i003 records, with no filesystem mutation
  - criterion: AC-EXISTING-INTENTS-MIGRATED
    command: >-
      find intent -type d -print | rg '/i[0-9]{4}-[^/]+$' ; test $? -eq 1
    expect: no active or archived intent directory uses the old four-digit form
  - criterion: AC-EXISTING-INTENTS-MIGRATED
    command: >-
      for d in intent/i*-* intent/archive/i*-*; do [ -d "$d" ] || continue;
      id=$(basename "$d"); test "$(sed -n 's/^intent: //p' "$d/contract.yaml")" = "$id";
      done
    expect: every migrated directory basename equals its canonical contract intent field
  - criterion: AC-REFERENCES-CONSISTENT
    command: >-
      rg -n --hidden --pcre2 -g '!sources/**' -g '!.git/**' -g '!intent/*-intent-id-width/trace/context-circuit-source.yaml'
      'i[0-9]{4}(?:-[a-z0-9]+(?:-[a-z0-9]+)*)?' .
    expect: no output; trace manifests are excluded because they preserve the pre-migration evidence inventory
  - criterion: AC-REFERENCES-CONSISTENT
    command: >-
      rg -n --hidden -g '!sources/**' -g '!.git/**' -g '!intent/*-intent-id-width/trace/context-circuit-source.yaml' 'intent: i[0-9]{4}|intent/(?:archive/)?i[0-9]{4}|i\$(?:pid|cc_fxp_pid|cc_fxe_pid)' .
    expect: no output outside the trace manifest and no dynamic four-digit derivation remains
  - criterion: AC-FUTURE-LIFECYCLE
    command: >-
      sh wrapper/runtime/engine.sh intent-validate intent/i001-conversation-spec-library
      && sh wrapper/runtime/engine.sh intent-validate intent/i002-plan-decomposition-guidance
      && sh wrapper/runtime/engine.sh intent-validate intent/i003-intent-id-width
    expect: all migrated active intents validate with the new grammar
  - criterion: AC-LIFECYCLE-PRESERVED
    command: sh test/acceptance.sh
    expect: semantic acceptance suite exits 0; this check is for the worker/verifier phase and was not executed during tracing

