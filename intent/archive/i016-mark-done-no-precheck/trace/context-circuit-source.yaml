task_partition:
  - id: ungate-mark-done
    title: Flip plan status on ask, with no check
    rationale: >
      One repository, one mark-done verb (plan-complete), one owner chain
      (INV-COMPLETE-01 → completion.yaml → engine → cc-complete), and one
      independent verification surface (completion semantic tests plus the
      unreadiness-vocab grep). Contract, runtime, skill/PK, and tests cannot
      be executed or verified independently: a skill-only change leaves
      COMPLETION_BLOCKED in the engine; an engine-only change leaves the
      contract and cc-complete teaching a refusal; tests that still expect
      failure would fail the suite. Stacked plans would invent false
      independence. Embedded task order: (1) rewrite INV-COMPLETE-01/02 and
      decouple INV-CANDIDATE-01 / INV-ASSURE-01 complete-coupling, plus
      completion.yaml / plan.yaml preconditions; (2) ungate cc_plan_complete /
      cc_completion_finalize without calling cc_completion_ready, keeping
      Explore planless, completion-infer, delivery-record, and
      change-set-complete; (3) rewrite cc-complete (and cc-execute's
      completion-ready sentence), coordinator no-precheck + multi-plan loop,
      completion/assurance PK; (4) invert unreadiness tests and the stale
      harness plot; keep delivery/infer/verify-not-done tests. Same
      plan-complete per named plan, looped for several in one ask.
    paths:
      - wrapper/contracts/invariants.yaml
      - wrapper/contracts/schemas/completion.yaml
      - wrapper/contracts/schemas/plan.yaml
      - wrapper/runtime/engine.sh
      - .agents/skills/cc-complete/SKILL.md
      - .agents/skills/cc-execute/SKILL.md
      - agents/coordinator.md
      - context/domains/completion/README.md
      - context/domains/assurance/README.md
      - test/completion/test-completion.sh
      - test/completion/test-inferred.sh
      - test/runtime/test-runtime.sh
      - agent-harness/conversations/plots/stale-candidate-refuse-complete.md
      - agent-harness/scenarios/17-stale-candidate-requires-reverification/case.yaml
    plan_boundary: one-plan-embedded-tasks
    depends_on: []
risks:
  - "Skill-only exception: rewriting .agents/skills/cc-complete/SKILL.md while cc_plan_complete still calls cc_completion_ready (3151) or still fails COMPLETION_NO_EXECUTION (3147) leaves the runtime refusal in place — the exact failure the constraint names."
  - "Finalize-as-second-gate: dropping completion-ready but leaving cc_completion_finalize's COMPLETION_ACCEPTOR_MISSING / COMPLETION_PLAN_REVISION_MISSING / required candidate_id (3116-3120) still blocks never-built, failed, and no-acceptance plans."
  - "Required completion.yaml fields (schema 23-46) become a schema-level unreadiness gate if finalize still must write a full record before status flip."
  - "Accidentally letting verify/accept/deliver mark done: cc_completion_infer, cc_delivery_record, cc_change_set_complete, cc-verify, worker, and verifier must keep not calling cc_plan_set_status done."
  - "INV-CANDIDATE-01 / INV-ASSURE-01 left saying completion-ready refuses to complete would restore the gate in the owner index even if the engine is ungated."
  - "Keeping completion-ready as a query is safe only if no skill/coordinator still calls it before plan-complete (cc-complete lines 10-12, cc-execute lines 21-23, assurance PK lines 77-90)."
  - "Explore leak: COMPLETION_EXPLORE_PLANLESS (3150) must stay; cc-pair must still never mark complete. If plan-complete stops reading execution.tier when there is no execution, do not start completing Explore pairing sessions."
  - "Stale harness plot stale-candidate-refuse-complete / case 17 currently requires refuse + plan_status draft; leaving it grades a correct ungated flip as failure. Turn 2 ('leave it pending') conflicts with turn 1 succeeding."
  - "WORKFLOW.md row 'Accept the result / mark X complete' could collapse accept into done once unreadiness is gone; keep candidate acceptance distinct (AC-STILL-EXPLICIT)."
  - "PK reconcile-after-mark-done (cc-complete 23-34, INV-COMPLETE-02, INV-KNOWLEDGE-02) must not be rewritten; also must not be used as a new precheck before the status flip."
  - "Several named plans: engine takes one PLAN; if the skill does not loop, a multi-plan ask will only flip the first."
done_checks:
  - criterion: AC-NO-CHECK
    command: "sh test/completion/test-completion.sh"
    expect: "pass. Suite includes: (a) plan-complete on a never-built draft (cc_fx_plan, no execution) sets status done; (b) plan-complete on a failed execution sets status done; (c) plan-complete with no human-acceptance and no verifier pass sets status done; (d) two named drafts each become done via the same plan-complete path. expect_failure cc_plan_complete for unreadiness is gone."
  - criterion: AC-NO-CHECK
    command: "awk '/^cc_plan_complete\\(\\)/,/^}/' wrapper/runtime/engine.sh | grep -E 'cc_completion_ready|COMPLETION_BLOCKED|COMPLETION_NO_EXECUTION|COMPLETION_NOT_VERIFIED|COMPLETION_CANDIDATE_STALE|COMPLETION_NO_ACCEPTANCE' ; test $? -ne 0"
    expect: "no match. cc_plan_complete does not call completion-ready or fail those unreadiness codes. COMPLETION_EXPLORE_PLANLESS may still appear."
  - criterion: AC-NO-CHECK
    command: "rg -n 'refuses unless|do not change status|completion-ready' .agents/skills/cc-complete/SKILL.md"
    expect: "no unreadiness refusal and no completion-ready precheck. Skill still says delivery/acceptance/verification do not mark done, Explore is planless, and PK reconcile happens after a successful flip."
  - criterion: AC-NO-CHECK
    command: "sh test/completion/test-inferred.sh"
    expect: "pass after the stale-candidate block (0009-drift) is inverted: extra post-verify commit must not prevent plan-complete from setting status done."
  - criterion: AC-STILL-EXPLICIT
    command: "sh test/completion/test-inferred.sh"
    expect: "pass on the unchanged assertions: human-acceptance-record leaves draft; delivery-record leaves draft and writes no completion.yaml; completion-infer fails; change-set-complete leaves members draft and writes no member completion.yaml; explicit plan-complete is what sets done when asked."
  - criterion: AC-STILL-EXPLICIT
    command: "awk '/^cc_delivery_record\\(\\)/,/^}/' wrapper/runtime/engine.sh | grep -q cc_plan_set_status; test $? -ne 0; awk '/^cc_change_set_complete\\(\\)/,/^}/' wrapper/runtime/engine.sh | grep -q cc_plan_set_status; test $? -ne 0; awk '/^cc_completion_infer\\(\\)/,/^}/' wrapper/runtime/engine.sh | grep -q COMPLETION_INFER_REQUIRES_EXPLICIT"
    expect: "delivery-record and change-set-complete do not set plan status; completion-infer still refuses. Verifier/worker skills still forbid changing plan status."
tier_signal: >
  Keep Standard. This is a lifecycle bookkeeping rule (draft→done on ask),
  not auth, secrets, money, data migration, production/deploy, or an
  irreversible ship. Gate 2 delivery, verifier independence, and Explore
  planless stay. Mark-done does not merge, push, or write credentials.
  Status flip without evidence is organizational, not a production side
  effect; INV-ASSURE-01 irreversibility signals are absent. No raise.
