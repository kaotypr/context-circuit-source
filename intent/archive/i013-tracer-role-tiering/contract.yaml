schema_version: 2
intent: i013-tracer-role-tiering
title: Support tracer in role-tiering.local.yaml
goal: >
  When a human asks the coordinator to set up role-tiering.local.yaml with a
  tracer (model, effort), that tracer entry is written into the file and used
  when the tracer is spawned. The observed failure — the coordinator creates
  the file but reports "Tracer tiering isn't supported by this workspace
  contract, so tracers use each adapter's default," and omits the tracer
  config — is the defect this change closes. Worker and verifier remain
  configurable; tracer becomes a supported role in the same host-local file.

non_goals:
  - Changing the tracer's read-only role, spawn rules, or feasibility check.
  - Letting model or effort select a consequence tier, grant a gate, or
    change independence or the failure limit.
  - Replacing adapter defaults when no tracer entry is present.
  - The Explore/cc-pair worker honor issue (that is i012-pair-role-tiering).
  - Delivering, publishing, merging, or committing the implementation implicitly.

constraints:
  - Role tiering remains bounded host evidence: it changes cost and speed,
    never meaning, independence, or the failure limit.
  - Adapter defaults still apply when no tracer entry is present for the
    current host.
  - Product behavior has one owner per rule; update the owning role-tiering
    contract rather than a skill-only exception.
  - Preserve unrelated and dirty work, and run the semantic acceptance suite
    after meaningful phases.

acceptance_criteria:
  - id: AC-TRACER-WRITTEN
    statement: >
      When a human asks the coordinator to set role-tiering including tracer,
      role-tiering.local.yaml contains the requested tracer (model, effort)
      for that host; the entry is not omitted.
  - id: AC-TRACER-HONORED
    statement: >
      A spawned tracer uses the (model, effort) from role-tiering.local.yaml
      when that host has a tracer entry, not only the adapter default.
  - id: AC-NO-UNSUPPORTED
    statement: >
      The coordinator does not report that tracer tiering is unsupported by
      the workspace contract when the human requested a tracer config.
  - id: AC-MEANING-UNCHANGED
    statement: >
      Adding tracer to role-tiering does not change what the tracer does,
      drop or add a verifier, or alter independence or the failure limit.

scope:
  repositories:
    - id: context-circuit-source

tier: standard
status: approved
contract_digest: sha256:5c68661ccebf64df9c0db81863dba12c7e5a728985b3b7d4dbdc69411b28c1b1
