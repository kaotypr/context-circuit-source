task_partition:
  - id: dual-root-authoring
    title: "Teach the design helper both homes"
    repositories:
      - context-circuit-source
    paths:
      - .agents/skills/cc-system-design/
      - context/domains/system-design-authoring/
      - docs/terminology.md
      - sources/system-design/context-circuit/v1.1.0/
    depends_on: []
    outcome: "cc-system-design authors either sources/system-design/... or intent/<id>/detail/ with the same three-tier/split-when-earned rubric; product-level path preserved; empty/unsolicited v1.1.0 tree discarded; no new skill and no new sources/system-design scope used as spec."
  - id: intent-offer-and-plan-consume
    title: "Offer detail while preparing a change; use it when planning"
    repositories:
      - context-circuit-source
    paths:
      - .agents/skills/cc-intent/
      - .agents/skills/cc-plan/
      - .agents/skills/cc-trace/
      - agents/coordinator.md
      - context/domains/intent/
      - context/domains/tracing/
      - context/domains/plan-authorization/
      - docs/templates/intent.md
      - docs/planning.md
    depends_on:
      - dual-root-authoring
    outcome: "cc-intent can request or recommend detail for multi-concern intents without blocking approval or lengthening INTENT.md; Gate 1 stays the only conversational approval; when detail/ exists, cc-plan uses it as confirmed topic shape without replacing the post-approval code read; ownership stays one-rule-one-owner."
  - id: prove-two-paths
    title: "Prove the two paths"
    repositories:
      - context-circuit-source
    paths:
      - test/contracts/
      - test/intent/
      - test/acceptance.sh
      - test/acceptance/criteria-map.yaml
    depends_on:
      - intent-offer-and-plan-consume
    outcome: "Deterministic checks prove dual-root authoring, optional/recommended detail, no second gate, short five-section surface, planning-consumes-detail guidance, and absence of the v1.1.0 draft as specification; acceptance suite still passes."
risks:
  - "cc-system-design currently teaches a single root and a product-design→context-proposal feed path. A careless dual-root edit could imply intent detail is Product Knowledge, a lifecycle object, or a design-acceptance gate."
  - "cc-intent already points multi-topic pictures at sources/system-design/. Without a clear contrast, agents may spawn product-level designs (or a new skill) instead of intent/<id>/detail/, or duplicate the three-tier rubric inside cc-intent."
  - "cc-plan today grounds only on contract.yaml + trace + Product Knowledge. Ignoring an existing detail/ would violate AC-PLANNING-USES-DETAIL; treating detail as replacing the tracer would violate INV-INTENT-02."
  - "INTENT.md templates and domain pages stress exactly five sections. Adding detail content into INTENT.md (sixth section or internal filenames) would violate AC-SHORT-SURFACE and the approved constraints."
  - "Empty sources/system-design/context-circuit/v1.1.0/ (+ intent-detail/) shells remain. Leaving them invites treating the discarded draft location as live design space (AC-SKILL-NOT-SOURCE-DESIGN)."
  - "test/contracts/test-contracts.sh asserts sources/system-design/ presence in the skill. Dual-root changes must extend, not drop, that product-level assertion."
  - "agent-harness conversation plot author-system-design-spawns-intents covers only the product-level root. Expanding conversation coverage requires agent-harness/ MODIFY (out of bound scope); relying solely on greps is fine if ACs are still executable."
  - "Dirty/unrelated work exists (intent/INDEX.md and sibling intents/traces). Implementation must not normalize unrelated intent files or revive deleted draft content as specification."
  - "wrapper/ is readable evidence only in this scope. Adding an engine verb, schema field, or invariant without necessity would conflict with the approved prefer-skill-and-guidance constraint and INV-SKILL-01/owner map."
done_checks:
  - criterion: AC-BOTH-ROOTS
    command: "rg -n 'sources/system-design/|intent/<id>/detail/|intent/\\*/detail/|three-tier|split when|by concern' .agents/skills/cc-system-design/SKILL.md context/domains/system-design-authoring/README.md && rg -n 'sources/system-design/' .agents/skills/cc-system-design/SKILL.md && rg -n 'intent/.*/detail|intent/<id>/detail' .agents/skills/cc-system-design/SKILL.md"
    expect: "Skill and domain page document both roots and the shared three-tier/split-when-earned/by-concern rubric; product-level path is still present."
  - criterion: AC-OPTIONAL-RECOMMENDED
    command: "rg -n -i 'recommend|request|optional|several concerns|does not block|not required|skip' .agents/skills/cc-intent/SKILL.md context/domains/intent/README.md agents/coordinator.md"
    expect: "Guidance states a human may request or be recommended detail; skipping does not block Gate 1; small single-outcome intents may stay short."
  - criterion: AC-NO-SECOND-GATE
    command: "rg -n -i 'no separate approval|no second.*(gate|approval)|Gate 1|single.*(upstream|conversational)|detail.*(not|never).*approv' .agents/skills/cc-intent/SKILL.md .agents/skills/cc-plan/SKILL.md context/domains/intent/README.md context/domains/plan-authorization/README.md docs/planning.md && sh test/intent/test-feasibility.sh"
    expect: "Guidance keeps a single intent approval; no detail-approval gate; feasibility suite still passes."
  - criterion: AC-SKILL-NOT-SOURCE-DESIGN
    command: "test ! -e sources/system-design/context-circuit/v1.1.0 && test ! -e .agents/skills/cc-intent-detail && rg -n 'intent/<id>/detail|intent/.*/detail' .agents/skills/cc-system-design/SKILL.md .agents/skills/cc-intent/SKILL.md && ! rg -n 'v1.1.0/intent-detail' .agents/skills/cc-system-design/SKILL.md .agents/skills/cc-intent/SKILL.md .agents/skills/cc-plan/SKILL.md context/domains/system-design-authoring/README.md context/domains/intent/README.md"
    expect: "v1.1.0 draft tree is gone; no cc-intent-detail skill; capability is specified in skill/guidance, not via a new sources/system-design scope."
  - criterion: AC-PLANNING-USES-DETAIL
    command: "rg -n -i 'detail/|confirmed shape|topic|when.*detail.*exist|without replacing|trace manifest' .agents/skills/cc-plan/SKILL.md docs/planning.md context/domains/tracing/README.md"
    expect: "Planning guidance consumes intent detail when present as confirmed shape/topics, and still requires the post-approval real-code/trace path."
  - criterion: AC-SHORT-SURFACE
    command: "rg -n 'five sections|exactly five|Intention|Expectations|The plans|How carefully this is checked|Open questions' docs/templates/intent.md .agents/skills/cc-intent/SKILL.md context/domains/intent/README.md && ! rg -n '## Detail|sixth section|detail/design.md' docs/templates/intent.md docs/templates/intent.example.md"
    expect: "Human-facing intent page remains the five-section template; detail is not folded into INTENT.md."
  - criterion: AC-BOTH-ROOTS
    command: "sh test/contracts/test-contracts.sh"
    expect: "Contracts suite passes with extended dual-root rubric assertions and continued no-runtime-surface checks for system-design."
  - criterion: AC-OPTIONAL-RECOMMENDED
    command: "sh test/acceptance.sh"
    expect: "Full semantic acceptance suite passes after meaningful phase(s), including any new intent-detail coverage wired into acceptance.sh / criteria-map.yaml."
tier_signal: "No tier raise. Inspected surfaces are skills, agents guidance, docs, Product Knowledge domain pages, and tests. No auth, secrets, money, migration, production/deploy, or irreversible data operation is introduced. Standard remains appropriate."
feasible: true
out_of_scope_reach: []
open_questions:
  - question: "Should the fuller write-up sit in a folder named design/ or detail/?"
    disposition: already-answered
    rationale: "Approved INTENT.md Open questions and contract constraints fix the name as detail/ under intent/<id>/."
  - question: "Should this be a new helper (cc-intent-detail), or the existing design helper?"
    disposition: already-answered
    rationale: "Approved intent requires extending cc-system-design; non-goals forbid a new skill and forbid a new sources/system-design specification scope."
  - question: "What exact heuristic should trigger recommending detail (for example: number of concerns, numbered plans, or human ask only)?"
    disposition: plan-resolution
    rationale: "Contract says recommend when one intent has several concerns and allow request/skip. Exact wording/threshold is implementation guidance inside cc-intent, not an intent-level criteria change."
  - question: "Must template/intent/README.md and/or agent-harness conversation plots be updated in this change?"
    disposition: plan-resolution
    rationale: "Bound scope omits template/ and agent-harness/. Skill+domain+test greps can prove ACs. Updating blank-seed layout docs or adding a conversation plot is optional packaging/coverage; if the coordinator decides they are required MODIFYs, reclassify as out_of_scope_reach and widen scope via Gate 1."
  - question: "Is an engine verb, schema field, or new invariant required for correctness?"
    disposition: already-answered
    rationale: "Engine validate already allows extra files under intent/<id>/; contract_digest hashes only contract.yaml; existing INV-INTENT-01/02, INV-APPROVE-01, and INV-SKILL-01 cover the gates and skill packaging. Prefer skill and guidance changes only."
