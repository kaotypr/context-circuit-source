task_partition:
  - id: trace-planning-rule
    title: "Define the decomposition rule"
    repositories:
      - context-circuit-source
    paths:
      - .agents/skills/cc-trace/
      - .agents/skills/cc-plan/
      - agents/tracer.md
      - context/domains/tracing/
      - context/domains/plan-authorization/
      - docs/planning.md
    depends_on: []
    outcome: "State that one bounded execution/verification boundary yields one plan with embedded tasks; independent execution or verification boundaries, meaningful dependencies, or distinct failure surfaces justify stacked plans."
  - id: handoff-representation
    title: "Carry the decision into plan records"
    repositories:
      - context-circuit-source
    paths:
      - wrapper/contracts/schemas/trace-manifest.yaml
      - wrapper/contracts/schemas/plan.yaml
      - .agents/skills/cc-plan/
    depends_on:
      - trace-planning-rule
    outcome: "Use task_partition plus durable coordinator rationale, task dependencies for intra-plan order, and existing plan_dependencies with bounded repository/path mappings for stacked plans."
  - id: decomposition-acceptance
    title: "Prove both derivation paths and authority boundaries"
    repositories:
      - context-circuit-source
    paths:
      - test/plans/
      - test/run-stack/
      - test/intent/
      - test/scenarios/
      - test/acceptance.sh
      - test/acceptance/criteria-map.yaml
      - docs/
    depends_on:
      - handoff-representation
    outcome: "Add deterministic checks for one-plan and stacked-plan choices, wrong combine/split failures, explicit dependencies, and unchanged intent/delivery/candidate/verification ownership."
risks:
  - "The plan schema already distinguishes intra-plan task depends_on from inter-plan plan_dependencies; guidance must not collapse those concepts or make plan count a tier proxy."
  - "Runtime execution is one worker per plan and requires an independent verifier at Standard/Critical. A stacked-plan explanation must preserve that lifecycle; the separate change-set path may still combine delivered plans into one candidate and is not a second plan lifecycle."
  - "The approved intent scope includes docs, guidance, contracts, and tests but not a runtime redesign. Introducing new engine verbs or a new approval state would conflict with INV-INTENT-02, INV-APPROVE-01, and existing authorization behavior."
  - "Existing acceptance-map metadata describes the older v0.5 criteria set while current suites assert v1.0 behavior; adding coverage must preserve the map's credential-free and provider-neutral checks."
  - "The checkout is dirty in intent/INDEX.md, intent/i002-plan-decomposition-guidance/INTENT.md, and its contract.yaml. Those files are pre-existing user changes and must not be normalized by implementation."
done_checks:
  - criterion: AC-DECOMPOSITION-RULE
    command: "rg -n -i 'one plan|multiple plans|stacked plans|bounded (execution|change|repository/path)|independent (execution|verification)|failure surface|dependency' .agents/skills/cc-trace/SKILL.md .agents/skills/cc-plan/SKILL.md agents/tracer.md context/domains/tracing/README.md docs/planning.md"
    expect: "The guidance contains an explicit human-readable rule covering both one-plan and stacked-plan outcomes and all three decision signals."
  - criterion: AC-SINGLE-PLAN-PRESERVED
    command: "sh test/plans/test-plans.sh && rg -n 'one plan|one worker|embedded tasks|no separate plan-approval|no intermediate.*approved' .agents/skills/cc-plan/SKILL.md docs/planning.md context/domains/plan-authorization/README.md"
    expect: "The existing plan suite passes and guidance preserves one plan with multiple tasks without using plan count as assurance tier."
  - criterion: AC-STACKED-PLANS-REPRESENTED
    command: "sh test/run-stack/test-run-stack.sh && rg -n 'plan_dependencies|explicit dependencies|bounded paths|one worker|independent verifier|rationale' .agents/skills/cc-plan/SKILL.md wrapper/contracts/schemas/plan.yaml docs/planning.md"
    expect: "Dependent plans pass readiness, base, failure-containment, and cross-repository checks; the representation names dependencies, bounded paths, and per-plan worker/verifier lifecycles."
  - criterion: AC-AUTHORITY-PRESERVED
    command: "sh test/intent/test-feasibility.sh && rg -n 'approved intent|no second.*gate|no separate plan.*approval|delivery|candidate|scope-safety|verification' .agents/skills/cc-trace/SKILL.md .agents/skills/cc-plan/SKILL.md context/domains/plan-authorization/README.md docs/planning.md wrapper/contracts/invariants.yaml"
    expect: "Authorization remains intent-derived, plan approval remains absent, and delivery/candidate/verification/scope-safety ownership remains documented in its existing owners."
  - criterion: AC-BOTH-PATHS-CHECKED
    command: "sh test/acceptance.sh"
    expect: "The full semantic acceptance suite passes, including explicit one-plan and stacked-plan fixtures; a dedicated decomposition suite, if added, is invoked by test/acceptance.sh and mapped in test/acceptance/criteria-map.yaml."
tier_signal: "No tier raise. The inspected surfaces contain planning guidance, contracts, shell tests, and documentation only; no auth, secrets, money, migration, production/deploy, or irreversible data operation is introduced. Standard remains appropriate and retains independent verification."
feasible: true
out_of_scope_reach: []
open_questions:
  - question: "Should the decomposition rationale be a new canonical trace-manifest field or a required section in the derived readable plan?"
    disposition: plan-resolution
    rationale: "The approved intent explicitly leaves the exact representation to tracing/planning. Existing task_partition, plan_dependencies.reason, and readable PLAN.md provide durable reviewable locations; choose one canonical location and mirror only as needed."
  - question: "Does combining independently executed plans into one delivered change set alter the per-plan verification requirement?"
    disposition: already-answered
    rationale: "Current runtime/test behavior gives each Standard plan its own worker/verifier lifecycle; change-set candidate aggregation is a separate delivery/completion concern and does not remove that per-plan execution evidence."
