task_partition:
  - id: nest-product-home
    title: Move wrapper, agents, docs under .context-circuit and retarget runtime
    rationale: >
      Physical move of the three product folders plus engine worker-brief lookup,
      manifest shipped/upgrade sets, invariants owner map, and schema owner fields.
      Without this, nothing else can pass verification.
    paths:
      - wrapper/runtime/engine.sh
      - wrapper/manifest.yaml
      - wrapper/contracts/invariants.yaml
      - wrapper/contracts/schemas/
      - wrapper/migrations/README.md
    plan_boundary: one-plan-embedded-tasks
    depends_on: []
  - id: host-front-door
    title: Keep workspace-root host discovery as thin pointers
    rationale: >
      Root AGENTS.md, WORKFLOW.md, CLAUDE.md, CURSOR.md (source + adapter sources),
      wrapper/adapters/* content, and .cursor/rules/role-tiering-spawn.mdc must
      point hosts into .context-circuit without duplicating product policy.
      .agents/skills/ stays at root (already-answered). Depends on nested home
      existing so pointers have a target.
    paths:
      - wrapper/adapters/AGENTS.md
      - wrapper/adapters/CLAUDE.md
      - wrapper/adapters/CURSOR.md
      - wrapper/adapters/WORKFLOW.md
      - CLAUDE.md
      - CURSOR.md
      - .cursor/rules/role-tiering-spawn.mdc
      - agents/coordinator.md
    depends_on: [nest-product-home]
  - id: template-and-upgrade-ship
    title: Ship nested home in release assembly and upgrade docs
    rationale: >
      release-artifact.sh, release-manifest.txt, and build-dist.sh must emit
      .context-circuit/{wrapper,agents,docs} in the distributable template;
      migrations/README must document layout upgrade preserving workspace-owned
      files. test/release and agent-harness/test-template-runtime.sh verify this
      boundary. Cannot verify independently of path retargeting in tests.
    paths:
      - scripts/release-artifact.sh
      - scripts/release-manifest.txt
      - scripts/build-dist.sh
      - agent-harness/test-template-runtime.sh
      - test/release/test-release.sh
    depends_on: [nest-product-home]
  - id: retarget-and-prove
    title: Retarget skills, tests, PK, harness; prove no root leftovers
    rationale: >
      .agents/skills with engine/role/docs paths, test/lib/assert.sh and all
      eng() helpers, agent-harness scenarios/plots, context/domains PK, README,
      and maintainer root docs. Completeness proof must go to zero actionable
      old-home references. Same verification suite as slices 1–3.
    paths:
      - .agents/skills/
      - test/lib/assert.sh
      - test/contracts/test-contracts.sh
      - agent-harness/scenarios/
      - context/domains/
      - README.md
    depends_on: [nest-product-home, host-front-door, template-and-upgrade-ship]
risks:
  - "Partial move: relocating directories without retargeting test/lib/assert.sh leaves every suite sourcing a missing engine at $ROOT/wrapper/runtime/engine.sh."
  - "Invoke-not-read break: skills that still say sh wrapper/runtime/engine.sh after the move fail closed — coordinators cannot allocate intents, execute, pair, or trace."
  - "Release-assembler drift: release-artifact.sh staging tar of top-level wrapper agents docs produces an artifact with root product folders, failing AC-NESTED-HOME and AC-TEMPLATE-AND-UPGRADE even if source checkout is nested."
  - "Owner-map-only change: updating invariants.yaml owners without schema owner: fields and skill citations leaves one-owner-per-rule inconsistent and test/contracts owner loops failing."
  - "Host double-copy: making root AGENTS.md a full product adapter instead of a thin pointer violates AC-HOST-FRONT-DOOR and duplicates policy outside .context-circuit/wrapper/adapters/."
  - "Accidentally moving .agents/, context/, plans/, intent/, or .runtime/ into .context-circuit/ violates AC-WORKSPACE-OWNED-STAY."
  - "Maintainer source AGENTS.md conflation: source checkout uses a distinct maintainer AGENTS.md today; folding maintainer safety into the shipped pointer without separation could leak maintainer-only rules into instantiated workspaces or drop them from source."
  - "Harness stale paths: ~30 agent-harness scenarios forbid wrapper/runtime/engine.sh as invoke-not-read boundary — paths must update together or grading rejects correct coordinator behavior."
  - "Upgrade without migration: existing instantiated workspaces with root wrapper/agents/docs need a documented move; silent failure leaves AC-NO-LEFTOVER-ROOT false for upgraded users."
  - "engine.sh worker-brief lookup: cc_worker_brief_assemble hardcodes wrapper/runtime/worker-brief.md — pairing/grounding tests fail if brief is promoted beside engine under nested path but lookup is not retargeted."
done_checks:
  - criterion: AC-NESTED-HOME
    command: "test -d .context-circuit/wrapper && test -d .context-circuit/agents && test -d .context-circuit/docs && test ! -e wrapper && test ! -e agents && test ! -d docs"
    expect: "nested product folders exist; root wrapper/, agents/, docs/ product trees are absent."
  - criterion: AC-NESTED-HOME
    command: "artifact=$(mktemp -d)/out && sh scripts/release-artifact.sh \"$(mktemp -d)/stg\" \"$artifact\" v-nest-check >/dev/null && test -d \"$artifact/context-circuit-v-nest-check/.context-circuit/wrapper\" && test ! -e \"$artifact/context-circuit-v-nest-check/wrapper\""
    expect: "assembled template artifact uses nested home, not root wrapper/."
  - criterion: AC-RUNTIME-FINDS-HOME
    command: "sh .context-circuit/wrapper/runtime/engine.sh workspace-validate . 2>/dev/null || sh .context-circuit/wrapper/runtime/engine.sh workspace-init /tmp/cc-nest-smoke-$$(date +%s) && sh .context-circuit/wrapper/runtime/engine.sh workspace-validate /tmp/cc-nest-smoke-$$(date +%s)"
    expect: "engine invokes from nested path; workspace verbs succeed."
  - criterion: AC-RUNTIME-FINDS-HOME
    command: "sh test/acceptance.sh"
    expect: "full semantic acceptance suite passes with retargeted paths."
  - criterion: AC-HOST-FRONT-DOOR
    command: "test -f AGENTS.md && test -f WORKFLOW.md && test -d .agents/skills && rg -n 'context-circuit' AGENTS.md WORKFLOW.md CLAUDE.md CURSOR.md 2>/dev/null | head -1"
    expect: "root host surfaces exist; AGENTS.md or WORKFLOW.md points into .context-circuit. .agents/ remains at workspace root."
  - criterion: AC-HOST-FRONT-DOOR
    command: "artifact=$(mktemp -d)/out && sh scripts/release-artifact.sh \"$(mktemp -d)/stg\" \"$artifact\" v-nest-check >/dev/null && a=\"$artifact/context-circuit-v-nest-check\" && test -f \"$a/AGENTS.md\" && test ! -d \"$a/wrapper/adapters\" && test -d \"$a/.agents/skills\""
    expect: "shipped workspace has root adapters and .agents/; wrapper/adapters source dir not leaked."
  - criterion: AC-WORKSPACE-OWNED-STAY
    command: "test -d context && test -d plans && test -d intent && test -d template && test ! -e .context-circuit/context && test ! -e .context-circuit/plans"
    expect: "workspace-owned trees remain at workspace root; not under .context-circuit/."
  - criterion: AC-TEMPLATE-AND-UPGRADE
    command: "sh test/release/test-release.sh && sh agent-harness/test-template-runtime.sh"
    expect: "release boundary and template-runtime laboratory pass with nested layout."
  - criterion: AC-NO-LEFTOVER-ROOT
    command: "rg -n --glob '!**/archive/**' --glob '!**/intent/archive/**' --glob '!**/sources/**' --glob '!intent/i017-nest-system-home/**' --glob '!**/.claude/**' '(^|[[:space:]`\"'\"'(])wrapper/|(^|[[:space:]`\"'\"'(])agents/|(^|[[:space:]`\"'\"'(])docs/|\\$ROOT/wrapper|\\$W/|wrapper/runtime/engine\\.sh|agents/(coordinator|worker|verifier|tracer)\\.md' wrapper .agents agents docs context template test agent-harness scripts .cursor AGENTS.md WORKFLOW.md CLAUDE.md CURSOR.md README.md 2>/dev/null; test $? -ne 0"
    expect: "zero matches after retarget (completeness_proof count was 718 pre-change). Migration README may quote old paths only if explicitly marked historical and excluded from this grep via plan."
tier_signal: >
  Keep Standard. This is a product home relocation and path retargeting with
  a template/upgrade migration that preserves workspace-owned files. No auth,
  secrets, money, or irreversible user-data wipe. Gate 2, verifier independence,
  and host-blocked semantics stay unchanged.
feasible: true
out_of_scope_reach: []
open_questions:
  - question: "Should engine.sh expose a single cc_product_home/cc_product_path helper used by cc_worker_brief_assemble (and future lookups), or retarget literal .context-circuit/ strings everywhere?"
    disposition: plan-resolution
    note: "Only engine.sh joins wrapper/ today besides comments; skills and tests use literal invoke paths. A helper reduces drift but is not required if every cite retargets consistently."
  - question: "How does an upgrade move root wrapper/, agents/, and docs/ on an existing workspace — automated engine verb, release script step, or documented manual migration in wrapper/migrations/?"
    disposition: plan-resolution
    note: "repository-binding-migrate is the precedent for workspace-owned file migration. Layout move is template-owned; must preserve context/, plans/, intent/, .runtime/. Intent requires migration-needed reporting when meaning changes."
  - question: "In context-circuit-source, root AGENTS.md is maintainer-specific (not wrapper/adapters/AGENTS.md). After nest, does maintainer safety stay in a separate file while root AGENTS.md becomes only the thin product pointer copied from adapters?"
    disposition: plan-resolution
    note: "Instantiated workspaces and assembled artifact should get thin product pointer only. Source checkout may need maintainer rules in WORKFLOW.md or README without duplicating product policy at root."
  - question: "Does cc_workspace_validate (or a new probe) require .context-circuit/wrapper to exist, or is nested-home discovery entirely via host pointers and invoke paths?"
    disposition: plan-resolution
    note: "Today validate only checks workspace.yaml and plans/. Optional probe improves fail-closed for half-upgraded workspaces."
  - question: "Does .agents/ stay at workspace root?"
    disposition: already-answered
    note: "Yes — frozen on intent and host-surfaces.md."
  - question: "Does docs/ move under .context-circuit/?"
    disposition: already-answered
    note: "Yes — including source-only docs/release.md in the maintainer checkout; it remains excluded from release-manifest ship set."
  - question: "Does template/ stay at source root?"
    disposition: already-answered
    note: "Yes — seed identity, not a user-facing product folder; assembly copies seed contents into artifact workspace root."
