# Partition evidence: ONE plan with embedded tasks. One repository, one lifecycle
# identity change (done-trigger + knowledge write path), one worker, one verifier.
# Stacking contracts/runtime/tests would leave contradictory owners mid-stack.
task_partition:
  - id: DCU-001
    title: Rework knowledge and completion contracts
    repositories: [context-circuit-source]
    paths:
      - wrapper/contracts/invariants.yaml
      - wrapper/contracts/schemas/completion.yaml
      - wrapper/contracts/schemas/context-impact.yaml
      - wrapper/contracts/schemas/context-index.yaml
      - wrapper/contracts/schemas/context-proposal.yaml
      - wrapper/contracts/schemas/human-acceptance.yaml
      - wrapper/manifest.yaml
    boundary: >-
      Rewrite INV-COMPLETE-01 (explicit mark-done at Standard and Critical;
      Explore stays planless; verification, candidate acceptance, and delivery
      do not mark done), INV-COMPLETE-02 (mark-done starts in-place reconcile
      only when the plan affected PK; delivery does not), and INV-KNOWLEDGE-02
      (no separate accept-context-update gate; no next-plan debt-block). Stop
      owning a live context/proposals/ staging path. Do not change Gate 1 or
      Gate 2 as gates. Do not interpret Product Knowledge in the runtime.
    dependencies: []

  - id: DCU-002
    title: Make mark-done the only done trigger in the runtime
    repositories: [context-circuit-source]
    paths:
      - wrapper/runtime/engine.sh
    boundary: >-
      cc_plan_complete becomes the Standard and Critical draft→done writer
      (keep completion-ready floor). cc_delivery_record and
      cc_change_set_complete record delivery only — they must not set plan
      status done and must not emit a reconcile-starting debt marker.
      cc_knowledge_debt_check must not block the next plan.
      cc_completion_infer must not mark a plan done from delivery.
      Engine still does not write context/ files.
    dependencies: [DCU-001]

  - id: DCU-003
    title: Teach coordinator, skills, and shipped docs the in-place path
    repositories: [context-circuit-source]
    paths:
      - .agents/skills/cc-complete/
      - .agents/skills/cc-deliver/
      - .agents/skills/cc-plan/
      - .agents/skills/cc-system-design/
      - agents/coordinator.md
      - wrapper/adapters/WORKFLOW.md
      - wrapper/adapters/AGENTS.md
      - wrapper/adapters/README.md
      - docs/product-knowledge.md
      - docs/getting-started.md
      - docs/planning.md
      - docs/terminology.md
    boundary: >-
      Gather context writes live context/ files and keeps INDEX.md consistent.
      Mark-done reads the plan, marks it done, then — if PK was affected —
      updates those same live files (no proposal, no extra accept). Delivery
      language stays Gate 2 only. cc-plan no longer waits on knowledge debt.
      Product skills are edited at .agents/skills/; .claude/skills/cc-* product
      entries are symlinks.
    dependencies: [DCU-001]

  - id: DCU-004
    title: Drop pending proposal 0034 and rewrite live Product Knowledge
    repositories: [context-circuit-source]
    paths:
      - context/INDEX.md
      - context/proposals/
      - context/domains/completion/
      - context/domains/delivery/
      - context/DECISIONS.md
      - plans/archive/0001-conversation-spec-library/
    boundary: >-
      Delete context/proposals/0034-add-conversation-spec-library.md without
      creating context/domains/conversation-spec-library/. Remove the INDEX.md
      pending row and the plan 0001 citation of that path. Rewrite the
      completion domain (and delivery as needed) to the new lifecycle.
      Historical DECISIONS.md notes 0034 was pending; record that it is dropped.
    dependencies: [DCU-001]

  - id: DCU-005
    title: Prove the old path is gone
    repositories: [context-circuit-source]
    paths:
      - test/completion/
      - test/knowledge/
      - test/scenarios/
      - test/runtime/test-runtime.sh
      - test/archive/test-archive.sh
      - test/contracts/test-contracts.sh
      - test/release/test-release.sh
      - test/acceptance.sh
      - test/acceptance/criteria-map.yaml
      - template/context/
      - scripts/release-manifest.txt
      - scripts/release-artifact.sh
      - agent-harness/
    boundary: >-
      Invert suites that currently require inferred-from-delivery, proposal
      staging, accept-context-update, or next-plan debt-block. Keep
      covering-tip delivery and verifier-independence checks. Update the
      shipped seed and release manifest so context/proposals/ is no longer
      required. Rewrite harness plots/scenarios/grade/seeder for the new
      outcomes; regenerate generated/*.case.yaml from plots.
    dependencies: [DCU-002, DCU-003, DCU-004]

risks:
  - >-
    Lifecycle-identity coupling: INV-COMPLETE-01 inferred-from-delivery is
    implemented in cc_completion_infer, cc_change_set_complete, cc-deliver,
    cc-complete, AC-35, test-inferred.sh, test-scenarios.sh Scenario A,
    run-scenario.sh completed-standard, and harness scenario 18. Changing only
    the skill or only the engine leaves contradictory owners (INV-OWN-01).
  - >-
    cc_change_set_complete currently fuses Gate 2 recording, debt emit, and
    per-member done into one verb (status delivered-and-completed). Splitting
    delivery from mark-done is required by AC-EXPLICIT-MARK-DONE and
    AC-NO-DELIVERY-RECONCILE; leaving the fused verb would fail both.
  - >-
    INV-RUNTIME-01: the engine must not write or interpret Product Knowledge.
    Detecting 'the plan affected Product Knowledge' and performing in-place
    context edits is a coordinator act after plan-complete, not a new engine
    PK writer. Putting the write inside cc_plan_complete would violate the
    runtime boundary.
  - >-
    Harness completeness: generated conversation cases are build artifacts.
    Editing generated/*.case.yaml without the plot (or the reverse) will drift.
    grade.sh product_knowledge_unchanged_silently currently excludes
    context/proposals/; after in-place writes, a gathering-context plot that
    edits live files will fail that predicate unless the grader and plot
    post-conditions change together.
  - >-
    Authorization/digest side effect is limited: this intent's contract_digest
    is already frozen and must not be edited. Rewriting invariant text and
    schemas does not re-enter Gate 1. Fixture completion.yaml files that assert
    human_completion: inferred will fail until tests use the explicit path.
    Do not change the intent digest algorithm.
  - >-
    Dropping 0034 leaves plans/archive/0001-conversation-spec-library
    citing a deleted path. Removing that citation is required for a consistent
    tree; applying 0034 as a domain page is forbidden.
  - >-
    Dirty pre-existing work in intent/i014-direct-context-updates/INTENT.md
    (duplicate status lines) and untracked intent/i015-lean-workspace-context/
    must not be normalized by implementation.
  - >-
    template/ and agent-harness/ must be modified to keep the shipped product
    and harness consistent. They live inside this bound repository; omitting
    them would ship the old proposal/inferred-done/debt-block path.

done_checks:
  - criterion: AC-IN-PLACE-WRITES
    command: >-
      rg -n --hidden -g '!sources/**' -g '!.git/**' -g '!intent/**' -g '!plans/archive/**'
      'context/proposals/|Propose a context update' wrapper/adapters/WORKFLOW.md .agents/skills/cc-complete/SKILL.md
      docs/product-knowledge.md docs/getting-started.md agents/coordinator.md
    expect: no output; gather/reconcile procedure no longer stages context/proposals/

  - criterion: AC-NO-KNOWLEDGE-GATE
    command: >-
      rg -n --hidden -g '!sources/**' -g '!.git/**' -g '!intent/**' -g '!plans/archive/**'
      'accept the context update|Accept the context update|accept a knowledge proposal|Review / accept context updates'
      .agents/skills/ agents/coordinator.md wrapper/adapters/WORKFLOW.md docs/
    expect: no output; the separate accept-context-update route is gone

  - criterion: AC-EXPLICIT-MARK-DONE
    command: >-
      sh -c '. wrapper/runtime/engine.sh;
      command -v cc_plan_complete >/dev/null;
      rg -n "COMPLETION_EXPLICIT_CRITICAL_ONLY" wrapper/runtime/engine.sh;
      test $? -eq 1'
    expect: plan-complete is no longer Critical-only; Standard can mark done on explicit request

  - criterion: AC-EXPLICIT-MARK-DONE
    command: sh test/completion/test-inferred.sh
    expect: >-
      exit 0 after rewrite; delivery-record plus completion-infer must not flip
      a Standard plan to done; change-set-complete must not mark members done

  - criterion: AC-NO-DELIVERY-RECONCILE
    command: >-
      rg -n 'cc_knowledge_debt_emit|completion-infer' .agents/skills/cc-deliver/SKILL.md;
      awk '/^cc_delivery_record\(\)/,/^cc_completion_infer\(\)/' wrapper/runtime/engine.sh | rg 'cc_knowledge_debt_emit'
    expect: no output; delivery skill and cc_delivery_record do not start reconcile or inferred done

  - criterion: AC-MARK-DONE-STARTS-RECONCILE
    command: >-
      rg -n -i 'mark.*done|plan-complete' .agents/skills/cc-complete/SKILL.md agents/coordinator.md context/domains/completion/README.md
    expect: >-
      mark-done is the trigger that marks the plan done and then updates live
      context files only when the plan affected Product Knowledge; no proposal sidecar

  - criterion: AC-NEXT-PLAN-NOT-BLOCKED
    command: sh test/knowledge/test-debt.sh
    expect: >-
      exit 0 after rewrite; knowledge-debt-check must not fail a later overlapping
      plan solely because prior PK has not yet been updated

  - criterion: AC-DROP-0034
    command: >-
      test ! -e context/proposals/0034-add-conversation-spec-library.md
      && test ! -e context/domains/conversation-spec-library
      && rg -n '0034-add-conversation-spec-library' context/INDEX.md;
      test $? -eq 1
    expect: proposal file gone, no applied domain page, INDEX.md has no pending 0034 row

  - criterion: AC-RECONCILE-IS-ITS-OWN-ACT
    command: >-
      rg -n 'context/proposals/' .agents/skills/cc-complete/SKILL.md .agents/skills/cc-deliver/SKILL.md
      wrapper/adapters/WORKFLOW.md docs/product-knowledge.md
    expect: no output; gather still writes in place; mark-done starts that same in-place reconcile, not a proposal sidecar

  - criterion: AC-IN-PLACE-WRITES
    command: sh test/acceptance.sh
    expect: full semantic suite exits 0 after the rewritten completion, knowledge, scenario, contract, and release checks

tier_signal: >-
  No tier raise. The inspected surfaces are contracts, shell runtime, skills,
  docs, Product Knowledge, tests, template seed, and the agent harness. No auth,
  secrets, money, production/deploy, or irreversible data migration is introduced.
  Dropping an unapplied pending proposal is reversible before delivery. Standard
  remains appropriate and retains independent verification.

feasible: true

out_of_scope_reach:
  - >-
    template/ (inside bound repository context-circuit-source, not a second
    repo): shipped seed still contains context/proposals/README.md and PROJECT.md
    still teaches the accept gate; scripts/release-manifest.txt and
    test/release/test-release.sh require that README. Must be modified to keep
    the shipped product consistent — include in the one plan, do not skip.
  - >-
    agent-harness/ (inside bound repository context-circuit-source, not a second
    repo): plots, generated cases, scenarios 18 and 19, grade.sh, run-scenario.sh,
    and test-template-runtime.sh currently assert inferred completion, proposal
    accept, and next-plan debt-block. Must be modified to keep the harness
    consistent — include in the one plan, do not skip.

open_questions:
  - question: "When should the in-place knowledge update auto-run?"
    disposition: already-answered
    rationale: "Approved contract: when the human asks to mark a plan done. Read the plan, mark it done, then update live context files if the plan affected Product Knowledge."

  - question: "Should asking for a pull request, merge, or sync start a knowledge update or mark the plan done?"
    disposition: already-answered
    rationale: "Approved contract: no. Delivery stays delivery only (AC-NO-DELIVERY-RECONCILE, AC-EXPLICIT-MARK-DONE)."

  - question: "If the knowledge update has not landed, should the next plan wait?"
    disposition: already-answered
    rationale: "Approved contract: no. A later plan can start (AC-NEXT-PLAN-NOT-BLOCKED)."

  - question: "What happens to pending proposal 0034?"
    disposition: already-answered
    rationale: "Approved contract: drop it; do not apply it as a context page (AC-DROP-0034)."

  - question: "Must template/ and agent-harness/ be modified even though the contract named only repository context-circuit-source?"
    disposition: already-answered
    rationale: "Those trees live inside the bound repository. They must change to keep shipped product and harness consistent. That is in-scope inclusion, not a second repository and not an intent revision."

  - question: "How should 'the plan affected Product Knowledge' be detected, and who writes the live context files?"
    disposition: plan-resolution
    rationale: "Engine must not interpret PK (INV-RUNTIME-01). Coordinator compares the plan's product_knowledge/changed paths/handoffs/evidence to live context units after plan-complete, then edits context/ and INDEX.md only when there is a durable knowledge change."

  - question: "Delete context/proposals/ entirely, leave an empty directory, or keep a README that says the path is retired?"
    disposition: plan-resolution
    rationale: "The approved intent forbids staging there; it does not freeze directory-cleanup shape. Release-manifest and workspace-init currently mkdir and require the README."

  - question: "Retire context-proposal.yaml and the accepted_schema_versions entry, or leave an unused schema?"
    disposition: plan-resolution
    rationale: "No live staging path should remain. Whether the schema file is deleted or kept as a historical unused shape is an implementation choice; test/contracts and release-artifact currently require the file."

  - question: "Keep .runtime/knowledge-debt markers as bookkeeping, or stop emitting them?"
    disposition: plan-resolution
    rationale: "The approved outcome is that they must not block the next plan and must not be started by delivery. Keeping a non-blocking audit marker vs removing emit/check verbs does not change the approved decision."

  - question: "Remove the completion-infer verb, or keep it as a no-op/refuse?"
    disposition: plan-resolution
    rationale: "It must not mark a plan done from delivery. Deleting the CLI vs making it refuse COMPLETION_INFER_REQUIRES_EXPLICIT for every tier is an implementation choice."

