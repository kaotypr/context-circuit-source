    expect: "pass; representative exact-cache warm approval reaches validated plan stack within 120 seconds and records whether the approximately 90-second target was met."
  - criterion: LAT-AC-003
    command: "sh test/latency/test-approval-plan.sh --case cold-multi-repository"
    expect: "pass; representative cold full trace completes within the three-to-four-minute benchmark target under the harness conditions, without reducing trace quality."
  - criterion: LAT-AC-004
    command: "sh test/intent/test-feasibility.sh && sh test/intent/test-approval-trace-plan.sh"
    expect: "pass; manifests retain anchors, task partitions, risks, runnable checks, tier/feasibility, scope reach, and question dispositions, and plans are derived only after the feasibility barrier."
  - criterion: LAT-AC-005
    command: "sh test/latency/test-approval-plan.sh --case exact-delta-fallback"
    expect: "pass; exact revision reuses a map, bounded relevant drift rereads/updates it, and unknown/broad drift or incompatible cache falls back to cold trace; stale evidence is never silently reused."
  - criterion: LAT-AC-006
    command: "sh test/latency/test-approval-plan.sh --case multi-plan-atomicity"
    expect: "pass; batch IDs are unique/stable, all staged plan files/dependencies/authorization/index rows agree, and injected validation failure leaves no partial visible stack or duplicate IDs."
  - criterion: LAT-AC-007
    command: "sh test/latency/test-approval-plan.sh --case timing-evidence"
    expect: "pass; approval records monotonic phase durations for approval, trace dispatch/per-repository trace, feasibility, ratification, materialization, validation, publication, fallback, and total time with no sensitive payloads."
  - criterion: LAT-AC-008
    command: "sh test/latency/test-approval-plan.sh --case same-repository-expansion"
    expect: "pass; worker can record and verifier checks an additional necessary path inside its assigned repository without plan rewrite or a new human gate, while tracer anchors remain advisory."
  - criterion: LAT-AC-009
    command: "sh test/latency/test-approval-plan.sh --case expansion-stop"
    expect: "pass; a needed second repository or approved-decision change stops with a structured coordinator finding, while ordinary same-repository discovery proceeds."
  - criterion: LAT-AC-001
    command: "sh test/acceptance.sh"
    expect: "pass; complete semantic acceptance suite remains green after the latency changes."
tier_signal: "Standard remains appropriate: this changes host-neutral orchestration, cache metadata, shell materialization, and plan records, but the approved scope contains no auth, secrets, money, production deployment, data migration, or irreversible side effect. Raise only if implementation introduces credential-bearing cache data, production/deploy automation, or destructive publication semantics."
