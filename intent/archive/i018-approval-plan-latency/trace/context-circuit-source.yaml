task_partition:
  - id: incremental-grounding
    title: Make repository grounding revision-bound and reusable
    rationale: "Add a derived immutable cache/map identity and bounded exact/delta/fallback freshness path to cc-trace while preserving an independent first-hand tracer and the existing manifest evidence."
    paths:
      - .agents/skills/cc-trace/SKILL.md
      - .context-circuit/agents/tracer.md
      - .context-circuit/wrapper/contracts/schemas/trace-manifest.yaml
      - .context-circuit/wrapper/contracts/invariants.yaml
      - context/domains/tracing/README.md
      - test/intent/test-feasibility.sh
      - test/latency/test-latency.sh
    depends_on: []
  - id: plan-shaped-trace
    title: Produce structured plan-ready trace fragments
    rationale: "Extend the durable trace handoff with observed revision/cache mode, typed anchors, investigation leads, criterion coverage, and normalized fragment/task dependencies so cc-plan need not perform a second repository interpretation pass."
    paths:
      - .context-circuit/wrapper/contracts/schemas/trace-manifest.yaml
      - .agents/skills/cc-trace/SKILL.md
      - .agents/skills/cc-plan/SKILL.md
      - .context-circuit/agents/coordinator.md
      - .context-circuit/agents/worker.md
      - .context-circuit/agents/verifier.md
      - .context-circuit/wrapper/contracts/schemas/worker-handoff.yaml
      - .context-circuit/wrapper/contracts/schemas/verifier-result.yaml
      - test/intent/test-approval-trace-plan.sh
    depends_on:
      - incremental-grounding
  - id: atomic-plan-stack
    title: Materialize and measure the complete plan stack atomically
    rationale: "Introduce one validated request boundary that batch-allocates unique IDs, renders and validates all plans/dependencies/authorization/index rows in staging, publishes all-or-nothing, and records phase timing/cache mode."
    paths:
      - .context-circuit/wrapper/runtime/engine.sh
      - .context-circuit/wrapper/contracts/schemas/plan.yaml
      - .context-circuit/wrapper/contracts/schemas/intent-contract.yaml
      - .context-circuit/wrapper/contracts/schemas/invariants.yaml
      - .context-circuit/agents/coordinator.md
      - .agents/skills/cc-intent/SKILL.md
      - .agents/skills/cc-plan/SKILL.md
      - test/intent/test-approval-trace-plan.sh
      - test/intent/test-feasibility.sh
      - test/latency/test-approval-plan.sh
      - test/acceptance.sh
    depends_on:
      - plan-shaped-trace
    plan_boundary: one-plan-with-embedded-tasks
    boundary_rationale: "The intent is scoped to one repository. These partitions share one approval/coordinator lifecycle, one runtime/materialization failure surface, one plan-stack publication boundary, and one independent verification boundary; separating them into stacked plans would make the intermediate trace/cache contracts unverifiable in isolation and would violate the intent's same-turn outcome."
risks:
  - "Current cc_intent_approve only freezes and indexes the intent; wiring plans into approval can accidentally make approval mutate plans before feasibility or publish partial state. Keep tracer/feasibility as a barrier and publish no plan on blocked/intent-revision/host-blocked outcomes."
  - "cc_plan_allocate_id scans directories without reservation; concurrent or retried batch allocation can duplicate IDs unless the materializer uses a lock/reservation keyed by invocation identity and includes archived IDs."
  - "cc_plan_validate and cc_plan_index_upsert are single-plan/single-row operations; composing them naïvely leaves partial plans/index rows when a later plan fails. Stage the complete tree and validate staged dependencies/authorization before one publication boundary."
  - "Trace-manifest is schema v1 and lacks revision/cache/fragment fields; old manifests cannot silently be treated as plan-ready. Use explicit legacy fallback or bounded re-trace and preserve required v1 evidence."
  - "Repository-map cache can hide relevant drift or leak source/credential/provider payloads if it stores content rather than structural indexes. Bind by workspace/repository/revision/schema/discovery rules, use immutable keys, and fall back cold on uncertain/broad drift."
  - "The approved design changes tracer paths from an inferred worker allowlist to advisory anchors, while worker.md and plan.yaml currently require declared bounded paths. Updating only the trace schema would either violate the intent or weaken existing worker/verifier scope safety; handoff and verifier must account for every same-repository expansion and stop on another repository or decision change."
  - "The runtime is model-blind and feasibility is coordinator judgment; moving fragment ratification, tier selection, question dispositions, or cache validity verdicts into engine.sh would create a parallel policy owner and weaken host neutrality."
  - "Timing evidence must use monotonic elapsed measurements and bounded fields without provider payloads, hidden reasoning, credentials, or user-facing internal jargon; shell wall-clock/date values alone are insufficient for elapsed timing."
  - "Retries around malformed plan fragments or publication failures can recreate the observed eight-minute command loop or consume IDs. Return one stage/key/error diagnostic; make pre-publication retries discardable and same-invocation success idempotent."
  - "The current test/latency/test-latency.sh measures execution attempt evidence, not approval-to-plan latency. Passing it alone cannot prove LAT-AC-002/003/007; add repeatable warm exact, delta, fallback, cold, multi-plan, and invalid-request benchmark cases while preserving quality assertions."
