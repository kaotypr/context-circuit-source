schema_version: 2
intent: i027-runnable-worktrees
title: Runnable worktrees via gitignored overlay
goal: >
  Every newly created execution or Explore worktree is toolchain-runnable
  before a worker is attached: after git worktree add, the runtime
  copy-on-write overlays every gitignored file and folder that exists on disk
  in the bound checkout, including .env, then keeps or replaces cloned install
  trees so they match this worktree's lockfile. environment ready is true only
  when that preparation succeeded. Overlay is never a symlink into the bound
  checkout. Untracked files that are not gitignored are not copied.

non_goals:
  - Copying untracked files that are not gitignored (uncommitted source on
    the bound checkout).
  - Symlinking the bound checkout's working tree or install directories into
    the worktree.
  - Adding a per-repository copy list or other CC-side profile (INV-GROUND-01).
  - Copying workspace-root host-local files (role-tiering.local.yaml,
    member.local.yaml, repositories.local.yaml) into a product worktree.
  - Changing isolation: each execution or Explore session still gets its own
    worktree and branch.
  - Teaching the worker to install deps or to use --no-verify as a workaround
    (INV-GROUND-03).
  - Committing gitignored overlay files, including .env.
  - Changing Gate 1, Gate 2, verifier independence, or one-owner-per-rule.
  - Mixing this change into unrelated dirty work already in the checkout.
  - Delivering, publishing, merging, or committing the implementation
    implicitly.

constraints:
  - Overlay runs after git worktree add and before a worker or Explore
    session is attached, for execution worktrees and for cc-pair Explore
    copies.
  - Overlay source is gitignored paths that exist on disk in the bound
    checkout. Copy-on-write when the filesystem supports it; otherwise a
    real copy of that path. Never a symlink.
  - .env and other gitignored local files from the checkout are included.
    They remain gitignored in the worktree and are not committed by the
    runtime.
  - After overlay, cloned toolchain install trees are kept only when they
    match this worktree's lockfile (and companion manifest as needed);
    otherwise a frozen install runs inside the worktree. That install may
    use the network. Greenfield (no lockfile or manifest) is no-toolchain
    and does not install.
  - environment ready is emitted only after overlay and, when a toolchain
    exists, after the worktree can run that toolchain. A lockfile alone is
    not ready. Overlay or provision failure blocks setup.
  - No per-repo profile. The ignored-path listing is Git's, and toolchain
    correction is a runtime-constant table keyed by detected lockfile or
    manifest.
  - Workarounds (shared node_modules, verify-deps flags, --no-verify) stay
    eliminated by hardening, never documented in the brief (INV-GROUND-03).
  - Product behavior has one owner per rule. Preserve unrelated and dirty
    work, and run the semantic acceptance suite after meaningful phases.

acceptance_criteria:
  - id: AC-IGNORED-OVERLAY
    statement: >
      A newly created execution or Explore worktree contains the gitignored
      files and folders that existed on disk in the bound checkout, including
      .env.
  - id: AC-COW-NOT-SYMLINK
    statement: >
      The overlay uses copy-on-write when the filesystem supports it, or a
      real copy otherwise, and does not symlink into the bound checkout.
  - id: AC-UNTRACKED-OUT
    statement: >
      Untracked files that are not gitignored are not copied from the bound
      checkout into the worktree.
  - id: AC-RUNNABLE
    statement: >
      When the worktree has a toolchain lockfile or manifest, it can run that
      repository's normal commands without the worker installing dependencies
      first.
  - id: AC-LOCKFILE-CORRECT
    statement: >
      A cloned install tree is kept only when it matches this worktree's
      lockfile; otherwise the worktree is installed from its own lockfile.
  - id: AC-HONEST-READY
    statement: >
      environment ready means overlay and toolchain preparation succeeded;
      detecting a lockfile without a prepared tree is not ready.
  - id: AC-FAIL-CLOSED
    statement: >
      If overlay or provision fails, worktree setup blocks and a worker is
      not attached to a half-ready tree.
  - id: AC-STILL-IGNORED
    statement: >
      Overlay files including .env stay gitignored in the worktree and are
      not committed by the runtime.

scope:
  repositories:
    - id: context-circuit-source

tier: standard
status: approved
