  Runtime blocker for id allocation, unrelated to this intent and already
  recorded by plans 0034 and 0038: `plan-allocate-id` fails
  PLAN_PREFIX_COLLISION because plans/archive/ carries duplicate numeric
  prefixes 0001-0016 (for example 0015-repository-grounding and
  0015-tracer-role-tiering). The ids were therefore derived by the same band
  rule the runtime would apply: member `kao`, plan band 1-999, highest existing
  prefix 0038, so the next consecutive in-band ids are 0039, 0040, 0041; each
  was checked free against `cc_plan_numbers`.
