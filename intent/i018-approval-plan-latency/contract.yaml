schema_version: 2
intent: i018-approval-plan-latency
title: Reduce approval-to-plan latency
goal: >-
  Reduce the elapsed time from an explicit intent approval to a complete, grounded,
  feasible, created, and validated plan stack, targeting roughly 90 seconds for a
  normal warm approval and three to four minutes for a cold full trace, while
  preserving approval as the single human action and retaining the existing
  grounding, feasibility, assurance, and authorization guarantees.
non_goals:
  - Split tracing or plan derivation into a separate human command or approval gate.
  - Start plan execution, delivery, completion, or publication as part of intent approval.
  - Remove the independent tracer role, feasibility judgment, or assurance-tier behavior.
  - Treat stale repository evidence as current or skip required grounding to meet a latency target.
  - Turn tracer-discovered paths into an exhaustive worker write allowlist.
constraints:
  - Intent approval must continue through tracing, feasibility, plan derivation, and validation in the same turn when the intent is feasible.
  - Repository grounding reused by a tracer must be bound to a repository revision and refreshed for relevant drift before it supports a plan.
  - Plan-ready trace output must preserve grounding anchors, task partitioning, risks, runnable done checks, tier signals, feasibility, scope reach, and question dispositions.
  - File paths, symbols, and call sites reported by the tracer are evidence anchors and investigation leads, not an exhaustive boundary on what the worker may read or modify.
  - A worker may expand the implementation surface within its assigned repository when the additional change is necessary for the approved intent, remains consistent with its constraints and non-goals, and is recorded for independent verification.
  - A worker must stop and return an expansion finding when implementation requires another repository, contradicts an explicit constraint or non-goal, or changes the approved goal, behavior, authority, or lifecycle semantics.
  - Multi-plan ID allocation, materialization, dependency validation, authorization, and index updates must complete consistently without leaving a partially finalized plan stack.
  - Performance optimizations must preserve host-neutral behavior and the existing one-rule-one-owner contract structure.
  - Approval timing must be observable by phase so warm, cold, fallback, and missed-target outcomes can be distinguished.
acceptance_criteria:
  - id: LAT-AC-001
    statement: A single explicit intent approval remains sufficient to produce every feasible derived plan, fully created and validated, without another human action.
  - id: LAT-AC-002
    statement: Representative warm approvals complete from approval request to validated plan stack in roughly 90 seconds, with typical cases remaining within two minutes.
  - id: LAT-AC-003
    statement: Representative cold approvals requiring full repository tracing complete within a three-to-four-minute target under normal operating conditions.
  - id: LAT-AC-004
    statement: Faster approvals retain sufficient grounding anchors, risks, runnable done checks, tier signals, feasibility outcomes, scope findings, and question dispositions to produce an evidence-backed plan without pretending that the tracer has found every implementation path.
  - id: LAT-AC-005
    statement: Reused repository knowledge cannot silently survive relevant code drift; stale evidence is refreshed or the workflow falls back to a full trace.
  - id: LAT-AC-006
    statement: Creating multiple plans allocates unique stable IDs and leaves plan files, dependencies, authorization state, and indexes mutually consistent without retry-driven recovery.
  - id: LAT-AC-007
    statement: Approval records phase-level timing evidence that distinguishes repository tracing, feasibility, plan materialization, validation, and fallback work.
  - id: LAT-AC-008
    statement: The worker can inspect its full assigned repository and modify additional necessary paths discovered during implementation without a plan rewrite, while recording why each expansion was required and keeping the work within the approved intent.
  - id: LAT-AC-009
    statement: Discoveries that require another repository or change the approved decision stop and return to the coordinator, while ordinary same-repository implementation discoveries do not create a new human gate.
scope:
  repositories:
    - id: context-circuit-source
      paths:
        - .
tier: standard
status: draft
intent_dependencies: []
