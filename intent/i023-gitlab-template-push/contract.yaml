schema_version: 2
intent: i023-gitlab-template-push
title: Push the published template to GitLab from the GitHub Action
goal: >
  When a template publication job publishes the assembled Context Circuit
  template to GitHub, that same job also pushes the same commit and version
  tag to gitlab.sicepat.tech. GitHub remains the canonical published
  template. GitLab receives a copy of that already-published tree, not a
  separately assembled artifact, and not a GitLab Release.

non_goals:
  - Replacing GitHub as the canonical template destination or making GitLab
    the sole or equal binding.
  - Creating a GitLab Release, GitLab project template flag, or GitLab
    package/registry artifact.
  - Changing cc-publish, plan publications, or any workspace external-surface
    pipeline.
  - Changing template assembly, the acceptance suite, or the meaning of a
    template version tag.
  - Putting a GitLab token, URL-with-token, or other credential into any
    workspace file or runtime record.
  - Creating the GitLab group or project from this source change.
  - Teaching instantiated workspaces a GitLab-only clone path as a new
    product concept.
  - Mixing this change into unrelated dirty work already in the checkout.
  - Delivering, merging, or committing the implementation implicitly.

constraints:
  - The GitLab host is gitlab.sicepat.tech. The GitLab group/project path is
    an open question until answered; do not invent it.
  - GitHub publication of main, the version tag, and the GitHub Release
    remains as it is today.
  - The GitLab push uses the same commit and annotated version tag the
    GitHub push just made; it does not re-assemble.
  - INV-SEC-01: the GitLab credential lives as a GitHub Actions secret at
    the host. Workspace files stay credential-free.
  - Product "publish"/"publication" vocabulary for cc-publish is unchanged.
    This work is a git push of the already-published template, not an
    external-surface publication.
  - Preserve unrelated and dirty work, and run the semantic acceptance
    suite after meaningful phases.

acceptance_criteria:
  - id: AC-GITHUB-UNCHANGED
    statement: >
      A successful template publication still pushes main and the version
      tag to GitHub and still creates the GitHub Release, the same as today.
  - id: AC-GITLAB-PUSH
    statement: >
      That same job also pushes the same commit and the same version tag to
      the named project on gitlab.sicepat.tech.
  - id: AC-SAME-TREE
    statement: >
      GitLab receives the tree that was just published to GitHub, not a
      second assembly or a different commit.
  - id: AC-NO-CREDENTIAL
    statement: >
      No GitLab token, URL-with-token, or other credential is written into
      any workspace file or runtime record.
  - id: AC-FAILURE-VISIBLE
    statement: >
      If the GitLab push cannot complete, the publication job fails rather
      than reporting success.

scope:
  repositories:
    - id: context-circuit-source

tier: standard
status: approved
