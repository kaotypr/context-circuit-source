schema_version: 2
intent: i004-intent-detail
title: Intent detail via the system-design skill
goal: >
  Let a human request, or be recommended, a fuller by-concern write-up of one
  intent before they approve it, so they can see what they are agreeing to and
  the coordinator can plan from a confirmed shape. That write-up lives at
  intent/<id>/detail/ using the same three-tier authoring as a system design.
  The existing cc-system-design skill is refactored to author both product-level
  designs under sources/system-design/ and this intent-rooted detail; no new
  skill and no new sources/system-design scope are added to specify this
  capability.

non_goals:
  - Adding a new sources/system-design tree or scope (including the unsolicited
    v1.1.0/intent-detail draft) as the specification of this capability.
  - Adding a new skill such as cc-intent-detail.
  - Replacing or removing product-level system-design authoring under
    sources/system-design/.
  - Adding a second human approval gate for the detail, or changing Gate 1.
  - Making intent detail required for every intent.
  - Changing Explore's planless path, tracing-before-planning, delivery, or
    scope-safety ownership.
  - Turning intent detail into Product Knowledge or a lifecycle object with
    its own status.
  - Delivering, publishing, merging, or committing the implementation implicitly.

constraints:
  - The folder name is detail/ under intent/<id>/, not design/.
  - Inner layout reuses the existing system-design three-tier rubric (README,
    design.md, concern files only when earned); split by concern, never by
    repository.
  - cc-system-design owns the authoring rubric for both roots. cc-intent
    recommends or honors a request and does not duplicate that rubric.
  - INTENT.md remains the short five-section approval surface and does not
    gain a sixth section or internal filenames.
  - Detail is drafted without reading the codebase (INV-INTENT-01).
  - contract.yaml remains the frozen authority; detail is not part of
    contract_digest.
  - Prefer skill and guidance changes; do not add an engine verb, schema field,
    or invariant unless tracing shows one is required for correctness.
  - Discard the unsolicited sources/system-design/context-circuit/v1.1.0/
    draft as part of landing this, rather than keeping it as specification.
  - Product behavior has one owner per rule; guidance must not create parallel
    policy.
  - Preserve unrelated and dirty work, and run the semantic acceptance suite
    after meaningful phases.

acceptance_criteria:
  - id: AC-BOTH-ROOTS
    statement: >
      The system-design skill can still author a product-level design under
      sources/system-design/, and can also author an intent's fuller write-up
      under intent/<id>/detail/ with the same three-tier layout and
      split-when-earned rule.
  - id: AC-OPTIONAL-RECOMMENDED
    statement: >
      A human can request the fuller write-up, or be recommended it when one
      intent has several concerns; skipping it does not block approving the
      intent, and a small single-outcome intent can stay short.
  - id: AC-NO-SECOND-GATE
    statement: >
      Approving the intent remains the one conversational decision; there is
      no separate approval of the detail, and plan derivation after approval
      is unchanged.
  - id: AC-SKILL-NOT-SOURCE-DESIGN
    statement: >
      This capability is specified and shipped through the system-design skill
      and the related intent/plan/trace guidance, not through a new
      sources/system-design scope written for this feature.
  - id: AC-PLANNING-USES-DETAIL
    statement: >
      When an intent has a detail write-up, later planning uses it as the
      confirmed shape of what to build so plans and tasks follow those topics,
      without replacing the post-approval read of the real code.
  - id: AC-SHORT-SURFACE
    statement: >
      The human-facing intent page stays the short five-section approval
      surface; the fuller write-up is extra files with the intent, not a
      longer approval page.

scope:
  repositories:
    - id: context-circuit-source
      paths:
        - .agents/skills/
        - agents/
        - docs/
        - context/domains/
        - test/
        - sources/system-design/context-circuit/v1.1.0/

tier: standard
status: draft
