task_partition:
  - id: rule-owners
    title: Add durable-only rule to normative owners
    scope: invariants.yaml, product-knowledge.md, context/CONVENTIONS.md, context-index schema if needed
    depends_on: []
    boundary: one plan with embedded tasks
  - id: writing-paths
    title: Update gather and mark-done writing-path guidance
    scope: WORKFLOW.md, coordinator.md, cc-complete/SKILL.md, domain-context template
    depends_on: [rule-owners]
  - id: rewrite-live-context
    title: Rewrite live context ephemeral citations and DECISIONS style
    scope: live context/ (26 files with path citations; DECISIONS history style)
    depends_on: [rule-owners]
  - id: rewrite-template-seed
    title: Align template/context seed with durable-only rule
    scope: template/context/SOURCES.md, sources.yaml, DECISIONS.md, INDEX.md; release-manifest / workspace.yaml if sources.yaml fate changes
    depends_on: [rule-owners, writing-paths]
  - id: prove-and-fix-tests
    title: Add done-check scripts and fix contract tests
    scope: test/contracts/test-contracts.sh, new rg-based checks, sh test/acceptance.sh
    depends_on: [rewrite-live-context, rewrite-template-seed, writing-paths]

risks:
  - INV-KNOWLEDGE-01 still mandates provenance as retrieval metadata while the outcome bans sources/ paths in live context; SOURCES.md and sources.yaml must be redesigned together or the invariant conflicts with the outcome.
  - workspace.yaml context.sources_file and release-manifest.txt require context/sources.yaml; hollowing or deleting it needs coordinated identity and release-assembly updates.
  - Domain Provenance sections and YAML frontmatter source_revisions embed wrapper HEAD commits and Authored-from footnotes; bulk removal may drop freshness signals unless replaced with durable acceptance dates only.
  - test/contracts/test-contracts.sh asserts ephemeral paths remain in the system-design-authoring domain.
  - Generic product-layout paths (plans/<id>/, intent/<id>/INTENT.md) sit on the AC-CONCEPTS-REMAIN boundary; over-aggressive rg checks could forbid legitimate concept explanation.
  - DECISIONS.md historical rewrite is large; easy to drop durable decision substance while stripping file lists.

done_checks:
  - criterion: AC-NO-EPHEMERAL-CITE
    command: >
      test $(rg -c 'sources/' context/ 2>/dev/null | awk -F: '{s+=$2} END {print s+0}') -eq 0
      && test $(rg -c 'context/sources\.yaml' context/ 2>/dev/null | awk -F: '{s+=$2} END {print s+0}') -eq 0
      && test $(rg -c 'intent/i[0-9]{3}-' context/ 2>/dev/null | awk -F: '{s+=$2} END {print s+0}') -eq 0
      && test $(rg -c 'plans/context-circuit-plans|sources/system-design/' context/ 2>/dev/null | awk -F: '{s+=$2} END {print s+0}') -eq 0
    expect: exit 0 — zero banned path patterns in live context/
  - criterion: AC-REWRITE-EXISTING
    command: >
      test $(rg -l 'sources/|context/sources\.yaml|intent/i[0-9]{3}-|plans/context-circuit-plans|sources/system-design/' context/ | wc -l | tr -d ' ') -eq 0
    expect: exit 0 — no live context file still contains a banned citation
  - criterion: AC-DECISIONS-KNOWLEDGE
    command: >
      ! rg -n 'Accepted from proposal|context/proposals/' context/DECISIONS.md
    expect: exit 0 — DECISIONS entries do not cite proposals
  - criterion: AC-CONCEPTS-REMAIN
    command: >
      rg -q 'Gate 1|first-class intent|intent contract' context/domains/intent/README.md
      && rg -q 'archive|restore' context/domains/plan-organization/README.md
      && rg -q 'passive|read only when named' context/SOURCES.md
    expect: exit 0 — concept explanations remain
  - criterion: AC-ALL-WRITES
    command: >
      rg -q 'durable' .context-circuit/docs/product-knowledge.md
      && rg -q 'durable' .context-circuit/wrapper/contracts/invariants.yaml
      && rg -q 'durable' .context-circuit/agents/coordinator.md
      && rg -q 'durable' .context-circuit/wrapper/adapters/WORKFLOW.md
      && rg -q 'durable' .agents/skills/cc-complete/SKILL.md
    expect: exit 0 — all writing paths state the durable-only rule
  - criterion: regression
    command: sh test/acceptance.sh
    expect: exit 0

