    disposition: already-answered
    note: Template seed is shipped product surface and must align with the writing rule.
  - question: How to explain the sources concept without naming a sources/ path?
    disposition: already-answered
    note: AC-CONCEPTS-REMAIN allows the concept; the ban is on paths and particular files.
  - question: What happens to context/sources.yaml — delete, empty catalog, or repurpose?
    disposition: plan-resolution
    note: No live context file may name a sources path. workspace.yaml and release-manifest still point at this file.
  - question: Do generic product-layout paths (plans/<id>/, intent/<id>/INTENT.md, plans/INDEX.md) remain in domain pages?
    disposition: plan-resolution
    note: AC-CONCEPTS-REMAIN supports concept explanation; particular artifact ids and sources/system-design/... paths must go.
