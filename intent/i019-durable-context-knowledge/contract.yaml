schema_version: 2
intent: i019-durable-context-knowledge
title: Context files hold only durable product knowledge
goal: >
  When an agent generates or updates Product Knowledge, live context files
  contain only durable knowledge about the product. They never name a plan,
  an intent file, or a sources file, because those artifacts are meant to be
  archived or deleted. Existing live context is rewritten to that rule. No
  live context file names a sources/ path, including context/sources.yaml
  and provenance footnotes. DECISIONS.md records the decision of the
  product-knowledge change — what is now true — not the files that were
  edited and not the ephemeral artifact the change came from. Explaining
  the product concepts plan, intent, and sources remains allowed.

non_goals:
  - Forbidding Product Knowledge from explaining the product concepts
    plan, intent, and sources (what they are, how they work, how an agent
    routes them).
  - Changing when knowledge is written. Gathering context and mark-done
    reconcile still write live context files in place; delivery still does
    not.
  - Changing archive or delete behavior of plans, intents, or sources.
  - Adding a third human gate for knowledge updates.
  - Rewriting sources files, plan files, or intent files themselves.
  - Changing the catalog-selection work in i015-lean-workspace-context.
  - Delivering, publishing, merging, or committing the implementation
    implicitly.

constraints:
  - Product behavior has one owner per rule. The durable-knowledge writing
    rule lives with Product Knowledge conventions and the knowledge
    invariants, not as a skill-only copy.
  - Linking between durable context units (for example a domain page and
    DECISIONS.md) remains allowed.
  - No live context file names a sources/ path. That includes
    context/sources.yaml and provenance footnotes.
  - Invariant IDs and shipped contract or adapter paths are durable
    product identity, not ephemeral artifacts, and may still be named.
  - Use the smallest route-selected context. Do not glob or grep context/
    to discover units.
  - Preserve unrelated and dirty work, and run the semantic acceptance
    suite after meaningful phases.

acceptance_criteria:
  - id: AC-NO-EPHEMERAL-CITE
    statement: >
      No live context file names a plan, an intent file, or a sources
      file. That includes pages already present, new writes, and
      context/sources.yaml.
  - id: AC-REWRITE-EXISTING
    statement: >
      Existing live context that currently names a plan, an intent file,
      or a sources file is rewritten so only durable product knowledge
      remains.
  - id: AC-DECISIONS-KNOWLEDGE
    statement: >
      DECISIONS.md records the durable product-knowledge decision — what
      is now true about the product — not which files were changed and not
      the plan, intent, or sources artifact the change came from.
  - id: AC-CONCEPTS-REMAIN
    statement: >
      Product Knowledge may still explain the product concepts plan,
      intent, and sources. The ban is on pointing at particular files of
      those kinds, not on using the words.
  - id: AC-ALL-WRITES
    statement: >
      Every path that generates or updates context files — gathering
      context, reconciling after mark-done, and any similar in-place
      update — follows the same durable-only rule.

scope:
  repositories:
    - id: context-circuit-source

tier: standard
status: approved
