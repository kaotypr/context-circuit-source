schema_version: 2
intent: i022-ok-easter-egg
title: Easter egg on a lone ok, punchline hidden in the engine
goal: >
  When a user's entire message is the two letters ok, case-insensitive and
  allowing surrounding whitespace, the coordinator's reply begins with the
  exact line "Haha, meat proxy!" and then continues the immediately pending
  work that message was confirming. The punchline string is stored only in
  the engine as the deterministic stdout of a named invoke. The engine does
  not see chat and does not interpret user language; the coordinator notices
  the two-letter message and invokes that action. If nothing is pending, the
  line is still printed and the coordinator waits. Ordinary agent
  instructions, skills, host adapters, Product Knowledge, and ordinary
  engine help do not contain the punchline.

non_goals:
  - Teaching the engine to read, store, or interpret user conversation.
  - Matching ok inside a longer message, or matching okay, punctuation,
    or extra words.
  - Putting the punchline in coordinator instructions, skills, host
    adapters, Product Knowledge, or ordinary engine help/usage text.
  - Changing Gate 1, Gate 2, or any other lifecycle meaning except treating
    a lone ok as continuation of the immediately pending coordinator ask.
  - Making workers, verifiers, or planners emit the line.
  - Documenting the easter egg as a product feature a lay user is taught.
  - Mixing this change into unrelated dirty work already in the checkout.
  - Delivering, publishing, merging, or committing the implementation
    implicitly.

constraints:
  - INV-RUNTIME-01 stands: the engine remains a deterministic library with no
    conversational routing policy, no prompts, and no Product Knowledge
    interpretation. Hiding the punchline means a fixed stdout string behind
    an invoke, not an engine that decides when the user said ok.
  - Conversational routing stays with the coordinator. The trigger (entire
    message is those two letters) is owned there; the punchline string is
    not.
  - A lone ok continues the immediately pending coordinator ask and prefixes
    the joke. It is not a hidden confirmation token and does not approve,
    execute, complete, or deliver anything that was not already the pending
    ask.
  - Product behavior has one owner per rule. Do not copy the punchline or
    a second trigger into skills, adapters, or host-native stubs.
  - The punchline must not appear in ordinary engine help or the documented
    public action list. Semantic tests that enumerate public actions must
    still pass.
  - Preserve unrelated and dirty work, and run the semantic acceptance
    suite after meaningful phases.

acceptance_criteria:
  - id: AC-LONE-OK
    statement: >
      When the user's entire message is ok, OK, Ok, or oK, with optional
      surrounding whitespace and nothing else, the coordinator's next
      user-visible reply begins with the exact line Haha, meat proxy! and
      then continues the immediately pending work.
  - id: AC-NO-FALSE-TRIGGER
    statement: >
      Messages such as okay, ok., ok!, ok thanks, or any longer text that
      merely contains ok do not trigger the line.
  - id: AC-PUNCHLINE-HIDDEN
    statement: >
      The exact punchline string lives in the engine implementation and
      does not appear in coordinator instructions, skills, host adapters,
      Product Knowledge, or ordinary engine help.
  - id: AC-ENGINE-NOT-A-ROUTER
    statement: >
      The engine does not read chat, store user text, or decide that a
      message was ok. It only prints a fixed line when the coordinator
      invokes it.
  - id: AC-IDLE-OK
    statement: >
      If a lone ok arrives with nothing pending, the line is still said
      and the coordinator does not invent work.

scope:
  repositories:
    - id: context-circuit-source

tier: standard
status: approved
