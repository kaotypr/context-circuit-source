  - id: plan-resolution-archive-prefix-collision
    kind: plan-resolution
    question: >
      plan-allocate-id returns PLAN_PREFIX_COLLISION because archived plan
      directories reuse numeric prefixes (0001–0016 each appear more than once).
      The next free in-band id is 0030. Publication should use 0030-lean-workspace-context
      until archive prefix duplicates are reconciled or allocation is relaxed for
      new ids outside the duplicate set.
  - id: plan-resolution-domains-readme
    kind: plan-resolution
    question: >
      context/domains/README.md stays in the shipped seed as domain-structure
      knowledge (release-manifest.txt requires it). Agents must not treat it as
      the retrieval catalog; procedure and checks forbid fall-through from
      context/INDEX.md, without deleting or rewriting domain pages.
