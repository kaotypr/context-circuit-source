schema_version: 2
intent: i009-one-repo-per-plan
title: One plan, one repository, one worker
goal: >
  A plan maps to exactly one repository and is executed by one worker who
  changes only that repository. An approved intent whose scope covers two or
  more repositories must derive at least one plan per repository, each with
  its own worker and, where the tier requires it, its own independent
  verifier. The observed failure — one intent covering two repositories
  collapsing into a single plan that expects one worker to change both — is
  the defect this change closes.

non_goals:
  - Changing Explore's existing one-repository pairing rule.
  - Adding a second human approval of the derived plans.
  - Making plan count a proxy for assurance tier.
  - Changing delivery's ability to present more than one finished plan as
    one pull request.
  - Undoing stacked-plan ordering; this tightens the execution boundary
    rather than removing stacks.
  - Delivering, publishing, merging, or committing the implementation implicitly.

constraints:
  - This replaces the current "one worker across all mapped repositories"
    execution boundary with "one worker, one repository, per plan".
  - Inter-plan order uses existing plan dependencies when one repository's
    work must follow another.
  - One intent may still authorize several plans; the split is not a new
    human gate.
  - Product behavior has one owner per rule; update the owning execution
    and tracing contracts rather than adding a skill-only note.
  - Preserve unrelated and dirty work, and run the semantic acceptance suite
    after meaningful phases.

acceptance_criteria:
  - id: AC-ONE-REPO-PER-PLAN
    statement: >
      Every derived plan names exactly one repository; a plan that lists two
      or more repositories is invalid.
  - id: AC-ONE-WORKER-PER-REPO
    statement: >
      The worker for a plan changes only that plan's repository and is never
      asked to implement the same plan across two repositories.
  - id: AC-SPLIT-MULTI-REPO-INTENT
    statement: >
      An intent whose scope covers two repositories produces at least two
      plans, one per repository, with explicit ordering when one depends on
      the other.
  - id: AC-NO-SECOND-GATE
    statement: >
      The split remains derived from the approved intent and the tracer;
      it does not add a second human approval of the plans.
  - id: AC-DELIVERY-UNCHANGED
    statement: >
      Finished per-repository plans can still be delivered together later;
      this change does not require one pull request per plan.

scope:
  repositories:
    - id: context-circuit-source

tier: standard
status: draft
