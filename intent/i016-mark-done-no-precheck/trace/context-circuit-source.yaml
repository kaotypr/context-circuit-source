schema_version: 1
intent: i016-mark-done-no-precheck
repository: context-circuit-source
recorded_at: "2026-09-06T00:00:00Z"

file_map:
  - path: ".agents/skills/cc-complete/SKILL.md"
    description: "Agent skill instruction for mark-done. Currently describes calling plan-complete without explicit pre-check text, but should clarify that NO inspection of work or evidence happens before the runtime readiness gate."
    line_range: "1-35"
    call_sites:
      - "Lines 9-14: defines Standard and Critical mark-done path via plan-complete"
      - "Lines 15-20: success path and refusal conditions"
      - "Lines 21-30: knowledge reconcile (separate from completion gate)"

  - path: "wrapper/runtime/engine.sh"
    description: "Runtime implementation of plan-complete verb and completion-ready gate"
    line_range: "3065-3153"
    call_sites:
      - "Lines 3146-3153: cc_plan_complete function - the actual mark-done implementation. Calls cc_completion_ready to enforce tier floor."
      - "Lines 3069-3103: cc_completion_ready function - the runtime gate that enforces whether a plan is eligible for mark-done. For Standard/Critical: requires verified status, candidate still current, and human acceptance. For Explore: requires human acceptance only."

  - path: "agents/coordinator.md"
    description: "Coordinator role instructions that govern when mark-done is invoked"
    line_range: "133-154"
    call_sites:
      - "Lines 145-146: states 'Mark-done is the only draft→done trigger and, when the plan affected Product Knowledge, starts that same in-place reconcile.'"
      - "Lines 150-154: states completion is explicit at Standard/Critical, verification/delivery never mark done"

  - path: "wrapper/contracts/invariants.yaml"
    description: "Formal contract rules about completion behavior"
    line_range: "search for INV-COMPLETE-01"
    call_sites:
      - "INV-COMPLETE-01: completion-ready enforces tier floor; Standard/Critical require candidate-bound independent pass"
      - "INV-COMPLETE-02: explicit mark-done writes completion record and changes status, optionally starts knowledge reconcile"

task_partition:
  - id: "one-plan"
    description: "One bounded plan: remove/clarify pre-check language from agent instructions"
    rationale: >
      The runtime readiness gate (completion-ready) already exists and is correct. No change needed there. The only work is
      in the coordinator-facing instructions (cc-complete skill and coordinator.md) to make explicit that NO agent
      inspection of work or evidence occurs before calling plan-complete. The runtime itself decides readiness. This is
      a single skill-instruction clarification task with a single execution boundary.

risks:
  - description: "Risk of accidentally modifying or weakening the runtime completion-ready gate itself"
    mitigation: "The runtime verb must not change — only the coordinator skill text changes. Verify completion-ready function remains unmodified."

  - description: "Risk of missing a second place where pre-check language appears"
    mitigation: "Grep search across all .agents/skills and agents/*.md files for any text instructing inspection/checking before mark-done"

  - description: "Risk that batch mark-done (several plans in one ask) has a separate code path with pre-check logic"
    mitigation: "Verify plan-complete is called identically for one plan and multiple plans; no special pre-check for batches."

  - description: "Risk of weakening the human acceptance record requirement"
    mitigation: "cc_completion_ready still requires human-acceptance record (candidate-bound); this is NOT removed."

done_checks:
  - criterion: "AC-NO-PRECHECK"
    command: "grep -r 'inspect.*work\\|check.*work\\|verify.*work\\|evidence.*before.*done\\|before.*mark' .agents/skills/cc-complete/ agents/coordinator.md"
    expect: "No matches. Any reference to pre-inspection is removed from agent instructions."

  - criterion: "AC-NO-PRECHECK"
    command: "grep -n 'plan-complete' .agents/skills/cc-complete/SKILL.md && grep -A2 'run.*plan-complete' .agents/skills/cc-complete/SKILL.md"
    expect: "Shows plan-complete is invoked directly without a preceding inspection step in the text"

  - criterion: "AC-RUNTIME-REFUSES"
    command: "grep -A 20 'cc_completion_ready' wrapper/runtime/engine.sh | grep -E 'cc_fail|return 1' | head -5"
    expect: "At least 5 distinct failure paths in cc_completion_ready remain (verifier status, candidate staleness, human acceptance missing, etc.)"

  - criterion: "AC-RUNTIME-REFUSES"
    command: "grep 'COMPLETION_' wrapper/runtime/engine.sh"
    expect: "All COMPLETION_* error codes present and unchanged (COMPLETION_NO_EXECUTION, COMPLETION_BLOCKED, COMPLETION_NOT_VERIFIED, COMPLETION_NO_ACCEPTANCE, COMPLETION_CANDIDATE_STALE, etc.)"

  - criterion: "AC-STILL-EXPLICIT"
    command: "grep -n 'plan-complete' wrapper/runtime/engine.sh | grep -c 'cc_plan_complete'"
    expect: "Exactly one function definition (cc_plan_complete); it is only called when explicitly invoked, never auto-called"

completeness_proof:
  command: "grep -rn 'plan-complete\\|plan_complete\\|mark.*done\\|mark_done' .agents/skills/cc-complete/ agents/coordinator.md wrapper/contracts/invariants.yaml | wc -l"
  count: ">0 references exist; after change, skill text should have ONE reference (the invocation) but no prior-inspection language"

tier_signal: null

feasible: true

out_of_scope_reach: []

open_questions:
  - text: "Is there existing coordinator conversational logic (in a hosted agent or template) that currently does inspect work before asking to mark-done? If so, that would need updating too, but it is outside the source repository scope."
    disposition: "plan-resolution"

  - text: "The INTENT text says 'That extra look is wasted agent work' — is there a specific place where the coordinator currently inspects work/evidence before calling plan-complete that was identified during intent authoring but not visible in current skill text?"
    disposition: "already-answered"
    rationale: "The intent was approved with the understanding that the pre-check is a conversational behavior to be removed from instructions, not a runtime code path."
