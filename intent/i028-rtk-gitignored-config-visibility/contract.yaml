schema_version: 2
intent: i028-rtk-gitignored-config-visibility
title: Direct-read rule for gitignored workspace-root config
goal: >
  Any agent working in this repository can reliably find and read
  repositories.local.yaml, role-tiering.local.yaml, and member.local.yaml.
  CLAUDE.md and/or AGENTS.md state that these three files are gitignored,
  host-local, and must be read directly by path rather than discovered via
  find/grep, and explain why: the Claude Code PreToolUse hook silently
  rewrites find/grep to RTK's proxy, which walks with git_ignore(true)
  hardcoded and never surfaces a gitignored path, so an empty find/grep
  result is not evidence the file is absent.

non_goals:
  - Changing RTK configuration (.rtk/filters.toml, config.toml, or any
    upstream rtk-ai/rtk behavior).
  - Un-gitignoring repositories.local.yaml, role-tiering.local.yaml, or
    member.local.yaml, or altering .gitignore.
  - Disabling or reconfiguring the RTK PreToolUse hook itself.
  - Documenting every RTK-affected command generally; scope is the three
    named workspace-root config files only.
  - Committing, publishing, merging, or delivering implicitly.

constraints:
  - The rule is added to CLAUDE.md and/or AGENTS.md only — no runtime code,
    no schema, no .claude/ hook or settings change.
  - Name all three files explicitly (repositories.local.yaml,
    role-tiering.local.yaml, member.local.yaml) and state they are
    gitignored/host-local.
  - Keep the addition short: a rule plus a one-line reason, not a treatise
    on RTK internals.
  - Preserve unrelated and dirty work already in the checkout.

acceptance_criteria:
  - id: AC-RULE-PRESENT
    statement: >
      CLAUDE.md and/or AGENTS.md contains an explicit instruction to read
      repositories.local.yaml, role-tiering.local.yaml, and
      member.local.yaml directly by path rather than via find/grep
      discovery.
  - id: AC-REASON-STATED
    statement: >
      The instruction states why: these files are gitignored and the RTK
      hook rewrites find/grep in a way that silently omits gitignored
      paths from their output.
  - id: AC-NO-RTK-CHANGE
    statement: >
      No .rtk/filters.toml, rtk config.toml, or hook configuration is
      added or modified by this change.

scope:
  repositories:
    - id: context-circuit-source

tier: explore
status: draft
