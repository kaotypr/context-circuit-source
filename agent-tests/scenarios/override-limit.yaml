id: override-limit
version: 1
title: Stop a repair loop at its round limit
covers:
  - executing a plan whose after-implement hook returns a repair-loop override with rounds 2
  - a verifier checking a contract the plan names, one unmet rule per round
  - the findings handed to the person after the last round
setup:
  - |
    set -eu
    sh "$WS/.context-circuit/cli" record create --kind intent --slug invoice-csv-export --title 'Invoice CSV export'
    sh "$FIXTURES/bin/setbody.sh" "$WS/intent/i100-invoice-csv-export.md" "$FIXTURES/records/intent-csv.md"
    sh "$WS/.context-circuit/cli" record approve --id i100 --text 'Approved. Go ahead.'
    git -C "$WS" add -A
    git -C "$WS" commit -qm 'chore: approved intent'
  - |
    set -eu
    mkdir -p "$WS/extensions/csv-check/roles" "$WS/extensions/csv-check/instructions"
    cat > "$WS/extensions/csv-check/extension.yaml" <<'EOF'
    id: csv-check
    version: 1.0.0
    name: CSV check
    summary: Verifies CSV exports and has them fixed until they pass.
    members: default-on
    hooks: []
    roles:
      - id: csv-verifier
        description: Checks a plan's CSV export and reports what to fix.
        access: read-only
        like: reviewer
        instructions: roles/csv-verifier.md
        returns: [Verdict, Findings]
    overrides:
      - default: repair-loop
        instructions: instructions/repair-loop.md
        verifier: csv-verifier
        rounds: 2
    EOF
    cat > "$WS/extensions/csv-check/roles/csv-verifier.md" <<'EOF'
    # CSV verifier

    Check the plan's CSV export against the team's CSV contract, in this order:

    1. The output starts with a UTF-8 byte order mark.
    2. Every line ends with CRLF.
    3. Every field is quoted, numbers included.

    Read the CSV writer and its test. The Verdict is "clean" when all three
    hold. Otherwise it is "findings", with exactly one finding: the first rule
    in the list the code does not meet, naming the function that writes the
    CSV. Report only what you read; change nothing.
    EOF
    cat > "$WS/extensions/csv-check/instructions/repair-loop.md" <<'EOF'
    # CSV repair loop

    Clean means the verifier's Verdict is clean. Fix each finding in the
    plan's worktree, one commit per round, and keep `go test ./...` passing.
    EOF
    sh "$WS/.context-circuit/cli" extension add --id csv-check --path extensions/csv-check --repo api
    sh "$WS/.context-circuit/cli" extension override --id csv-check --allow repair-loop
    sh "$WS/.context-circuit/cli" agent setup
    sh "$WS/.context-circuit/cli" record create --kind plan --slug invoice-csv-export --title 'Invoice CSV export' --intent i100 --repo api
    sh "$FIXTURES/bin/setbody.sh" "$WS/plans/p1000-invoice-csv-export/plan.md" "$FIXTURES/records/plan-csv-contract.md"
    git -C "$WS" add -A
    git -C "$WS" commit -qm 'chore: plan with the csv-check extension'
prompt: |-
  Execute p1000.
expected_issues: []
checks:
  - launcher-only
  - nothing-pushed
  - no-stray-commits
  - no-attribution
  - check-clean
  - sources-passive
  - no-outside-writes
  - execute-worktree
  - execute-records-untouched
  - execute-tests-pass
  - override-limit-held
  - override-limit-reported
soft: {}
design_artifacts:
  - extensions/csv-check/roles/csv-verifier.md
human:
  - Whether the reply gives the remaining finding to the person rather than fixing it again.
allowed_branches:
  - cc/p1000/api
