# Trigger map: which source paths need which scenarios.
#
# match is a glob over source paths. ** crosses directories. An empty hosts
# list means any one host. kind is the before/after artifact:
#   always-loaded, skill-text, skill-route, shipped-docs, structure,
#   cli-action, record-template, check-findings, role-definitions,
#   launcher, template-data, host-settings.
# larger on a row means the path itself is a larger change. surface-diff
# also reports a larger change from the diff, and that part is a heuristic.
# none lists paths that need no scenarios.
#
# The Language section names intent-lang, the scenario file for the
# language variant. The catalogue does not have a separate overhead scenario.

rows:
  - match: product/AGENTS.md.in
    scenarios: [orient]
    kind: always-loaded
    note: Any section. orient always, plus the section table.

  - match: product/CLAUDE.md.in
    scenarios: [orient]
    hosts: [claude]
    kind: always-loaded

  - match: product/CURSOR.md.in
    scenarios: [orient]
    hosts: [cursor]
    kind: always-loaded

  - match: product/cursor.mdc.in
    scenarios: [orient]
    hosts: [cursor]
    kind: always-loaded

  - match: product/skills/cc-workspace/SKILL.md
    scenarios: [join, extension-skill]
    kind: skill-text

  - match: product/skills/cc-workspace/route.md
    scenarios: [join]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/cc-intent/SKILL.md
    scenarios: [intent]
    kind: skill-text

  - match: product/skills/cc-intent/route.md
    scenarios: [intent]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/cc-plan/SKILL.md
    scenarios: [plan]
    kind: skill-text

  - match: product/skills/cc-plan/route.md
    scenarios: [plan]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/cc-dispatch/SKILL.md
    scenarios: [plan, execute, extension-role, override-loop]
    kind: skill-text

  - match: product/skills/cc-dispatch/route.md
    scenarios: [plan, execute]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/cc-worktree/SKILL.md
    scenarios: [execute, override-loop]
    kind: skill-text

  - match: product/skills/cc-worktree/route.md
    scenarios: [execute]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/cc-knowledge/SKILL.md
    scenarios: [complete, borrowed]
    kind: skill-text

  - match: product/skills/cc-knowledge/route.md
    scenarios: [complete, borrowed]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/cc-complete/SKILL.md
    scenarios: [complete, archive, after-merge]
    kind: skill-text

  - match: product/skills/cc-complete/route.md
    scenarios: [complete, after-merge]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/cc-deliver/SKILL.md
    scenarios: [after-merge]
    kind: skill-text

  - match: product/skills/cc-deliver/route.md
    scenarios: [after-merge]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/ff/SKILL.md
    scenarios: [ff, after-merge]
    kind: skill-text

  - match: product/skills/ff/route.md
    scenarios: [ff, after-merge]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files. /ff is a slash command on these two hosts.

  - match: product/skills/cc-writing/SKILL.md
    scenarios: [intent, intent-lang, intent-tone, plan, complete, complete-tone]
    kind: skill-text

  - match: product/skills/cc-writing/route.md
    scenarios: [intent, intent-lang, intent-tone, plan, complete, complete-tone]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/cc-writing/references/**
    scenarios: [intent, intent-lang, intent-tone, complete-tone]
    kind: skill-text

  - match: product/skills/cc-direct/SKILL.md
    scenarios: [direct]
    kind: skill-text

  - match: product/skills/cc-direct/route.md
    scenarios: [direct]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/cc-cli/SKILL.md
    scenarios: [orient]
    kind: skill-text

  - match: product/skills/cc-cli/route.md
    scenarios: [orient]
    hosts: [claude, cursor]
    kind: skill-route
    note: Codex does not read route files.

  - match: product/skills/cc-cli/scripts/install.*
    scenarios: [orient]
    kind: launcher
    note: Shipped installer. orient in faithful mode.

  - match: product/docs/commands.md
    scenarios: [intent]
    kind: shipped-docs

  - match: product/docs/working.md
    scenarios: [intent, plan, complete]
    kind: shipped-docs

  - match: product/docs/workspace.md
    scenarios: [join, borrowed]
    kind: shipped-docs

  - match: product/docs/worktrees.md
    scenarios: [execute]
    kind: shipped-docs

  - match: product/docs/agents.md
    scenarios: [plan, execute]
    kind: shipped-docs

  - match: product/docs/extensions.md
    scenarios: [extension-execute, extension-skip, extension-push, extension-stop, extension-report, extension-unallowed, extension-none-push, extension-role, override-not-allowed, extension-skill]
    kind: shipped-docs
    note: The reference an agent follows for hook output, skips, scripts, trust, consent, failure, and the line no extension crosses.

  - match: product/docs/customization.md
    scenarios: [override-loop, override-not-allowed]
    kind: shipped-docs
    note: The reference for fixed rules, the overridable defaults, and the repair loop.

  - match: product/docs/how-it-works.md
    scenarios: [orient]
    kind: shipped-docs

  - match: product/host/claude-settings.json
    scenarios: [orient, execute]
    hosts: [claude]
    kind: host-settings

  - match: "product/launcher/*"
    scenarios: [orient, join]
    kind: launcher
    note: Faithful mode installs through the shipped installer. The Windows launcher is for when a reviewer asks.

  - match: product/workspace-README.md
    scenarios: [orient]
    kind: always-loaded
    note: Written to README.md at init. It is not a release-manifest line.

  - match: template/context/INDEX.md
    scenarios: [orient, complete, borrowed]
    kind: template-data

  - match: template/context/glossary.md
    scenarios: [orient, complete, borrowed]
    kind: template-data

  - match: template/intent/README.md
    scenarios: [intent]
    kind: template-data

  - match: template/plans/README.md
    scenarios: [plan]
    kind: template-data

  - match: template/sources/README.md
    scenarios: [orient, borrowed]
    kind: template-data

  - match: template/gitignore.in
    scenarios: [join, execute, extension-skill]
    kind: template-data

  - match: template/ignore.in
    scenarios: [orient, borrowed]
    kind: template-data
    note: Keeps sources/ out of ripgrep and editor search.

  - match: template/workspace.yaml
    scenarios: [join, orient]
    kind: template-data

  - match: template/members.yaml
    scenarios: [join, orient]
    kind: template-data

  - match: template/role-tiering.yaml
    scenarios: [plan, execute]
    kind: role-definitions
    note: Also the host whose generated definition changed.

  - match: internal/workspace/agents.go
    scenarios: [plan, execute, extension-role, override-loop, extension-skill]
    kind: role-definitions
    note: Also the host whose generated definition changed.

  - match: scripts/release-manifest.txt
    scenarios: [after-merge, archive, borrowed, complete, complete-tone, direct, execute, execute-in-worktree, extension-execute, extension-none-push, extension-push, extension-report, extension-role, extension-skill, extension-skip, extension-stop, extension-unallowed, ff, intent, intent-lang, intent-tone, join, orient, override-loop, override-not-allowed, plan, push-records, push-records-conflict]
    kind: structure
    larger: true
    note: Every scenario on any one host, plus orient on all three hosts. A destination added, removed, or moved.

  - match: assets.go
    scenarios: [after-merge, archive, borrowed, complete, complete-tone, direct, execute, execute-in-worktree, extension-execute, extension-none-push, extension-push, extension-report, extension-role, extension-skill, extension-skip, extension-stop, extension-unallowed, ff, intent, intent-lang, intent-tone, join, orient, override-loop, override-not-allowed, plan, push-records, push-records-conflict]
    kind: structure
    larger: true
    note: Every scenario on any one host, plus orient on all three hosts. A destination added, removed, or moved.

  - match: internal/cli/topics.go
    scenarios: [orient]
    kind: cli-action
    note: Help text. Used when CLI output changed.

  - match: internal/workspace/tone.go
    scenarios: [intent-tone, complete-tone]
    kind: cli-action
    note: The preset lines a member's tone records.

  - match: internal/cli/commands.go
    scenarios: [borrowed, complete, execute, intent, join, plan]
    kind: cli-action
    note: Upper bound. The author narrows this list to the command that changed.

  - match: internal/cli/cli.go
    scenarios: [complete, intent, plan, push-records]
    kind: cli-action
    note: Next-step messages, and the commit_recommended note behind the commit-and-push question. Used when CLI output changed.

  - match: internal/workspace/records.go
    scenarios: [intent, plan]
    kind: record-template
    note: Record skeletons from record create.

  - match: internal/workspace/inspect.go
    scenarios: [complete]
    kind: check-findings

  - match: internal/workspace/readability.go
    scenarios: [complete]
    kind: check-findings

  - match: internal/workspace/review.go
    scenarios: [complete]
    kind: check-findings

  - match: internal/workspace/archive*.go
    scenarios: [archive]
    kind: cli-action
    note: record archive, the archive offer, and the rename of a legacy archive/ folder.

  - match: internal/workspace/mine.go
    scenarios: [orient, archive]
    kind: cli-action
    note: status my_work, the record list default, and the finished-record count behind the archive offer.

  - match: internal/workspace/placement.go
    scenarios: [archive]
    kind: structure
    note: Where records are found and placed, and the layout findings check reports.

  - match: internal/workspace/worktrees.go
    scenarios: [execute]
    kind: cli-action

  - match: internal/workspace/sync.go
    scenarios: [ff]
    kind: cli-action
    note: repo sync and workspace sync, which /ff runs.

  - match: internal/workspace/extension*.go
    scenarios: [extension-execute, extension-skip, extension-push, extension-stop, extension-report, extension-unallowed, extension-none-push, extension-role, override-loop, override-not-allowed, extension-skill]
    kind: cli-action
    note: extensions.yaml, manifests, hook resolution, the cache, script launch, trust, and the extensions section of a brief.

  - match: internal/cli/extensions.go
    scenarios: [extension-execute, extension-skip, extension-push, extension-stop, extension-report, extension-unallowed, extension-none-push, extension-role, override-loop, override-not-allowed, extension-skill]
    kind: cli-action
    note: extension hooks, and the blocks CLI-fired stages return around their write.

  - match: internal/workspace/readme.go
    scenarios: [join]
    kind: cli-action
    note: README writing at init.

sections:
  - heading: Orient and initialize
    scenarios: [orient, join, override-not-allowed]
  - heading: Updating the workspace template
    scenarios: [orient, join]
  - heading: Who is working
    scenarios: [orient, join]
  - heading: Language
    scenarios: [intent-lang]
  - heading: Shared knowledge
    scenarios: [orient, borrowed, complete]
  - heading: Intent and planning
    scenarios: [intent, plan, direct]
  - heading: Worktrees and implementation
    scenarios: [execute, override-loop]
  - heading: Independent review on request
    scenarios: []
  - heading: Delivery, completion, and organization
    scenarios: [complete, execute, push-records, push-records-conflict, after-merge, ff]

none:
  - "**/*_test.go"
  - internal/cow/**
  - internal/installer/**
  - .github/**
  - scripts/*.sh
  - release/**
  - .changelog/**
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - CODE_OF_CONDUCT.md
  - context/**
  - .agents/**
  - agent-tests/**
  - product/README.md
  - product/assets/**
  - product/LICENSE
  - VERSION
  - CLI_VERSION
