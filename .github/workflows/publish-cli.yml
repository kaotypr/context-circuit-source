name: Publish CLI

# Deliberately separate from template publication. Trigger only with a CLI tag.
#
# The tag, the build and the release all live here, where the Go source is, so a
# released binary is traceable to the commit that produced it by the tag itself
# rather than by a sentence in its notes. They were split while this repository
# was private and installing could not depend on reading it.
#
# The tag is `cli-v<version>`; the assets under it stay `context-circuit-cli-v…`.
# They are deliberately different: the tag is read in a release list that already
# says which product it belongs to, while an asset is read in whatever directory
# someone downloaded it into, where nothing does.
on:
  push:
    tags: ['cli-v*']
permissions:
  contents: read
concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as check.yml: the knowledge checks count commits under
          # each note's code anchors, so a shallow clone leaves the
          # reviewed-date pass with nothing to read and it passes vacuously.
          # A release gate that is weaker than the pull-request gate is not one.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
  release:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate and build
        id: build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#cli-v}
          test "$version" = "$(cat CLI_VERSION)"
          sh scripts/build-cli.sh "$version" cli-release
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compose release notes
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat CLI.md > cli-notes.md
          printf '\n---\n\nBuilt at commit `%s`.\n' "$SOURCE_SHA" >> cli-notes.md
          # The workspace template is a separate product under a separate license,
          # so the archive says which one it carries rather than leaving a reader
          # to assume one release list means one set of terms.
          printf '\nApache-2.0; the archive carries the license. The workspace template is 0BSD.\n' >> cli-notes.md
      - name: Publish the CLI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          # The tag already exists here and is what triggered this run, so the
          # release hangs on the commit that actually built these binaries.
          case "$VERSION" in *-*) set -- --prerelease ;; *) set -- ;; esac
          gh release create "$RELEASE_TAG" \
            "$@" \
            --title "Context Circuit CLI $VERSION" \
            --notes-file cli-notes.md \
            cli-release/*.tar.gz cli-release/*.zip cli-release/SHA256SUMS
