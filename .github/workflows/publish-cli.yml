name: Publish CLI

# Deliberately separate from template publication. Trigger only with a CLI tag.
#
# The tag and the build live here, where the Go source is, so a released binary
# stays traceable to the commit that produced it. The assets are published on the
# product repository instead, so installing the CLI never needs read access to
# this maintainer checkout. The tag created on that repository is a distribution
# marker, not a build reference; the release notes carry the real provenance.
#
# The tag is `cli-v<version>`; the assets under it stay `context-circuit-cli-v…`.
# They are deliberately different: the tag is read in a release list beside the
# template's own `v<version>`, where the context is already given, while an asset
# is read in whatever directory someone downloaded it into, where it is not.
on:
  push:
    tags: ['cli-v*']
permissions:
  contents: read
concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
  release:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate and build
        id: build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#cli-v}
          test "$version" = "$(cat CLI_VERSION)"
          sh scripts/build-cli.sh "$version" cli-release
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compose release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # The destination tag points at that repository's branch tip, which did
          # not build these binaries. State where they actually came from.
          cat CLI.md > cli-notes.md
          printf '\n---\n\nBuilt from `%s` at commit `%s`, tag `%s`.\n' \
            "$SOURCE_REPO" "$SOURCE_SHA" "$RELEASE_TAG" >> cli-notes.md
          # This repository is labeled 0BSD, because the repository is the
          # workspace template. These assets are not, so say so where they are
          # downloaded rather than leaving the repository label to answer it.
          printf '\nApache-2.0; the archive carries the license. The `v*` workspace template released here is 0BSD.\n' >> cli-notes.md
      - name: Publish CLI assets on the product repository
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          case "$VERSION" in *-*) set -- --prerelease ;; *) set -- ;; esac
          gh release create "$RELEASE_TAG" \
            --repo kaotypr/context-circuit \
            --target main \
            "$@" \
            --title "Context Circuit CLI $VERSION" \
            --notes-file cli-notes.md \
            cli-release/*.tar.gz cli-release/*.zip cli-release/SHA256SUMS
