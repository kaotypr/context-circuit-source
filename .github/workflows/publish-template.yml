name: Publish template

# Publishes one release of the assembled product into kaotypr/context-circuit.
# Manual (workflow_dispatch) or on a new request file landing on main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Template version to publish (blank = the single unpublished request)"
        required: false
  push:
    branches: [main]
    paths:
      - "release/requests/**"

# This job only reads its own repository. Everything it writes lands in the
# published template repository, through TEMPLATE_REPO_TOKEN, so the automatic
# token needs nothing beyond the checkout it performs here.
permissions:
  contents: read

concurrency:
  group: publish-template
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check workspace and CLI compatibility
        run: sh scripts/check-release.sh

      - name: Checkout template repository
        uses: actions/checkout@v4
        with:
          repository: kaotypr/context-circuit
          ref: main
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          path: .template-repo
          fetch-depth: 0

      - name: Configure maintainer identity
        env:
          MAINTAINER_NAME: ${{ vars.MAINTAINER_NAME }}
          MAINTAINER_EMAIL: ${{ vars.MAINTAINER_EMAIL }}
        run: |
          git -C .template-repo config user.name "$MAINTAINER_NAME"
          git -C .template-repo config user.email "$MAINTAINER_EMAIL"

      - name: Resolve target version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: sh scripts/resolve-release-version.sh .template-repo

      - name: Publish (assemble, gate, commit, tag)
        id: publish
        env:
          MAINTAINER_NAME: ${{ vars.MAINTAINER_NAME }}
          MAINTAINER_EMAIL: ${{ vars.MAINTAINER_EMAIL }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          out=$(sh scripts/publish-template.sh "$RELEASE_VERSION" .template-repo)
          printf '%s\n' "$out"
          echo "assets=$(printf '%s\n' "$out" | sed -n 's/^release_assets_dir: //p')" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          V="$RELEASE_VERSION"
          git -C .template-repo push origin main
          git -C .template-repo push origin "v$V"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          ASSETS: ${{ steps.publish.outputs.assets }}
        run: |
          V="$RELEASE_VERSION"
          awk 'BEGIN{fm=0} /^---[[:space:]]*$/{fm++; next} fm>=2{print}' \
            "release/requests/$V.md" > release-notes.md
          # A SemVer pre-release identifier — the -rc.4, -alpha.1 or -beta.2
          # after the hyphen — is what makes a candidate a candidate, so it is
          # marked as one rather than becoming the repository's Latest release.
          # The CLI publication decides this the same way.
          case "$V" in *-*) set -- --prerelease ;; *) set -- ;; esac
          gh release create "v$V" \
            --repo kaotypr/context-circuit \
            "$@" \
            --title "v$V" \
            --notes-file release-notes.md \
            "$ASSETS"/*.tar.gz "$ASSETS/SHA256SUMS"
