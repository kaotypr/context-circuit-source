name: Publish template

# Publishes one release of the assembled product into kaotypr/context-circuit.
# Manual (workflow_dispatch) or on a new request file landing on main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Template version to publish (blank = the single unpublished request)"
        required: false
  push:
    branches: [main]
    paths:
      - "release/requests/**"

concurrency:
  group: publish-template
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check executable and release packages
        run: sh scripts/check-release.sh

      - name: Checkout template repository
        uses: actions/checkout@v4
        with:
          repository: kaotypr/context-circuit
          ref: main
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          path: .template-repo
          fetch-depth: 0

      - name: Configure maintainer identity
        env:
          MAINTAINER_NAME: ${{ vars.MAINTAINER_NAME }}
          MAINTAINER_EMAIL: ${{ vars.MAINTAINER_EMAIL }}
        run: |
          git -C .template-repo config user.name "$MAINTAINER_NAME"
          git -C .template-repo config user.email "$MAINTAINER_EMAIL"

      - name: Resolve target version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: sh scripts/resolve-release-version.sh .template-repo

      - name: Publish (assemble, gate, commit, tag)
        id: publish
        env:
          MAINTAINER_NAME: ${{ vars.MAINTAINER_NAME }}
          MAINTAINER_EMAIL: ${{ vars.MAINTAINER_EMAIL }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          out=$(sh scripts/publish-template.sh "$RELEASE_VERSION" .template-repo)
          printf '%s\n' "$out"
          echo "assets=$(printf '%s\n' "$out" | sed -n 's/^release_assets_dir: //p')" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          V="$RELEASE_VERSION"
          git -C .template-repo push origin main
          git -C .template-repo push origin "v$V"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          ASSETS: ${{ steps.publish.outputs.assets }}
        run: |
          V="$RELEASE_VERSION"
          awk 'BEGIN{fm=0} /^---[[:space:]]*$/{fm++; next} fm>=2{print}' \
            "release/requests/$V.md" > release-notes.md
          gh release create "v$V" \
            --repo kaotypr/context-circuit \
            --title "v$V" \
            --notes-file release-notes.md \
            "$ASSETS"/*.tar.gz "$ASSETS"/*.zip "$ASSETS/SHA256SUMS"

      - name: Push commit and tag to GitLab
        env:
          GITLAB_TEMPLATE_PROJECT: ${{ vars.GITLAB_TEMPLATE_PROJECT }}
          GITLAB_TEMPLATE_TOKEN: ${{ secrets.GITLAB_TEMPLATE_TOKEN }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          : "${GITLAB_TEMPLATE_PROJECT:?GITLAB_TEMPLATE_PROJECT is not set}"
          : "${GITLAB_TEMPLATE_TOKEN:?GITLAB_TEMPLATE_TOKEN is not set}"
          auth=$(printf 'oauth2:%s' "$GITLAB_TEMPLATE_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://gitlab.sicepat.tech/.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          git -C .template-repo push "https://gitlab.sicepat.tech/${GITLAB_TEMPLATE_PROJECT}.git" main "v$RELEASE_VERSION"

      - name: Create GitLab Release
        env:
          GITLAB_TEMPLATE_PROJECT: ${{ vars.GITLAB_TEMPLATE_PROJECT }}
          GITLAB_TEMPLATE_TOKEN: ${{ secrets.GITLAB_TEMPLATE_TOKEN }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          ASSETS: ${{ steps.publish.outputs.assets }}
        run: |
          : "${GITLAB_TEMPLATE_PROJECT:?GITLAB_TEMPLATE_PROJECT is not set}"
          : "${GITLAB_TEMPLATE_TOKEN:?GITLAB_TEMPLATE_TOKEN is not set}"
          ENC=$(jq -rn --arg project "$GITLAB_TEMPLATE_PROJECT" '$project|@uri')
          API="https://gitlab.sicepat.tech/api/v4/projects/${ENC}"
          printf '[]\n' > asset-links.json
          for file in "$ASSETS"/*.tar.gz "$ASSETS"/*.zip "$ASSETS/SHA256SUMS"; do
            name=${file##*/}
            url="${API}/packages/generic/context-circuit/${RELEASE_VERSION}/${name}"
            curl --fail --silent --show-error --request PUT \
              --header "PRIVATE-TOKEN: ${GITLAB_TEMPLATE_TOKEN}" --upload-file "$file" "$url"
            jq --arg name "$name" --arg url "$url" '. + [{name:$name,url:$url,link_type:"package"}]' asset-links.json > asset-links.next.json
            mv asset-links.next.json asset-links.json
          done
          jq -n --arg name "v$RELEASE_VERSION" --rawfile desc release-notes.md \
            --slurpfile links asset-links.json \
            '{name:$name,tag_name:$name,description:$desc,assets:{links:$links[0]}}' \
          | curl --fail --silent --show-error \
              --header "PRIVATE-TOKEN: ${GITLAB_TEMPLATE_TOKEN}" \
              --header "Content-Type: application/json" --data @- "${API}/releases"
