# Dependency updates open against main, the branch contributions target.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: "/agent-tests"
    target-branch: main
    schedule:
      interval: weekly
    groups:
      agent-tests-modules:
        patterns:
          - "*"
