# Dependency updates open against development/v2, the branch contributions target.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: development/v2
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: "/"
    target-branch: development/v2
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"
