name: Design case
description: Agree the design of a larger change that affects agents in a generated workspace, before any agent runs are paid for.
labels:
  - "triage: behaviour change"
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a larger change that affects agents: one that adds, removes or moves shipped files; changes the shape of what a skill produces; adds or changes a CLI action or a `check` rule; touches a gate such as approval, commit or push; or needs existing workspaces to migrate. Wait for the maintainer's answer before you pay for any agent runs. A smaller change puts its design case in the pull request instead; see "Changes that affect agents" in CONTRIBUTING.md.
  - type: textarea
    id: change
    attributes:
      label: Change
      description: What an agent in a generated workspace will now read, do or produce differently. Name the files.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why: what the current design gets wrong"
      description: Concrete, with evidence, such as a run artifact quoted with file and lines, a failing check, a token number, a reported issue, or a redacted excerpt from a real workspace. "It could be cleaner" is not a problem statement.
    validations:
      required: true
  - type: textarea
    id: before-after
    attributes:
      label: Before / after
      description: The agent-visible output before and after the change, from the same scenario, fixture, prompt, host and model. Before any paid run, a hand-written sketch is fine.
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: What is better
      description: Each claim tied to something in the after output or a check.
    validations:
      required: true
  - type: textarea
    id: catch
    attributes:
      label: The catch, and who pays
      description: "A size, or \"none\", for each: tokens (every session for always-loaded files, or the flow); agent compliance per host; existing workspaces (what the template delta touches, extra steps, whether old records still pass `check`); company forks and customized templates (files likely to conflict); people who read the output; maintenance."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: At least one, including leaving it as it is, and why not.
    validations:
      required: true
